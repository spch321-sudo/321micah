1<\/td><td>公平、公道、審判<\/td><\/tr><tr><td>惡善好惡<\/td><td>שֹׂנְאֵי<\/td><td>sonei<\/td><td>H8130<\/td><td>恨惡的人<\/td><\/tr><tr><td>剝皮<\/td><td>גֹּזְלֵי<\/td><td>gozelei<\/td><td>H1497<\/td><td>搶奪、剝取<\/td><\/tr><tr><td>掩面<\/td><td>וְיַסְתֵּר<\/td><td>veyaster<\/td><td>H5641<\/td><td>隱藏、掩蓋<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「我說」<\/strong>：va-omar，「我說」，是彌迦第一次直接出聲。前一章（2 章）的主詞是神、是人；這裡是先知。<\/p><p><strong>「公平」<\/strong>：ha-mishpat，前面加定冠詞，是「那個公平」。首領本來該知道的，就是這一個：按公道審案。這是「公平」（mishpat）全卷五次中的第一次（3:1、8、9；6:8；7:9）。<\/p><p><strong>「吃我民的肉」<\/strong>：這是一個比喻（參 詩 14:4；結 34:2–4），形容剝削與壓榨，不是字面的描寫。經文用最粗的畫面，是要讓人看見，剝奪人的生計，就等於剝奪人的身體。本講義不渲染這個畫面。<\/p>","exp":"<p><strong>全卷第二個「你們要聽」。<\/strong>第一個，是對萬民（1:2）；這一個，是對「首領、官長」。在以色列，首領與官長，是坐在城門口審案的人。彌迦先問一個問題：「你們不當知道公平嗎？」這不是問他們有沒有學問，是問他們的本分。<\/p><p><strong>首領的罪，是顛倒。<\/strong>他們「惡善好惡」，這句話與阿摩司的話相反：阿摩司說「要惡惡好善」（摩 5:15）。他們把次序倒過來了。位置越高，顛倒的影響越大，因為整個城，是照著他們的標準在走。<\/p><p><strong>第 4 節：他們也要呼求，神卻不應允。<\/strong>「掩面」，是神收回面光（申 31:17–18）。這一句，要小心讀：它是對這些剝削者說的，在他們「遭災的時候」。它不是在說：凡是呼求而沒有得到回答的人，都是被神掩面的人。一個正在受苦的人，若讀這節，不必問「我是不是被拒絕」；神的面，仍然朝向受傷的人（2:12；4:6）。<\/p>"},{"a":5,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֹּה אָמַר יְהוָה עַל־הַנְּבִיאִים הַמַּתְעִים אֶת־עַמִּי הַנֹּשְׁכִים בְּשִׁנֵּיהֶם וְקָרְאוּ שָׁלוֹם וַאֲשֶׁר לֹא־יִתֵּן עַל־פִּיהֶם וְקִדְּשׁוּ עָלָיו מִלְחָמָֽה׃ לָכֵן לַיְלָה לָכֶם מֵֽחָזוֹן וְחָשְׁכָה לָכֶם מִקְּסֹם וּבָאָה הַשֶּׁמֶשׁ עַל־הַנְּבִיאִים וְקָדַר עֲלֵיהֶם הַיּֽוֹם׃ וּבֹשׁוּ הַחֹזִים וְחָֽפְרוּ הַקֹּסְמִים וְעָטוּ עַל־שָׂפָם כֻּלָּם כִּי אֵין מַעֲנֵה אֱלֹהִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「論到使我民走差路的先知－他們牙齒有所嚼的，他們就呼喊說：平安了！凡不供給他們吃的，他們就預備攻擊他－耶和華如此說：你們必遭遇黑夜，以致不見異象；又必遭遇幽暗，以致不能占卜。日頭必向你們沉落，白晝變為黑暗。先見必抱愧，占卜的必蒙羞，都必摀著嘴唇，因為神不應允他們。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>先知<\/td><td>הַנְּבִיאִים<\/td><td>hannevi-im<\/td><td>H5030<\/td><td>先知<\/td><\/tr><tr><td>走差路<\/td><td>הַמַּתְעִים<\/td><td>hammat-im<\/td><td>H8582<\/td><td>使人走偏的<\/td><\/tr><tr><td>嚼<\/td><td>הַנֹּשְׁכִים<\/td><td>hannoshekhim<\/td><td>H5391<\/td><td>咬、啃<\/td><\/tr><tr><td>平安<\/td><td>שָׁלוֹם<\/td><td>shalom<\/td><td>H7965<\/td><td>平安、完整<\/td><\/tr><tr><td>占卜<\/td><td>מִקְּסֹם<\/td><td>miqqesom<\/td><td>H7080<\/td><td>占卜、問卜<\/td><\/tr><tr><td>抱愧<\/td><td>וּבֹשׁוּ<\/td><td>uvoshu<\/td><td>H954<\/td><td>羞愧、蒙羞<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「牙齒有所嚼的」<\/strong>：直譯「用牙齒咬的」，意思是：有東西可以吃的時候。先知的預言，跟著餵他們的人走。<\/p><p><strong>「平安」<\/strong>：shalom，這是「平安」全卷的第一次，也是唯一一次被拿來作假預言的口號（耶 6:14；8:11 也有「平安了！平安了！」）。一個詞，可以是神的應許，也可以是收買來的口號。<\/p><p><strong>「摀著嘴唇」<\/strong>：saphham 的「摀嘴」（上唇），是哀悼與羞愧的手勢（利 13:45；結 24:17）。「神不應允他們」，是 3:4 的呼應。<\/p>","exp":"<p><strong>這是對先知的控告。<\/strong>他們不是假裝神，他們是會說話的人，說「平安」的人。可是他們說話的依據，是有沒有人供他們吃：給他們吃的，他們說「平安」；不給的，他們「預備攻擊」。一個先知說什麼，被餵食的方式決定了。<\/p><p><strong>「使我民走差路」。<\/strong>他們的罪，不只是說錯話，是帶領錯了方向。對他們的審判，是黑夜、幽暗、日頭沉落：不再有異象。最可怕的刑罰，不是災禍，是沉默：神不再說話。阿摩司也說過這件事：聽道的饑荒（摩 8:11）。<\/p><p><strong>我們可以怎樣自我檢查？<\/strong>我說的話，是因為神交給我的，還是因為有人在聽、在供給？這不是在指責任何一位傳道人，是每一個說話的人（包括在家裡、在小組裡說話的人），都要問的問題。<\/p>"},{"a":8,"z":8,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאוּלָם אָנֹכִי מָלֵאתִי כֹחַ אֶת־רוּחַ יְהוָה וּמִשְׁפָּט וּגְבוּרָה לְהַגִּיד לְיַֽעֲקֹב פִּשְׁעוֹ וּלְיִשְׂרָאֵל חַטָּאתֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「至於我，我藉耶和華的靈，滿有力量、公平、才能，可以向雅各說明他的過犯，向以色列指出他的罪惡。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>至於我<\/td><td>אָנֹכִי<\/td><td>anokhi<\/td><td>H595<\/td><td>我（強調）<\/td><\/tr><tr><td>滿有<\/td><td>מָלֵאתִי<\/td><td>malleti<\/td><td>H4390<\/td><td>我是滿了的<\/td><\/tr><tr><td>力量<\/td><td>כֹחַ<\/td><td>koakh<\/td><td>H3581<\/td><td>力量、能力<\/td><\/tr><tr><td>靈<\/td><td>רוּחַ<\/td><td>ruakh<\/td><td>H7307<\/td><td>靈、氣、風<\/td><\/tr><tr><td>公平<\/td><td>וּמִשְׁפָּט<\/td><td>umishpat<\/td><td>H4941<\/td><td>公平、公道<\/td><\/tr><tr><td>才能<\/td><td>וּגְבוּרָה<\/td><td>ugvurah<\/td><td>H1369<\/td><td>才能、勇氣、勇力<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「至於我」<\/strong>：ve-ulam anokhi，是強烈的對比：「但是，我……」。前面所有的人，都是為食物、賄賂、銀錢說話，這裡一個人，站出來。<\/p><p><strong>「藉耶和華的靈」<\/strong>：原文是「et ruakh YHWH」；有些學者認為這幾個字，是後來加的註解，使句子更平順。但所有古抄本都有它，和合本也照譯。我們依經文現有的樣子讀。<\/p><p><strong>「過犯」「罪惡」<\/strong>：pesha 與 khattat，與 1:5 的「雅各的罪過」「以色列家的罪惡」是同一組字。1:5 說神出來，是因為這個；3:8 說，先知被充滿，為要「說明」這個。<\/p>","exp":"<p><strong>全章的轉折，在一個「但是」。<\/strong>前面七節，是首領與先知的控告，這一節，彌迦站出來說明自己：我不是靠口才，不是靠資歷，是靠耶和華的靈，才有力量、公平、才能。這三樣，正好是首領與先知所缺的：力量，是不為食物說話的力量；公平，是首領所厭惡的；才能，是敢說的勇氣。<\/p><p><strong>先知的任務，是「說明」。<\/strong>他的工作，不是發明，是把神已經知道的，說出來：「向雅各說明他的過犯，向以色列指出他的罪惡」。先知不替神編新的罪名，他只是說：這是你的過犯。<\/p><p><strong>這一節，是所有「要說真話的人」的鑰匙：先被聖靈充滿，才有能力說。<\/strong>這與 321 的基礎相通：聖靈是我的引導。我們不是先有勇氣，再求聖靈，是先有聖靈，勇氣才出來。<\/p>"},{"a":9,"z":11,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ־נָא זֹאת רָאשֵׁי בֵּית יַעֲקֹב וּקְצִינֵי בֵּית יִשְׂרָאֵל הַֽמֲתַעֲבִים מִשְׁפָּט וְאֵת כָּל־הַיְשָׁרָה יְעַקֵּֽשׁוּ׃ בֹּנֶה צִיּוֹן בְּדָמִים וִירוּשָׁלִַם בְּעַוְלָֽה׃ רָאשֶׁיהָ בְּשֹׁחַד יִשְׁפֹּטוּ וְכֹהֲנֶיהָ בִּמְחִיר יוֹרוּ וּנְבִיאֶיהָ בְּכֶסֶף יִקְסֹמוּ וְעַל־יְהוָה יִשָּׁעֵנוּ לֵאמֹר הֲלוֹא יְהוָה בְּקִרְבֵּנוּ לֹֽא־תָבוֹא עָלֵינוּ רָעָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「雅各家的首領、以色列家的官長啊，當聽我的話！你們厭惡公平，在一切事上屈枉正直；以人血建立錫安，以罪孽建造耶路撒冷。首領為賄賂行審判；祭司為雇價施訓誨；先知為銀錢行占卜。他們卻倚賴耶和華，說：耶和華不是在我們中間嗎？災禍必不臨到我們。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>厭惡<\/td><td>הַֽמֲתַעֲבִים<\/td><td>hamtaavim<\/td><td>H8581<\/td><td>厭惡、憎惡<\/td><\/tr><tr><td>屈枉<\/td><td>יְעַקֵּֽשׁוּ<\/td><td>yeaqqeshu<\/td><td>H6140<\/td><td>弄彎、扭曲<\/td><\/tr><tr><td>以人血<\/td><td>בְּדָמִים<\/td><td>bedamim<\/td><td>H1818<\/td><td>用血、用流人血的罪<\/td><\/tr><tr><td>賄賂<\/td><td>בְּשֹׁחַד<\/td><td>beshokhad<\/td><td>H7810<\/td><td>用賄賂<\/td><\/tr><tr><td>雇價<\/td><td>בִּמְחִיר<\/td><td>bimkhir<\/td><td>H4242<\/td><td>用價錢、收費<\/td><\/tr><tr><td>倚賴<\/td><td>יִשָּׁעֵנוּ<\/td><td>yishaenu<\/td><td>H8172<\/td><td>倚靠、依傍<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「厭惡公平」<\/strong>：hamtaavim 是「使人覺得可憎的人」，也是申命記常用的「可憎」（to-evah）的字根。他們把神所喜悅的公平，當作可憎之物。<\/p><p><strong>三個職分<\/strong>：首領（審判）、祭司（訓誨，yoru 與「律法」torah 同字根）、先知（異象）。這是以色列的三個「聲音」：誰說公平，誰教導，誰傳話。三者，都被收買。<\/p><p><strong>「耶和華不是在我們中間嗎」<\/strong>：這是錫安神學的核心信念（詩 46:5：神在其中，城必不動搖），被當成保險。出 17:7 有一句相似的問話：「耶和華是在我們中間嗎？」，是在曠野不信的時候問的，意思相反。<\/p>","exp":"<p><strong>全城，是用流人血與不義建造的。<\/strong>「以人血建立錫安，以罪孽建造耶路撒冷」。這座城，有宮殿、有聖殿、有城牆；每一塊石頭的下面，都有沒有被提起的人。建築的宏偉，沒有辦法洗去它的根基。<\/p><p><strong>三個領袖，三個價錢。<\/strong>賄賂、雇價、銀錢。審判被買、教導被買、預言被買。這裡不是在說：領薪水就是罪；是說：當一個人說話的方向，由價錢決定，真理就被拿來賣。<\/p><p><strong>最危險的，是最後一句。<\/strong>「他們卻倚賴耶和華，說：耶和華不是在我們中間嗎？災禍必不臨到我們。」他們沒有否認神；他們把神當成保證。信仰，變成了不用改變的理由。這個誘惑，每一個時代的敬拜者，都要小心：我們可以有最正確的信仰告白，卻活在最不公平的生活裡。<\/p>"},{"a":12,"z":12,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לָכֵן בִּגְלַלְכֶם צִיּוֹן שָׂדֶה תֵֽחָרֵשׁ וִירוּשָׁלִַם עִיִּין תִּֽהְיֶה וְהַר הַבַּיִת לְבָמוֹת יָֽעַר׃<\/p><\/blockquote>","lit":"<blockquote><p>「所以因你們的緣故，錫安必被耕種像一塊田，耶路撒冷必變為亂堆；這殿的山必像叢林的高處。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>緣故<\/td><td>בִּגְלַלְכֶם<\/td><td>biglalkhem<\/td><td>H1558<\/td><td>因為你們<\/td><\/tr><tr><td>錫安<\/td><td>צִיּוֹן<\/td><td>tsiyyon<\/td><td>H6726<\/td><td>錫安<\/td><\/tr><tr><td>耕種<\/td><td>תֵֽחָרֵשׁ<\/td><td>tekhareesh<\/td><td>H2790<\/td><td>被耕、被犁<\/td><\/tr><tr><td>亂堆<\/td><td>עִיִּין<\/td><td>iyyin<\/td><td>H5856<\/td><td>亂石堆、廢墟<\/td><\/tr><tr><td>殿的山<\/td><td>וְהַר<\/td><td>vehar<\/td><td>H2022<\/td><td>山<\/td><\/tr><tr><td>叢林的高處<\/td><td>לְבָמוֹת<\/td><td>levamot<\/td><td>H1116<\/td><td>高處、山崗<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「因你們的緣故」<\/strong>：biglalkhem，這是「因為你們」，句子的主詞是首領們：整座城，為著他們被審判。<\/p><p><strong>「耕種」「亂堆」<\/strong>：「被耕」（tekhareesh）與「亂堆」（iyyin），與 1:6 的「田野的亂堆」（le-i hasadeh）用字相近：撒馬利亞的命運，被原封不動地，說給耶路撒冷。這一句，也是全書最重的一句。<\/p><p><strong>耶利米書 26:18<\/strong> 引用了這一節，原文幾乎一字不差。耶利米因為說了類似的話，被指控；長老們提起彌迦，並說：猶大王希西家，那時並沒有殺他，反而敬畏耶和華、懇求耶和華的恩，耶和華就後悔，不降所說的災。這說明，彌迦的審判，是帶著條件的呼召。<\/p>","exp":"<p><strong>全章的重錘，也是全卷最低點。<\/strong>「錫安必被耕種像一塊田，耶路撒冷必變為亂堆；這殿的山必像叢林的高處。」聽的人，把「耶和華在我們中間」當作城不倒的保證；彌迦說：連聖殿的山，也可以長滿樹林。<\/p><p><strong>撒馬利亞與耶路撒冷，只隔一節。<\/strong>1:6 說撒馬利亞變為田野；3:12 說耶路撒冷成為田。先知在最安全的地方，說最不可能的話：不是外面的人攻進來，是這座城，因為自己的罪，成為廢墟。<\/p><p><strong>這一節，不是最後一句話。<\/strong>下一節，4:1 說：「末後的日子，耶和華殿的山必堅立」。同一座山，先說被耕，再說堅立。先知沒有偷偷地在中間放一個轉折，他用一個「但」也不用，直接把兩句話放在一起：審判之後，神還有話。耶利米書 26:19 告訴我們，希西家聽了，悔改，災就沒有臨到那個世代。<strong>審判，是為了挽回；彌迦的重錘，是為了叫人悔改。<\/strong><\/p>"}],"4":[{"a":1,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיָה בְּאַחֲרִית הַיָּמִים יִהְיֶה הַר בֵּית־יְהוָה נָכוֹן בְּרֹאשׁ הֶהָרִים וְנִשָּׂא הוּא מִגְּבָעוֹת וְנָהֲרוּ עָלָיו עַמִּֽים׃ וְֽהָלְכוּ גּוֹיִם רַבִּים וְאָֽמְרוּ לְכוּ וְנַעֲלֶה אֶל־הַר־יְהוָה וְאֶל־בֵּית אֱלֹהֵי יַעֲקֹב וְיוֹרֵנוּ מִדְּרָכָיו וְנֵלְכָה בְּאֹֽרְחֹתָיו כִּי מִצִּיּוֹן תֵּצֵא תוֹרָה וּדְבַר־יְהוָה מִירוּשָׁלִָֽם׃ וְשָׁפַט בֵּין עַמִּים רַבִּים וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד־רָחוֹק וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים וַחֲנִיתֹֽתֵיהֶם לְמַזְמֵרוֹת לֹֽא־יִשְׂאוּ גּוֹי אֶל־גּוֹי חֶרֶב וְלֹא־יִלְמְדוּן עוֹד מִלְחָמָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「末後的日子，耶和華殿的山必堅立，超乎諸山，高舉過於萬嶺；萬民都要流歸這山。必有許多國的民前往，說：來吧，我們登耶和華的山，奔雅各神的殿。主必將他的道教訓我們；我們也要行他的路。因為訓誨必出於錫安；耶和華的言語必出於耶路撒冷。他必在多國的民中施行審判，為遠方強盛的國斷定是非。他們要將刀打成犂頭，把槍打成鐮刀。這國不舉刀攻擊那國；他們也不再學習戰事。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>末後<\/td><td>בְּאַחֲרִית<\/td><td>beakharit<\/td><td>H319<\/td><td>在末後、在後來<\/td><\/tr><tr><td>堅立<\/td><td>נָכוֹן<\/td><td>nakhon<\/td><td>H3559<\/td><td>被堅立、穩固<\/td><\/tr><tr><td>流歸<\/td><td>וְנָהֲרוּ<\/td><td>venaharu<\/td><td>H5102<\/td><td>像河水般流來<\/td><\/tr><tr><td>指教<\/td><td>וְיוֹרֵנוּ<\/td><td>veyorenu<\/td><td>H3384<\/td><td>他要教導我們<\/td><\/tr><tr><td>律法<\/td><td>תוֹרָה<\/td><td>torah<\/td><td>H8451<\/td><td>訓誨、律法<\/td><\/tr><tr><td>判斷<\/td><td>וְשָׁפַט<\/td><td>veshafat<\/td><td>H8199<\/td><td>他要審斷、斷定是非<\/td><\/tr><tr><td>打成<\/td><td>וְכִתְּתוּ<\/td><td>vekhittetu<\/td><td>H3807<\/td><td>他們要打碎、錘成<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「末後的日子」<\/strong>：be-akharit ha-yamim，字面是「日子的尾端」，在先知書裡指「歷史走到神所定的結局之處」，並不是一個可以排進日曆的日期。這一節的動詞用的是「必（要）成為」，口氣是應許，不是時間表。<\/p><p><strong>「必堅立」<\/strong>：nakhon，是「被穩固安放」的意思。聖殿的山是被神堅立的，不是靠人築高。上一章（3:12）說這座山要變成叢林的高處；這裡說同一座山要被堅立。兩節之間，沒有任何過渡的話，這是全卷最大的一個轉彎。<\/p><p><strong>「必教導我們」<\/strong>：yoreinu，與「律法」torah 同一字根。列國來，不是為了看風景，是為了「被教導」；他們帶著的問題是「走哪一條路」。「律法」在這裡是「從錫安出來的訓誨」。<\/p><p><strong>「他必在列國中施行審判」<\/strong>：shafat 與 3:1、3:8、3:9 的「公平」（mishpat）同一字根。3 章首領不肯按公平審案；4 章是真正的審判者坐下來，為列國斷是非。<strong>「打成」<\/strong>（kittetu）有「搗碎、錘碎」的意思，不是「輕輕改裝」。<\/p>","exp":"<p><strong>全卷最大的轉彎，在 3:12 與 4:1 之間。<\/strong>前一句還是「錫安必被耕種像一塊田」；下一句就是「耶和華殿的山必堅立」。先知沒有把中間的路填滿，他只讓兩句話並排站著：審判是真的，盼望也是真的。神的審判不是故事的結尾，是通往結尾的門。<\/p><p><strong>這段話與以賽亞書 2:2–4 幾乎相同。<\/strong>歷來學者有不同看法：有人說是彌迦引用以賽亞，有人說是以賽亞引用彌迦，也有人說兩人都引用了一個更古老的、在聖殿中傳誦的應許。聖經沒有告訴我們，我們就不替它決定。可以確定的是：這個應許在兩個先知、兩座不同的口裡，被同時傳講，代表它是當時敬拜的人共同記得的盼望。<\/p><p><strong>列國為什麼來？為著「被教導」。<\/strong>他們不是來征服、不是來貿易，他們說：「我們上去，到雅各神的殿，他要將他的道指教我們，我們也要行他的路。」這句的順序是：先聽（被指教），再走（行他的路）。人類的走路，不是先決定要去哪裡再找神，而是先到神面前，聽他說，然後才知道怎麼走。<\/p><p><strong>「打刀為犁」的順序很要緊。<\/strong>第 3 節先說「他要審判」，然後才說「他們要把刀打成犁頭」。刀不是自己放下的，是在審判者面前、在是非被斷定之後才打成犁頭。所以這節不是口號，也不是任何政治立場的標語；它是在說：真正的和平，需要有一位真正公平的審判者。人間的審判者不可靠（第 3 章已經說完了），所以人只能等那一位。<\/p><p><strong>此刻在地上的人怎麼活？<\/strong>經文沒有叫我們等待時，什麼都不做。第 2 節的列國說：「我們也要行他的路」。這句話，是今天就可以開始的：還沒到那日，已經可以先走上那條路。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְיָשְׁבוּ אִישׁ תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ וְאֵין מַחֲרִיד כִּי־פִי יְהוָה צְבָאוֹת דִּבֵּֽר׃ כִּי כָּל־הָעַמִּים יֵלְכוּ אִישׁ בְּשֵׁם אֱלֹהָיו וַאֲנַחְנוּ נֵלֵךְ בְּשֵׁם־יְהוָה אֱלֹהֵינוּ לְעוֹלָם וָעֶֽד׃<\/p><\/blockquote>","lit":"<blockquote><p>「人人都要坐在自己葡萄樹下和無花果樹下，無人驚嚇。這是萬軍之耶和華親口說的。萬民各奉己神的名而行；我們卻永永遠遠奉耶和華－我們神的名而行。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>坐<\/td><td>וְיָשְׁבוּ<\/td><td>veyashevu<\/td><td>H3427<\/td><td>他們要坐下、安居<\/td><\/tr><tr><td>葡萄樹<\/td><td>גַּפְנוֹ<\/td><td>gafno<\/td><td>H1612<\/td><td>他的葡萄樹<\/td><\/tr><tr><td>無花果樹<\/td><td>תְּאֵנָתוֹ<\/td><td>teenato<\/td><td>H8384<\/td><td>他的無花果樹<\/td><\/tr><tr><td>驚嚇<\/td><td>מַחֲרִיד<\/td><td>makharid<\/td><td>H2729<\/td><td>使人驚懼的<\/td><\/tr><tr><td>口<\/td><td>פִי<\/td><td>fi<\/td><td>H6310<\/td><td>口<\/td><\/tr><tr><td>行走<\/td><td>יֵלְכוּ<\/td><td>yelkhu<\/td><td>H3212<\/td><td>他們要行走<\/td><\/tr><tr><td>名<\/td><td>בְּשֵׁם<\/td><td>beshem<\/td><td>H8034<\/td><td>奉（某）名、靠（某）名<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「各人」<\/strong>：ish，是「每一個人」，不是「眾民」。平安是一人一人、一家一家的事：各人坐在自己的葡萄樹下。<\/p><p><strong>「無人驚嚇」<\/strong>：ein makharid，「沒有使人驚懼的」。這個說法在利未記 26:6、西番雅書 3:13 也出現，都是神賜平安的標準說法。<\/p><p><strong>「耶和華萬軍之口說的」<\/strong>：「萬軍」（tseva-ot）是強調神的權柄；「口」（pi）是強調這句話已經說了，不會收回。這一句，是前面兩節所有應許的保證。<\/p><p><strong>「行走」<\/strong>：yelkhu / nelekh，是 halakh（行走）這個字。這是全卷「行走」軌跡的重要一站：列國各行各的神的名，我們要「奉耶和華我們神的名行走，直到永永遠遠」。注意：這是<strong>以賽亞書 2 章沒有的一節<\/strong>，是彌迦自己加上的，他用「我們」把應許拉回到眼前的決定。<\/p>","exp":"<p><strong>平安的畫面，小得驚人。<\/strong>先知描寫列國歸向神的結果，不是宏偉的宮殿，不是浩大的遊行，而是一個普通人，坐在自己的葡萄樹和無花果樹下，沒有人使他害怕。最大的盼望，落在最平常的地方：飯桌、院子、午後的樹蔭。<\/p><p><strong>「無人驚嚇」，是今天許多人最缺的。<\/strong>經文的意思，不是說人將來不會遇到難處，而是說到那日，沒有一個人需要活在驚嚇裡。這是神為人預備的安息。<\/p><p><strong>第 5 節是彌迦自己的「但是」。<\/strong>前面是未來的圖畫，這一節把人帶回現在：別的民族，各人奉自己神的名行走；「我們」要奉耶和華我們神的名行走。這句話，不是等到那日才說的，是現在就要決定的。<\/p><p><strong>「行走」是生活，不是地點。<\/strong>奉誰的名行走，是日常怎麼過日子、怎麼說話、怎麼處理錢、怎麼對待人。當前面首領「走差路」（3:5）、人民被搶奪的時候，彌迦卻說：我們要行在他的名裡。這是 321 的「讓耶穌作王」：不是等王來才跟隨，是今天就決定誰是主。<\/p>"},{"a":6,"z":8,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בַּיּוֹם הַהוּא נְאֻם־יְהוָה אֹֽסְפָה הַצֹּלֵעָה וְהַנִּדָּחָה אֲקַבֵּצָה וַאֲשֶׁר הֲרֵעֹֽתִי׃ וְשַׂמְתִּי אֶת־הַצֹּֽלֵעָה לִשְׁאֵרִית וְהַנַּהֲלָאָה לְגוֹי עָצוּם וּמָלַךְ יְהוָה עֲלֵיהֶם בְּהַר צִיּוֹן מֵעַתָּה וְעַד־עוֹלָֽם׃ וְאַתָּה מִגְדַּל־עֵדֶר עֹפֶל בַּת־צִיּוֹן עָדֶיךָ תֵּאתֶה וּבָאָה הַמֶּמְשָׁלָה הָרִאשֹׁנָה מַמְלֶכֶת לְבַת־יְרוּשָׁלִָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華說：到那日，我必聚集瘸腿的，招聚被趕出的和我所懲治的。我必使瘸腿的為餘剩之民，使趕到遠方的為強盛之民。耶和華要在錫安山作王治理他們，從今直到永遠。你這羊群的高臺、錫安城的山哪，從前的權柄－就是耶路撒冷民的國權－必歸與你。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>瘸腿的<\/td><td>הַצֹּלֵעָה<\/td><td>hatsolea<\/td><td>H6760<\/td><td>跛行的、瘸腿的<\/td><\/tr><tr><td>被趕出的<\/td><td>וְהַנִּדָּחָה<\/td><td>hanniddakha<\/td><td>H5080<\/td><td>被趕散的<\/td><\/tr><tr><td>聚集<\/td><td>אֲקַבֵּצָה<\/td><td>akabbetsah<\/td><td>H6908<\/td><td>我要聚集<\/td><\/tr><tr><td>受苦<\/td><td>הֲרֵעֹֽתִי<\/td><td>hareoti<\/td><td>H7489<\/td><td>我所使之受害的<\/td><\/tr><tr><td>餘民<\/td><td>לִשְׁאֵרִית<\/td><td>lishreit<\/td><td>H7611<\/td><td>成為剩下的、餘民<\/td><\/tr><tr><td>作王<\/td><td>וּמָלַךְ<\/td><td>umalakh<\/td><td>H4427<\/td><td>他要作王<\/td><\/tr><tr><td>俄斐勒<\/td><td>עֹפֶל<\/td><td>ofel<\/td><td>H6076<\/td><td>小山、山丘（耶路撒冷的一處）<\/td><\/tr><tr><td>國權<\/td><td>הַמֶּמְשָׁלָה<\/td><td>hammemshalah<\/td><td>H4475<\/td><td>治理、統治權<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「瘸腿的」「被趕出的」<\/strong>：這兩個詞都是<strong>陰性單數集合名詞<\/strong>，像「那跛行的（群）」「那被趕散的（群）」。彌迦在 1:12 以後，常用陰性單數來稱呼「城」與「女子」；這裡的意思，是整個民，不是某個殘障的個人。<strong>這一節不能用來解釋任何一個殘障的人。<\/strong><\/p><p><strong>「就是我所使之受害的」<\/strong>：原文是「那些我曾使之遭禍的」，神的口，承認這些人受苦與自己有關。這是全卷最誠實的一句話：審判是神做的，所以聚集也要由神來做。<\/p><p><strong>「作餘民」<\/strong>：le-shearit，是「成為剩餘的」。1 章到 3 章是審判；現在是「餘民」第一次真正站起來。這是「餘民」軌跡的重要節點（參 2:12；5:7–8；7:18）。<\/p><p><strong>「羊群的高臺」<\/strong>：migdal-eder，在創世記 35:21 是雅各紮營的地方，離伯利恆不遠。<strong>「俄斐勒」<\/strong>是耶路撒冷東南的山丘，是大衛城的高處。「國權」（memshalah）要「回到」錫安，是指王權回到原來的地方。<\/p>","exp":"<p><strong>神說：我要聚集的，是一群「瘸腿的」。<\/strong>祂沒有說「強壯的」，沒有說「出色的」，祂說的是瘸腿的、被趕散的、被祂自己所苦待的。這是聖經裡很驚人的一句話：神的新民，不是從最強的人開始，是從最受傷的人開始。<\/p><p><strong>這節的「瘸腿」不是比喻軟弱。<\/strong>有人把它讀成「人的軟弱」，然後給一個勸勉：「所以我們要承認軟弱。」但經文指的是一個被打散的民：一群真的走不動的人，被真的趕出家門。要小心，不要拿身體有殘障的人來當作屬靈比喻。神看重這群人，是因為他們真的受了苦。<\/p><p><strong>神承認自己有份。<\/strong>「就是我所使之受害的」這半句，是這段最重的話。神沒有躲在背後，沒有說「是別人害了你們」。祂說：我曾使你們受害；現在我來聚集。能承認自己所作的，才有資格作王。這也是為什麼，後面說「耶和華要在錫安山作王」，才有可信的重量。<\/p><p><strong>「作王」是整段的終點。<\/strong>聚集，是為了讓耶和華作王：「從今直到永遠」。這是 321 的核心：讓耶穌作王。神所聚集的，不是一個要自己當王的民，是一個讓祂當王的民。<\/p><p><strong>「國權要歸於錫安」。<\/strong>俄斐勒、羊群的高臺，都是大衛家的老地方；「先前的權柄」要歸回。這暗示了一件事：後面第 5 章要說的那位君王，要從大衛的根源來；他不會是從天外降下的陌生人，而是從伯利恆出來的。<\/p>"},{"a":9,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַתָּה לָמָּה תָרִיעִי רֵעַ הֲמֶלֶךְ אֵֽין־בָּךְ אִֽם־יוֹעֲצֵךְ אָבָד כִּֽי־הֶחֱזִיקֵךְ חִיל כַּיּוֹלֵדָֽה׃ חוּלִי וָגֹחִי בַּת־צִיּוֹן כַּיּֽוֹלֵדָה כִּֽי־עַתָּה תֵצְאִי מִקִּרְיָה וְשָׁכַנְתְּ בַּשָּׂדֶה וּבָאת עַד־בָּבֶל שָׁם תִּנָּצֵלִי שָׁם יִגְאָלֵךְ יְהוָה מִכַּף אֹיְבָֽיִךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「現在你為何大聲哭號呢？疼痛抓住你彷彿產難的婦人，是因你中間沒有君王嗎？你的謀士滅亡了嗎？錫安的民哪，你要疼痛劬勞，彷彿產難的婦人；因為你必從城裡出來，住在田野，到巴比倫去。在那裡要蒙解救；在那裡耶和華必救贖你脫離仇敵的手。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>呼喊<\/td><td>תָרִיעִי<\/td><td>tariyi<\/td><td>H7321<\/td><td>你喊叫<\/td><\/tr><tr><td>痛苦<\/td><td>חוּלִי<\/td><td>khuli<\/td><td>H2342<\/td><td>你要扭動（如產婦）<\/td><\/tr><tr><td>生產<\/td><td>כַּיּוֹלֵדָֽה<\/td><td>kayyoledah<\/td><td>H3205<\/td><td>像生產的婦人<\/td><\/tr><tr><td>出去<\/td><td>תֵצְאִי<\/td><td>tetseyi<\/td><td>H3318<\/td><td>你要出去<\/td><\/tr><tr><td>住<\/td><td>וְשָׁכַנְתְּ<\/td><td>veshakhant<\/td><td>H7931<\/td><td>你要居住<\/td><\/tr><tr><td>巴比倫<\/td><td>בָּבֶל<\/td><td>bavel<\/td><td>H894<\/td><td>巴比倫<\/td><\/tr><tr><td>解救<\/td><td>תִּנָּצֵלִי<\/td><td>tinnatseli<\/td><td>H5337<\/td><td>你要被拯救<\/td><\/tr><tr><td>救贖<\/td><td>יִגְאָלֵךְ<\/td><td>yigalekh<\/td><td>H1350<\/td><td>他要救贖你<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「你為何大聲哭號呢？」<\/strong>：lamah tari-i，「你為何喊叫？」這是問句，不是責備；神在問一個正在疼痛中的人：你為何這樣喊？答案在下面：因為你有痛苦，像生產的婦人。<\/p><p><strong>「像產難的婦人」<\/strong>：khuli，「扭動、辛苦地產出」，是命令式，字面是「扭動、使勁」，帶有「要把什麼產出來」的意味，所以這裡的痛苦，被描寫成有方向的痛。<\/p><p><strong>「出離城邑」<\/strong>：tetseyi（你要出去），與「出來」（yatsa）同字根；這是「出來」軌跡的一站：先是耶和華從居所出來（1:3），然後是錫安的民出城（4:10），後面是那位君王從伯利恆「出來」（5:2）。<\/p><p><strong>「巴比倫」<\/strong>：在彌迦的年代（主前八世紀），霸權是亞述，不是巴比倫。這個名字是<strong>很不尋常<\/strong>的：先知在亞述強盛的時候，預告到巴比倫。<strong>「解救」<\/strong>（natsal）與<strong>「救贖」<\/strong>（ga-al）並列：前者是「拔出來」，後者是「親族贖回」。<\/p>","exp":"<p><strong>先知先問一句：你為什麼哭？<\/strong>錫安在哭，在大聲喊叫，在疼痛中扭動。神沒有叫她不要哭，只是先問：你在喊什麼？這是一種溫柔。神不怕人在痛苦中喊出來，祂只是想讓人認出：這個痛苦，不是結束，是在「產出」。<\/p><p><strong>痛苦被說成「產痛」，是在說：這個痛有結局。<\/strong>產婦的痛，是最痛的痛之一，也是最有方向的痛。但請注意：經文沒有說所有的痛苦都會有好結果，它只說：這一次，是神的手在帶領。我們不可以隨便對正在受苦的人說：「這是在產出什麼。」這句話，只有神可以說。<\/p><p><strong>路是真的難：出城、住田野、到巴比倫。<\/strong>先知沒有說「神要把你留在耶路撒冷」。祂說：你要出離城邑，住在田野，一直到巴比倫。這是真實的流亡路線。神的拯救，不是繞過流亡，是走過流亡。<\/p><p><strong>「在那裡」兩次，是這段的亮點。<\/strong>「在那裡你要蒙解救；在那裡耶和華要救贖你。」不是到了耶路撒冷才被救，是在最遠的地方、在敵人的國裡、在她以為神不在的地方。這句話，是在給所有被放逐的人：神不只在聖殿，神也在你被帶到的那一個地方。<\/p><p><strong>「救贖」是親族的字眼。<\/strong>go-el 是家裡有人陷在困境，親族出面贖回的那一位。神自己，是錫安的親族。祂不是遠遠地下命令，而是出面贖人。<\/p>"},{"a":11,"z":13,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעַתָּה נֶאֶסְפוּ עָלַיִךְ גּוֹיִם רַבִּים הָאֹמְרִים תֶּחֱנָף וְתַחַז בְּצִיּוֹן עֵינֵֽינוּ׃ וְהֵמָּה לֹא יָֽדְעוּ מַחְשְׁבוֹת יְהוָה וְלֹא הֵבִינוּ עֲצָתוֹ כִּי קִבְּצָם כֶּעָמִיר גֹּֽרְנָה׃ קוּמִי וָדוֹשִׁי בַת־צִיּוֹן כִּֽי־קַרְנֵךְ אָשִׂים בַּרְזֶל וּפַרְסֹתַיִךְ אָשִׂים נְחוּשָׁה וַהֲדִקּוֹת עַמִּים רַבִּים וְהַחֲרַמְתִּי לַֽיהוָה בִּצְעָם וְחֵילָם לַאֲדוֹן כָּל־הָאָֽרֶץ׃<\/p><\/blockquote>","lit":"<blockquote><p>「現在有許多國的民聚集攻擊你，說：願錫安被玷污！願我們親眼見她遭報！他們卻不知道耶和華的意念，也不明白他的籌劃。他聚集他們，好像把禾捆聚到禾場一樣。錫安的民哪，起來踹穀吧！我必使你的角成為鐵，使你的蹄成為銅。你必打碎多國的民，將他們的財獻與耶和華，將他們的貨獻與普天下的主。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>聚集<\/td><td>נֶאֶסְפוּ<\/td><td>neesfu<\/td><td>H622<\/td><td>他們被聚集<\/td><\/tr><tr><td>思念<\/td><td>מַחְשְׁבוֹת<\/td><td>makhshevot<\/td><td>H4284<\/td><td>計畫、思想<\/td><\/tr><tr><td>不明白<\/td><td>הֵבִינוּ<\/td><td>hevinu<\/td><td>H995<\/td><td>他們不明白<\/td><\/tr><tr><td>禾捆<\/td><td>כֶּעָמִיר<\/td><td>keamir<\/td><td>H5995<\/td><td>像禾捆<\/td><\/tr><tr><td>踹穀<\/td><td>וָדוֹשִׁי<\/td><td>vadoshi<\/td><td>H1758<\/td><td>你要踹打、踏碎<\/td><\/tr><tr><td>鐵<\/td><td>בַּרְזֶל<\/td><td>barzel<\/td><td>H1270<\/td><td>鐵<\/td><\/tr><tr><td>獻<\/td><td>וְהַחֲרַמְתִּי<\/td><td>vehakharamti<\/td><td>H2763<\/td><td>我要奉獻、歸神滅絕<\/td><\/tr><tr><td>主<\/td><td>לַאֲדוֹן<\/td><td>laadon<\/td><td>H113<\/td><td>歸於主<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「現在」<\/strong>（ve-attah）：4:9 與 4:11 都以「現在」起頭，是兩個並行的現實：4:9 的「現在」是錫安的痛苦；4:11 的「現在」是許多國的聚集。兩個「現在」，是同一個時刻的兩面。<\/p><p><strong>「他們必看見錫安」<\/strong>：原文的主詞是列國，意思是「讓我們的眼睛看著錫安（遭禍）」，是幸災樂禍的眼光。注意：「玷污」（khanaf）有「褻瀆」的意思，他們想要的，不只是打敗，而是羞辱。<\/p><p><strong>「不知道耶和華的意念」<\/strong>：lo yadu makhshevot YHWH。列國以為這是他們的計畫，其實這是神的「思想」。<strong>「禾捆」<\/strong>（amir）是剛割下、放在禾場上的穀物；列國被「聚集」，像穀物被運到打穀場上。<\/p><p><strong>「奉獻」<\/strong>：hakharamti 與「herem」（歸神）同字根。經文談的，是列國的財物歸耶和華，是指「財富與力量改為神所有」，<strong>不是教導人今天拿起武器<\/strong>。<\/p>","exp":"<p><strong>兩批「聚集」，要放在一起看。<\/strong>4:6 是神聚集瘸腿的；4:11 是列國聚集來攻擊錫安。表面上，列國聚集是他們自己的主意，但 4:12 說：其實是耶和華「聚集」他們，像聚集禾捆。同一個動詞，兩種聚集：神聚集祂的民去得拯救；神也聚集仇敵去被審判。<\/p><p><strong>列國以為自己在作主。<\/strong>他們說：「願錫安被玷污，願我們的眼目看見她遭禍。」他們看見的是機會，神看見的是打穀場。人以為自己在決定歷史，其實神才是主角。這不是叫人看輕任何一場真實的戰爭，而是叫人知道：最後的主不是敵人。<\/p><p><strong>「不知道耶和華的意念」，是列國的盲點。<\/strong>也可能是我們的。我們以為遇到的是一個問題、一個敵人、一個絕境，神的意念，常常比我們看見的大。<\/p><p><strong>「起來踹穀吧」。<\/strong>錫安被叫起來：昨天她還在產痛中扭動，今天她被叫去踹穀。神給她的，是鐵角、銅蹄，是力量。但這不是人自己的力量，是神所賜的，所以最後所有的戰利品，都「歸於全地之主」。<\/p><p><strong>要小心：這一段不是為今日的任何戰爭背書。<\/strong>錫安、亞述、列國，都是主前八世紀的歷史對象；我們不可以把某個現代國家或民族，對應成「列國」，也不可以拿這段話來證明某一場戰爭是神的旨意。這段經文真正要教我們的是：最後的主，是耶和華，不是敵人，不是我們自己。<\/p>"}],"5":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַתָּה תִּתְגֹּדְדִי בַת־גְּדוּד מָצוֹר שָׂם עָלֵינוּ בַּשֵּׁבֶט יַכּוּ עַֽל־הַלְּחִי אֵת שֹׁפֵט יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「成群的民哪，現在你要聚集成隊；因為仇敵圍攻我們，要用杖擊打以色列審判者的臉。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>聚集成隊<\/td><td>תִּתְגֹּדְדִי<\/td><td>titgodedi<\/td><td>H1413<\/td><td>你要聚集成隊、你要自割（兩義）<\/td><\/tr><tr><td>圍攻<\/td><td>מָצוֹר<\/td><td>matsor<\/td><td>H4692<\/td><td>圍困、圍城<\/td><\/tr><tr><td>杖<\/td><td>בַּשֵּׁבֶט<\/td><td>bashshevet<\/td><td>H7626<\/td><td>用杖、用棍<\/td><\/tr><tr><td>擊打<\/td><td>יַכּוּ<\/td><td>yakku<\/td><td>H5221<\/td><td>他們要擊打<\/td><\/tr><tr><td>臉<\/td><td>הַלְּחִי<\/td><td>hallekhi<\/td><td>H3895<\/td><td>腮頰、臉頰<\/td><\/tr><tr><td>審判者<\/td><td>שֹׁפֵט<\/td><td>shofet<\/td><td>H8199<\/td><td>審判者、治理者<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「聚集成隊」<\/strong>：titgodedi 這個動詞有兩種讀法：一是「聚集成隊（軍旅）」，一是「（因哀痛）割傷自己」。和合本取前者，但上下文的氣氛，是被圍困、準備迎戰的城。這一節在希伯來文聖經裡屬於第 4 章最後一節（4:14），英文與和合本把它歸入第 5 章，與下一節合讀。<\/p><p><strong>「審判者」<\/strong>：shofet，與 4:3「他要審判（shafat）列國」同字根；3:1 的「首領」本該按公平審案，而此刻「以色列的審判者」自己被人用杖擊打臉頰。<\/p><p><strong>「用杖擊打臉」<\/strong>：這是極大的羞辱，不是致命傷。被羞辱的人是審判者，是<strong>那位本該執行公平的人<\/strong>。經文沒有說他是誰：有學者認為指當時的某位猶大王，有學者認為是泛指王權。我們不替經文指名。<\/p>","exp":"<p><strong>第 5 章從一個被打臉的審判者開始。<\/strong>4 章的結尾是錫安被叫起來、長出鐵角；5 章的第一句卻是：圍城、杖、臉頰。先知沒有讓盼望的氣氛停太久，他把人拉回眼前的現實：城被圍，審判者被辱。盼望是真的，現在也是真的。<\/p><p><strong>這一節為下一節預備了一個強烈的對照。<\/strong>被辱的是「審判者」（shofet）；下一節出來的，是「掌權者」（moshel）。一個在圍城中受辱，一個從小地方出來。彌迦要人看見：神所預備的君王，不是從這個正在崩壞的王權裡出來的，是從別處出來的。<\/p><p><strong>這節沒有被硬解成預言。<\/strong>新約記載耶穌被人用葦子打頭、吐唾沫（太 27:30），我們讀到這些時，可以想起這一句；但新約沒有明說這裡「應驗」，我們也不替它加註腳。我們只說：神的王在我們看得見之前，已經走進了被羞辱的路。<\/p>"},{"a":2,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאַתָּה בֵּֽית־לֶחֶם אֶפְרָתָה צָעִיר לִֽהְיוֹת בְּאַלְפֵי יְהוּדָה מִמְּךָ לִי יֵצֵא לִֽהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל וּמוֹצָאֹתָיו מִקֶּדֶם מִימֵי עוֹלָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「伯利恆的以法他啊，你在猶大諸城中為小，將來必有一位從你那裡出來，在以色列中為我作掌權的；他的根源從亙古，從太初就有。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>伯利恆<\/td><td>בֵּֽית<\/td><td>beit<\/td><td>H1035<\/td><td>房子（伯利恆＝麵包的房子）<\/td><\/tr><tr><td>以法他<\/td><td>אֶפְרָתָה<\/td><td>efratah<\/td><td>H672<\/td><td>以法他（伯利恆的別稱）<\/td><\/tr><tr><td>小<\/td><td>צָעִיר<\/td><td>tsair<\/td><td>H6810<\/td><td>小、年幼<\/td><\/tr><tr><td>出來<\/td><td>יֵצֵא<\/td><td>yetse<\/td><td>H3318<\/td><td>他要出來<\/td><\/tr><tr><td>掌權<\/td><td>מוֹשֵׁל<\/td><td>moshel<\/td><td>H4910<\/td><td>掌權者、統治者<\/td><\/tr><tr><td>根源<\/td><td>וּמוֹצָאֹתָיו<\/td><td>umotsaotav<\/td><td>H4163<\/td><td>他的出處、他的根源<\/td><\/tr><tr><td>古時<\/td><td>מִקֶּדֶם<\/td><td>miqqedem<\/td><td>H6924<\/td><td>從古時、從太初<\/td><\/tr><tr><td>亙古<\/td><td>מִימֵי<\/td><td>miyemei<\/td><td>H3117<\/td><td>從……的日子（諸日）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「你……為小」<\/strong>：tsair，是「年幼的、不起眼的」。<strong>「千」<\/strong>（elef）在這裡是<strong>宗族的單位<\/strong>，不是人數：「猶大諸宗族之中，你是小的」。和合本譯成「猶大諸城」是意譯。<\/p><p><strong>「將來必有一位從你那裡出來」<\/strong>：yetse（他要出來），與 1:3「耶和華出了他的居所」、4:10「你要出離城邑」同字根（yatsa）。出來的，是為神作王、為神掌權的人：le-hiyot moshel，「為要成為掌權者」。<\/p><p><strong>「為我作掌權的」<\/strong>：原文有 li（為我），意思是：這一位，是為耶和華自己而掌權的。他的權柄，不是自己的，是被託付的。<\/p><p><strong>「他的根源」<\/strong>：motsaotav，是複數，字根與「出來」相同；字面是「他的出處們」。<strong>「從亙古，從太初」<\/strong>：miqqedem（從古時）與 mimei olam（從永遠的日子）並列。這兩個詞語在別處（如：彌 7:14、7:20；哈 1:12）也指很久以前，未必就是「無始」。經文用最古老的詞語，說這位君王的來歷，<strong>不是從今天才開始的<\/strong>。<\/p>","exp":"<p><strong>神把最大的應許，放在最小的地方。<\/strong>耶路撒冷有聖殿、有宮殿、有城牆；神卻不從那裡出王。祂指向一個「為小」的伯利恆，只是一個村落，是大衛的家鄉。這是神一貫的作法：祂揀選的，常常是人看不上眼的。<\/p><p><strong>「出來」是全卷最重要的字之一。<\/strong>全卷有八處「出來」：1:3 是耶和華親自出居所來審判；4:2 說訓誨要從錫安出來；4:10 說人要出離城邑；現在 5:2 說君王要從伯利恆出來。從審判、到教訓、到流亡、到王，都是「出來」。神不是遠遠地坐著，祂一直在「出來」。<\/p><p><strong>馬太福音 2:5–6 引用了這節。<\/strong>祭司長和文士回答希律：「猶太的伯利恆。」他們引用的文字，與彌迦書略有不同，那是新約作者自己的引法。我們可以確定的是：新約把這個應許，連在耶穌的降生上；而這個連結，是新約自己作的，不是我們加上去的。約翰福音 7:42 也記載當時的人，知道基督要出於伯利恆。<\/p><p><strong>「根源從亙古」這句，要順著經文讀。<\/strong>彌迦當年說的，至少是：這位王不是新冒出的人物，他的來歷與神的古老計畫連在一起。基督徒讀到這裡，常聯想到約翰福音一章的「太初有道」；那是新約之後才有的亮光，我們可以說「這使我們想起」，但不替這節加上超過經文的證明。<\/p><p><strong>在 321 裡，這就是「耶穌是我的榜樣」。<\/strong>祂的出身是小地方，祂的路是被輕看的路。我們若要跟隨祂，就得先放下「我要有名、有位」的想法。<\/p>"},{"a":3,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לָכֵן יִתְּנֵם עַד־עֵת יוֹלֵדָה יָלָדָה וְיֶתֶר אֶחָיו יְשׁוּבוּן עַל־בְּנֵי יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華必將以色列人交付敵人，直等那生產的婦人生下子來。那時掌權者其餘的弟兄必歸到以色列人那裡。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>交付<\/td><td>יִתְּנֵם<\/td><td>yittenem<\/td><td>H5414<\/td><td>他要把他們交出<\/td><\/tr><tr><td>時候<\/td><td>עֵת<\/td><td>et<\/td><td>H6256<\/td><td>時刻、時候<\/td><\/tr><tr><td>生產的婦人<\/td><td>יוֹלֵדָה<\/td><td>yoledah<\/td><td>H3205<\/td><td>正在生產的婦人<\/td><\/tr><tr><td>生下<\/td><td>יָלָדָה<\/td><td>yaladah<\/td><td>H3205<\/td><td>她生下了<\/td><\/tr><tr><td>其餘的<\/td><td>וְיֶתֶר<\/td><td>veyeter<\/td><td>H3499<\/td><td>餘剩的<\/td><\/tr><tr><td>弟兄<\/td><td>אֶחָיו<\/td><td>ekhav<\/td><td>H251<\/td><td>他的弟兄們<\/td><\/tr><tr><td>歸回<\/td><td>יְשׁוּבוּן<\/td><td>yeshuvun<\/td><td>H7725<\/td><td>他們要回來<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「所以」<\/strong>：lakhen，是邏輯連接詞，把 5:3 接在 5:2 後面：因為這位王要出來，所以神要先「交出」他們，直到……<\/p><p><strong>「生產的婦人生下子來」<\/strong>：yoledah yaladah，是同一個字根重複使用，字面「生產者生產了」。這句話，有兩種讀法：一是接上 4:9–10 錫安「像產婦」的痛苦，這位婦人就是錫安，生下來的是新時代；一是指某位具體的母親，生下那位君王（參賽 7:14）。歷來學者並陳這兩種讀法，<strong>我們不強迫選一個<\/strong>，兩者並不互相排斥。<\/p><p><strong>「其餘的弟兄」<\/strong>：yeter ehav，「他的弟兄中剩下的」。<strong>「歸到」<\/strong>：yeshuvun 是「回來」，是 shuv 的動詞，與「悔改」同字根。<\/p>","exp":"<p><strong>在王出來之前，有一段「被交付」的時期。<\/strong>經文沒有美化這個空檔。神的應許與神的審判並行：王要出來，但在那之前，人要經歷被交給敵人的日子。這是一段等候，不是被遺棄。<\/p><p><strong>「直等那生產的婦人生下子來」：等候被說成「懷孕」。<\/strong>懷孕的日子看不出什麼，婦人天天等；時候一到，一個新的生命出來。不可以把這句話用來叫痛苦中的人「再忍耐一下」；只有神才能說：這一段，是有盡頭的。<\/p><p><strong>「其餘的弟兄必歸到以色列人那裡」。<\/strong>有些人是被趕散的、走遠的、出走的；王來的時候，他們要「回來」。這是一幅家族重聚的圖畫。神的王，是來把家人帶回來的。<\/p>"},{"a":4,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעָמַד וְרָעָה בְּעֹז יְהוָה בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו וְיָשָׁבוּ כִּֽי־עַתָּה יִגְדַּל עַד־אַפְסֵי־אָֽרֶץ׃ וְהָיָה זֶה שָׁלוֹם אַשּׁוּר כִּֽי־יָבוֹא בְאַרְצֵנוּ וְכִי יִדְרֹךְ בְּאַרְמְנֹתֵינוּ וַהֲקֵמֹנוּ עָלָיו שִׁבְעָה רֹעִים וּשְׁמֹנָה נְסִיכֵי אָדָֽם׃ וְרָעוּ אֶת־אֶרֶץ אַשּׁוּר בַּחֶרֶב וְאֶת־אֶרֶץ נִמְרֹד בִּפְתָחֶיהָ וְהִצִּיל מֵֽאַשּׁוּר כִּֽי־יָבוֹא בְאַרְצֵנוּ וְכִי יִדְרֹךְ בִּגְבוּלֵֽנוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「他必起來，倚靠耶和華的大能，並耶和華－他神之名的威嚴，牧養他的羊群。他們要安然居住；因為他必日見尊大，直到地極。這位必作我們的平安。當亞述人進入我們的地境，踐踏宮殿的時候，我們就立起七個牧者，八個首領攻擊他。他們必用刀劍毀壞亞述地和寧錄地的關口。亞述人進入我們的地境踐踏的時候，他必拯救我們。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>起來<\/td><td>וְעָמַד<\/td><td>veamad<\/td><td>H5975<\/td><td>他要站立<\/td><\/tr><tr><td>牧養<\/td><td>וְרָעָה<\/td><td>vaarah<\/td><td>H7462<\/td><td>他要牧養<\/td><\/tr><tr><td>大能<\/td><td>בְּעֹז<\/td><td>beoz<\/td><td>H5797<\/td><td>憑著大能<\/td><\/tr><tr><td>威嚴<\/td><td>בִּגְאוֹן<\/td><td>bigon<\/td><td>H1347<\/td><td>憑著威嚴、尊榮<\/td><\/tr><tr><td>平安<\/td><td>שָׁלוֹם<\/td><td>shalom<\/td><td>H7965<\/td><td>平安、完整<\/td><\/tr><tr><td>七個<\/td><td>שִׁבְעָה<\/td><td>shivah<\/td><td>H7651<\/td><td>七個<\/td><\/tr><tr><td>牧者<\/td><td>רֹעִים<\/td><td>roim<\/td><td>H7462<\/td><td>牧者們<\/td><\/tr><tr><td>毀壞<\/td><td>וְרָעוּ<\/td><td>vera-u<\/td><td>H7462<\/td><td>他們要牧（治理）、他們要毀壞<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「牧養」<\/strong>：raah，是「牧羊」。以賽亞書 40:11、結 34 也用這字。「牧養」在聖經裡常常是王的職分。這位王，<strong>用牧人的方式作王<\/strong>。<\/p><p><strong>「憑著耶和華的大能」<\/strong>：不是憑自己的力量。他站起來，有兩個依靠：耶和華的大能（oz）和耶和華名的威嚴（gaon）。<strong>這個「威嚴」<\/strong>（gaon）在 5:4 是好的，在別處（如摩 6:8）卻常常指人的驕傲，這是同一個字的兩種用法：驕傲是人自己抓住，威嚴是神所給的。<\/p><p><strong>「這位必作我們的平安」<\/strong>：zeh shalom（這位是平安）。原文沒有「作」字：是「這位，就是平安」。不是「他帶來平安」，而是「他就是平安」。這一句是全段的中心。<\/p><p><strong>「七個牧者，八個首領」<\/strong>：這是舊約常見的「數字遞進」的說法（如：箴 6:16；摩 1:3），意思是「足夠多，甚至更多」，<strong>不是算數目<\/strong>。<strong>「毀壞」<\/strong>（ra-u）：這個字可以讀成「牧」（治理）或「毀壞」；希臘文舊約（七十士譯本）和一些學者讀作「牧」。和合本採取「毀壞」。我們兩種讀法並陳，不因此改變整節的意思：神的子民，要得勝。<\/p>","exp":"<p><strong>這位王，是站著的牧人。<\/strong>「他必起來，牧養他的羊群」。不是坐在王座上的王，是站起來、走進羊群中的牧人。在 321 裡，這就是「耶穌是我的榜樣」：祂作王的方式，是牧養。<\/p><p><strong>「憑著耶和華的大能」，是他的力量來源。<\/strong>他沒有自己的軍隊、自己的財富、自己的名聲。他的力量，是父神的力量。耶穌在約翰福音 5:19 說：「子憑著自己不能作什麼，惟有看見父所作的，子才能作。」我們看見：新約裡耶穌的態度，和彌迦所說的這位王，是同一種姿態。<\/p><p><strong>「這位必作我們的平安」，是彌迦書的高峰之一。<\/strong>不是「他給我們平安」，是「他就是我們的平安」。以弗所書 2:14 說：「因他使我們和睦。」平安不是一種心情，也不是一個條件，而是一位。當人把平安放在別的地方，如錢、關係、成就，一旦失去，平安就不見了。把平安放在一位身上，就不會不見。<\/p><p><strong>「七個、八個」不是算數字。<\/strong>有人用這節來推算末世時間表，或算「七牧者八首領」是誰；經文用的是一種修辭，意思是「神要興起足夠的人來」。我們不推算，也不指名。<\/p><p><strong>亞述是當時的世界強權。<\/strong>那是一個讓人怕的名字；彌迦說：你們不必怕，因為「這位」是平安。我們今天不要把「亞述」換成任何現代的國家，而是要問：我今天心裡最怕的，是什麼？<\/p>"},{"a":7,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיָה שְׁאֵרִית יַעֲקֹב בְּקֶרֶב עַמִּים רַבִּים כְּטַל מֵאֵת יְהוָה כִּרְבִיבִים עֲלֵי־עֵשֶׂב אֲשֶׁר לֹֽא־יְקַוֶּה לְאִישׁ וְלֹא יְיַחֵל לִבְנֵי אָדָֽם׃ וְהָיָה שְׁאֵרִית יַעֲקֹב בַּגּוֹיִם בְּקֶרֶב עַמִּים רַבִּים כְּאַרְיֵה בְּבַהֲמוֹת יַעַר כִּכְפִיר בְּעֶדְרֵי צֹאן אֲשֶׁר אִם עָבַר וְרָמַס וְטָרַף וְאֵין מַצִּֽיל׃ תָּרֹם יָדְךָ עַל־צָרֶיךָ וְכָל־אֹיְבֶיךָ יִכָּרֵֽתוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「雅各餘剩的人必在多國的民中，如從耶和華那裡降下的露水，又如甘霖降在草上；不仗賴人力，也不等候世人之功。雅各餘剩的人必在多國多民中，如林間百獸中的獅子，又如少壯獅子在羊群中。他若經過就必踐踏撕裂，無人搭救。願你的手舉起，高過敵人！願你的仇敵都被剪除！」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>餘剩的<\/td><td>שְׁאֵרִית<\/td><td>sheerit<\/td><td>H7611<\/td><td>餘剩的人、餘民<\/td><\/tr><tr><td>露水<\/td><td>כְּטַל<\/td><td>ketal<\/td><td>H2919<\/td><td>像露水<\/td><\/tr><tr><td>甘霖<\/td><td>כִּרְבִיבִים<\/td><td>kirviviim<\/td><td>H7241<\/td><td>像細雨<\/td><\/tr><tr><td>等候<\/td><td>יְקַוֶּה<\/td><td>yekavveh<\/td><td>H6960<\/td><td>他要仰望、等候<\/td><\/tr><tr><td>獅子<\/td><td>כְּאַרְיֵה<\/td><td>kearyeh<\/td><td>H738<\/td><td>像獅子<\/td><\/tr><tr><td>踐踏<\/td><td>וְרָמַס<\/td><td>veramas<\/td><td>H7429<\/td><td>他踐踏<\/td><\/tr><tr><td>無人救<\/td><td>מַצִּֽיל<\/td><td>matsil<\/td><td>H5337<\/td><td>拯救的人<\/td><\/tr><tr><td>剪除<\/td><td>יִכָּרֵֽתוּ<\/td><td>yikkaretu<\/td><td>H3772<\/td><td>他們要被剪除<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「餘剩的人」<\/strong>：sheerit，是「餘民」軌跡（2:12；4:7；5:7–8；7:18）的核心字。這一節出現兩次（5:7、5:8），是全卷第一次，把「餘民」放在<strong>列國中間<\/strong>，不只是被帶回來，而是在列國中活著。<\/p><p><strong>「露水」「甘霖」<\/strong>：tal（露水）與revivim（細雨）都是不靠人手、從天降下的水。<strong>「不等候世人之功」<\/strong>：lo yekavveh le-ish，字面「不仰望人」。露水不等人，不會因人努力才降下。<\/p><p><strong>「獅子」<\/strong>：aryeh，同一個餘民，在 5:8 變成獅子：在羊群中，踐踏、撕裂，沒有人救。<strong>這兩個比喻放在一起<\/strong>，是故意的：一個是祝福，一個是力量。<\/p><p><strong>「你的手要舉起」<\/strong>：5:9 的「你」是餘民，「手舉起」是得勝的姿態，<strong>這節是比喻，不是教導信徒採取暴力<\/strong>。<\/p>","exp":"<p><strong>餘民在列國中的兩個樣子：露水和獅子。<\/strong>露水，是安靜的、柔軟的、滋潤的；獅子，是有力的、不被攔阻的。神的子民，在世界中可以是兩種樣子，沒有哪一個是多餘的。要有露水的柔，才不會傷人；要有獅子的力，才不會被壓倒。<\/p><p><strong>「如從耶和華那裡降下的露水」：他們的價值，不是自己的。<\/strong>露水來自天，不是來自地。餘民在列國中活著，他們帶給世界的祝福，不是自己的能力，而是從耶和華那裡降下來的。這是謙卑：我不是源頭，我只是水滴。<\/p><p><strong>「不仗賴人力，也不等候世人之功」。<\/strong>這句是整段的關鍵：他們的祝福，不靠人給的位置、人給的掌聲。人不給，他們仍然是露水。<\/p><p><strong>獅子的比喻，不是為暴力背書。<\/strong>這是詩歌的語言，描寫神所保守的餘民不被壓倒、無人能搶走。我們不可以用這節為今天任何暴力、報復、或對異己的壓迫辯護。第 6 章會告訴我們，神真正要的，是行公義、好憐憫、存謙卑的心（6:8）。<\/p>"},{"a":10,"z":15,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיָה בַיּוֹם־הַהוּא נְאֻם־יְהוָה וְהִכְרַתִּי סוּסֶיךָ מִקִּרְבֶּךָ וְהַאֲבַדְתִּי מַרְכְּבֹתֶֽיךָ׃ וְהִכְרַתִּי עָרֵי אַרְצֶךָ וְהָרַסְתִּי כָּל־מִבְצָרֶֽיךָ׃ וְהִכְרַתִּי כְשָׁפִים מִיָּדֶךָ וּֽמְעוֹנְנִים לֹא יִֽהְיוּ־לָֽךְ׃ וְהִכְרַתִּי פְסִילֶיךָ וּמַצֵּבוֹתֶיךָ מִקִּרְבֶּךָ וְלֹֽא־תִשְׁתַּחֲוֶה עוֹד לְמַעֲשֵׂה יָדֶֽיךָ׃ וְנָתַשְׁתִּי אֲשֵׁירֶיךָ מִקִּרְבֶּךָ וְהִשְׁמַדְתִּי עָרֶֽיךָ׃ וְעָשִׂיתִי בְּאַף וּבְחֵמָה נָקָם אֶת־הַגּוֹיִם אֲשֶׁר לֹא שָׁמֵֽעוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華說：到那日，我必從你中間剪除馬匹，毀壞車輛，也必從你國中除滅城邑，拆毀一切的保障，又必除掉你手中的邪術；你那裡也不再有占卜的。我必從你中間除滅雕刻的偶像和柱像，你就不再跪拜自己手所造的。我必從你中間拔出木偶，又毀滅你的城邑。我也必在怒氣和忿怒中向那不聽從的列國施報。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>剪除<\/td><td>וְהִכְרַתִּי<\/td><td>vehikhratti<\/td><td>H3772<\/td><td>我要剪除<\/td><\/tr><tr><td>馬<\/td><td>סוּסֶיךָ<\/td><td>susekha<\/td><td>H5483<\/td><td>你的馬<\/td><\/tr><tr><td>戰車<\/td><td>מַרְכְּבֹתֶֽיךָ<\/td><td>markevotekha<\/td><td>H4818<\/td><td>你的戰車<\/td><\/tr><tr><td>邪術<\/td><td>כְשָׁפִים<\/td><td>khesafim<\/td><td>H3785<\/td><td>邪術、巫術<\/td><\/tr><tr><td>雕刻的偶像<\/td><td>פְסִילֶיךָ<\/td><td>fesilekha<\/td><td>H6456<\/td><td>你雕刻的像<\/td><\/tr><tr><td>柱像<\/td><td>וּמַצֵּבוֹתֶיךָ<\/td><td>umatstsevotekha<\/td><td>H4676<\/td><td>你的柱像<\/td><\/tr><tr><td>報復<\/td><td>נָקָם<\/td><td>naqam<\/td><td>H5359<\/td><td>報復、伸冤<\/td><\/tr><tr><td>不聽從<\/td><td>שָׁמֵֽעוּ<\/td><td>shameu<\/td><td>H8085<\/td><td>他們聽從<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「我要剪除」<\/strong>：vehikhratti，在 5:10–13 出現<strong>四次<\/strong>（馬、城邑、邪術、偶像），是這一段的節奏。每一次剪除的對象，都是以色列所倚靠的東西。<\/p><p><strong>「你的」<\/strong>：5:10–14 全都用第二人稱單數：你的馬、你的戰車、你的城邑、你的偶像。<strong>被剪除的，是以色列自己所倚靠的<\/strong>，不是別國的。<\/p><p><strong>「不聽從的列國」<\/strong>：asher lo shameu，「那不聽（從）的」。「聽」（shama）是全卷的軌跡：1:2「你們都要聽」、3:1「你們要聽」、6:1「要聽」，到 5:15 是「不聽從」的結局。<\/p><p><strong>「報復」<\/strong>：naqam 在聖經裡，是神自己的行動；人不可以用這個字給自己報復。<\/p>","exp":"<p><strong>神要除去的，是人所仗賴的東西。<\/strong>馬和戰車，是軍事的力量；城邑與堡壘，是安全的保障；邪術與占卜，是對未來的控制；偶像與柱像，是對神的取代。神對祂的百姓說：我要把你所依靠的，一樣一樣拿走。<\/p><p><strong>這不是懲罰，是剝掉假的支柱。<\/strong>一個人若靠著不是神的東西站立，那個東西倒下的時候，人才有機會被神扶起來。神拿走馬和戰車，是為了讓人看見：真正的平安（5:5），是一位，不是一個武器庫。<\/p><p><strong>你今天的「馬」和「戰車」是什麼？<\/strong>今天的人不一定有馬和戰車，但每個人都有自己的倚靠：存款、人脈、學歷、掌控。這些本身不是罪，但若成為安全感的源頭，神就可能一樣一樣拿走。<\/p><p><strong>最後一句，是給「不聽從」的人。<\/strong>全卷開始說「你們都要聽」，結尾說「不聽從的」。聽，不是一個小事，是全卷的軸線。神不是等著報復，祂是一次又一次地呼喊：你們要聽。<\/p><p><strong>「報復」留給神。<\/strong>這節話不能被拿來證明我們可以報復別人。羅馬書 12:19 說：「不要自己伸冤，寧可讓步，聽憑主怒；因為經上記著：主說：伸冤在我，我必報應。」<\/p>"}],"6":[{"a":1,"z":2,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ־נָא אֵת אֲשֶׁר־יְהוָה אֹמֵר קוּם רִיב אֶת־הֶהָרִים וְתִשְׁמַעְנָה הַגְּבָעוֹת קוֹלֶֽךָ׃ שִׁמְעוּ הָרִים אֶת־רִיב יְהוָה וְהָאֵתָנִים מֹסְדֵי אָרֶץ כִּי רִיב לַֽיהוָה עִם־עַמּוֹ וְעִם־יִשְׂרָאֵל יִתְוַכָּֽח׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列人哪，當聽耶和華的話！要起來向山嶺爭辯，使岡陵聽你的話。山嶺和地永久的根基啊，要聽耶和華爭辯的話！因為耶和華要與他的百姓爭辯，與以色列爭論。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>要聽<\/td><td>שִׁמְעוּ<\/td><td>shimu<\/td><td>H8085<\/td><td>你們要聽<\/td><\/tr><tr><td>爭辯<\/td><td>רִיב<\/td><td>riv<\/td><td>H7378<\/td><td>訟案、爭訟<\/td><\/tr><tr><td>山嶺<\/td><td>הֶהָרִים<\/td><td>hehariym<\/td><td>H2022<\/td><td>那些山<\/td><\/tr><tr><td>岡陵<\/td><td>הַגְּבָעוֹת<\/td><td>haggevaot<\/td><td>H1389<\/td><td>那些山崗<\/td><\/tr><tr><td>根基<\/td><td>מֹסְדֵי<\/td><td>mosedei<\/td><td>H4146<\/td><td>根基們<\/td><\/tr><tr><td>爭論<\/td><td>יִתְוַכָּֽח<\/td><td>yitvakkakh<\/td><td>H3198<\/td><td>他要辯論、他要爭論<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「要聽」<\/strong>：shimu，是「聽」（shama）軌跡在全卷的又一次命令（1:2；3:1；6:1、2、9）。這一節與 3:1 一樣，開口就是「聽」。<\/p><p><strong>「爭辯」<\/strong>：riv，是「訴訟、案件」，在先知書裡是<strong>約的官司<\/strong>：神把自己的子民帶上法庭。山嶺與地的根基，是旁聽的證人（申 32:1；賽 1:2 也有同樣的場景）。<\/p><p><strong>「與以色列爭論」<\/strong>：yitvakkakh，是法庭辯論的用語，意思是「他要提出論點」，不是「他要發脾氣」。這是一場講道理的官司。<\/p>","exp":"<p><strong>神把自己放在被告席旁邊。<\/strong>這是全卷最特別的場景：神召集山嶺和地的根基當證人，然後對自己的百姓說：來，我們把這件事說清楚。審判者願意先聽人說話。這是慈愛的先聲：一個真的要懲罰的人，不會先請你辯論。<\/p><p><strong>山嶺是不會偏袒的證人。<\/strong>它們看過亞伯拉罕，看過摩西，看過以色列走過的每一步；它們不為任何人說話，只作見證。有時候我們最需要的，是一個不偏不倚的證人，來告訴我們：事情到底是怎麼走到這一步的。<\/p><p><strong>3 章與 6 章的「聽」，有一個對照。<\/strong>3:1 是首領要聽；6:1 是全民要聽。審判者先被審判，然後所有人被邀請坐下來。神的官司，從上面開始，一直到每一個人。<\/p>"},{"a":3,"z":5,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַמִּי מֶה־עָשִׂיתִי לְךָ וּמָה הֶלְאֵתִיךָ עֲנֵה בִּֽי׃ כִּי הֶעֱלִתִיךָ מֵאֶרֶץ מִצְרַיִם וּמִבֵּית עֲבָדִים פְּדִיתִיךָ וָאֶשְׁלַח לְפָנֶיךָ אֶת־מֹשֶׁה אַהֲרֹן וּמִרְיָֽם׃ עַמִּי זְכָר־נָא מַה־יָּעַץ בָּלָק מֶלֶךְ מוֹאָב וּמֶה־עָנָה אֹתוֹ בִּלְעָם בֶּן־בְּעוֹר מִן־הַשִּׁטִּים עַד־הַגִּלְגָּל לְמַעַן דַּעַת צִדְקוֹת יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「我的百姓啊，我向你做了甚麼呢？我在甚麼事上使你厭煩？你可以對我證明。我曾將你從埃及地領出來，從作奴僕之家救贖你；我也差遣摩西、亞倫，和米利暗在你前面行。我的百姓啊，你們當追念摩押王巴勒所設的謀和比珥的兒子巴蘭回答他的話，並你們從什亭到吉甲所遇見的事，好使你們知道耶和華公義的作為。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>厭煩<\/td><td>הֶלְאֵתִיךָ<\/td><td>helteikha<\/td><td>H3811<\/td><td>我使你疲累<\/td><\/tr><tr><td>回答<\/td><td>עֲנֵה<\/td><td>anei<\/td><td>H6030<\/td><td>你回答（我）<\/td><\/tr><tr><td>領出來<\/td><td>הֶעֱלִתִיךָ<\/td><td>heelitikha<\/td><td>H5927<\/td><td>我曾領你上來<\/td><\/tr><tr><td>救贖<\/td><td>פְּדִיתִיךָ<\/td><td>peditikha<\/td><td>H6299<\/td><td>我曾贖你<\/td><\/tr><tr><td>巴蘭<\/td><td>בִּלְעָם<\/td><td>bilam<\/td><td>H1109<\/td><td>巴蘭<\/td><\/tr><tr><td>公義的作為<\/td><td>צִדְקוֹת<\/td><td>tsidqot<\/td><td>H6666<\/td><td>公義的事、拯救的作為<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「我的百姓啊」<\/strong>：ammi，是呼喊，不是稱呼。神在被告面前，仍然說「我的百姓」。<\/p><p><strong>「我向你作了甚麼呢？」<\/strong>：原文是<strong>兩個問句連續<\/strong>：「我對你做了什麼？我怎樣使你疲累？」神不是要人認罪，而是邀請人指出自己哪裡做錯。這是先知書裡少見的、神對人的「自我辯護」，卻<strong>不是<\/strong>為自己找理由，而是為了讓人想起：祂所做的一切，都是為人。<\/p><p><strong>「領出來」「救贖」<\/strong>：he-elitikha（我使你上來）與 peditikha（我贖了你）是兩個出埃及的字：前者是方向（從埃及上來），後者是代價（贖回）。這是 6:4 的核心。<\/p><p><strong>「公義的作為」<\/strong>：tsidqot YHWH，是<strong>複數<\/strong>，「耶和華多次的公義作為」。它在士師記 5:11 也是這個意思：神的拯救的歷史。<strong>這裡「公義」不是審判，是拯救。<\/strong><\/p>","exp":"<p><strong>神的第一句話，是問人有什麼不滿。<\/strong>「我的百姓啊，我向你作了甚麼呢？」這一句的語氣，像一位被誤會的父親、一位被冷落的丈夫。神不是用力量壓住人的口，祂是把口讓給人。這是一位極有耐性的神。<\/p><p><strong>然後神開始說「記得」。<\/strong>祂沒有列舉人的罪，祂列舉自己做過的事：領出來、救贖、差遣摩西、亞倫與米利暗。這份名單裡有一個很少被注意的名字：米利暗。神所差遣的領袖，是三個人，包括一位女性。祂的恩典不只是一個人，是一群人。<\/p><p><strong>為什麼提到巴勒和巴蘭？<\/strong>民數記 22–24 記載，摩押王巴勒雇用巴蘭去咒詛以色列，神卻使他說了祝福。以色列沒有出力，沒有參與，甚至不知道，神已經替他們擋住了咒詛。「從什亭到吉甲」，是從約旦河東到約旦河西，從曠野到應許地。神要百姓回想的，是那些**他們不知道、神替他們做的事**。<\/p><p><strong>記得，是悔改的第一步。<\/strong>人不是被罵醒的，人是被提醒：我是一個被愛的人。人一旦記得自己曾被這樣對待，後面所有的要求，才不會變成壓力。<\/p>"},{"a":6,"z":8,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בַּמָּה אֲקַדֵּם יְהוָה אִכַּף לֵאלֹהֵי מָרוֹם הַאֲקַדְּמֶנּוּ בְעוֹלוֹת בַּעֲגָלִים בְּנֵי שָׁנָֽה׃ הֲיִרְצֶה יְהוָה בְּאַלְפֵי אֵילִים בְּרִֽבְבוֹת נַֽחֲלֵי־שָׁמֶן הַאֶתֵּן בְּכוֹרִי פִּשְׁעִי פְּרִי בִטְנִי חַטַּאת נַפְשִֽׁי׃ הִגִּיד לְךָ אָדָם מַה־טּוֹב וּמָֽה־יְהוָה דּוֹרֵשׁ מִמְּךָ כִּי אִם־עֲשׂוֹת מִשְׁפָּט וְאַהֲבַת חֶסֶד וְהַצְנֵעַ לֶכֶת עִם־אֱלֹהֶֽיךָ׃<\/p><\/blockquote>","lit":"<blockquote><p>「我朝見耶和華，在至高神面前跪拜，當獻上甚麼呢？豈可獻一歲的牛犢為燔祭嗎？耶和華豈喜悅千千的公羊，或是萬萬的油河嗎？我豈可為自己的罪過獻我的長子嗎？為心中的罪惡獻我身所生的嗎？世人哪，耶和華已指示你何為善。他向你所要的是甚麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>燔祭<\/td><td>בְעוֹלוֹת<\/td><td>veolot<\/td><td>H5930<\/td><td>用燔祭<\/td><\/tr><tr><td>長子<\/td><td>בְּכוֹרִי<\/td><td>bekhori<\/td><td>H1060<\/td><td>我的長子<\/td><\/tr><tr><td>指示<\/td><td>הִגִּיד<\/td><td>higgid<\/td><td>H5046<\/td><td>他已告訴<\/td><\/tr><tr><td>要求<\/td><td>דּוֹרֵשׁ<\/td><td>doresh<\/td><td>H1875<\/td><td>他所尋求的、他所要的<\/td><\/tr><tr><td>公平<\/td><td>מִשְׁפָּט<\/td><td>mishpat<\/td><td>H4941<\/td><td>公平、公道<\/td><\/tr><tr><td>慈愛<\/td><td>חֶסֶד<\/td><td>khesed<\/td><td>H2617<\/td><td>慈愛、忠誠的愛<\/td><\/tr><tr><td>存謙卑<\/td><td>וְהַצְנֵעַ<\/td><td>vehatsnea<\/td><td>H6800<\/td><td>並且謙卑地<\/td><\/tr><tr><td>同行<\/td><td>לֶכֶת<\/td><td>lekhet<\/td><td>H3212<\/td><td>行走<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>6:6–7 是一連串愈來愈大的問句<\/strong>：一歲的牛犢→千千的公羊→萬萬的油河→長子。這是修辭上的「加碼」，一步一步把數目推到極端，結論是：不論多少，都不是神要的。<strong>這四步並不是神的要求<\/strong>，是敬拜的人提出來的反問。<\/p><p><strong>「我的長子」「我身所生的」<\/strong>：6:7 最後一句，把問題推到最極端。<strong>律法嚴禁以人獻祭<\/strong>（利 18:21；申 12:31），先知引用這個說法，是修辭上的極端，並<strong>不是<\/strong>在鼓勵，也不是在說當時的人普遍這樣做。<\/p><p><strong>「他已指示你何為善」<\/strong>：higgid lekha adam mah tov，「他已向你說明，世人哪，什麼是善」。<strong>「已」<\/strong>很要緊：這不是新的要求，是<strong>舊的、一直都在的<\/strong>。<strong>「世人」<\/strong>（adam）是泛指的「人」，不只是以色列人。<\/p><p><strong>三個要求<\/strong>：mishpat（公平）、khesed（慈愛、忠誠的愛）、hatsnea lekhet（謙卑地行走）。「公平」是 3:1、3:8、3:9 首領所厭惡的；<strong>「慈愛」<\/strong>（khesed）是盟約的忠誠，<strong>「好憐憫」<\/strong>中「好」字原文是 ahavah，是「愛」；<strong>「謙卑」<\/strong>（hatsnea）這個字在舊約只出現一次，字根與「謙遜」（箴 11:2）有關，有「不張揚、不炫耀」的意思。<strong>「與你的神同行」<\/strong>：lekhet 是「行走」（halakh），是「行走」軌跡的高峰：4:5 說「奉耶和華的名行走」；這裡說「與神同行」。<\/p>","exp":"<p><strong>這是全卷最有名的一節，也最容易被誤用。<\/strong>它常被拿來說：「神要的不是儀式，是行為。」這個說法有一半是對的，但如果停在這裡，就會把這節變成一份要人努力的清單。<\/p><p><strong>要看前面：神已經先做了。<\/strong>6:4 說：「我曾將你從埃及地領出來。」這是先於所有要求的恩典。神的要求，是對一群已經被贖的人說的，而不是對一群想要賺取救恩的人說的。所以 6:8 不是「靠行為得救」，而是「已經得救的人，要怎樣活」。<\/p><p><strong>三件事，是一個完整的圖畫。<\/strong>行公義，是對外：在市場上、法庭上，公平待人；好憐憫，是對內：心裡對人有溫度，不只是照規矩；存謙卑的心與神同行，是對上：不自己當王，與神同路。三者缺一不可：只有公義沒有憐憫，是冷酷；只有憐憫沒有公義，是縱容；兩者沒有與神同行，都是自己的善。<\/p><p><strong>「與你的神同行」，是 321 的「無己」。<\/strong>同行，就是不走在前面，也不落在後面；不替神作決定，也不丟下神自己走。驕傲是離開本位、抓住權力；謙卑是放下權力、回到本位。「存謙卑的心」，就是回到「人作人，神作神」的本位。<\/p><p><strong>6:7 不是在鼓勵獻上長子。<\/strong>先知用最荒謬的極端，來顯示人對「神到底要什麼」的誤解之深。任何以傷害人當作敬拜的做法，都與這節完全相反。<\/p>"},{"a":9,"z":12,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>קוֹל יְהוָה לָעִיר יִקְרָא וְתוּשִׁיָּה יִרְאֶה שְׁמֶךָ שִׁמְעוּ מַטֶּה וּמִי יְעָדָֽהּ׃ עוֹד הַאִשׁ בֵּית רָשָׁע אֹצְרוֹת רֶשַׁע וְאֵיפַת רָזוֹן זְעוּמָֽה׃ הַאֶזְכֶּה בְּמֹאזְנֵי רֶשַׁע וּבְכִיס אַבְנֵי מִרְמָֽה׃ אֲשֶׁר עֲשִׁירֶיהָ מָלְאוּ חָמָס וְיֹשְׁבֶיהָ דִּבְּרוּ־שָׁקֶר וּלְשׁוֹנָם רְמִיָּה בְּפִיהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華向這城呼叫，智慧人必敬畏他的名。你們當聽是誰派定刑杖的懲罰。惡人家中不仍有非義之財和可惡的小升斗嗎？我若用不公道的天平和囊中詭詐的法碼，豈可算為清潔呢？城裡的富戶滿行強暴；其中的居民也說謊言，口中的舌頭是詭詐的。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>智慧<\/td><td>וְתוּשִׁיָּה<\/td><td>vetushiyyah<\/td><td>H8454<\/td><td>（真）智慧、成功<\/td><\/tr><tr><td>聽<\/td><td>שִׁמְעוּ<\/td><td>shimu<\/td><td>H8085<\/td><td>你們要聽<\/td><\/tr><tr><td>升斗<\/td><td>וְאֵיפַת<\/td><td>veefat<\/td><td>H374<\/td><td>並且伊法（量器）<\/td><\/tr><tr><td>天平<\/td><td>בְּמֹאזְנֵי<\/td><td>mozenei<\/td><td>H3976<\/td><td>天平<\/td><\/tr><tr><td>詭詐<\/td><td>מִרְמָֽה<\/td><td>mirmah<\/td><td>H4820<\/td><td>詭詐、欺騙<\/td><\/tr><tr><td>強暴<\/td><td>חָמָס<\/td><td>khamas<\/td><td>H2555<\/td><td>強暴、暴力<\/td><\/tr><tr><td>謊言<\/td><td>שָׁקֶר<\/td><td>shaqer<\/td><td>H8267<\/td><td>謊言<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>6:9 是全卷最難的一節<\/strong>：「智慧人必敬畏他的名」這半句，原文詞句殘缺，古譯本的讀法不同。和合本的讀法是其中一種合理的選擇；<strong>我們不把這節的任何一個細節當作教義的基礎<\/strong>，只取其大意：神向這城呼叫，要人聽。<\/p><p><strong>「伊法」<\/strong>：efat，是量穀物的容器，約二十多公升。<strong>「小」<\/strong>（zeumah）的意思是「被咒詛的」；缺斤短兩的升斗，是被神厭惡的（參申 25:13–16；箴 11:1）。<\/p><p><strong>「天平」「法碼」<\/strong>：mozenei 與 avnei，是市場的工具。先知說的罪，不是抽象的，是<strong>買賣時每一次舉起秤的動作<\/strong>。<\/p><p><strong>「強暴」「謊言」<\/strong>：khamas 與 shaqer，一個是行動，一個是言語。富戶滿行強暴，居民滿口謊言，<strong>整座城從有權的人到平凡的人，都在其中<\/strong>。<\/p>","exp":"<p><strong>神的指控，進了市場。<\/strong>6:8 說「行公義」；6:9–12 馬上告訴你：公義不是在聖殿裡，是在市場上、在你手上那一桿秤上。信仰最容易被拆成兩半：禮拜日一半，禮拜一到禮拜六一半。彌迦不允許。<\/p><p><strong>三樣東西：升斗、天平、法碼。<\/strong>這些不是大罪，是「小動作」：多收一點、少給一點、秤偏一點。一次看不出，天天這樣，就是一座城的文化。神看的，不只是大罪，也是每天的小事。<\/p><p><strong>6:11 是一個反問：「我若用不公道的天平……，豈可算為清潔呢？」<\/strong>這是說：一個人不能一面行詭詐，一面自認清潔。信仰不是洗掉罪的外表，是從手上的秤開始。<\/p><p><strong>「富戶」與「居民」都在其中。<\/strong>先知不只指責有錢有勢的人，也指責「其中的居民」。這座城的謊言，是全體的，沒有人可以說：「是別人的問題。」<\/p>"},{"a":13,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְגַם־אֲנִי הֶחֱלֵיתִי הַכּוֹתֶךָ הַשְׁמֵם עַל־חַטֹּאתֶֽךָ׃ אַתָּה תֹאכַל וְלֹא תִשְׂבָּע וְיֶשְׁחֲךָ בְּקִרְבֶּךָ וְתַסֵּג וְלֹא תַפְלִיט וַאֲשֶׁר תְּפַלֵּט לַחֶרֶב אֶתֵּֽן׃ אַתָּה תִזְרַע וְלֹא תִקְצוֹר אַתָּה תִדְרֹֽךְ־זַיִת וְלֹא־תָסוּךְ שֶׁמֶן וְתִירוֹשׁ וְלֹא תִשְׁתֶּה־יָּֽיִן׃ וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי וְכֹל מַעֲשֵׂה בֵית־אַחְאָב וַתֵּלְכוּ בְּמֹֽעֲצוֹתָם לְמַעַן תִּתִּי אֹתְךָ לְשַׁמָּה וְיֹשְׁבֶיהָ לִשְׁרֵקָה וְחֶרְפַּת עַמִּי תִּשָּֽׂאוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「因此，我擊打你，使你的傷痕甚重，使你因你的罪惡荒涼。你要吃，卻吃不飽；你的虛弱必顯在你中間。你必挪去，卻不得救護；所救護的，我必交給刀劍。你必撒種，卻不得收割；踹橄欖，卻不得油抹身；踹葡萄，卻不得酒喝。因為你守暗利的惡規，行亞哈家一切所行的，順從他們的計謀；因此，我必使你荒涼，使你的居民令人嗤笑，你們也必擔當我民的羞辱。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>擊打<\/td><td>הֶחֱלֵיתִי<\/td><td>hekheleti<\/td><td>H2470<\/td><td>我使你患病、擊傷<\/td><\/tr><tr><td>不飽<\/td><td>תִשְׂבָּע<\/td><td>tisba<\/td><td>H7646<\/td><td>你得飽足<\/td><\/tr><tr><td>撒種<\/td><td>תִזְרַע<\/td><td>tizra<\/td><td>H2232<\/td><td>你要撒種<\/td><\/tr><tr><td>惡規<\/td><td>חֻקּוֹת<\/td><td>khuqqot<\/td><td>H2708<\/td><td>律例、規條<\/td><\/tr><tr><td>暗利<\/td><td>עָמְרִי<\/td><td>omri<\/td><td>H6018<\/td><td>暗利<\/td><\/tr><tr><td>嗤笑<\/td><td>לִשְׁרֵקָה<\/td><td>lishreqah<\/td><td>H8322<\/td><td>被嗤笑的對象<\/td><\/tr><tr><td>行<\/td><td>וַתֵּלְכוּ<\/td><td>vattelekhu<\/td><td>H3212<\/td><td>你們就走了<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「我擊打你」<\/strong>：hekheleti，原文是「我使你病了」，是神主動的作為，與 1:9 的「無法醫治的傷」相呼應。<\/p><p><strong>「你要吃，卻吃不飽」<\/strong>：6:14–15 是一連串<strong>徒勞的咒詛<\/strong>：吃不飽、撒種不收、踹橄欖不得油、踹葡萄不得酒。這與利未記 26:26、申命記 28:30–40、阿摩司書 5:11 的說法很相近，是盟約咒詛的標準語言。<\/p><p><strong>「暗利的惡規」「亞哈家」<\/strong>：暗利是北國以色列的王（王上 16:25–26），亞哈是他的兒子（王上 16:30–33）；他的家族以拜巴力、奪取拿伯葡萄園（王上 21）聞名。彌迦在<strong>猶大<\/strong>，說的卻是<strong>北國<\/strong>的惡規；意思是：北國已經亡了（主前 722 年），猶大卻還在學他們。<\/p><p><strong>「行」<\/strong>：vattelekhu（你們就走了），是 halakh（行走）。6:8 的「與神同行」（lekhet），6:16 的「你們走在他們的計謀裡」，兩節對照，是「行走」軌跡裡最重的一組。<\/p>","exp":"<p><strong>人走在誰的路上，就嘗誰的果子。<\/strong>6:8 是與神同行；6:16 是行在暗利、亞哈的規條裡。兩條路，都在「行走」。彌迦沒有說「你們不要走」，他說：你選擇走哪一條。<\/p><p><strong>六個「卻不」：生活的空洞。<\/strong>吃，卻不飽；撒種，卻不收；踹油，卻不得油；踹酒，卻不得酒。這描寫的，是一種有做很多、卻沒有滿足的生活。今天許多人也是這樣：很忙，很累，很多東西，但一直不滿足。彌迦說：問題不在你做得不夠，而在你走的是哪條路。<\/p><p><strong>這是警告，不是詛咒的宣判。<\/strong>先知先說：「我擊打你」，是神在管教；後面又說：「使你荒涼」，是結果。目的，是讓人回頭。所以第 7 章的開頭是哀歌，不是絕望。<\/p><p><strong>北國的失敗，是猶大的鏡子。<\/strong>神沒有說：看，他們多壞。祂說：你們正在走他們的路。別人的失敗，是給我們看自己用的。<\/p><p><strong>最後一句：「你們也必擔當我民的羞辱」。<\/strong>這一句很沉重，是這一章的結語。但它不是終點：6 章的結尾是荒涼，7 章是仰望。神的話從來不是只有控告，後面還有一個「但是」。<\/p>"}],"7":[{"a":1,"z":6,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אַלְלַי לִי כִּי הָיִיתִי כְּאָסְפֵּי־קַיִץ כְּעֹלְלֹת בָּצִיר אֵין־אֶשְׁכּוֹל לֶאֱכוֹל בִּכּוּרָה אִוְּתָה נַפְשִֽׁי׃ אָבַד חָסִיד מִן־הָאָרֶץ וְיָשָׁר בָּאָדָם אָיִן כֻּלָּם לְדָמִים יֶאֱרֹבוּ אִישׁ אֶת־אָחִיהוּ יָצוּדוּ חֵֽרֶם׃ עַל־הָרַע כַּפַּיִם לְהֵיטִיב הַשַּׂר שֹׁאֵל וְהַשֹּׁפֵט בַּשִׁלּוּם וְהַגָּדוֹל דֹּבֵר הַוַּת נַפְשׁוֹ הוּא וַֽיְעַבְּתֽוּהָ׃ טוֹבָם כְּחֵדֶק יָשָׁר מִמְּסוּכָה יוֹם מְצַפֶּיךָ פְּקֻדָּתְךָ בָאָה עַתָּה תִהְיֶה מְבוּכָתָֽם׃ אַל־תַּאֲמִינוּ בְרֵעַ אַֽל־תִּבְטְחוּ בְּאַלּוּף מִשֹּׁכֶבֶת חֵיקֶךָ שְׁמֹר פִּתְחֵי־פִֽיךָ׃ כִּֽי־בֵן מְנַבֵּל אָב בַּת קָמָה בְאִמָּהּ כַּלָּה בַּחֲמֹתָהּ אֹיְבֵי אִישׁ אַנְשֵׁי בֵיתֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「哀哉！我好像夏天的果子已被收盡，又像摘了葡萄所剩下的，沒有一掛可吃的；我心羨慕初熟的無花果。地上虔誠人滅盡；世間沒有正直人；各人埋伏，要殺人流血，都用網羅獵取弟兄。他們雙手作惡；君王徇情面，審判官要賄賂；位分大的吐出惡意，都彼此結聯行惡。他們最好的，不過是蒺藜；最正直的，不過是荊棘籬笆。你守望者說，降罰的日子已經來到。他們必擾亂不安。不要倚賴鄰舍；不要信靠密友。要守住你的口；不要向你懷中的妻提說。因為，兒子藐視父親；女兒抗拒母親；媳婦抗拒婆婆；人的仇敵就是自己家裡的人。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>哀哉<\/td><td>אַלְלַי<\/td><td>allay<\/td><td>H480<\/td><td>哀哉、禍哉（我）<\/td><\/tr><tr><td>果子被收盡<\/td><td>כְּאָסְפֵּי<\/td><td>keaspei<\/td><td>H625<\/td><td>像被收盡的<\/td><\/tr><tr><td>虔誠人<\/td><td>חָסִיד<\/td><td>khasid<\/td><td>H2623<\/td><td>忠於盟約的人<\/td><\/tr><tr><td>正直人<\/td><td>וְיָשָׁר<\/td><td>veyashar<\/td><td>H3477<\/td><td>正直的人<\/td><\/tr><tr><td>網羅<\/td><td>חֵֽרֶם<\/td><td>kherem<\/td><td>H2764<\/td><td>網、被奉獻毀滅的物<\/td><\/tr><tr><td>守住<\/td><td>שְׁמֹר<\/td><td>shemor<\/td><td>H8104<\/td><td>你要守住<\/td><\/tr><tr><td>仇敵<\/td><td>אֹיְבֵי<\/td><td>oyevei<\/td><td>H341<\/td><td>仇敵們<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「哀哉」<\/strong>：allay li，是個人的哀嚎。1 章是為撒馬利亞與耶路撒冷哀哭，7 章回到「我」。全卷的聲音，從「萬民哪，你們都要聽」，收到「我好像……」。<\/p><p><strong>「虔誠人」<\/strong>：khasid，與「慈愛」（khesed）同字根，是活出盟約慈愛的人。這個人從地上「滅盡」了，是這節最深的哀歌。<\/p><p><strong>「網羅」<\/strong>：kherem，這個字通常是「奉獻給神、必須毀滅」的物，在這裡是<strong>獵人的網<\/strong>：弟兄用網獵取弟兄。把聖潔的字眼拿來作惡，本身就是一種諷刺。<\/p><p><strong>「仇敵就是自己家裡的人」<\/strong>：oyevei ish anshei veito。<strong>這是描寫世道敗壞，不是教導；<\/strong>主耶穌在馬太福音 10:35–36 引用這句話，說明跟隨祂會使家庭分裂，是描述實況，而不是鼓勵人與家人為敵。<\/p>","exp":"<p><strong>全卷最低的聲音，是一個人的哀歌。<\/strong>前六章是先知對別人說話，現在他轉向自己。夏天的果子被收盡了，葡萄園只剩下摘剩的，連一串可吃的也沒有。這不是在責備誰，是一個人看著眼前的田地，說：什麼都沒有了。<\/p><p><strong>最痛的，不是敵人，是身邊的人。<\/strong>7:5–6 說：不要倚賴鄰舍，不要信靠密友，連懷中的妻也要守住口。這是一個信任崩潰的社會。這樣的世界裡，一個人最孤單的時候，不是在曠野裡，而是在家裡、在飯桌上。<\/p><p><strong>這段話對受過傷的人，要特別小心。<\/strong>有人在家裡經歷過被背叛、被傷害、被冷落。讀這幾節時，不可以對他們說：「你要原諒」「你要忍耐」。經文沒有要受害者留在危險中；經文只是承認：這樣的痛，是真的。陪伴比說教重要。<\/p><p><strong>注意：彌迦沒有說「你要去恨家人」。<\/strong>他說的，是一個壞掉的世界的樣子。耶穌引用這節的時候，意思是：跟從我，有時要付上關係的代價；但祂沒有叫任何人去傷害家人。<\/p><p><strong>哀歌也是一種禱告。<\/strong>在 7:7 的「但是」之前，有六節哀歌。神沒有叫先知跳過這六節。有些痛，需要先被說出來，才有力量往下走。<\/p>"},{"a":7,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַאֲנִי בַּיהוָה אֲצַפֶּה אוֹחִילָה לֵאלֹהֵי יִשְׁעִי יִשְׁמָעֵנִי אֱלֹהָֽי׃ אַֽל־תִּשְׂמְחִי אֹיַבְתִּי לִי כִּי נָפַלְתִּי קָמְתִּי כִּֽי־אֵשֵׁב בַּחֹשֶׁךְ יְהוָה אוֹר לִֽי׃ זַעַף יְהוָה אֶשָּׂא כִּי חָטָאתִי לוֹ עַד אֲשֶׁר יָרִיב רִיבִי וְעָשָׂה מִשְׁפָּטִי יוֹצִיאֵנִי לָאוֹר אֶרְאֶה בְּצִדְקָתֽוֹ׃ וְתֵרֶא אֹיַבְתִּי וּתְכַסֶּהָ בוּשָׁה הָאֹמְרָה אֵלַי אַיּוֹ יְהוָה אֱלֹהָיִךְ עֵינַי תִּרְאֶינָּה בָּהּ עַתָּה תִּֽהְיֶה לְמִרְמָס כְּטִיט חוּצֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「至於我，我要仰望耶和華，要等候那救我的神；我的神必應允我。我的仇敵啊，不要向我誇耀。我雖跌倒，卻要起來；我雖坐在黑暗裡，耶和華卻作我的光。我要忍受耶和華的惱怒；因我得罪了他，直等他為我辨屈，為我伸冤。他必領我到光明中；我必得見他的公義。那時我的仇敵，就是曾對我說「耶和華－你神在哪裡」的，他一看見這事就被羞愧遮蓋。我必親眼見他遭報；他必被踐踏，如同街上的泥土。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>至於我<\/td><td>וַאֲנִי<\/td><td>vaani<\/td><td>H589<\/td><td>但是我<\/td><\/tr><tr><td>仰望<\/td><td>אֲצַפֶּה<\/td><td>atsappeh<\/td><td>H6822<\/td><td>我要守望、仰望<\/td><\/tr><tr><td>等候<\/td><td>אוֹחִילָה<\/td><td>okhilah<\/td><td>H3176<\/td><td>我要等候<\/td><\/tr><tr><td>應允<\/td><td>יִשְׁמָעֵנִי<\/td><td>yishmaeni<\/td><td>H8085<\/td><td>他要聽我<\/td><\/tr><tr><td>跌倒<\/td><td>נָפַלְתִּי<\/td><td>nafalti<\/td><td>H5307<\/td><td>我跌倒了<\/td><\/tr><tr><td>起來<\/td><td>קָמְתִּי<\/td><td>qamti<\/td><td>H6965<\/td><td>我起來了<\/td><\/tr><tr><td>辨屈<\/td><td>יָרִיב<\/td><td>yarivv<\/td><td>H7378<\/td><td>他要為我爭辯<\/td><\/tr><tr><td>帶領<\/td><td>יוֹצִיאֵנִי<\/td><td>yotsienni<\/td><td>H3318<\/td><td>他要領我出來<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「但是我」<\/strong>：va-ani，原文只是一個小連接詞加「我」，卻是整卷最大的轉彎。前六節都是「他們」「人」；這裡終於有一個「我」站出來。與 3:8「至於我」（ve-ulam anokhi）相呼應。<\/p><p><strong>「我要仰望」<\/strong>：atsappeh，是「守望」，如守望者站在城牆上等天亮。<strong>「我要等候」<\/strong>：okhilah，是「盼望地等」。兩個動詞並列，是<strong>主動的等<\/strong>，不是被動的忍。<\/p><p><strong>「他要聽我」<\/strong>：yishmaeni，是「聽」（shama）軌跡的最後一站。全卷一直在說：你們要聽（1:2；3:1；6:1）；現在最後一個「聽」，是<strong>神聽人<\/strong>。<\/p><p><strong>「為我辨屈，為我伸冤」<\/strong>：原文是 yarivv rivi（他要為我爭辯我的案件）；「辯屈」就是「riv」，與 6:2 神的「爭辯」同一個字：<strong>神與百姓的官司（6 章），現在神親自為百姓辯護<\/strong>。<strong>「他必領我到光明中」<\/strong>：yotsienni la-or，用的是「出來」（yatsa）：從黑暗中「帶出來」。<strong>「出來」軌跡的最後一站<\/strong>。<\/p>","exp":"<p><strong>全卷最重要的一個轉彎，在「但是我」。<\/strong>周遭什麼都沒有改變：果子還是沒有，朋友還是不能信，家人還是敵人。改變的，只有一件事：一個人決定朝向耶和華。盼望不是環境改變的結果，而是一個人轉身的動作。<\/p><p><strong>在黑暗裡「坐」著，也要「仰望」。<\/strong>7:8 說：「我雖坐在黑暗裡，耶和華卻作我的光。」他沒有說「我已經出了黑暗」，他說：我正坐在黑暗裡，而耶和華是我的光。這不是否認黑暗，也不是等黑暗過去才信，是黑暗還在的時候，就已經有光。<\/p><p><strong>他先認自己的罪：「因我得罪了他」。<\/strong>彌迦的盼望，不是自以為義。他承認：「我要忍受耶和華的惱怒，因我得罪了他。」同時他又說：神要為我辯屈。這兩句並存：我有罪，我也相信神會為我辯護。這是福音的樣式：不是我沒有錯，而是神替我站出來。<\/p><p><strong>神親自作我的辯護人。<\/strong>6 章是神與百姓打官司；7:9 是百姓說：這場官司，神要為我辯護。因為最後的審判者，也是願意為我們辯護的那一位。<\/p><p><strong>仇敵問：「耶和華你神在哪裡？」<\/strong>這是被羞辱的人最常聽到的一句話。先知沒有急著回答；他只是說：他們要看見。我們也不需要急著為神辯護；我們只要繼續站在祂那邊。7:10 的「踐踏」，是在描寫仇敵的結局，不是教導信徒去報復；伸冤在神（羅 12:19）。<\/p>"},{"a":11,"z":13,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>יוֹם לִבְנוֹת גְּדֵרָיִךְ יוֹם הַהוּא יִרְחַק־חֹֽק׃ יוֹם הוּא וְעָדֶיךָ יָבוֹא לְמִנִּי אַשּׁוּר וְעָרֵי מָצוֹר וּלְמִנִּי מָצוֹר וְעַד־נָהָר וְיָם מִיָּם וְהַר הָהָֽר׃ וְהָיְתָה הָאָרֶץ לִשְׁמָמָה עַל־יֹֽשְׁבֶיהָ מִפְּרִי מַֽעַלְלֵיהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「以色列啊，日子必到，你的牆垣必重修；到那日，你的境界必開展。當那日，人必從亞述，從埃及的城邑，從埃及到大河，從這海到那海，從這山到那山，都歸到你這裡。然而，這地因居民的緣故，又因他們行事的結果，必然荒涼。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>重修<\/td><td>לִבְנוֹת<\/td><td>livnot<\/td><td>H1129<\/td><td>建造<\/td><\/tr><tr><td>牆垣<\/td><td>גְּדֵרָיִךְ<\/td><td>gedereyikh<\/td><td>H1447<\/td><td>你的籬笆、牆<\/td><\/tr><tr><td>境界<\/td><td>חֹֽק<\/td><td>khoq<\/td><td>H2706<\/td><td>界線、定規<\/td><\/tr><tr><td>歸到<\/td><td>יָבוֹא<\/td><td>yavo<\/td><td>H935<\/td><td>他要來<\/td><\/tr><tr><td>荒涼<\/td><td>לִשְׁמָמָה<\/td><td>lishmamah<\/td><td>H8077<\/td><td>成為荒涼<\/td><\/tr><tr><td>行事<\/td><td>מַֽעַלְלֵיהֶֽם<\/td><td>maalleihem<\/td><td>H4611<\/td><td>他們的所作所為<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>這三節在原文裡是全卷最難的一組<\/strong>。7:11 的「日子必到」只有兩個詞：「建造你牆垣的日子」；7:12 的「從亞述，從埃及的城邑……」中，「埃及」與「要塞」是同一個字（matsor），譯法不同；7:13 又突然回到審判。<strong>我們只取大意<\/strong>，不為細節下結論。<\/p><p><strong>「牆垣」<\/strong>：gederayikh，是葡萄園的籬笆，不是城牆（比如 1:6 的「葡萄園」）。重修籬笆，是回到被保護的狀態。<\/p><p><strong>「境界」<\/strong>：khoq，是「界線」或「法令」。「開展」（yirkhaq）是「被推遠」。意思是：界線要向外擴張。<\/p><p><strong>7:13 的「然而」<\/strong>：原文只是 ve-hayetah（「而且……要成為」），看起來是個斷裂，實際上提醒讀者：<strong>盼望並不取消人行為的結果<\/strong>。<\/p>","exp":"<p><strong>神的應許，從重建籬笆開始。<\/strong>不是從建高塔、蓋宮殿開始，是修補葡萄園的牆。神的救贖，常常是細緻的：先把被拆掉的邊界一磚一瓦修好，讓人重新有一個安全的地方。<\/p><p><strong>從四面八方回來的人。<\/strong>從亞述，從埃及，從海到海，從山到山，都要歸到神這裡。這是 4:1–3「萬民流歸」的另一個畫面。神的家，不是越來越小，而是越來越大。<\/p><p><strong>7:13 提醒我們：盼望不是否認現實。<\/strong>在一段寫滿盼望的經文中，先知突然說：「然而，這地因居民的緣故，必然荒涼。」他沒有假裝一切都好。神的應許是真的，人行事的結果也是真的。兩者同時成立，我們才不會活在虛幻的樂觀裡。<\/p><p><strong>這幾節不是地圖，也不是時間表。<\/strong>「亞述」「埃及」「大河」，是以古代的世界地圖來說「從四方」；我們不可以把它們換成今天某個國家，也不可以拿這段推算日期。重要的是：神要把人帶回來。<\/p>"},{"a":14,"z":17,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>רְעֵה עַמְּךָ בְשִׁבְטֶךָ צֹאן נַֽחֲלָתֶךָ שֹׁכְנִי לְבָדָד יַעַר בְּתוֹךְ כַּרְמֶל יִרְעוּ בָשָׁן וְגִלְעָד כִּימֵי עוֹלָֽם׃ כִּימֵי צֵאתְךָ מֵאֶרֶץ מִצְרָיִם אַרְאֶנּוּ נִפְלָאֽוֹת׃ יִרְאוּ גוֹיִם וְיֵבֹשׁוּ מִכֹּל גְּבֽוּרָתָם יָשִׂימוּ יָד עַל־פֶּה אָזְנֵיהֶם תֶּחֱרַֽשְׁנָה׃ יְלַחֲכוּ עָפָר כַּנָּחָשׁ כְּזֹחֲלֵי אֶרֶץ יִרְגְּזוּ מִמִּסְגְּרֹֽתֵיהֶם אֶל־יְהוָה אֱלֹהֵינוּ יִפְחָדוּ וְיִֽרְאוּ מִמֶּֽךָּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「求耶和華在迦密山的樹林中，用你的杖牧放你獨居的民，就是你產業的羊群。求你容他們在巴珊和基列得食物，像古時一樣。耶和華說：我要把奇事顯給他們看，好像出埃及地的時候一樣。列國看見這事就必為自己的勢力慚愧；他們必用手摀口，掩耳不聽。他們必舔土如蛇，又如土中腹行的物，戰戰兢兢地出他們的營寨。他們必戰懼投降耶和華，也必因我們的神而懼怕。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>牧放<\/td><td>רְעֵה<\/td><td>reeh<\/td><td>H7462<\/td><td>你要牧養（請求）<\/td><\/tr><tr><td>杖<\/td><td>בְשִׁבְטֶךָ<\/td><td>veshivtekha<\/td><td>H7626<\/td><td>用你的杖<\/td><\/tr><tr><td>獨居<\/td><td>לְבָדָד<\/td><td>levadad<\/td><td>H910<\/td><td>獨自地<\/td><\/tr><tr><td>迦密<\/td><td>כַּרְמֶל<\/td><td>karmel<\/td><td>H3760<\/td><td>迦密（山名，意為「果園」）<\/td><\/tr><tr><td>巴珊<\/td><td>בָשָׁן<\/td><td>bashan<\/td><td>H1316<\/td><td>巴珊<\/td><\/tr><tr><td>基列<\/td><td>וְגִלְעָד<\/td><td>vegilad<\/td><td>H1568<\/td><td>基列<\/td><\/tr><tr><td>奇事<\/td><td>נִפְלָאֽוֹת<\/td><td>niflaot<\/td><td>H6381<\/td><td>奇妙的事<\/td><\/tr><tr><td>舔<\/td><td>יְלַחֲכוּ<\/td><td>yelakhakhu<\/td><td>H3897<\/td><td>他們要舔<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「牧放」<\/strong>：reeh，是命令式，「請你牧養」，是一個<strong>禱告<\/strong>。這節是全書的第一個真正的禱告，也是第二次出現「牧放」（5:4）：5 章是神應許要立一位牧者；這裡是百姓求神親自牧養。<\/p><p><strong>「你獨居的民」<\/strong>：shokhenei levadad，「獨居的」。用的是申命記 33:28「以色列安然居住，獨居」的語言，意思是「被神單獨分別、單獨保守」。<strong>注意：這不是孤單，是分別為聖。<\/strong><\/p><p><strong>「迦密、巴珊、基列」<\/strong>：都是肥美的牧地；巴珊與基列在約旦河東，是以色列失去的土地。<strong>「像古時一樣」<\/strong>：kimei olam，同 5:2「從亙古」。<strong>「出埃及地的時候」<\/strong>：7:15 回到全書的原點：6:4 說「我領你出埃及」；這裡說：我要再顯奇事，像那時一樣。<\/p><p><strong>「舔土如蛇」<\/strong>：這是古代近東描寫戰敗者伏地的說法，是修辭。<strong>不是教導我們對待他人的方式<\/strong>。<\/p>","exp":"<p><strong>這是全書的第一個「禱告」。<\/strong>前面六章，都是神與先知對人說話，7:14 是先知轉過身來，對神說話：求你牧放你的民。一個人最後能做的，是求。從控告，到哀歌，到禱告，是整卷書的軌跡。<\/p><p><strong>神的回答，是出埃及。<\/strong>先知求的是「牧放」；神回答的是：「我要把奇事顯給他們看，好像出埃及地的時候一樣。」過去的拯救，是未來的保證。神過去怎樣做，祂就會怎樣做。這就是 6:4 那一個「記得」的功能：記得，是為了能盼望。<\/p><p><strong>「獨居的民」：被分別，不是被拋棄。<\/strong>在列國中，以色列顯得孤單、渺小，神說這是「你產業的羊群」。人看為「獨居」，神看為「產業」。<\/p><p><strong>列國的結局是羞愧，不是我們的勝利歌。<\/strong>7:16–17 描寫的，是列國在神的作為面前，心服口服。這是神的行動，不是我們的勝利。我們不可以拿這幾節，去對任何一個今天的民族宣告他們「要舔土」。<\/p><p><strong>最後一句：「他們必因我們的神而懼怕」。<\/strong>敬畏，是列國最後的反應。真正的得勝，不是別人被打敗，而是別人認出神是神。<\/p>"},{"a":18,"z":20,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מִי־אֵל כָּמוֹךָ נֹשֵׂא עָוֺן וְעֹבֵר עַל־פֶּשַׁע לִשְׁאֵרִית נַחֲלָתוֹ לֹא־הֶחֱזִיק לָעַד אַפּוֹ כִּֽי־חָפֵץ חֶסֶד הֽוּא׃ יָשׁוּב יְרַֽחֲמֵנוּ יִכְבֹּשׁ עֲוֺֽנֹתֵינוּ וְתַשְׁלִיךְ בִּמְצֻלוֹת יָם כָּל־חַטֹּאותָֽם׃ תִּתֵּן אֱמֶת לְיַֽעֲקֹב חֶסֶד לְאַבְרָהָם אֲשֶׁר־נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ מִימֵי קֶֽדֶם׃<\/p><\/blockquote>","lit":"<blockquote><p>「神啊，有何神像你，赦免罪孽，饒恕你產業之餘民的罪過，不永遠懷怒，喜愛施恩？必再憐憫我們，將我們的罪孽踏在腳下，又將我們的一切罪投於深海。你必按古時起誓應許我們列祖的話，向雅各發誠實，向亞伯拉罕施慈愛。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>像你<\/td><td>כָּמוֹךָ<\/td><td>kamokha<\/td><td>H3644<\/td><td>像你<\/td><\/tr><tr><td>赦免<\/td><td>נֹשֵׂא<\/td><td>noseh<\/td><td>H5375<\/td><td>擔去、赦免<\/td><\/tr><tr><td>罪孽<\/td><td>עָוֺן<\/td><td>avon<\/td><td>H5771<\/td><td>罪孽、彎曲<\/td><\/tr><tr><td>罪過<\/td><td>פֶּשַׁע<\/td><td>pesha<\/td><td>H6588<\/td><td>過犯、背叛<\/td><\/tr><tr><td>餘民<\/td><td>לִשְׁאֵרִית<\/td><td>lishreit<\/td><td>H7611<\/td><td>為了餘民<\/td><\/tr><tr><td>施恩<\/td><td>חֶסֶד<\/td><td>khesed<\/td><td>H2617<\/td><td>慈愛、盟約的愛<\/td><\/tr><tr><td>踏在腳下<\/td><td>יִכְבֹּשׁ<\/td><td>yikhbosh<\/td><td>H3533<\/td><td>他要制伏、踏平<\/td><\/tr><tr><td>投<\/td><td>וְתַשְׁלִיךְ<\/td><td>vetashlikh<\/td><td>H7993<\/td><td>你要拋下<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「有何神像你」<\/strong>：mi-el kamokha，直譯「誰是神，像你」。<strong>「彌迦」這個名字（Mikhah）是「誰像耶和華」的縮寫<\/strong>；全卷的最後三節，以這個問句，回應了先知自己的名字。<\/p><p><strong>「赦免罪孽」<\/strong>：noseh avon，直譯「擔去罪孽」。這是<strong>赦免的畫面<\/strong>：神把罪孽扛起來，帶走。<strong>「饒恕……罪過」<\/strong>：over al pesha，「越過過犯」，像從旁邊走過去、不再追究。這兩個動作是兩張圖：一是擔，一是越過。<\/p><p><strong>「不永遠懷怒，喜愛施恩」<\/strong>：lo hekhezik la-ad appo ki khafets khesed hu，直譯「他不永遠緊抓怒氣，因為他喜愛慈愛」。<strong>「喜愛」（khafets）是出於心意的愛<\/strong>：他不是勉強赦免，他喜歡。<strong>「踏在腳下」「投於深海」<\/strong>：yikhbosh 是「制伏」，像踩住一個敵人；tashlikh 是「拋下」。罪被當作一個要被制伏的對象，並丟到無法撈回之處。<\/p><p><strong>「向雅各發誠實，向亞伯拉罕施慈愛」<\/strong>：emet 與 khesed，是盟約的兩個字，也回到 6:8 的 khesed 與 mishpat；<strong>這是整卷「公平、公義、慈愛」軌跡的最後一站<\/strong>：人被要求的（6:8），神自己先做到了。<\/p>","exp":"<p><strong>全卷最後的一個問句，是一首讚美詩。<\/strong>「有何神像你？」整卷書，從審判、控告、哀歌，走到這一句。彌迦沒有用一個定義來結束他的書，他用一個問句來結束，這句話，也是他自己名字的意思。<\/p><p><strong>神的赦免，有三個動作。<\/strong>祂「擔去」罪孽，祂「越過」過犯，祂把罪「踏在腳下」「投進深海」。罪不是被忽視，而是被處理：被擔起、被制伏、被拋棄。這不是輕看罪，而是一位神，親自為罪付上了代價；基督徒在十字架上，看見這句話最完整的樣子。<\/p><p><strong>「喜愛施恩」，是整卷的答案。<\/strong>人以為神的怒氣是祂的本性，慈愛只是例外；彌迦說：不，神的本性是「喜愛」慈愛，怒氣是暫時的。這句話可以改變一個人對神的整個認識：我是被一位喜歡憐憫我的神所面對的。<\/p><p><strong>6:8 的要求，在 7:18 找到了源頭。<\/strong>神要我們「好憐憫」（ahavat khesed）；神自己「喜愛施恩」（khafets khesed）。祂要我們有的，是祂自己先有的。在 321 裡，「耶穌是我的榜樣」：我們要學的，不是一個外在的標準，而是一位先這樣愛了我們的神。<\/p><p><strong>最後一句，回到亞伯拉罕。<\/strong>「向亞伯拉罕施慈愛」：神的赦免，不是臨時起意，是盟約。從亞伯拉罕開始，神就許下了：我要信實，我要慈愛。這一句，是全卷最堅固的底：所有的審判，都是在這個盟約的框架裡。人會失敗，神的信實不會。<\/p>"}]},"serm":{"1":{"min":12,"blocks":[["h","《耶和華出了他的居所》"],["p","弟兄姊妹平安。"],["p","今天我們讀彌迦書第一章。"],["p","先問一個問題。"],["p","你有沒有在半夜，被手機的警報聲嚇醒過？"],["p","那種聲音，很特別。"],["p","不是鬧鐘。"],["p","不是訊息。"],["p","是一種，你不會認錯的聲音。"],["p","它一響，整個房間都醒了。"],["p","你還沒看清楚螢幕上寫什麼，心已經先跳起來。"],["p","因為你知道，這個聲音，不是來閒聊的。"],["p","它是在說，有事情，要發生了。"],["p","快醒過來。"],["p","彌迦書的第一章，就是這樣的聲音。"],["p","它不是從安靜的地方開始。"],["p","它一開口，就是警報。"],["p","萬民哪，你們都要聽！"],["p","我們分三個部分來讀。"],["p","第一，神出來了。"],["p","第二，罪的根。"],["p","第三，哀歌。"],["h","一、神出來了"],["p","先看這個人。"],["q","當猶大王約坦、亞哈斯、希西家在位的時候，摩利沙人彌迦得耶和華的默示，論撒馬利亞和耶路撒冷。（彌1:1）"],["p","他叫彌迦。"],["p","他是摩利沙人。"],["p","摩利沙，是猶大西邊的小地方。"],["p","靠近非利士人的邊界。"],["p","不是耶路撒冷。"],["p","不是王宮。"],["p","是一個，你在地圖上，要找很久的小鎮。"],["p","神把話，交給一個鄉下人。"],["p","再看他的時代。"],["p","三位王。"],["p","約坦，亞哈斯，希西家。"],["p","前後有好幾十年。"],["p","那是一個，大國在崛起的時代。"],["p","北邊的亞述，一天比一天強。"],["p","人心惶惶。"],["p","可是，彌迦要說的，不是亞述。"],["p","你看最後一句。"],["p","論撒馬利亞和耶路撒冷。"],["p","撒馬利亞，是北國的京城。"],["p","耶路撒冷，是南國的京城。"],["p","兩座城。"],["p","一個在北，一個在南。"],["p","神的話，先對準首都。"],["p","不是對準外面的敵人。"],["p","是對準，自己人的中心。"],["p","接著，是第一個命令。"],["q","萬民哪，你們都要聽！地和其上所有的，也都要側耳而聽！主耶和華從他的聖殿要見證你們的不是。（彌1:2）"],["p","你注意，這是一個法庭的場面。"],["p","萬民，被叫來了。"],["p","大地，也被叫來了。"],["p","有一位，要作見證。"],["p","見證的是誰？"],["p","是主耶和華。"],["p","從他的聖殿。"],["p","就是說，這一場官司，審判者就是原告。"],["p","聽的人，不是只有以色列。"],["p","是萬民。"],["p","神的話，從來不只是關起門來的家務事。"],["p","接下來，是這一句。"],["q","看哪，耶和華出了他的居所，降臨步行地的高處。（彌1:3）"],["p","出了他的居所。"],["p","神，從祂的居所，走出來了。"],["p","這個「出來」，很要緊。"],["p","這是整卷書，反覆出現的一個字。"],["p","後面你會看見，有人要出城。"],["p","有一位君王，要從伯利恆出來。"],["p","可是，第一個出來的，是神自己。"],["p","祂不是坐在遠處，下命令。"],["p","祂親自走出來。"],["p","為什麼？"],["p","因為，祂要看。"],["p","祂要親眼，看看祂的百姓，走到哪裡了。"],["p","你再看，祂走到哪裡？"],["p","地的高處。"],["p","高處，就是邱壇的地方。"],["p","是人，最喜歡獻祭的地方。"],["p","也是人，離神最遠的地方。"],["p","神走到那裡，是一步一步地走。"],["p","不是飛過去。"],["p","是步行。"],["p","像一個人，走進自己的田地，要看看，到底長了什麼。"],["q","眾山在他以下必消化，諸谷必崩裂，如蠟化在火中，如水沖下山坡。（彌1:4）"],["p","山，是最穩的東西。"],["p","我們說，穩如泰山。"],["p","可是，神一走來，山都融化了。"],["p","像蠟遇到火。"],["p","像水沖下山坡。"],["p","這裡有一個很深的提醒。"],["p","人最倚靠的東西，在神面前，都不是真正穩的。"],["p","你的存款。"],["p","你的位置。"],["p","你的人脈。"],["p","你的經驗。"],["p","看起來，像山一樣。"],["p","可是，在神面前，是蠟。"],["p","這個吼聲，是不是很可怕？"],["p","是的。"],["p","可是請你留意。"],["p","先有神的話，然後才有這些事。"],["p","神總是先開口。"],["p","祂先說，萬民哪，你們都要聽。"],["p","這是第一個部分。"],["p","神出來了。"],["h","二、罪的根"],["p","接著，彌迦問了一個問題。"],["q","這都因雅各的罪過，以色列家的罪惡。雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎？猶大的邱壇在哪裡呢？豈不是在耶路撒冷嗎？（彌1:5）"],["p","這是一個，很不客氣的問題。"],["p","雅各的罪過，在哪裡？"],["p","他沒有說，在外邦人那裡。"],["p","他沒有說，在偶像廟裡。"],["p","他說，在撒馬利亞。"],["p","在首都。"],["p","猶大的邱壇，在哪裡？"],["p","在耶路撒冷。"],["p","在聖殿所在的城。"],["p","你聽見這個問題，有沒有覺得，心裡一沉？"],["p","我們常常以為，問題在別人。"],["p","在社會。"],["p","在環境。"],["p","在政府。"],["p","在那個我們看不順眼的人。"],["p","可是，彌迦說，罪的根，在中心。"],["p","在那些，本來應該最清楚神心意的地方。"],["p","一個團體，最大的危險，不是外面的敵人。"],["p","是中心，慢慢壞掉了，卻沒有人說。"],["p","再看下去。"],["q","所以我必使撒馬利亞變為田野的亂堆，又作為種葡萄之處；也必將她的石頭倒在谷中，露出根基來。（彌1:6）"],["p","撒馬利亞，是一座建得漂亮的城。"],["p","石頭砌的。"],["p","可是，神說，我要把她變成田野。"],["p","把石頭，倒進谷裡。"],["p","把根基，露出來。"],["p","露出根基，是什麼意思？"],["p","意思是，讓人看見，這座城，到底是用什麼蓋起來的。"],["p","再看一節。"],["q","她一切雕刻的偶像必被打碎；她所得的財物必被火燒；所有的偶像我必毀滅；因為是從妓女雇價所聚來的，後必歸為妓女的雇價。（彌1:7）"],["p","這裡有一個，很重的說法。"],["p","她的財物，是從妓女的雇價，聚來的。"],["p","在古代，拜偶像的聖所，常常有這樣的收入。"],["p","信仰，和錢，混在一起。"],["p","敬拜，變成了生意。"],["p","神說，這些東西，來自哪裡，就要回到哪裡去。"],["p","你有沒有想過，我們的生命裡，有沒有一些東西，是不乾淨的來路？"],["p","一份心安理得的收入。"],["p","一個漂亮的名聲。"],["p","一段，看起來很屬靈的服事。"],["p","可是根基底下，藏著我們不敢說的動機。"],["p","彌迦說，神要露出根基。"],["p","這不是為了羞辱我們。"],["p","是為了，讓我們看見，真正的根基，要放在哪裡。"],["p","接下來，最讓我感動的，是這一節。"],["q","先知說：因此我必大聲哀號，赤腳露體而行；又要呼號如野狗，哀鳴如鴕鳥。（彌1:8）"],["p","請你看清楚。"],["p","宣告審判的人，哭了。"],["p","他沒有站在高處，說，你們活該。"],["p","他沒有拍手。"],["p","他脫下鞋子，不穿外衣，像一個，剛失去親人的人。"],["p","他像野狗一樣哀號。"] "你看，這個畫面。"],["p","羊群，不是自己找出路。"],["p","有一位牧者，在前面。"],["p","祂，先走。"],["p","後面的人，跟著走。"],["p","新約告訴我們，耶穌，為我們作了先鋒。"],["p","祂先走過了死亡。"],["p","祂先打開了門。"],["p","我們，是跟著祂走出去的人。"],["p","這是第三個部分。"],["p","開路的在前面。"],["p","好，我們把這一章，帶回生活。"],["p","第一，檢查你床上的念頭。"],["p","今晚，躺下來的時候，問自己。"],["p","我在想什麼？"],["p","我在圖謀什麼？"],["p","把它交給神。"],["p","第二，不要說，你別講那些。"],["p","也不要，讓人覺得，不能對你說真話。"],["p","今天，找一個人，對他說。"],["p","你可以，對我說實話。"],["p","第三，歸還你不該拿的。"],["p","一塊地。"],["p","一筆錢。"],["p","一句，應該說的道歉。"],["p","今天，決定，怎麼還。"],["p","第四，看見那些，被趕出家的人。"],["p","一個被拖欠的人。"],["p","一個被忘記的孩子。"],["p","今天，為他做一件，具體的事。"],["p","第五，相信神，是聚集的神。"],["p","你可能，覺得自己，是剩下的人。"],["p","被留下來的，沒有人要的。"],["p","神說，我必要聚集你。"],["p","這裡，我們看見耶穌。"],["p","祂說，我是好牧人。"],["p","好牧人，為羊捨命。"],["p","祂在曠野，尋找那一隻，走失的羊。"],["p","祂不是在等羊，自己回來。"],["p","祂親自走出去。"],["p","祂是開路的。"],["p","祂是我們的榜樣。"],["p","面對不肯聽的人，祂不放棄。"],["p","面對走失的羊，祂不嫌棄。"],["p","這裡，也有321的信息。"],["p","有己的生命，聽到真話，第一個反應是，你別講那些。"],["p","因為，我要保護我自己。"],["p","這是驕傲，離開本位，抓住權力，想要代替神。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","神是牧者，我是羊。"],["p","我不需要，堵住說真話的人。"],["p","因為，我不需要，保護我的面子。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我能聽真話，不惱怒。"],["p","也能，說真話，不傷人。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，不是一群，只說好聽話的人。"],["p","是一群，能彼此說真話的人。"],["p","是一群，在牧者手下，被聚集的人。"],["p","我們不堵住說真話的嘴。"],["p","我們不霸佔別人的家。"],["p","大家的焦點，都在耶穌，不在自己的面子。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，認真地聽見我們床上的念頭。"],["p","謝謝祢，忍耐我們很久。"],["p","謝謝祢，應許要聚集剩下的人。"],["p","求祢使我們，能聽真話，也能說真話。"],["p","求祢使我們，歸還不該拿的，看見被趕出的人。"],["p","求祢作我們的牧者，在前面開路。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"3":{"min":11,"blocks":[["h","《我藉耶和華的靈》"],["p","弟兄姊妹平安。"],["p","今天我們讀彌迦書第三章。"],["p","先問一個問題。"],["p","你小時候，玩過需要裁判的遊戲嗎？"],["p","也許是在巷子裡。"],["p","也許是在學校操場。"],["p","一群孩子，吵吵鬧鬧。"],["p","最後，總要有一個人，站出來，說，我來當裁判。"],["p","你有沒有發現？"],["p","孩子們對裁判，要求很簡單。"],["p","不用多聰明。"],["p","不用多有力氣。"],["p","只要一件事。"],["p","公平。"],["p","一個孩子，哪怕不識字，他也知道，裁判偏心的時候，遊戲，就玩不下去了。"],["p","彌迦書第三章，是對一群裁判，說話。"],["p","對那些，在位置上的人。"],["p","他問了一句，很簡單的話。"],["p","你們不當知道公平嗎？"],["p","我們分三個部分來讀。"],["p","第一，知道公平。"],["p","第二，靈與力量。"],["p","第三，錫安被耕。"],["h","一、知道公平"],["p","先看這一節。"],["q","我說：雅各的首領，以色列家的官長啊，你們要聽！你們不當知道公平嗎？（彌3:1）"],["p","我說。"],["p","這是全卷，彌迦第一次，親口說話。"],["p","前面兩章，是神在說，人在說。"],["p","現在，是先知，站出來。"],["p","對誰說？"],["p","首領。"],["p","官長。"],["p","在以色列，這些人，是坐在城門口，審案的人。"],["p","窮人有冤，要找他們。"],["p","鄰舍有爭，要找他們。"],["p","他們，是一個社會，最後的一道防線。"],["p","彌迦沒有問，你們懂不懂禮儀。"],["p","他沒有問，你們有沒有學問。"],["p","他問的是，你們不當知道公平嗎？"],["p","注意這個「不當」。"],["p","意思是，你們本來應該知道。"],["p","不是不能知道。"],["p","是不肯知道。"],["p","這個「公平」，在希伯來文裡，前面加了一個冠詞。"],["p","是那一個公平。"],["p","意思是，你們心裡明明，有一把尺。"],["p","你們知道，那一把尺在哪裡。"],["p","可是，你們把它，放在口袋裡。"],["q","你們惡善好惡，從人身上剝皮，從人骨頭上剔肉，（彌3:2）"],["p","他說，你們惡善好惡。"],["p","把善，當作惡。"],["p","把惡，當作善。"],["p","善和惡，被顛倒了。"],["p","你想一想，這是最可怕的事。"],["p","一個壞人，知道自己壞，還有機會回頭。"],["p","可是，一個人，把壞當作好，他連回頭的路，都看不見了。"],["p","然後，彌迦用了一個，很重的畫面。"],["p","剝皮。"],["p","剔肉。"],["p","他說，這些審判官，吃我民的肉。"],["p","這是比喻。"],["p","他的意思是，那些本來要保護人的人，卻一口一口，把人吃掉。"],["p","用判決。"],["p","用罰款。"],["p","用手續。"],["p","用人們，看不懂的規矩。"],["p","他沒有說，他們動手殺人。"],["p","他說的，是一種，更安靜的方式。"],["p","安靜地，把一個人，消耗到沒有。"],["q","到了遭災的時候，這些人必哀求耶和華，他卻不應允他們。那時他必照他們所行的惡事向他們掩面。（彌3:4）"],["p","這一節，很讓人心痛。"],["p","他們要哀求了。"],["p","可是，神，不應允。"],["p","神向他們掩面。"],["p","你有沒有想過，這是什麼意思？"],["p","神不是賭氣。"],["p","神不是，一下子變得冷淡。"],["p","祂是，順著他們，自己選的路。"],["p","他們一直，不聽窮人的哀求。"],["p","現在，他們的哀求，也沒有人聽。"],["p","這是第一個部分。"],["p","知道公平。"],["h","二、靈與力量"],["p","接下來，彌迦轉過頭，講先知。"],["q","論到使我民走差路的先知－他們牙齒有所嚼的，他們就呼喊說：平安了！凡不供給他們吃的，他們就預備攻擊他－耶和華如此說：（彌3:5）"],["p","牙齒有所嚼的。"],["p","意思是，有東西吃的時候。"],["p","給他們吃的人，他們就說，平安了。"],["p","不給他們吃的人，他們就預備攻擊他。"],["p","你看，這是一種，可以被購買的預言。"],["p","他們說的話，是跟著餵食的人，轉的。"],["p","平安，這個字，本來是神的應許。"],["p","可是，在他們嘴裡，變成一句，可以標價的口號。"],["p","彌迦不是在說，所有的先知，都是這樣。"],["p","他是說，當一個傳話的人，開始看供應，才決定說什麼，那句話，就不再是神的話了。"],["p","你有沒有想過，我們每一個人，也有一個，這樣的時刻？"],["p","當你知道，說真話，要付代價。"],["p","當你知道，說好聽的話，可以得到喜歡。"],["p","你怎麼選？"],["p","這樣的預言，結局是什麼？"],["q","你們必遭遇黑夜，以致不見異象；又必遭遇幽暗，以致不能占卜。日頭必向你們沉落，白晝變為黑暗。（彌3:6）"],["p","黑夜。"],["p","幽暗。"],["p","他們一直在賣異象。"],["p","最後，連異象，也看不見了。"],["p","這是一個，最安靜的懲罰。"],["p","不是雷。"],["p","不是火。"],["p","是神的話，不再來了。"],["p","然後，彌迦說了，整卷書，最有力的一句。"],["q","至於我，我藉耶和華的靈，滿有力量、公平、才能，可以向雅各說明他的過犯，向以色列指出他的罪惡。（彌3:8）"],["p","至於我。"],["p","這是一個，很大的轉折。"],["p","前面，是一群，為食物說話的人。"],["p","現在，有一個人，站起來。"],["p","他說，我不一樣。"],["p","他有什麼不一樣？"],["p","他沒有說，我更聰明。"],["p","他沒有說，我更有學問。"],["p","他沒有說，我的口才比較好。"],["p","他說，我藉耶和華的靈。"],["p","我滿有力量。"],["p","我滿有公平。"],["p","我滿有才能。"],["p","你看，這三樣，剛好，是那些首領和先知，所缺的。"],["p","力量，是不為食物說話的力量。"],["p","公平，是首領所厭惡的東西。"],["p","才能，是敢說的勇氣。"],["p","這三樣，都不是他自己的。"],["p","是神的靈，給他的。"],["p","這是一個很重要的提醒。"],["p","說真話，不是靠性格。"],["p","不是靠，天生的膽量。"],["p","是靠，一個，被神的靈充滿的人。"],["p","有一些人，天生，就很敢講。"],["p","可是，他們講的，常常是自己的火氣。"],["p","彌迦，不是這樣。"],["p","他的力量，和他的公平，是連在一起的。"],["p","有力量，沒有公平，是暴力。"],["p","有公平，沒有力量，是軟弱。"],["p","唯有神的靈，能把兩樣，放在同一個人身上。"],["p","這是第二個部分。"],["p","靈與力量。"],["h","三、錫安被耕"],["p","最後一個部分，是這一章，最重的地方。"],["q","雅各家的首領、以色列家的官長啊，當聽我的話！你們厭惡公平，在一切事上屈枉正直；（彌3:9）"],["p","又是一次，當聽。"],["p","彌迦再說一次，同樣的話。"],["p","因為，他知道，他們不想聽。"],["q","以人血建立錫安，以罪孽建造耶路撒冷。（彌3:10）"],["p","這一句，很刺耳。"],["p","錫安，是神的城。"],["p","耶路撒冷，是聖殿所在的城。"],["p","可是，彌迦說，這座城，是用人血，用罪孽，建起來的。"],["p","每一塊石頭，下面，都有沒有人提起的人。"],["p","一座城，可以很宏偉。"],["p","一座教會，可以很大。"],["p","一個團體，可以很成功。"],["p","可是，它的根基，若是建在別人的眼淚上，它還是，神的城嗎？"],["p","再看下一節。"],["q","首領為賄賂行審判；祭司為雇價施訓誨；先知為銀錢行占卜。他們卻倚賴耶和華，說：耶和華不是在我們中間嗎？災禍必不臨到我們。（彌3:11）"],["p","三個領袖。"],["p","首領，審判。"],["p","祭司，教導。"],["p","先知，傳話。"],["p","三個人，三個價錢。"],["p","審判，被買走。"],["p","教導，被買走。"],["p","預言，被買走。"],["p","然後，他們還說，耶和華不是在我們中間嗎？"],["p","災禍，不會臨到我們。"],["p","這是整卷書，最讓人心驚的一句話。"],["p","他們不是不信神。"],["p","他們信。"],["p","他們很相信，神在我們中間。"],["p","可是，他們把這個信，當成了，保險。"],["p","神在這裡，所以，我們不會有事。"],["p","聖殿在這裡，所以，我們是安全的。"],["p","你有沒有聽過，有人這樣說，我是基督徒，所以，神會保護我。"],["p","我在教會服事，所以，神不會管我的私生活。"],["p","彌迦要問，神與你同在，是為了保護你的罪，還是為了，改變你的心？"],["q","所以因你們的緣故，錫安必被耕種像一塊田，耶路撒冷必變為亂堆；這殿的山必像叢林的高處。（彌3:12）"],["p","這是第三章的結尾。"],["p","也是整卷書，最低的一點。"],["p","錫安，要被耕種，像一塊田。"],["p","耶路撒冷，要變成亂堆。"],["p","連殿的山，也要像叢林的高處。"],["p","這是一個很大膽的話。"],["p","當時，沒有人，敢這樣說。"],["p","聖殿，是神的家。"],["p","聖殿，不會倒。"],["p","可是，彌迦說，可以。"],["p","這一節話，後來，有人記得。"],["p","一百年後，耶利米，被人抓起來，要處死他。"],["p","有一些長老，站起來，說，不可以。"],["p","你們記得嗎？"],["p","從前，有一位摩利沙人彌迦，也這樣說過。"],["p","猶大王希西家，有沒有把他殺了？"],["p","沒有。"],["p","王，敬畏耶和華，向祂求恩。"],["p","神，就後悔，不降所說的那災。"],["p","你看，這是一個很美的見證。"],["p","彌迦說的話，有人聽。"],["p","一個王，聽了。"],["p","一個城，因此，被保住了。"],["p","這就是第三章的真正的意思。"],["p","不是要人，絕望。"],["p","是要人，趕快回來。"],["p","審判的話，是給人，一個機會。"],["p","好，我們把這一章，帶回生活。"],["p","第一，檢查你的尺。"],["p","你心裡，有一把公平的尺。"],["p","你知道，它在哪裡。"],["p","今天，把它拿出來。"],["p","你對家人，公平嗎？"],["p","你對同事，公平嗎？"],["p","你對那個，你不喜歡的人，公平嗎？"],["p","第二，檢查你的口。"],["p","你說的話，是不是跟著，誰在餵你，轉？"],["p","今天，說一句，你一直不敢說的真話。"],["p","用愛心，說。"],["p","第三，不要把「神與我同在」，當成保險。"],["p","問自己，我有沒有，一件事，是我預備好，神不會管的？"],["p","把它，拿到光裡。"],["p","第四，靠神的靈，不靠自己的性格。"],["p","不敢說的人，向神求勇氣。"],["p","太敢說的人，向神求柔軟。"],["p","第五，為那些，在位置上的人，禱告。"],["p","你的主管。"],["p","你的牧者。"],["p","你的父母。"],["p","為他們，求神，賜公平的心。"],["p","這裡，我們看見耶穌。"],["p","祂進入聖殿，推翻兌換銀錢的桌子。"],["p","祂說，我的殿，必稱為禱告的殿。"],["p","你們，竟使它成為賊窩了。"],["p","祂比彌迦，更大。"],["p","彌迦說，殿要被耕種。"],["p","耶穌說，拆毀這殿，我三日內要再建立起來。"],["p","祂說的，是祂的身體。"],["p","祂是真正的聖殿。"],["p","祂是真正的審判者。"],["p","祂的審判，不收賄賂。"],["p","祂是我們的榜樣。"],["p","有權柄，卻不用權柄壓人。"],["p","有真話，卻帶著眼淚說。"],["p","這裡，也有321的信息。"],["p","有己的生命，在位置上，很容易，把位置，當成自己的東西。"],["p","把權力，當成自己的權利。"],["p","這是驕傲，離開本位，抓住權力，想要代替神。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","位置，是神託付的，不是我的。"],["p","我是一個，要向祂交帳的僕人。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我能公平，不被賄賂。"],["p","能說真話，不被收買。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，不是一群，靠位置站立的人。"],["p","是一群，靠神的靈，站立的人。"],["p","是一群，不被價錢買走的人。"],["p","我們不用服事，換取位置。"],["p","我們不用位置，壓住別人。"],["p","大家的焦點，都在耶穌，不在自己的名聲。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，把公平的尺，放在我們心裡。"],["p","謝謝祢，差派彌迦，勇敢地說話。"],["p","謝謝祢，聽見一個王的悔改，保守了一座城。"],["p","求祢，用祢的靈，充滿我們。"],["p","使我們有力量，有公平，有才能。"],["p","求祢保守每一位，在位置上的人，不被賄賂，不被收買。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"4":{"min":11,"blocks":[["h","《末後的日子》"],["p","弟兄姊妹平安。"],["p","今天我們讀彌迦書第四章。"],["p","先問一個問題。"],["p","你有沒有看過，一棟老房子，被拆掉？"],["p","也許是你小時候住的家。"],["p","也許是外婆的老厝。"],["p","推土機來了。"],["p","牆倒了。"],["p","瓦片碎了。"],["p","最後，只剩下，一片空地。"],["p","你站在那裡，心裡空空的。"],["p","你會想，這裡，還能有什麼？"],["p","可是，有一天，你再經過。"],["p","地基，打好了。"],["p","鋼筋，立起來了。"],["p","一個人，對你說，我們要在這裡，重新蓋。"],["p","你的眼睛，突然，有了光。"],["p","彌迦書第三章的最後，是一座，被拆毀的城。"],["p","錫安，被耕種，像一塊田。"],["p","第四章，一開始，就是重建。"],["p","中間，沒有任何過渡的話。"],["p","這是整卷書，最大的一個轉彎。"],["p","我們分三個部分來讀。"],["p","第一，殿的山。"],["p","第二，同行。"],["p","第三，在那裡蒙解救。"],["h","一、殿的山"],["p","先看第一節。"],["q","末後的日子，耶和華殿的山必堅立，超乎諸山，高舉過於萬嶺；萬民都要流歸這山。（彌4:1）"],["p","末後的日子。"],["p","我們要先停一下。"],["p","很多人，讀到這四個字，就開始算。"],["p","哪一年？"],["p","哪一件事？"],["p","請你不要算。"],["p","在先知書裡，末後的日子，意思是，神所定的結局。"],["p","是一個，神要完成祂應許的時候。"],["p","不是一個，可以排進日曆的日期。"],["p","你再看，上一節說什麼？"],["p","這座山，要像叢林的高處。"],["p","這一節說，這座山，必堅立。"],["p","同一座山。"],["p","上一節，是荒涼。"],["p","這一節，是堅立。"],["p","神的審判，不是故事的結尾。"],["p","是通往結尾的一道門。"],["p","你再看，萬民，都要流歸這山。"],["p","流歸，是像河水，流過來。"],["p","不是被趕來。"],["p","是自己，流過來的。"],["q","必有許多國的民前往，說：來吧，我們登耶和華的山，奔雅各神的殿。主必將他的道教訓我們；我們也要行他的路。因為訓誨必出於錫安；耶和華的言語必出於耶路撒冷。（彌4:2）"],["p","他們為什麼來？"],["p","他們沒有說，我們來看風景。"],["p","他們沒有說，我們來做生意。"],["p","他們說，主必將他的道，教訓我們。"],["p","他們來，是為了，被教導。"],["p","你有沒有注意到，這裡的次序？"],["p","先被教導。"],["p","再行他的路。"],["p","很多人，是反過來的。"],["p","我自己，決定要走哪一條路。"],["p","走不通了，才來找神。"],["p","可是，這裡的人，是先來到神面前。"],["p","先聽。"],["p","然後，才知道，怎麼走。"],["p","這是一個，很好的生活原則。"],["p","在做決定以前，先到神面前去。"],["p","先聽一聽，祂要教導你什麼。"],["q","他必在多國的民中施行審判，為遠方強盛的國斷定是非。他們要將刀打成犂頭，把槍打成鐮刀。這國不舉刀攻擊那國；他們也不再學習戰事。（彌4:3）"],["p","這是很多人，最熟悉的一節。"],["p","將刀打成犂頭。"],["p","常常，被印在海報上。"],["p","被寫在標語裡。"],["p","可是，請你看，這一節的次序。"],["p","先說，他必施行審判。"],["p","先說，他為列國，斷定是非。"],["p","然後，才說，他們要將刀，打成犂頭。"],["p","刀，不是自己放下的。"],["p","是在一位，真正公平的審判者面前，是非被斷定以後，才打成犂頭。"],["p","你想一想。"],["p","為什麼，人間的和平，這麼難？"],["p","因為，沒有一位，大家都信服的審判者。"],["p","每一個人，都以為，自己是對的。"],["p","所以，這一節，不是一句口號。"],["p","它是在說，真正的和平，需要一位，真正公平的審判者。"],["p","第三章，我們已經看過了。"],["p","人間的審判者，不可靠。"],["p","所以，我們只能等。"],["p","等那一位。"],["p","這是第一個部分。"],["p","殿的山。"],["h","二、同行"],["p","接著，彌迦寫了一個，很小的畫面。"],["q","人人都要坐在自己葡萄樹下和無花果樹下，無人驚嚇。這是萬軍之耶和華親口說的。（彌4:4）"],["p","人人。"],["p","坐在自己的葡萄樹下。"],["p","坐在自己的無花果樹下。"],["p","沒有人，驚嚇他。"],["p","這是多麼小的一幅畫。"],["p","沒有宮殿。"],["p","沒有遊行。"],["p","沒有凱旋門。"],["p","只有一個，普通人，在午後的樹蔭裡，坐著。"],["p","最大的盼望，落在最平常的地方。"],["p","也許，你今天，沒有辦法，想像一個沒有驚嚇的世界。"],["p","你每天，都在擔心。"],["p","擔心工作。"],["p","擔心孩子。"],["p","擔心健康。"],["p","擔心明天。"],["p","神說，有一天，沒有人，需要再活在驚嚇裡。"],["p","這是祂，親口說的。"],["p","然後，彌迦，轉過頭來。"],["q","萬民各奉己神的名而行；我們卻永永遠遠奉耶和華－我們神的名而行。（彌4:5）"],["p","這是彌迦，自己加上的一句。"],["p","前面，是未來的圖畫。"],["p","這一節，把我們，拉回現在。"],["p","別的民族，各人奉自己神的名行走。"],["p","我們，要奉耶和華，我們神的名行走。"],["p","今天，就是。"],["p","不是等到，那一天來了，才開始。"],["p","是現在，就決定。"],["p","行走，是什麼意思？"],["p","是你，怎麼過日子。"],["p","怎麼說話。"],["p","怎麼用錢。"],["p","怎麼對待，家裡的人。"],["p","怎麼處理，你的情緒。"],["p","奉誰的名行走，就是，由誰作主。"],["p","這就是，讓耶穌作王。"],["p","不是等到，王來了，才跟隨。"],["p","是今天，就決定，誰是主。"],["q","耶和華說：到那日，我必聚集瘸腿的，招聚被趕出的和我所懲治的。（彌4:6）"],["p","這一節，我們要小心地讀。"],["p","神說，我要聚集的，是瘸腿的。"],["p","是被趕出的。"],["p","是我所懲治的。"],["p","你看，祂沒有說，強壯的。"],["p","祂沒有說，有能力的。"],["p","祂說，瘸腿的。"],["p","這裡，有一個，我要提醒的地方。"],["p","這一節，不是在說，身體有殘障的人，是軟弱的象徵。"],["p","請不要，用這一節，去形容任何一個，行動不便的弟兄姊妹。"],["p","這是一群，被打散的民。"],["p","真正走不動的人。"],["p","真正被趕出家門的人。"],["p","神看重他們，是因為，他們真的受了苦。"],["p","而且，你注意最後那句。"],["p","我所懲治的。"],["p","神沒有躲在背後。"],["p","祂沒有說，是別人害了你。"],["p","祂承認，有一份，是祂做的。"],["p","一位，能承認自己所做的神，才有資格，作王。"],["q","我必使瘸腿的為餘剩之民，使趕到遠方的為強盛之民。耶和華要在錫安山作王治理他們，從今直到永遠。（彌4:7）"],["p","餘剩之民。"],["p","強盛之民。"],["p","從瘸腿的，到強盛的。"],["p","這中間，沒有說，他們做了什麼。"],["p","只說，我必使。"],["p","這是神的作為。"],["p","然後，這一節的終點，是什麼？"],["p","耶和華要作王。"],["p","從今直到永遠。"],["p","聚集的目的，不是為了，讓人變強。"],["p","是為了，讓耶和華，作王。"],["p","這是第二個部分。"],["p","同行。"],["h","三、在那裡蒙解救"],["p","最後一個部分，彌迦，又回到眼前。"],["q","現在你為何大聲哭號呢？疼痛抓住你彷彿產難的婦人，是因你中間沒有君王嗎？你的謀士滅亡了嗎？（彌4:9）"],["p","現在。"],["p","他說，現在。"],["p","前面，是未來。"],["p","這裡，是現在。"],["p","現在，錫安在哭。"],["p","她在疼痛。"],["p","像一個，要生產的婦人。"],["p","神先問了一句話。"],["p","你為什麼哭？"],["p","你有沒有注意到，神沒有說，不要哭。"],["p","祂是先問。"],["p","你為什麼，這樣喊？"],["p","這是一種，溫柔。"],["p","一位，不怕你在痛苦中喊出來的神。"],["q","錫安的民哪，你要疼痛劬勞，彷彿產難的婦人；因為你必從城裡出來，住在田野，到巴比倫去。在那裡要蒙解救；在那裡耶和華必救贖你脫離仇敵的手。（彌4:10）"],["p","這一節，我讀了很多次。"],["p","他說，你要從城裡出來。"],["p","住在田野。"],["p","到巴比倫去。"],["p","這是真實的路線。"],["p","一條，很難的路。"],["p","神沒有說，你不用去巴比倫。"],["p","祂說，你要去。"],["p","可是，你注意，這一節，最美的地方。"],["p","在那裡。"],["p","在那裡，要蒙解救。"],["p","在那裡，耶和華必救贖你。"],[" "p","神是我的平安，我是祂的羊。"],["p","我不需要，自己建造，我的安全。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我能在小的地方，不灰心。"],["p","能在圍城中，仍有平安。"],["p","也能，像露水一樣，祝福別人。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，不是一群，靠馬靠車的人。"],["p","是一群，倚靠牧者的人。"],["p","是一群，像露水一樣，安靜祝福人的人。"],["p","我們不誇耀，我們有多大。"],["p","我們不倚靠，我們有多少資源。"],["p","大家的焦點，都在耶穌，不在自己的馬。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，從伯利恆，差來一位牧者。"],["p","謝謝祢，不輕看，小的地方，小的人。"],["p","謝謝祢，讓祢的兒子，作我們的平安。"],["p","求祢，拿走我們，假的倚靠。"],["p","求祢，使我們，成為露水，祝福身邊的人。"],["p","求祢，安慰每一位，正在等候的人，使他們知道，生產的時候，一定會來。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"6":{"min":11,"blocks":[["h","《何為善》"],["p","弟兄姊妹平安。"],["p","今天我們讀彌迦書第六章。"],["p","先問一個問題。"],["p","當有人，指著你說，你做錯了。"],["p","你的第一句話，是什麼？"],["p","有人說，不是我。"],["p","有人說，你聽我解釋。"],["p","有人說，那你呢？"],["p","有人什麼都不說，只是臉紅了，低下頭。"],["p","我們每個人，被控告的時候，都有自己的第一句話。"],["p","這一句話，常常，洩露了我們的心。"],["p","今天，經文裡，有一個，很特別的場面。"],["p","神，控告祂的百姓。"],["p","可是，祂的第一句話，不是，你錯了。"],["p","是一個問題。"],["p","我的百姓啊，我向你做了甚麼呢？"],["p","我們分三個部分來讀。"],["p","第一，神的訴訟。"],["p","第二，何為善。"],["p","第三，詭詐的天平。"],["h","一、神的訴訟"],["p","先看一個，很大的場面。"],["q","以色列人哪，當聽耶和華的話！要起來向山嶺爭辯，使岡陵聽你的話。（彌6:1）"],["p","當聽。"],["p","又是一次。"],["p","這是整卷書，第三次，這樣開口。"],["p","第一章，是對萬民。"],["p","第三章，是對首領。"],["p","這一章，是對以色列全民。"],["p","然後，接下來一節。"],["q","山嶺和地永久的根基啊，要聽耶和華爭辯的話！因為耶和華要與他的百姓爭辯，與以色列爭論。（彌6:2）"],["p","山嶺，被叫來了。"],["p","地的根基，被叫來了。"],["p","它們，是證人。"],["p","它們，看過亞伯拉罕。"],["p","看過摩西。"],["p","看過以色列，走過的每一步。"],["p","它們，不偏袒任何人。"],["p","這是一場，法庭的官司。"],["p","神，把自己的百姓，帶上法庭。"],["p","可是，你注意一件事。"],["p","這不是一場，沒有商量的審判。"],["p","這是一場，爭論。"],["p","是一場，講道理的官司。"],["p","神，願意，先聽人說話。"],["p","一個真的，要懲罰的人，不會，先請你辯論。"],["q","我的百姓啊，我向你做了甚麼呢？我在甚麼事上使你厭煩？你可以對我證明。（彌6:3）"],["p","這是神的第一句話。"],["p","我的百姓啊。"],["p","被告面前，神，仍然說，我的百姓。"],["p","我向你做了什麼？"],["p","我在什麼事上，使你疲累？"],["p","你可以，對我證明。"],["p","這是什麼語氣？"],["p","像一位，被誤會的父親。"],["p","像一位，被冷落的丈夫。"],["p","祂不是用力量，壓住人的口。"],["p","祂把口，讓給人。"],["p","你有沒有想過，如果，你被誤會的時候，你會怎麼說？"],["p","神，沒有為自己辯護。"],["p","祂只是，問。"],["p","然後，祂開始說，記得。"],["q","我曾將你從埃及地領出來，從作奴僕之家救贖你；我也差遣摩西、亞倫，和米利暗在你前面行。（彌6:4）"],["p","祂沒有，列舉人的罪。"] 不丟下神，自己走。"],["p","只有公義，沒有憐憫，是冷酷。"],["p","只有憐憫，沒有公義，是縱容。"],["p","兩者，沒有與神同行，都是，自己的善。"],["p","你要的不是，三個，要努力的標準。"],["p","是一位，同行的神。"],["p","這是第二個部分。"],["p","何為善。"],["h","三、詭詐的天平"],["p","讀到這裡，你可能，覺得，很美。"],["p","可是，彌迦，馬上把我們，帶進市場。"],["q","惡人家中不仍有非義之財和可惡的小升斗嗎？（彌6:10）"],["p","小升斗。"],["p","那是用來量穀物的容器。"],["p","故意做小一點。"],["p","買的人，不知道。"],["p","賣的人，多賺一點。"],["p","神說，這是可惡的。"],["p","不是因為，錢很多。"],["p","是因為，那是從別人身上，偷來的。"],["q","我若用不公道的天平和囊中詭詐的法碼，豈可算為清潔呢？（彌6:11）"],["p","天平。"],["p","法碼。"],["p","你看，神說的公義，不是在聖殿裡。"],["p","是在，那一桿秤上。"],["p","多收一點。"],["p","少給一點。"],["p","秤，稍微偏一點。"],["p","一次，看不出來。"],["p","可是，天天這樣，就是一座城的文化。"],["p","神看的，不只是，大的罪。"],["p","也是每天的，小事。"],["p","一個人，不能一面詭詐，一面自認清潔。"],["p","信仰，不是洗掉罪的外表。"],["p","是從，手上那一桿秤，開始。"],["q","城裡的富戶滿行強暴；其中的居民也說謊言，口中的舌頭是詭詐的。（彌6:12）"],["p","富戶。"],["p","居民。"],["p","先知，不只是指責，有錢有勢的人。"],["p","他也指責，一般的居民。"],["p","這座城的謊言，是全體的。"],["p","沒有人，可以說，是別人的問題。"],["p","接著，是一連串，空洞的光景。"],["q","你必撒種，卻不得收割；踹橄欖，卻不得油抹身；踹葡萄，卻不得酒喝。（彌6:15）"],["p","撒種，卻不得收割。"],["p","踹橄欖，卻不得油。"],["p","踹葡萄，卻不得酒。"],["p","你有沒有發現？"],["p","這是一種，很熟悉的生活。"],["p","做了很多，卻不滿足。"],["p","很忙。"],["p","很累。"],["p","有很多東西。"],["p","可是，一直，不夠。"],["p","彌迦說，問題不在，你做得不夠。"],["p","問題在，你走的，是哪一條路。"],["q","因為你守暗利的惡規，行亞哈家一切所行的，順從他們的計謀；因此，我必使你荒涼，使你的居民令人嗤笑，你們也必擔當我民的羞辱。（彌6:16）"],["p","暗利。"],["p","亞哈。"],["p","這是北國的王。"],["p","北國，已經亡了。"],["p","可是，猶大，還在學他們。"],["p","別人的失敗，不是用來，笑他們的。"],["p","是用來，給我們，看自己的。"],["p","你看，這一章，兩條路。"],["p","第八節，與神同行。"],["p","第十六節，走在別人的計謀裡。"],["p","兩條路。"],["p","都是，行走。"],["p","彌迦沒有說，你們不要走。"],["p","他說，你選哪一條。"],["p","這是第三個部分。"],["p","詭詐的天平。"],["p","好，我們把這一章，帶回生活。"],["p","第一，被指責的時候，先問，主，你要我看見什麼。"],["p","不要先說，不是我。"],["p","先停三秒鐘。"],["p","第二，數算神，替你做過的事。"],["p","今晚，寫下三件。"],["p","一件，是你不知道，神，擋住的。"],["p","第三，把這三件事，放到你這一週。"],["p","行公義。"],["p","找一件，你需要公平對待的人。"],["p","好憐憫。"],["p","找一個人，你願意，多給一點時間。"],["p","存謙卑的心，與神同行。"],["p","今天，在做決定以前，先問神。"],["p","第四，檢查你手上的秤。"],["p","你的帳目。"],["p","你的承諾。"],["p","你的說話。"],["p","有沒有，偏了一點點？"],["p","第五，不要用別人的失敗，笑他們。"],["p","用它，來檢查自己。"],["p","這裡，我們看見耶穌。"],["p","祂說，公義、憐憫、信實，是律法上更重的事。"],["p","祂也說，你們這假冒為
