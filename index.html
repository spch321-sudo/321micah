都是這樣做的。」"],["p","我們都很熟悉這些話，因為，被指出問題的時候，人的第一個反應，往往是保護自己。可是，彌迦書第六章，一開始，就是一場官司。神是原告，百姓是被告，山嶺和地永久的根基，是旁聽席。一節說：「以色列人哪，當聽耶和華的話！要起來向山嶺爭辯，使岡陵聽你的話。」（彌6:1）二節說：「因為耶和華要與他的百姓爭辯，與以色列爭論。」（彌6:2）"],["p","可是，請你注意，這位原告，第一句話，說什麼？三節：「我的百姓啊，我向你做了甚麼呢？我在甚麼事上使你厭煩？你可以對我證明。」（彌6:3）這不是一個法官的宣判，而是一位受傷的父親，一位被冷落的伴侶，在問：我哪裡，做得不好？你告訴我。這是整個聖經裡，最讓人心疼的一句話。神不是先說「你錯了」，神是先說「我的百姓啊」。"],["p","接著，神開始，一件一件地，提起祂做過的事。四節：「我曾將你從埃及地領出來，從作奴僕之家救贖你；我也差遣摩西、亞倫，和米利暗在你前面行。」（彌6:4）神提醒他們，你的自由，是我給的；你前面的領袖，是我差的。五節還提到巴勒和巴蘭，也提到從什亭到吉甲的路，那是神怎樣在曠野、在過約旦河的時候，一步一步地帶領他們。神要他們，記得祂的「公義的作為」。"],["p","有一件事，很值得停下來想：全能的神，為什麼要用「訴訟」這種方式，跟百姓說話？祂大可以直接宣判。可是，祂選擇坐下來，把案情一件一件擺出來，讓百姓有機會回答。這是一位尊重人的神。"],["p","所以，這一課，我們要看見三件事：神為什麼與百姓爭辯？人要拿什麼來見神？神真正要的是什麼？三個詞，記在心裡：訟、行、秤。"],["d",["神與百姓「爭辯」，是不是說祂在生氣、要定罪？","這個「爭辯」，在希伯來文，是一個法庭的用語，意思是「提出訴訟、陳述案情」。可是，在彌迦書這一章，它的開頭，不是一句宣判，而是一個問句，三節的「我向你做了甚麼呢」。這告訴我們：神提出訴訟的目的，不是想把人定罪，而是想把關係，修好。就像一位父親，坐在桌邊，對孩子說：我們談一談。你可以這樣用：下一次，當你被人指出問題的時候，先停三秒，在你說「我可以解釋」以前，先問一句：主，祢要我從這裡，學什麼？"]],["h","二、當獻上甚麼呢？（6:6--7）"],["p","六節，是百姓的回答。他們說：「我朝見耶和華，在至高神面前跪拜，當獻上甚麼呢？」（彌6:6）這句話，其實，很像我們：我知道我做錯了，我想補償，請你告訴我，要付多少？這是一個很自然的反應：用「做更多」，來彌補「做錯的」。"],["p","可是，這個回答，越說越大。先是「一歲的牛犢」，然後是「千千的公羊」，然後是「萬萬的油河」，最後是「我的長子」。七節說：「耶和華豈喜悅千千的公羊，或是萬萬的油河嗎？我豈可為自己的罪過獻我的長子嗎？」（彌6:7）這是一個層層加碼的反問，目的是要顯出，人想用「更多的東西」來買回神的心，是多麼徒勞。這個反問，也在問我們：你究竟想用什麼，換取心裡的平安？"],["p","請你特別注意，七節最後那一句，說到獻長子，這不是神喜悅的事。這是一個誇張的反問，要人看見，就算你獻上最寶貴的東西，也不能取代你的心。聖經從來沒有叫人獻上孩子，相反的，摩西的律法，明確地禁止（申命記十八章十節）。這一節，千萬不能用來為任何傷害孩子的事辯護。"],["p","這一段，與我們今天，很有關係。我們也常常，用「更多」，來回應內心的不安：更多的服事，更多的奉獻，更多的忙碌，更多的「我很努力」。這些，都不是壞事，可是，當它變成我們，用來避免面對自己的方式，它就變成了牛犢、公羊和油河。"],["d",["七節說「獻我的長子」，神喜歡人獻孩子嗎？","絕對不是。七節是一個反問，期待的答案是「不」，用來顯出，人的各種獻祭，都不能代替真正的心。聖經從來沒有叫人，把孩子獻給任何一個神明；申命記十八章十節，明確地說，不可以有人使兒女經火。若有人拿這一節，說人應該為神「犧牲」自己的孩子、家人，那是對經文的誤用，也可能造成深深的傷害。若你曾經被這樣的話傷害過，請你知道：神不是這樣的神。你可以找一位牧者或輔導，陪你好好談一談。"]],["h","三、原文亮光：爭辯、慈愛、謙卑（6:1--8）"],["p","這一章，有三個字，如果你記得，就記得了整章的路：爭辯、慈愛、謙卑。我們用三十秒，一個一個，把它轉成生命。"],["p","第一個字，是一節的 רִיב（riv），意思是「爭辯、訴訟」。它出現在一節、二節，是整個法庭場景的起點。在聖經裡，有時是人與人之間的爭訟，有時，是神與人之間的訴訟。可是，它背後的意思，是：事情，要被擺在桌面上，好好處理。三十秒轉成生命：今天，找一件你一直擺在心裡、沒有說出來的小事，決定一個時間，把它擺在桌面上，用平靜的語氣，說出來。"],["p","第二個字，是八節的 חֶסֶד（chesed），和合本譯作「憐憫」，也常常譯為「慈愛」、「信實的愛」。這是一個很難用一個中文字，翻譯清楚的字：它是「在關係裡，持續的、不離不棄的愛」。「好憐憫」的「好」，是「愛」；也就是說，神要的，不只是行出憐憫，而是「愛」憐憫。三十秒轉成生命：今天，找一個你需要憐憫的人，對他做一件小事：不是因為他值得，而是因為，你愛憐憫。"],["p","第三個字，是八節的 הַצְנֵעַ（hatsne'a），意思是「謙卑地」，也有「小心、不張揚」的意思。這是一個很少見的字，描寫一個人，走在神面前，不炫耀、不誇張，像一個知道自己位置的人。這個字，和「與你的神同行」連在一起：謙卑，不是低頭，而是，與神並肩，同行。三十秒轉成生命：今天，在你做一件好事的時候，不要告訴別人，只告訴神。"],["p","這三個字連起來，是整章的路：神與人，把事情談開；人，在愛裡，行出公義與憐憫；然後，謙卑地，與神同行。"],["d",["「憐憫」或「慈愛」這個字，為什麼不容易翻譯？","因為它不只是一種感覺，而是一種「關係的承諾」。它的意思，包括：憐憫、慈愛、信實、不離不棄。舊約中，它常常用來形容神，對祂的百姓，一種不因對方的表現，而改變的愛。也因此，和合本有時譯作「恩典」、有時譯作「慈愛」、有時譯作「憐憫」。這提醒我們：「好憐憫」，不是偶爾做一件善事，而是願意，在一段關係裡，長期地、持續地，不離開。你可以先問：我身邊有哪一個人，我需要在他身上，更有耐心、更不離開？"]],["h","四、何為善，與詭詐的天平（6:8--16）"],["p","八節，是整卷書，最著名的一節，也是許多人，一輩子記得的一節：「世人哪，耶和華已指示你何為善。他向你所要的是甚麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。」（彌6:8）"],["p","請你看，這一節，是怎樣回答六、七節的問題。人問：要獻上什麼？神說：不是你拿給我什麼，而是你怎樣活。人問：要多大？神說：不是多大，而是，三件事：行公義，好憐憫，存謙卑。而且，這三件事，不是三個獨立的規條，而是一個人，與神同行的樣子。公義，是對人的公平；憐憫，是對人的愛；謙卑，是對神的位置。"],["p","請你也注意，這一節，不是在說：「你這樣做，神就會接納你。」因為，在四節，神已經說：「我曾將你從埃及地領出來，從作奴僕之家救贖你。」神先救贖了，人才被要求，這樣活。換句話說，六章八節，不是救恩的方法，而是被救贖的人，活出來的樣子。新約也清楚地說，我們得救，是本乎恩，也因著信，並不是出於自己；但我們是被造的，為要行善（以弗所書二章八至十節）。"],["p","接下來，九至十六節，神回到城裡，說出具體的問題。十節說：「惡人家中不仍有非義之財和可惡的小升斗嗎？」（彌6:10）十一節說：「我若用不公道的天平和囊中詭詐的法碼，豈可算為清潔呢？」（彌6:11）這就是八節，被放進生活裡的樣子：你的天平，準不準？你的升斗，是不是比標準的小？十二節說：「城裡的富戶滿行強暴；其中的居民也說謊言，口中的舌頭是詭詐的。」（彌6:12）"],["p","九節還有一句容易被略過的話：「智慧人必敬畏他的名」。這一章不只是責備，也是邀請：有智慧的人，會從這個呼叫裡，聽見保護，而不是羞辱；他們不會問「誰在指責我」，而會問「我可以怎樣，把天平擺正」。"],["p","十三至十六節，是結果。神說：「你要吃，卻吃不飽」（彌6:14），「你必撒種，卻不得收割」（彌6:15）。這是一幅很令人心酸的圖畫：做了很多，卻沒有成果；吃了很多，卻不滿足。因為，他們守的，是「暗利的惡規」，行「亞哈家一切所行的」。這不是神刻意要他們不吃飽，而是，當一個人，把生活，建立在不公道的天平上，就算有收成，也不會有真正的滿足。"],["d",["「行公義，好憐憫，存謙卑」，是不是說，靠行為得救？","不是。這一節的前面，神已經提醒，祂先救贖了他們（彌6:4）。也就是說，順序是：神先救，人才活出來。新約說得更清楚：我們得救，是本乎恩，也因著信，並不是出於自己，乃是神所賜的；我們是祂的工作，在基督耶穌裡造成的，為要叫我們行善（以弗所書二章八至十節）。所以，六章八節，不是一條「怎麼得救」的路，而是一幅「已經被救的人，怎樣活」的圖畫。你若發現，自己讀這一節，心裡很有壓力，請先回到四節：神先做了什麼？然後，再問：我怎樣回應？"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把八節，講成救恩的方法：「只要行公義、好憐憫、存謙卑，就能得救」。這一節的前面，神先救贖了他們；新約也清楚地說，我們得救，是本乎恩，也因著信。檢驗標準是：聽完以後，會眾是更倚靠耶穌，還是更倚靠自己的行為？"],["p","第二個偏差，是把六、七節，講成「神不要敬拜，不要奉獻，只要做好人」。經文說的，是人不能用「更多」的祭物，取代真正的心；它不是說，敬拜不重要。耶穌說，公義、憐憫、信實，是律法上更重的事，卻也沒有說，其餘的可以不做（馬太福音二十三章二十三節）。檢驗標準是：我是在用公義，替代敬拜，還是在用敬拜，逃避公義？"],["p","第三個偏差，是把十二節的「富戶」，講成對所有有錢人、某一個行業或某一個階層的攻擊。經文批評的，是「滿行強暴」、「說謊言」、「舌頭是詭詐的」，不是財富本身。檢驗標準是：聽完以後，會眾是更有憐憫，還是更有怒氣？"],["p","第四個偏差，是把十三至十六節的「荒涼」、「吃不飽」，講成「凡是歉收、失敗、生病，都是罪的報應」。耶穌曾經清楚地說，不是這人犯了罪，也不是他父母犯了罪（約翰福音九章三節）。經文的對象，是那些守著不公道的天平，卻仍然說「我很虔誠」的人。檢驗標準是：我是在檢查自己，還是在定別人的罪？"],["p","第五個偏差，是把十六節的「暗利的惡規」、「亞哈家」，套成今天某一個政權、某一個人，或某一個團體。這是彌迦時代，一段具體的歷史；聖經不是用來支持或反對任何現代的政黨、國家或領袖的。檢驗標準是：我讀完這一節，是更謙卑，還是更熱衷於找出誰是「亞哈」？"],["d",["有人說，信仰就是行公義、好憐憫，不需要敬拜，我怎麼回應？","可以先同意他：公義與憐憫，非常重要，這也是神真正關心的。然後，你可以溫和地問：八節的最後一句，是什麼？是「與你的神同行」。也就是說，公義和憐憫，不是單獨的，而是在與神的同行中。何西阿書六章六節，也有類似的話：神喜愛良善，不喜愛祭祀；可是，這不是說，祭祀不重要，而是，不能取代良善。你可以說：我們需要同時：向神敬拜，也向人行公義。兩者，缺一不可。這樣，你不是在反對他，而是在把他的好意，帶得更完整。也不需要馬上說服他，先成為一個兩樣都做的人。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「保護面子」，因此，也很習慣，被指出問題的時候，先解釋。「我可以解釋」、「我也是不得已」、「大家都這樣」。這些話，有時候，確實是事實，可是，如果它們，總是我們的第一句，我們就會失去，聽見的機會。面子，保護得了一個下午，卻保護不了一段關係。神在三節，沒有先說「你錯了」，而是先問：「我向你做了甚麼呢？」這提醒我們，在與人相處中，也可以先問一句：我哪裡，讓你不舒服了？"],["p","第二個問題：我們有一句很有智慧的諺語：「水至清則無魚」。這句話，有它的現實智慧：不要苛求完美。可是，它也常常，被用來為灰色地帶，辯護：帳可以「靈活」一點、收據可以「通融」一點、斤兩可以「差不多」一點。十節、十一節說：不公道的天平，和詭詐的法碼，是神所厭惡的。小的欺騙，累積起來，就會變成一個城的「滿行強暴」。一個人的一把尺，看起來很小；千千萬萬把這樣的尺，放在一起，就是一個社會的信用。"],["d",["做生意難免有灰色地帶，「詭詐的法碼」我怎麼做？","我們不需要假裝，沒有灰色。可是，可以用三個問題，檢驗：第一，如果這件事，被公開，我敢不敢？第二，對方，如果知道實情，還願意跟我做生意嗎？第三，我是在「靈活」，還是在「讓對方吃虧」？若這三個問題，有一個答案，讓你心裡不安，那個不安，就是神，在提醒你。你可以從一個小地方，開始：下一次，多找回一塊錢、多給一份收據、說一句「這裡，我算錯了」。這些小事，就是在把天平，一點一點，擺正。若遇到壓力，很難一個人處理，請找一位可信的同伴，或專業的協助，不要一個人扛。"]],["h","七、活出321——行公義，好憐憫，存謙卑"],["p","第一個基礎，耶穌是我的榜樣。耶穌，是那位真正「行公義，好憐憫，存謙卑」，與神同行的人。祂被控告的時候，沒有先辯解；祂為不認識祂的人，求赦免；祂把自己，放在最卑微的位置，直到死。我們學彌迦，其實，是學耶穌：被指出問題的時候，先聽；被誤解的時候，先愛。"],["p","第二個基礎，聖經是我的準則。我們不是用「大家都這樣」，來決定怎麼做，而是讓經文，先說話。六章八節，告訴我們：何為善，神已經指示了。這是我們每一次做決定的準則：公義嗎？有憐憫嗎？謙卑嗎？"],["p","第三個基礎，聖靈是我的引導。八節說「與你的神同行」，同行，需要引導。沒有聖靈，我們的公義，會變成指責；我們的憐憫，會變成軟弱；我們的謙卑，會變成假裝。求聖靈使我們，在每一個小決定裡，都能聽見祂的聲音。"],["p","第一個核心，讓耶穌作王。讓耶穌作王，就是讓祂，成為我們的天平：不是我的利益，而是祂的標準，來決定，什麼是對的。我手中的每一個法碼，都向祂交帳。"],["p","第二個核心，讓耶穌得著一切的榮耀。我們做的一切好事，都不是為了讓神接納我們，而是因為神已經接納了我們。所以，我們行公義、好憐憫，不是為了掌聲，而是為了讓人，看見耶穌。榮耀，都歸給祂。"],["p","一個目的，建立屬神的體系。屬神的體系，是一個天平準確的群體：他們的帳目，是清楚的；他們的話，是誠實的；他們對人，有憐憫；他們與神，同行。他們不用「更多」的事奉，來逃避面對自己；他們被指出問題的時候，先聽。"],["d",["讓耶穌作王，和「何為善」有什麼關係？","很有關係。「何為善」的前提，是「與你的神同行」。也就是說，我們不是自己決定，什麼是善；我們是跟著神，一起走，一邊走，一邊看見，什麼是善。讓耶穌作王，就是讓祂，來定義「善」。具體的做法，可以從一個很小的習慣開始：下一次，你要做一個決定以前，先問一句：主，在這件事上，祢說，何為善？然後，安靜十秒。這十秒，就是把天平，交給祂。這個習慣，聽起來很小，卻會慢慢改變：你在每一個決定背後，真正看重的是什麼。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我已經做了很多，神應該滿意了。經文對他說：六、七節說，千千的公羊、萬萬的油河，都不夠；神要的，不是更多，而是你的心。你可以先問：我現在做的事，有沒有一件，是我用來避免面對自己的？"],["p","恐懼型的人說：我怕做得不夠，怕神不接納我。經文對他說：神先說的，不是「你做得不夠」，而是「我向你做了甚麼呢」；祂先救贖了你，才要你這樣活。你可以把你的怕，說給祂聽，並對自己說：我已經被接納了。"],["p","羞恥型的人說：我曾經用過不公道的法碼，我不配再談公義。經文對他說：神的訴訟，不是為了羞辱，而是為了修復；祂邀請你，把事情，擺在桌面上。你可以對一位可信的同伴說：我曾經做過一件事，我想把它擺正。"],["p","受傷型的人說：我是那個被詭詐、被欺壓的人，我不相信，有公義。經文對他說：神看見城裡的強暴與詭詐；祂不是無動於衷，祂提出了訴訟。你不需要立刻原諒；今天，只要讀一句：「耶和華已指示你何為善」，並對神說：主，我需要祢的公義。若這一章，讓你更痛，請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找一件你可能需要「解釋」的事。下一次，有人指出你的問題，先停三秒，問一句：你可以告訴我，我哪裡，讓你不舒服嗎？然後，只聽，不辯解。"],["p","第二，檢查你的「天平」：一個你常常「差不多」的地方，例如，報帳、時間、承諾、斤兩。這個星期，把它擺正，或找一位可信的同伴，一起檢查。"],["p","第三，找一個人，用「憐憫」對待他：一個你覺得他「不值得」的人。這個星期，做一件小事，不求回報：一則關心的訊息，或一個善意的舉動。"],["p","第四，在你做一件好事的時候，不要告訴別人，只告訴神。連續七天，寫下你做了什麼。"],["p","第五，每天用三十秒，問自己：我今天，與神同行了嗎？哪一個地方，我走在前面，或落在後面？連續七天，把答案，寫下一句。"],["p","我宣告：神已經指示我何為善，我要行公義，好憐憫，存謙卑。"],["p","我宣告：我被指出問題的時候，先聽，不先辯解。"],["p","我宣告：我要把我的天平，一點一點，擺正。"],["p","我宣告：耶穌是我的榜樣，祂與神同行，我也要與神同行。"],["d",["這個星期，我怎樣開始「與神同行」？","可以從一個固定的「同行時間」開始：每天，選一個固定的時刻，例如，通勤的路上、洗碗的時候、睡前的三分鐘，對神說一句話：主，祢今天，要我注意什麼？然後，不求答案，只是，與祂同行三分鐘。這就像，走路的時候，有人在你旁邊：你不一定要說話，可是，你知道，他在。連續七天，你會發現，與神同行，不是一件很大的事，而是，許多很小的瞬間，累積起來的。若有一天忘記了，也不必氣餒，隔天再開始就好；神不是在記分，祂是在等你。"]],["h","十、結語"],["p","彌迦書第六章，是一場以山嶺為旁聽席的官司；是一位受傷的父親，問：「我向你做了甚麼呢？」；是一個層層加碼的反問，和一句寫在許多人心裡的話；也是一架不準確的天平，和一幅「吃不飽」的圖畫。開頭，是「耶和華要與他的百姓爭辯」；中間，是「只要你行公義，好憐憫，存謙卑的心，與你的神同行」；最後，是「你守暗利的惡規」所帶來的荒涼。"],["p","在這一章，神讓我們看見祂的心：祂是一位，先問「我向你做了甚麼」的神；祂是一位，不要我們用更多的事奉，來掩蓋自己，只要我們的心的神；祂也是一位，看重天平準不準、斤兩足不足的神。祂的訴訟裡，有一個要人回家的邀請。"],["p","這一章也提醒我們，最大的訴訟，不是在山嶺面前，而是在十字架上。在那裡，神自己，為我們，承擔了判決；在那裡，祂不是問「你做了什麼」，而是說「我已經為你做了」。所以，我們才有力量，去行公義，好憐憫，存謙卑。"],["p","所以，請你記得這一課的三個重點：訟，神與我們談，不是為了定罪，而是為了修復；行，公義、憐憫、謙卑，是被救贖的人，與神同行的樣子；秤，我們每一個小小的天平，神都看見。這一課的焦點，不在你做了多少，不在你找到了誰是「亞哈」，也不在你的天平，是不是完美，而是那位被控告時不辯解、為我們承擔了判決的耶穌。"],["p","親愛的天父，謝謝祢，先問我們：「我向你做了甚麼呢？」；求祢使我們，在被指出問題的時候，先聽；求祢使我們，行公義，好憐憫，存謙卑；也求祢，保守我們的天平，使我們與祢同行。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 彌迦書六章三節：我向你做了甚麼呢？你被人指出問題的時候，你的第一句話，通常是什麼？請說出一句，不必細節。"],["n","2. ★ 六章八節：行公義，好憐憫，存謙卑。這三樣，你現在最缺的是哪一樣？請說出一個。"],["n","3. ★★ 六章四節：神先救贖了你。你有沒有一個時刻，感覺到神先為你做了一件事？請用一句話說出那一次。"],["n","4. ★★★ 請在安靜中想一件事：一件你一直用「更多的事奉、更多的忙碌」來避免面對的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念六章八節，再開始。不要點名逼人說。這一章會碰到控告、被欺壓、被詭詐對待、失去孩子：若有人提到性暴力、家庭暴力、被誣告、流產、失去孩子、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照六章十一節，你的「天平」，哪一個地方最容易「差不多」？請只說出一個，例如報帳、時間、承諾、斤兩。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀六章三節與八節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：六章八節在四節之後，神先救贖，才要人這樣活。請用自己的話向組員說明：為什麼八節，不是救恩的方法？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先把哪一個「天平」擺正，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一次更正、一通電話、一次道歉；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，被不公道對待、被欺壓的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一件事，需要有人用憐憫的方式說出來？請說出你可以怎樣，用一句溫柔的話開口。"],["n","12. ★★ 你有沒有一位，曾經在你做錯事的時候，沒有急著定罪，而是先問「怎麼了」的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「與神同行」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。不要用六章七節，為任何傷害孩子的事辯護。若有人分享被欺壓、被誣告、失去孩子或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「天平」，放在神面前。一起念六章八節。"],["p","由帶領者為每一位禱告：求神使我們行公義，好憐憫，存謙卑，與祂同行。散會前，彼此問一句：你這星期要先把哪一件事擺正？"]]},"7":{"no":7,"vol":"《321彌迦書講義》第7課·彌迦書第7章","title":"有何神像你——哀、望、赦","chars":4752,"min":60,"deep":8,"dchars":1466,"tchars":1324,"blocks":[["h","一、哀哉！（7:1--6）"],["p","弟兄姊妹平安。如果你曾經在山裡，遇過天黑，你就知道，那是什麼樣的感覺。那種安靜，不是平安，而是不知道前面是什麼的安靜。太陽一下去，山路就不見了；頭燈只照得到前面三步，三步以外，什麼都沒有。你本來還在走，可是，走著走著，有一個時刻，你忽然決定：不走了，先坐下來，等天亮。你坐在石頭上，聽見風，聽見自己的呼吸，也聽見心裡一個很小的聲音：天，真的會亮嗎？"],["p","彌迦書第七章，就是從這樣的一個夜晚，開始的。一節說：「哀哉！我好像夏天的果子已被收盡，又像摘了葡萄所剩下的，沒有一掛可吃的；我心羨慕初熟的無花果。」（彌7:1）這是一個哀歌：葡萄園收成過了，只剩下枝子；他走進去，想找一顆可吃的，卻什麼也沒有。他的心，餓了。"],["p","二節接著說：「地上虔誠人滅盡；世間沒有正直人。」（彌7:2）這不是一句文學的誇張，而是一個誠實的感受：他往四周看，找不到一個可以信靠的人。三、四節，說到君王、審判官、位分大的，都「彼此結聯行惡」；連最好的人，也不過是蒺藜和荊棘籬笆。這是一個彌迦，在長長的責備之後，終於轉過身，看著自己的社會，說：太痛了。"],["p","五、六節，更是讀起來，令人心痛的：「不要倚賴鄰舍；不要信靠密友。」（彌7:5）「人的仇敵就是自己家裡的人。」（彌7:6）當一個社會，連家，都不再安全的時候，它的黑暗，就到了最深的地方。耶穌在差遣門徒的時候，也引用了這一節（馬太福音十章三十五至三十六節）：祂說，跟隨祂的人，有時會遇到家裡人的反對。"],["p","很多時候，在教會和家庭裡，我們被教導，要把「哀」收起來：要感恩、要正面、要堅強。可是，聖經裡有許多哀歌，神的話，容許人，把痛說出來。誠實的哀，不是不信，而是，把真實的自己，帶到神面前。"],["p","請注意，這一課的第一個字，是「哀」。彌迦沒有叫我們，假裝一切都好；他讓我們，先坐下來，哀。因為，只有誠實地承認黑暗，我們才有資格，說出下一句話：「至於我。」這一課，我們要看見三件事：先知怎樣哀？先知怎樣望？神怎樣赦？三個詞，記在心裡：哀、望、赦。"],["d",["六節的「人的仇敵就是自己家裡的人」，耶穌引用這一節，是要我們與家人為敵嗎？","不是。耶穌在馬太福音十章，說這句話的背景，是跟隨祂的人，可能會遇到家人的反對，甚至被疏遠。祂的意思，不是叫人去恨家人，而是說，我們愛祂，要勝過一切，包括最親近的人。同樣的，彌迦在這一節，是在描述一個破碎的社會，不是在給我們一個「與家人斷絕」的指示。若你正在經歷家人的傷害，請不要用這一節，去證明「他們就是敵人」；也不要用它，叫自己「忍耐一切」。請找牧者、輔導，或專業的協助，陪你一起，好好面對。"]],["h","二、至於我，我要仰望（7:7--10）"],["p","可是，在這片黑暗裡，忽然，有一句話，像一根火柴，被劃亮了：「至於我，我要仰望耶和華，要等候那救我的神；我的神必應允我。」（彌7:7）請你注意，這句話，說在什麼時候？不是在黑暗過去以後，而是在黑暗的正中間。他沒有說：我看見光了，所以我仰望。他說的是：我什麼也看不見，可是，我仍要仰望。"],["p","八節，更是整卷書，最動人的一句：「我雖跌倒，卻要起來；我雖坐在黑暗裡，耶和華卻作我的光。」（彌7:8）注意，這裡有兩個動作：「跌倒」和「坐」。跌倒，是失敗；坐，是停下來。可是，兩個動作的後面，都有一個「卻」：我雖跌倒，卻要起來；我雖坐著，耶和華卻作我的光。這個「卻」，是整個福音的轉折。"],["p","注意，他沒有說「我不會跌倒」，而是說「我雖跌倒」。信心，不是從不跌倒的保證，而是跌倒了，還知道往哪裡看。"],["p","九節接著說，他怎樣面對自己的過犯：「我要忍受耶和華的惱怒；因我得罪了他，直等他為我辨屈，為我伸冤。他必領我到光明中；我必得見他的公義。」（彌7:9）請你看，這是一個悔罪者的話。他沒有指著別人，說「都是他們的錯」；他說：我也得罪了祂。可是，他仍然相信：祂必為我辨屈，祂必領我到光明中。"],["p","這四節，給我們一個很深的示範：在黑暗裡，不假裝，也不放棄。他承認黑暗，也承認自己的罪；可是，他把眼睛，放在神身上。「仰望」，不是一種情緒，而是一種姿態：一個坐在黑暗裡的人，把臉，轉向那會來的光。"],["d",["九節說「我要忍受耶和華的惱怒」，是不是說，我受的苦，都是因為我有罪？","不是。這是一位悔罪的人，對自己的過犯，所說的話：「因我得罪了他」。這不是一個，可以用來對別人說的話。尤其，不可以對一位受傷害的人，說「你受苦，是因為你有罪」，或「你要忍受」。耶穌也清楚地說，不是這人犯了罪，也不是他父母犯了罪（約翰福音九章三節）。若你正在受苦，請先確保安全；若你有需要認罪的地方，讓神，單獨與你談；你不需要一個人，承受別人的指責；神的惱怒，不是別人可以代替祂，拿來對你說的話。"]],["h","三、原文亮光：仰望、投、彌迦（7:7--19）"],["p","這一章，有三個字，如果你記得，就記得了整章的路：仰望、投、彌迦。我們用三十秒，一個一個，把它轉成生命。"],["p","第一個字，是七節的 אֲצַפֶּה（atsapeh），意思是「我要仰望、我要守望」。這個字，常常用來形容一個守夜的人，站在城牆上，一直望著東方，等天亮。他不能讓天亮得更快，可是，他可以站在那裡，等。三十秒轉成生命：今晚，在你睡以前，找一個窗子，或站在門口，看一眼天，對神說：主，我在這裡守望。不求答案，只是站著。"],["p","第二個字，是十九節的 תַשְׁלִיךְ（tashlikh），意思是「你必投」。完整的一句，是：「將我們的一切罪投於深海。」（彌7:19）這個字，是一個很有力的動作：不是輕輕放下，而是，用力地，丟出去，丟到最深、最遠、撈不回來的地方。三十秒轉成生命：今天，在一張紙上，寫下一個你一直自責的事，然後，對神說：主，這件事，祢說，祢投進深海了。然後，把那張紙，撕掉。"],["p","第三個字，是整卷書的第一個名字：一章一節的 מִיכָה（Mikhah），也就是「彌迦」。這個名字的意思，一般認為是「誰像耶和華？」整卷書，以這個名字開始，也以一個問句結束：十八節說「神啊，有何神像你」。這是一個首尾呼應：作者的名字，就是他最後的敬拜。三十秒轉成生命：今天，在你的名字裡，問一個問題：我的名字，我的生命，是在問「誰像耶和華」嗎？"],["p","這三個字連起來，是整章的路：先守望，因為還在黑夜；再相信，神必把罪，投進深海；最後，開口敬拜，因為，沒有任何一位神，像祂。"],["d",["彌迦的名字，真的是「誰像耶和華」嗎？","一般的解釋，是這樣：「彌迦」，是「彌迦雅」的簡短形式，意思是「誰像耶和華」。因此，整卷書，從第一節的名字，到最後一章的問句，成為一個完整的圓。有學者認為，這是一種寫作的技巧，也有人說，這只是一個巧合。無論如何，這個解釋，不影響整卷書的信息；它只是，讓我們多一個，欣賞的角度。你可以這樣用：下一次，當你覺得「神離我很遠」，在心裡，問一句：誰像祢？不是要自己，找一個答案，而是讓這個問句，帶你，回到敬拜。"]],["h","四、日子必到，與有何神像你（7:11--20）"],["p","十一節，是一個盼望的宣告：「以色列啊，日子必到，你的牆垣必重修；到那日，你的境界必開展。」（彌7:11）這是一個熟悉的畫面：牆倒了，被拆了，現在，要被重修。十二節說，人必從各處，歸到你這裡；十三節卻說：「然而，這地因居民的緣故，又因他們行事的結果，必然荒涼。」（彌7:13）請注意，這裡的次序，很誠實：盼望，不否認後果；後果，不取消盼望。"],["p","請注意，「日子必到」，不是一個日期，是一個保證；我們不把它變成日程表，我們也不把這些地名，套到今天的某一個國家或民族。這是彌迦的時代，一個很具體的應許；對我們來說，它是一個保證：神，是一位重修牆垣的神。"],["p","十四、十五節，是一個禱告，也是一個應許。「求你容他們在巴珊和基列得食物，像古時一樣。」（彌7:14）「我要把奇事顯給他們看，好像出埃及地的時候一樣。」（彌7:15）他們的盼望，不是一個全新的東西，而是回到神最初，帶領他們的那個樣子。這使我們想起，一切的重建，都是回到那位，曾經帶領他們出埃及的神。"],["p","十六、十七節說到列國看見神的作為，就為自己的勢力慚愧，戰懼投降。這幾節是詩的語言，重點，不是誰被踐踏，而是人所倚靠的勢力，在神面前，顯出它的有限。我們讀這一段，不是為了盼望誰倒下，而是為了記得：真正可靠的，只有神。"],["p","然後，是整卷書，最後的三節，也是最美的三節：「神啊，有何神像你，赦免罪孽，饒恕你產業之餘民的罪過，不永遠懷怒，喜愛施恩？」（彌7:18）這是一個問句，卻不需要答案，因為答案，就是敬拜。十九節說：「必再憐憫我們，將我們的罪孽踏在腳下，又將我們的一切罪投於深海。」（彌7:19）二十節：「向雅各發誠實，向亞伯拉罕施慈愛。」（彌7:20）"],["p","請你細細看這三節。神不是只「赦免」，祂還「不永遠懷怒」；祂不是勉強，祂是「喜愛施恩」。罪，不只是被擦掉，而是被「踏在腳下」，被「投於深海」。而這一切，是因為祂對亞伯拉罕的誓言：祂是一位，信守承諾的神。路加福音一章七十二至七十三節，撒迦利亞的頌歌，也提到神記念祂對亞伯拉罕的誓言，這使我們想起，神的赦免，和祂的信實，是連在一起的。"],["d",["神把罪投於深海，那我的記憶和後果呢？","赦免，不等於記憶立刻消失，也不等於所有後果，都馬上被取消。十三節就說，後果，是真實的。可是，赦免，是說，神不再用那件事，定你的罪；祂不再拿它，當作與你相處的條件。你可以這樣理解：深海，是神放罪的地方；記憶，有時，還在你這裡，可是，你可以把它，一次一次地，帶到神面前，說：主，這件事，祢說祢投進深海了，請祢幫助我，也放下它。對一些很深的傷害與自責，也可以尋求輔導的陪伴，這不是軟弱，而是智慧。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把六節「人的仇敵就是自己家裡的人」，講成「家人就是敵人」，或「信主就要與反對的家人斷絕」。馬太福音十章的意思，是我們愛主，要勝過一切；不是叫人恨家人，更不是為家庭暴力，找藉口。檢驗標準是：聽完以後，會眾與家人的關係，是更有愛心的智慧，還是更多的怨恨？"],["p","第二個偏差，是把九節「我要忍受耶和華的惱怒」，拿去對受害者說：「你受苦，是因為你有罪，你要忍耐。」這是一位悔罪者，對自己說的話，不是給別人用的。檢驗標準是：受傷的人，聽完以後，是更敢開口求助，還是更沉默？"],["p","第三個偏差，是把十節的「遭報」，和十六、十七節列國的「舔土」，講成對仇敵報復的盼望，或套用到今天某一個國家。這些是詩的語言，要我們看見，神的公義；不是給我們用來，咒詛任何人的。檢驗標準是：我讀完以後，是更為仇敵禱告，還是更恨他們？"],["p","第四個偏差，是把十一至十三節的「牆垣重修」、「歸到你這裡」，講成今天某一個民族或國家的政治事件，或一個時間表。經文說的，是彌迦時代，神對祂百姓的應許；新約也沒有，把它連到今天某個具體的政治行動。檢驗標準是：會眾是更認識神的信實，還是更熱衷於討論新聞？"],["p","第五個偏差，是把八節「我雖坐在黑暗裡」，講成「只要信心夠，黑暗就會立刻消失」，然後對正在流淚的人，說「你要有信心」，或「你要快樂起來」。彌迦自己，是坐在黑暗裡，他沒有被催促。檢驗標準是：黑暗中的人，聽完以後，是被陪伴，還是被催促？"],["d",["有人說「牆垣必重修」、「歸到你這裡」，講的是今天某一個民族的歸回，我怎麼回應？","可以溫和地問他三個問題：第一，經文自己，有沒有說，這是在講今天的某一個民族或國家？沒有，它說的，是彌迦當時的以色列。第二，新約，有沒有把這一段，連到今天的某個政治事件？也沒有。第三，這樣的講法，讓人更認識神的信實，還是更關心局勢？然後，你可以說：我們可以一起讀這一章，看神怎樣重修；至於今天各國的局勢，我們為各國禱告，把結果交給神。沒有新約根據的連結，我們只說「這使我們想起」，不說「這就是預言」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們這個文化，重視「孝」，這是很美的價值。孝，本來是愛，不是壓力。可是，當「孝」，被用來要求「無條件順從」，受傷的人，就沒有地方可以說：我很痛。許多人，在家裡，被傷害、被忽略、被控制，卻因為「百善孝為先」，一直沒有說出口。六節說「人的仇敵就是自己家裡的人」，這提醒我們：家，也可能是傷害發生的地方；而神，看見。"],["p","第二個問題：我們有一個很熟悉的字：「忍」。「忍一時，風平浪靜」、「忍字頭上一把刀」。「忍」，在我們文化裡，常常是美德，可是，它也常常，和「忍氣吞聲」，混在一起。七節的「等候」，和「忍氣吞聲」，是兩件事。等候，是把一件事，交給神，並且願意，採取該做的行動；忍氣吞聲，是把一件事，壓下去，假裝它不存在。忍氣吞聲，是把痛，埋進土裡；等候，是把痛，放在神手裡。"],["d",["「忍」和「等候」到底有什麼不同？","可以用三個問題，分辨。第一，我在「忍」的時候，有沒有把這件事，告訴神、告訴一位可信的人？等候，是說出來；忍氣吞聲，是藏起來。第二，我有沒有，在安全的範圍裡，採取該做的行動？等候，不是什麼都不做。第三，我的心，是越來越平安，還是越來越苦毒？等候，會帶來平安；壓抑，會帶來苦毒。若你發現，自己是在「忍氣吞聲」，請不要責備自己，找一位可信的同伴，或牧者、輔導，開始說出來。這就是等候的第一步。"]],["h","七、活出321——黑暗裡的光，深海裡的罪"],["p","第一個基礎，耶穌是我的榜樣。耶穌，是那位走進最深的黑暗的人。祂在客西馬尼園，說：「我的心甚是憂傷。」祂在十字架上，被人離棄。可是，祂仍然把自己，交在父的手裡。我們學彌迦，其實是學耶穌：在黑暗裡，不假裝，也不放棄。"],["p","第二個基礎，聖經是我的準則。我們不是用「我的感覺」，來判斷，神在不在，而是讓經文，先說話。七章八節，說「耶和華卻作我的光」；這是我們在黑暗中，每一次，回到的準則：不是我看見，而是祂說。"],["p","第三個基礎，聖靈是我的引導。沒有聖靈，我們的「仰望」，會變成硬撐，我們的「等候」，會變成壓抑。求聖靈在我們坐在黑暗裡的時候，成為我們的安慰者，也在我們該起來的時候，扶我們起來。"],["p","第一個核心，讓耶穌作王。讓耶穌作王，就是在最黑的時候，仍然，讓祂作我的光；不是等我看見了，才讓祂作王，而是在我看不見的時候，就讓祂作王。"],["p","第二個核心，讓耶穌得著一切的榮耀。十八節，問了一個問題：「有何神像你？」這是一個敬拜的問題。所有的赦免、所有的重建、所有的盼望，都不是我們做的，是祂做的；榮耀，都歸給耶穌。"],["p","一個目的，建立屬神的體系。屬神的體系，是一個能夠誠實地哀、也能夠安靜地望的群體：他們不假裝一切都好，也不放棄。他們彼此陪伴，在黑暗裡坐下，也彼此提醒，神必作我們的光。他們因為被赦免，所以，也成為會赦免人、會陪伴人的人。"],["d",["讓耶穌作王，和「我仍要仰望」有什麼關係？","關係很深。「仰望」，就是在我還看不見的時候，把王位，留給祂。讓耶穌作王，不是在我一切順利的時候，才說的話，而是在我坐在黑暗裡，也說：主，祢是王。具體的做法，可以從一個很小的動作開始：在你覺得最累、最沒有力氣的時候，對自己說一句：我不需要現在就有答案，我只需要，把這一刻，交給祂。然後，閉上眼睛，停十秒。這十秒，就是仰望。若這樣的黑暗，已經持續很久，請也尋求輔導或專業的陪伴，這也是祂為你預備的方式。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我可以靠自己，走出黑暗。經文對他說：七節說，「我要仰望耶和華」；連彌迦，也是等候。你可以先問：我現在，有哪一個地方，是我不肯等候，一定要自己掌握的？"],["p","恐懼型的人說：我怕黑暗不會過去，怕天不會亮。經文對他說：八節說，「耶和華卻作我的光」；祂不是在黑暗過去以後，才作光，而是在你坐著的時候，就在那裡。你可以把你的怕，說給祂聽，從十秒的安靜開始。"],["p","羞恥型的人說：我曾經做過一件事，我覺得，祂不會再赦免我。經文對他說：十八、十九節說，祂「喜愛施恩」，祂把罪「投於深海」；祂不是勉強赦免，祂喜愛。你可以對一位可信的同伴說：我曾經做過一件事，我想把它，放在神面前。"],["p","受傷型的人說：連我家裡的人，都傷了我，我不知道，還能信任誰。經文對他說：六節說出了你的痛，沒有人叫你假裝；八節說，你坐在黑暗裡，也是被神看見的。你不需要立刻原諒，也不需要一次讀完；若這一章讓你更痛，請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找出一個你的「黑夜」：一件你一直不敢說出口的事。今天，用一句話寫下它，並決定，找一位可信的人，陪你一起，說出來。"],["p","第二，每天晚上，花一分鐘，站在窗前或門口，對神說：主，我在這裡守望。連續七天，不求答案，只是站著；你會發現，守望本身，就是一種安靜的信靠。"],["p","第三，找出一件你一直自責的事，用一張紙寫下來，對神說：祢說祢把它投於深海。然後，把這張紙，撕掉。若這件事，很深、很痛，請也找一位輔導，陪你一起，慢慢走。"],["p","第四，找出一位「在黑暗裡坐著」的人：一位正在失落、生病、或長期沒有力氣的人。這個星期，主動去陪他坐十分鐘，不講道理，不說「你要有信心」，只是，在那裡。"],["p","第五，每天用三十秒，問自己：誰像祢？連續七天，把你想到的，寫下一句。這是整卷彌迦書，最後的問題，也是我們每天，可以回到的敬拜。"],["p","我宣告：我雖坐在黑暗裡，耶和華卻作我的光。"],["p","我宣告：我的罪，神已經投於深海，我不再用它，定自己的罪。"],["p","我宣告：我要在黑暗中，誠實地哀，也安靜地望。"],["p","我宣告：耶穌是我的榜樣，祂走進黑暗，我也要陪伴別人，走過黑暗。"],["d",["在黑暗裡，我今晚可以做的一件小事是什麼？","可以很小：今晚，在睡前，把房間的燈關掉，坐在床邊，對神說一句：主，我在這裡，我看不見，可是，我仍然在這裡。然後，只是坐著，坐一分鐘。不需要有答案，也不需要感覺到什麼。若你的黑暗，已經持續很久，請明天，告訴一位你信任的人：我最近，有一點辛苦。若你有不想活下去的念頭，請馬上，聯絡你當地的緊急協助專線、輔導，或可信的人，不要一個人撐著。你不是一個人，這一刻，也有人願意，陪你一起，等天亮。"]],["h","十、結語"],["p","彌迦書第七章，是一座被收盡的葡萄園、一個坐在黑暗裡的守夜人、一句寫給所有跌倒的人的「卻」，和一個以名字為敬拜的問句。開頭，是「哀哉！我好像夏天的果子已被收盡」；中間，是「我雖坐在黑暗裡，耶和華卻作我的光」；最後，是「神啊，有何神像你，赦免罪孽」。"],["p","在這一章，神讓我們看見祂的心：祂是一位，能夠容許我們誠實地哀的神；祂是一位，在黑暗中，仍然作光的神；祂也是一位，喜愛施恩、把我們一切的罪，投於深海的神。祂不永遠懷怒，因為，祂喜愛施恩。"],["p","這是整卷書的結尾，也是整卷書的鑰匙。從第一章，神出了祂的居所；到第七章，神把罪，投進深海。中間，是審判，是盼望，是一位牧者，是一場官司，是一句「何為善」。每一章，都在說同一件事：神，是一位走向人的神。"],["p","讀完彌迦書七章，我們會發現，這一卷書，不是從光明開始，也不是在光明中結束，而是在一個「卻」字裡轉彎。這就是福音的形狀：坐在黑暗裡的人，不被責備，而被扶起來。"],["p","所以，請你記得這一課的三個重點：哀，誠實地，說出黑暗；望，在看不見的時候，仍然仰望；赦，神喜愛施恩，把我們的罪，投於深海。這一課的焦點，不在你有沒有擺脫黑暗，不在你找到了誰是「仇敵」，也不在日子何時來到，而是那位走進最深的黑暗、為我們承擔了一切的罪、並在第三天復活的耶穌。"],["p","親愛的天父，謝謝祢，容許我們誠實地哀；求祢在我們坐著的時候，作我們的光；求祢赦免我們的罪，把它們，投於深海；也求祢使我們，成為能陪伴人、能赦免人的人。有何神像祢？我們要永遠敬拜祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 彌迦書七章七節：我要仰望耶和華。你最近有沒有一個「黑夜」，讓你坐了很久？請說出是哪一類，不必細節。"],["n","2. ★ 七章五節：不要倚賴鄰舍，不要信靠密友。你身邊有沒有一位，你可以放心說真話的人？請說出一個，例如家人、同伴、牧者。"],["n","3. ★★ 七章八節：耶和華卻作我的光。你有沒有一個時刻，在黑暗中，感覺到一點光？請用一句話說出那一次。"],["n","4. ★★★ 請在安靜中想一件事：一件你一直在「忍」、卻從來沒說出口的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起等候。"],["m","帶領提醒：請先安靜念七章八節，再開始。不要點名逼人說。這一章會碰到黑暗、家人的傷害、長期的無力感與自責：若有人提到性暴力、家庭暴力、流產、失去孩子、自傷的念頭或長期的絕望感，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照七章一、二節，你最近最感到「被收盡、沒有可吃的」是哪一方面？請只說出一個，例如關係、工作、體力、盼望。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀七章八節與十八節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：七章七節的「等候」，和「忍氣吞聲」，有什麼不同？請用自己的話向組員說明。"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先把哪一件「忍著的事」說給一位可信的人聽，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一通電話、一次探訪、十分鐘守望；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，正坐在黑暗裡的人？請說出名字，並決定這個月用一句具體的話陪伴他，不講道理。"],["n","11. ★★ 你的小組或教會，有沒有一位長期沒有力氣、很少說話的人？請說出你可以怎樣，這個星期陪他坐十分鐘。"],["n","12. ★★ 你有沒有一位，曾經在你的黑暗裡陪著你、沒有催你「趕快好起來」的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「仰望那位赦罪的神」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。不要用七章六節，為任何家庭暴力或斷絕關係辯護；也不要用九節，叫受傷的人忍受。若有人分享被家人傷害、失去孩子、長期絕望或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件「忍著的事」，放在神面前。一起念七章八節。"],["p","由帶領者為每一位禱告：求神在我們坐著的時候作我們的光，並把我們的罪投於深海。散會前，彼此問一句：你這星期要先對誰說出一件忍著的事？"]]}}}</script>

      '{t}。',
      '我們來看{t}。',
      '接下來談{t}。',
      '底下是{t}。',
      '這一段講{t}。'
    ],
    /* 序號題目：{n} 是題序 */
    numbered: [
      '第{n}題。',
      '我們看第{n}題。',
      '接著是第{n}題。',
      '來到第{n}題。',
      '第{n}題這樣問。',
      '我們往下，第{n}題。'
    ],
    /* 條列裡的第幾點 */
    item: [
      '第{n}，',
      '{n}是，',
      '再來，',
      '接著，',
      '還有一點，'
    ],
    /* 想更深：問 */
    deeper: [
      '我們在這裡想更深一點。有人會問，',
      '這裡容我多說一句。可能有人心裡正在問，',
      '我知道有人讀到這裡會停下來問，',
      '讓我們把這一段再往裡走一步。有人問，',
      '這裡有一個問題值得停下來。有人問，',
      '也許你正在想這個問題：'
    ],
    /* 想更深：答 */
    deeperAnswer: [
      '我的回答是這樣。',
      '我是這樣看的。',
      '我們可以這樣想。',
      '這一題我會這樣回答。',
      '讓我這樣說。',
      '答案其實就在經文裡。'
    ],
    /* 五步驟：{k} 是「看」「聽」「想」「講」「行」，{t} 是內容 */
    step: [
      '這一步是「{k}」。{t}',
      '接下來我們「{k}」。{t}',
      '「{k}」這一步：{t}',
      '先來「{k}」。{t}',
      '我們「{k}」。{t}'
    ],
    /* 收尾 */
    wrap: [
      '我們來收尾。',
      '最後，我們把這一段收起來。',
      '到這裡，我們收個尾。',
      '讓我們把這一段收在一起。'
    ],
    /* 表格：畫面上是表，耳朵裡是一段話 */
    table: [
      '這裡有一張表，我用說的帶你看過一遍。',
      '接下來這一段本來是一張表，我把它讀成一段話。',
      '這一段我整理成了表格，用聽的是這樣。',
      '底下是一張對照表，我一列一列說。'
    ],
    /* 條列 */
    list: [
      '這裡有幾點。',
      '底下分成幾點來看。',
      '這一段有幾點。',
      '我列了幾點。'
    ],
    /* 引用經文 */
    quote: [
      '經上說：',
      '聖經這樣說：',
      '我們來讀這一節：',
      '這一節是這樣寫的：'
    ],

    /* ── 開始、暫停、停止、接續 ──────────────────────────────────
     * 這四件事本來沒有聲音：按下去就開始唸，按停就沒聲了。
     * 少了這一句話，聽的人不知道自己在哪裡——尤其是「從書籤繼續」，
     * 冷不防從半路唸起，耳朵會以為前面漏掉了。
     *
     * 一位牧者不會這樣帶人。他會說「我們接著上次停的地方」。
     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      '我們一起來讀{t}。',
      '{t}。我們開始。',
      '來，我們讀{t}。',
      '我們從{t}開始。',
      '{t}，我們一起聽。'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      '我們開始。',
      '來，我們一起來讀。',
      '我們一起來讀這一段。',
      '好，我們開始讀。'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      '我們從第{n}段開始，{t}。',
      '這一次從第{n}段起，{t}。',
      '我們直接來到第{n}段，{t}。',
      '從第{n}段讀起。{t}。',
      '我們從第{n}段往下讀，{t}。'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      '我們從第{n}段開始。',
      '這一次從第{n}段起。',
      '我們直接來到第{n}段。',
      '從第{n}段讀起。'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      '我們接著上次停的地方，從第{n}段繼續。',
      '上一次讀到第{n}段，我們從那裡接下去。',
      '我們回到第{n}段，接著往下讀。',
      '接著剛才停下來的地方，第{n}段。',
      '我們從第{n}段再往下走。'
    ],
    /* 暫停 */
    pause: [
      '我們先停在這裡。',
      '先停一下。',
      '到這裡先歇一口氣。',
      '我們暫時停在這裡。'
    ],
    /* 停止 */
    stop: [
      '今天先讀到這裡。',
      '我們就讀到這裡。',
      '這一段先停在這裡。',
      '好，我們先到這裡。'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col}是{value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');
  }

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);
    return fill(pick('start', i), { t: t });
  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };
    if (!t) return fill(pick('startAtBare', i), v);
    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {
    return fill(pick('resume', i), { n: num(n) });
  }

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

  /* 行內：粗體、行內碼。斜體不做——`*` 跟條列的記號同一個，
     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }
      if (b.k === 'list') { out.push(listSpeech(b, base + i)); continue; }
      if (b.k === 'h') {
        t = inlineText(b.t);
        /* 「一、神的呼召」這種本身帶序號的標題，序號交給模板去說 */
        var m = t.match(/^([一二三四五六七八九十\d]+)[、．.]\s*(.+)$/);
        out.push(m ? section(m[2], m[1], base + i) : section(t, null, base + i));
        continue;
      }
      if (b.k === 'quote') {
        out.push(pick('quote', base + i) + inlineText(b.t));
        continue;
      }
      t = inlineText(b.t);
      /* 已經有句末標點的不補。冒號、分號、頓號也算——
         「三個立場：」後面接一張表，補成「三個立場：。」很難聽。 */

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  const songName = s => EN ? (s.ne || s.n) : (isSC() ? (s.ns || s.n) : s.n);

    if (hymnEl) return hymnEl;

    hymnEl.setAttribute('playsinline', ''); hymnEl.setAttribute('webkit-playsinline', '');

  function hymnPlay(i) {
    const s = hymns && hymns[i]; if (!s) return;
    const a = hymnAudio();
    if (hymnPrev === i) { hymnStop(); return; }
    hymnStop();
    const base = songBase[s.f] != null ? songBase[s.f] : '';
    a.src = SITE + base + encodeURIComponent(s.f);
    const p = a.play(); if (p && p.catch) p.catch(() => {
      if (base === '') { a.src = SITE + 'music/' + encodeURIComponent(s.f); const p2 = a.play(); if (p2 && p2.catch) p2.catch(() => say(T('這首歌暫時放不出來', 'This song could not play'))); }
    });
    hymnPrev = i;
    const b = q1('#gxhp' + i); if (b) b.textContent = '⏸';
  }
  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();
        if (!blob.size || /text\/html/.test(blob.type || '')) { why = T('檔案不對', 'bad file'); continue; }
        songBase[s.f] = b;
        return blob;
      } catch (e) { why = T('網路', 'network'); }
    }
    throw new Error(why || 'fail');
  }

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){

  function assemble(mdatStart){
    const newTraks=[];

      const tkc=mx_children(b,tk);
      const tkhd=mx_one(tkc,"tkhd");
      const v=b[tkhd.body];

      const mdia=mx_one(tkc,"mdia");
      const mdc=mx_children(b,mdia);
      const mdhd=mx_one(mdc,"mdhd");
      const mv=b[mdhd.body];
      const mts=mx_u32(b,mdhd.body+(mv===1?20:12));

      const mdhdBuf=b.slice(mdhd.start,mdhd.end);
      if(mv===1)writeU64(mdhdBuf,mdhd.body-mdhd.start+24,dur);
      else writeU32(mdhdBuf,mdhd.body-mdhd.start+16,dur);

      const minf=mx_one(mdc,"minf");

      const stblParts=parts.map(x=>x.__co?mx_box("co64",x.data):x);

      const minfParts=mic.map(x=>x.type==="stbl"?newStbl:b.slice(x.start,x.end));

    let maxDur=0;

      let d=0;tk.samples.forEach(s=>d+=s.dur);

    if(b[mvhd.body]===1)writeU64(mvhdBuf,mvhd.body-mvhd.start+24,maxDur);
    else writeU32(mvhdBuf,mvhd.body-mvhd.start+16,maxDur);

    return mx_box("moov",mvhdBuf,...newTraks);
  }

  function writeU32(buf,p,v){buf[p]=(v>>>24)&255;buf[p+1]=(v>>>16)&255;buf[p+2]=(v>>>8)&255;buf[p+3]=v&255;}
  function writeU64(buf,p,v){const hi=Math.floor(v/4294967296),lo=v>>>0;

  const ftypBuf=ftyp?b.slice(ftyp.start,ftyp.end)

  const mdatHead=new Uint8Array(16);

  writeU32(mdatHead,8,hi);writeU32(mdatHead,12,lo);

  const out=new Uint8Array(ftypBuf.length+moovNew.length+16+mdatSize);
  let p=0;
  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;
  order.forEach(o=>{out.set(b.subarray(o.off,o.off+o.size),p);p+=o.size;});

    try { mr = new MediaRecorder(stream, Object.assign(mime ? { mimeType: mime } : {}, { videoBitsPerSecond: 2200000 })); }
    catch (e) { cancelAnimationFrame(recAnim); say(T('這台裝置不能錄影片', 'This device cannot record video')); return; }
    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearInterval(recTimer); cancelAnimationFrame(recAnim); curFade = null; recFading = false;
      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}
      const type = mr.mimeType || mime || 'video/webm';
      await finishRec(new Blob(chunks, { type }), type, 'video');
    };
    mr.start(1000);
    try { await bgmEl.play(); } catch (e) {}
    fadeIn(mcGain, ac, 1, 0.6);
    curFade = () => fadeOutStop(mcGain, ac, BGM_FADEOUT);
    const len = +st().mc;
    bgmEl.onended = () => { if (recOn()) mr.stop(); };
    bgmEl.ontimeupdate = () => {
      if (len > 0 || recFading || !isFinite(bgmEl.duration)) return;
      const left = bgmEl.duration - bgmEl.currentTime;
      if (left <= BGM_FADEOUT && recOn()) fadeOutStop(mcGain, ac, Math.max(.5, left));
    };
    const lim = len > 0 ? len : 8 * 60;
    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);
    paint();
    recTick(T('音樂卡片製作中', 'Making music card') + '　♪');
  }

function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = LASTCH;
  /* 點的 x 是「章＋章內位置」（例 7.345＝第 7 章三分之一處），所以軸從 1 走到 LAST+1 */

    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur + .5).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="彌迦書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">出 · 聚 · 耕 · 山 · 小 · 善 · 赦</p></div>`;
}

let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>彌迦書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">下一段 ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 朗讀</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ 問小智</button>
    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '書 ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, '本章金句'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        TTSQ.bulk = true;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);

    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}
