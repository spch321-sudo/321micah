<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彌迦書講義">
<meta name="application-name" content="彌迦書講義">
<meta name="description" content="彌迦書講義：全書七章逐節原文解經、講章逐字稿、教學講章與321生命應用。">
<title>彌迦書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){
  var m = document.querySelector('main');
  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){

}, 8000);
</script>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"耶和華出了他的居所","sub":"出、審、哀","lv":"B","arc":"審判臨到與餘民應許","sec":[["1:1--1","摩利沙人彌迦：論撒馬利亞和耶路撒冷"],["1:2--4","耶和華出了居所：眾山如蠟化在火中"],["1:5--7","這都因雅各的罪過：偶像與妓女的雇價"],["1:8--9","先知哀號：傷痕無法醫治"],["1:10--12","沿著猶大的城鎮：不要哭泣，滾於灰塵"],["1:13--16","拉吉到亞杜蘭：剪除頭髮，兒女被擄"]],"serm":{"pts":[["神出來了","1:1--4","耶和華出了他的居所"],["罪的根","1:5--9","雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎"],["哀歌","1:10--16","災禍從耶和華那裡臨到耶路撒冷的城門"]]},"q":"你有沒有在半夜，被手機的警報聲嚇醒過？它不是鬧鐘，也不是訊息，只是一個你不會認錯的聲音：有事情要發生了。彌迦書第一章，就是這樣的聲音。它沒有從安靜的地方開始，一開口就是：萬民哪，你們都要聽！但這個警報不是從外面的敵人來的，是神自己從居所出來；而且發警報的先知，是一邊說，一邊流淚。這一章要問：當神把警報放在我面前的時候，我是急著指著別人，還是先回頭看自己的中心？","truth":"神從居所出來，不是為了毀滅，而是先把警報拉響，要人在災難之前回頭；罪的根不在外面的敵人，而在自己的中心，所以真正從神來的話，說出口的時候，是帶著眼淚的。","mv":{"t":"看哪，耶和華出了他的居所，降臨步行地的高處。","r":"彌1:3"},"card":["摩利沙人彌迦，在猶大王約坦、亞哈斯、希西家的時代，得到神的話，論撒馬利亞與耶路撒冷。他先叫萬民來聽：主耶和華要從聖殿見證你們的不是。接著，耶和華自己走出居所，步行在地的高處，眾山在祂以下如蠟化在火中。罪的根在哪裡？不在別處，就在撒馬利亞與耶路撒冷：偶像、雇價與人心的中心。先知因此赤腳露體，大聲哀號；傷痕無法醫治，延及猶大的城門。最後，他沿著家鄉一帶的小城，一個一個地哀歌，到拉吉、到亞杜蘭，直到兒女被擄。","「耶和華出了他的居所」：神不是遠遠坐著下命令，祂親自走出來，看自己的百姓走到哪裡；這一章是警報，不是終局。","福音在這一章是「先開口」：神在災難之前先說話，先派先知，先哭；這個「出來」的神，後來要從伯利恆出來（5:2），在十字架上把罪投進深海（7:19）。","無己是放下「問題在別人」的反應：不先指著敵人、政府、環境，而是先問自己的中心有沒有慢慢壞掉；回到本位，讓神作審判者，讓我作被祂喚醒的人。","「你們都要聽。我走出來，是要你回頭。」","今天找一個安靜的時間，寫下一個你已經聽了很久、卻一直假裝沒聽見的警報，對神說出口；再為一個你最想批評的人，先禱告，不先開口。","最終整合：\n神從居所出來，不是遠遠地下命令。\n祂先開口，先派先知，先流淚。\n罪的根，不在外面，在中心。\n偶像、雇價、慢慢壞掉的心，祂都看見。\n先知赤腳哀號，因為他背著這份審判。\n小城一個一個點名，因為祂記得每一個人。\n警報不是為了嚇人，是為了喚醒。\n先停下來，先回頭，先流淚。\n讓耶穌作王，在我裡面，聽見，不逃避。"],"self":"聽見警報的定義：我不先指著別人，先檢查自己的中心；我有沒有一個假裝沒聽見的警報、一個來路不乾淨的根基、一份只會評論卻不會流淚的心。","t321":{"k":"耶穌看見耶路撒冷，就為它哀哭；祂不是站在高處宣判，而是流著眼淚，並且走上十字架親自擔當審判（彌1:8；路19:41）。","g":"讓耶穌作王，就是讓祂的聲音，比我的辯護、我的指責、我的假裝沒聽見更大；我先把中心交給祂檢查（彌1:5–7）。","p":"屬神的體系，不是一群很會評論的人，而是先聽見神聲音、帶著眼淚說話、先檢查自己中心的人（彌1:2、8、12）。"},"grp":["【一、破冰】你有沒有被警報聲嚇醒過，或者收過一則讓你心一沉的訊息？那一刻，你第一個反應是什麼？","【二、扎心】1:5「雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎？」我們常以為問題在別人，你生命裡，有沒有一個中心，慢慢壞掉，卻沒有人說？","【三、經文】1:8先知赤腳露體，大聲哀號。講神的審判，卻是一邊說一邊哭；這對你「怎樣說真話」有什麼提醒？","【四、福音】耶穌看見耶路撒冷就為它哀哭，又走上十字架。這怎樣改變你面對「別人的罪」與「自己的中心」的方式？","【五、行動】這個星期，你要為哪一位最讓你想批評的人，先禱告三天？寫下名字，告訴組員，下週回來分享。"],"prac":{"main":"先聽見警報，先檢查中心，先為人流淚","items":["對神：每天花三分鐘，安靜地說：主，祢若有一個警報，是我一直假裝沒聽見的，求祢再說一次。","對自己：寫下一件你「不想打開的訊息」，問：我是不想面對它，還是不想承認它與我有關？","對人：想一個你最想批評的人，這個星期，先為他禱告，再決定要不要開口，開口時先帶著關心。","對生活：檢查一次你的收入與服事的動機，找出一個「來路不太乾淨」的地方，向神與一位可信的同伴說出來。","對使命：下次要說出一句真話以前，先問：我是帶著眼淚，還是帶著痛快？只在準備好帶著眼淚時，才開口。"]},"safe":["① 錯誤講法：把1:3「耶和華出了他的居所」講成神在天上發怒、親自下來毀滅，只剩下恐嚇","正確理解：經文的重點是神親自走出來看，先開口、先警告；同一卷書最後說祂「喜愛施恩」（7:18），警報是為了喚醒，不是為了嚇人。","檢驗標準：會眾聽完，是更想回到神面前，還是只剩下害怕？","② 錯誤講法：把1:5「罪的根在撒馬利亞與耶路撒冷」，講成北國與南國的對立，或藉此攻擊某一位領袖、某一間教會","正確理解：先知說的是整個中心的敗壞，包括講道的人自己；本講義要求講員先問自己，再問會眾，不拿這一節去指名任何人。","檢驗標準：會眾是更願意檢查自己的中心，還是更熱衷於指出別人的錯？","③ 錯誤講法：把亞述、撒馬利亞、耶路撒冷，套到今天某個國家、某個城市或某場戰事，說這是對現代的預言","正確理解：這一章說的是主前八世紀的歷史；本講義不用彌迦書去支持或反對任何現代國家、政黨或領袖，也不替任何人貼標籤。","檢驗標準：會眾是更貼近經文，還是更熱衷於拿新聞對照經文？","④ 錯誤講法：把1:7「妓女的雇價」講成對妓女或從事性工作者的羞辱，或藉此論斷某一群人","正確理解：這裡說的是敬拜偶像的聖所，用來路不正的收入建造信仰；先知控告的是拜偶像的人與制度，不是受剝削的人。","檢驗標準：曾受過剝削與傷害的人聽完，是被尊重，還是被指責？","⑤ 錯誤講法：渲染1:8先知「赤腳露體」，把它講成獵奇的細節，或當作先知可以任意行動的藉口","正確理解：這是古代近東表達哀悼與羞辱的行動，指向先知把審判扛在自己身上；講台上不渲染，也不當作今日的模仿。","檢驗標準：會眾是看見先知的哀痛，還是只記得一個奇怪的畫面？","⑥ 錯誤講法：把1:10–16的地名雙關，講成確定無疑的音義遊戲，或要會眾去背地名的意思","正確理解：學者對個別地名的雙關有不同意見，和合本也未全部譯出；講員只取大意：先知用鄰近家鄉的小城，一個一個點名哀歌。","檢驗標準：會眾是更看見先知的心，還是被地名的細節佔去了注意力？","⑦ 錯誤講法：把1:12「災禍從耶和華那裡臨到」，直接套在某一個人的疾病、失業或喪失上，暗示「你一定做錯了什麼」","正確理解：這是神對一整個社群的警報，不是解釋個人苦難的公式；對正在受苦的人，先陪伴，不追問原因。","檢驗標準：正在受苦的人聽完，是被安慰，還是被暗示「這是你應得的」？","⑧ 錯誤講法：把1:16「兒女被擄」，用來責備曾經失去孩子、或與孩子分離的父母","正確理解：這一節是先知為被擄的人哀哭，不是控告失去孩子的人；對於經歷喪失與分離的人，先陪伴，不追問細節。","檢驗標準：經歷過喪失的人聽完，是被擁抱，還是被責備？","⑨ 錯誤講法：把1:1的三位王與年代，講成可以推算日子的時間表，或用來斷定全書的作者與成書過程","正確理解：三位王只說明先知事奉的大約年代；本講義不推算日期，也不把成書問題變成「誰比較尊重聖經」的標籤。","檢驗標準：會眾是更看見神先說話，還是更熱衷於推算與爭論？","⑩ 錯誤講法：只講第1章的審判與哀歌，讓會眾停在絕望，彷彿這就是神最後的話","正確理解：第1章是警報，不是終點；講員要預告全書的終點：第7章「有何神像你」，神擔去罪孽、喜愛施恩。","檢驗標準：會眾離開時，是更想仰望神，還是更覺得沒有盼望？"]},{"n":2,"t":"我必要聚集你們","sub":"禍、拒、聚","lv":"B","arc":"審判臨到與餘民應許","sec":[["2:1--2","在床上圖謀罪孽：貪圖田地就佔據"],["2:3--5","耶和華也籌劃災禍：田地分給悖逆的人"],["2:6--7","不可說預言：神的心不忍耐嗎"],["2:8--11","近來我的民興起如仇敵：假先知說清酒和濃酒"],["2:12--13","我必聚集雅各：開路的在前面，耶和華引導"]],"serm":{"pts":[["在床上圖謀","2:1--2","在床上圖謀罪孽"],["不可說預言","2:3--11","你們不可說預言"],["開路的在前面","2:12--13","必要招聚以色列剩下的人"]]},"q":"你有沒有聽過一句話：你別講那些？也許是在飯桌上，也許是在辦公室，你剛要說一件不能不說的事，對方溫柔地說：今天氣氛這麼好，不要掃興。這句話很有力，它能讓一個人把心裡的話吞回去。彌迦書第二章，有一群人對先知說了同樣的話：你們不可說預言。但這一章不是只有控告；最後兩節，先知忽然說：我必要聚集你們，開路的在前面。這一章要問：我是那個叫別人住口的人，還是那個被神聚集、被牧者帶出去的人？","truth":"罪從床上的圖謀開始，一路長成奪取別人的家與田，再長成叫說真話的人住口；然而神的回答不只是審判，祂必要聚集剩下的人，並且親自在前面開路。","mv":{"t":"雅各家啊，我必要聚集你們，必要招聚以色列剩下的人，安置在一處，如波斯拉的羊，又如草場上的羊群","r":"彌2:12"},"card":["彌迦控告那些在床上圖謀罪孽的人：天一發亮，因手有能力就行出來了；貪圖田地就佔據，貪圖房屋便奪取。神說：我也在籌劃災禍，這禍在你們的頸項上不能解脫。到那日，他們要唱哀歌，說：我們全然敗落了。他們卻叫先知不要說預言，只要一個說「清酒和濃酒」的人。彌迦問：豈可說耶和華的心不忍耐嗎？最後，神說：我必要聚集剩下的人，如羊群；開路的在前面，他們的王，耶和華，引導他們。","「在床上圖謀」與「我籌劃災禍」用同一個字：人暗地裡的圖謀，神連那裡也在認真地聽；而祂的最後一句，是「我必要聚集」。","福音在這一章是「開路的在前面」：神親自走在羊群前面，打破門，帶人走出去；新約說耶穌為我們作了先鋒（來6:20），祂先走過，我們跟著走。","無己是放下「我不想被糾正」的保護：不叫說真話的人住口，也不霸佔別人的家；回到本位，讓神作牧者，讓我作羊。","「我必要聚集你，連你以為沒有人要的，我也不丟。」","今晚躺下前，問自己：我在床上圖謀什麼？把它說給神聽。這個星期，找一個人對他說：你可以對我說實話。","最終整合：\n罪，從床上長大。\n貪圖，佔據，奪取，霸佔。\n神說：我也在籌劃，我不是沒有聽見。\n人說：你別講那些。\n神說：我的話，是對行動正直的人有益。\n外衣被剝，婦人被趕，孩子的榮耀被奪。\n可是，最後一句，不是審判。\n我必要聚集你。\n開路的在前面，王在前面行，耶和華引導。\n讓耶穌作王，在我裡面，聽真話，也說真話。"],"self":"叫人住口的定義：我保護自己的面子、舒適與位置，勝過保護真理；我寧可聽好聽的話，也不願被糾正；我佔據我不該拿的，卻說自己不過是合理的。","t321":{"k":"耶穌是好牧人，祂親自走出去找一隻走失的羊，不是等羊自己回來；祂也是為我們開路、先行的那一位（彌2:12–13；來6:20；約10:11）。","g":"讓耶穌作王，就是讓祂的話勝過我的面子，我不叫說真話的人住口，我也交出我不該佔據的田地、房屋與位置（彌2:1–2、6–7）。","p":"屬神的體系，是一群能彼此說真話、也能聽真話的人，被牧者聚集，不霸佔別人的家，跟著王一同走出去（彌2:7、12–13）。"},"grp":["【一、破冰】你有沒有被人說過「你別講那些」？那一刻，你的心裡是什麼感覺？你後來把話吞回去了嗎？","【二、扎心】2:1「在床上圖謀罪孽」。你最近在床上，反覆想的是什麼？有沒有一件事，是你不敢在神面前說出來的？","【三、經文】2:7「我－耶和華的言語豈不是與行動正直的人有益嗎？」神的話讓你覺得是被傷害，還是被扶持？為什麼？","【四、福音】耶穌是開路的，祂先走，我們跟著走。你現在正走在哪一條路上，需要祂在前面開路？","【五、行動】2:8–9提到被奪去外衣與被趕出家的人。這個星期，你要為身邊哪一位，做一件具體的事？是什麼、怎麼做、告訴誰？"],"prac":{"main":"不叫真話住口，歸還不該拿的，跟著開路的牧者","items":["對神：每晚睡前一分鐘，說：主，我今天躺在床上，想的是什麼，請祢看，也請祢帶領。","對自己：寫下一件你「別人一提，就想打斷」的話題，問：我是在保護什麼？","對人：找一個你信任的人，對他說：你可以對我說實話。他說的時候，只說謝謝，不辯解。","對生活：檢查一件你「佔著不該佔的」東西：欠款、位置、承諾或功勞，決定怎麼歸還。","對使命：找出身邊一位被忽略、被趕出圈子的人，只陪伴，不評論，先問：我可以怎樣陪你？"]},"safe":["① 錯誤講法：把2:1–2「貪圖田地就佔據」，講成對有房產、有土地的人一概論斷，或套成某項現代土地、房產政策的立場","正確理解：經文說的是以色列家庭的地業（利25章）被有權勢的人用權力奪取；本講義不用這一段去支持或反對任何現代政策，也不論斷任何人的財產。","檢驗標準：會眾是更看見神對被奪者的眼睛，還是更熱衷於替某個政策站隊？","② 錯誤講法：把2:3「我籌劃災禍」，講成神以牙還牙、喜歡報復","正確理解：「籌劃」與2:1的「圖謀」是同一個字；重點是神認真對待人的暗地圖謀，不是神在發洩情緒。","檢驗標準：會眾是更看見神的認真與公義，還是更覺得神脾氣不好？","③ 錯誤講法：把2:6「你們不可說預言」，講成「被人反對，就證明我是真先知」，用來合理化講員的固執","正確理解：被人反對本身，不能證明一位講員是對的；先知的標準是話與神的話一致，並且有眼淚、有愛。講員自己，要先接受被糾正。","檢驗標準：講員是更願意被糾正，還是更習慣把批評當作逼迫？","④ 錯誤講法：把2:7「耶和華的心不忍耐嗎」，講成神其實不忍耐，隨時要發怒","正確理解：這句話是反問：神一直忍耐，是人的行為使審判臨到；經文也說祂的話是對行動正直的人有益。","檢驗標準：會眾是更看見神的忍耐，還是更怕神隨時動怒？","⑤ 錯誤講法：把2:8–9「剝去外衣」「趕出安樂家」，渲染成獵奇的畫面，或對曾被趕出家的人製造罪咎","正確理解：這裡描寫的是有權者對平民與婦孺的欺壓；對曾被趕出家、經歷家庭破碎的人，先陪伴，不追問細節，也不要求立刻原諒。","檢驗標準：曾失去家的人聽完，是被安慰，還是被指責？","⑥ 錯誤講法：把2:10「起來去吧，這不是你們安息之所」，用來叫人離開教會、離婚，或離開一個正在受苦的關係","正確理解：這是神對霸佔別人家園的人說的話；它不是給人隨便離開承諾的理由，也不是給人留在危險中的理由。個人的處境，要與牧者及專業人員一起面對。","檢驗標準：聽的人是更看見神為受欺壓者伸冤，還是被這節話催逼做衝動的決定？","⑦ 錯誤講法：把2:11「說謊言的先知，預言清酒和濃酒」，講成任何一位講「祝福、豐盛」的講員都是假先知","正確理解：經文的標準是：為了酒而說話、不說該說的話；不是題目本身。講員要先檢查自己，不用這節去貼別人的標籤。","檢驗標準：會眾是更學會分辨，還是更習慣懷疑每一位講員？","⑧ 錯誤講法：把2:12–13「聚集剩下的人」，講成特定的現代歸回事件或末世時間表","正確理解：這裡是神對被審判之後剩下之人的應許；本講義不把它對應成今天任何政治事件，也不推算日期。","檢驗標準：會眾是更盼望神的聚集，還是更熱衷於推算與對號入座？","⑨ 錯誤講法：把2:13「開路的」，直接斷定只能是某一個人，或把每一個古代人物都硬連到耶穌","正確理解：「開路的」在原文沒有指名；新約稱耶穌為先鋒（來6:20），我們說「這使我們想起」，不替經文補上它沒有說的證明。","檢驗標準：會眾是更看見牧者走在前面，還是更熱衷於解字謎？","⑩ 錯誤講法：只講2章的控告與審判，讓人覺得神的話都是壞消息，把12–13節的聚集一筆帶過","正確理解：這一章的最後一句不是審判，是「我必要聚集」；講員必須把12–13節放在台上，讓人看見這就是整章的方向。","檢驗標準：會眾離開時，是更想被牧者聚集，還是更覺得被定罪？"]},{"n":3,"t":"我藉耶和華的靈","sub":"斥、聽、耕","lv":"A","arc":"首領的罪、錫安的盼望、伯利恆的牧者","sec":[["3:1--4","雅各的首領：你們不當知道公平嗎"],["3:5--7","使我民走差路的先知：平安了"],["3:8--8","至於我：藉耶和華的靈，滿有力量"],["3:9--11","首領、祭司、先知：為賄賂、雇價、銀錢"],["3:12--12","錫安必被耕種像一塊田"]],"serm":{"pts":[["知道公平","3:1--4","你們不當知道公平嗎"],["靈與力量","3:5--8","我藉耶和華的靈，滿有力量、公平、才能"],["錫安被耕","3:9--12","錫安必被耕種像一塊田"]]},"q":"小時候玩遊戲，總要有一個人當裁判。孩子對裁判的要求很簡單：不用多聰明，不用多有力氣，只要公平；裁判一偏心，遊戲就玩不下去了。彌迦書第三章，就是對一群裁判說話。他問了一句最簡單的話：你們不當知道公平嗎？首領、祭司、先知，各有一個價錢：審判被買走，教導被買走，預言被買走。然後他們還說：耶和華不是在我們中間嗎？這一章要問：我手上的位置、我口中的話，是不是被什麼買走了？我說的「神與我同在」，是為了改變我的心，還是為了保護我的罪？","truth":"首領、祭司、先知若把位置與話語賣給賄賂、雇價與銀錢，連聖殿也保不住他們；真正的先知，是靠耶和華的靈，滿有力量、公平與才能，敢向神的百姓說明他們的過犯。","mv":{"t":"至於我，我藉耶和華的靈，滿有力量、公平、才能，可以向雅各說明他的過犯，向以色列指出他的罪惡。","r":"彌3:8"},"card":["彌迦對雅各的首領與官長說：你們不當知道公平嗎？他們惡善好惡，把百姓當作鍋中的肉。到了遭災的時候，他們哀求，神卻掩面。使百姓走差路的先知，有東西吃就喊平安，沒有東西吃就預備攻擊；他們必遭遇黑夜，不見異象。彌迦說：至於我，我藉耶和華的靈，滿有力量、公平、才能。接著他指控首領為賄賂、祭司為雇價、先知為銀錢，卻說耶和華在我們中間。所以，錫安必被耕種像一塊田，耶路撒冷必變為亂堆。","「你們不當知道公平嗎？」首領本來知道，卻把那把尺放在口袋裡；真正的力量與公平，只有神的靈能放在同一個人身上。","福音在這一章是「靈」：先知不靠膽量與口才，是被耶和華的靈充滿；真正公平的審判者，是不收賄賂的那一位，祂潔淨聖殿，也親自成為真聖殿（約2:19–21）。","無己是放下「位置是我的、話是我的」：位置是神託付的，話不是買賣的商品；回到本位，讓神作審判者，我只是向祂交帳的僕人。","「我給你力量與公平，不是讓你站高，是讓你敢說。」","這個星期，找出你手上一個公平的尺，在一件小事上拿出來用；再找出一句你一直不敢說的真話，用愛心說給一個人聽。","最終整合：\n你們不當知道公平嗎？\n尺，在口袋裡。\n位置，變成了價錢。\n審判被買走，教導被買走，預言被買走。\n他們說：耶和華不是在我們中間嗎？\n神說：因你們的緣故，錫安必被耕種。\n可是，有一個人站出來。\n至於我，我藉耶和華的靈，滿有力量。\n那靈，使人說真話，也使人公平。\n讓耶穌作王，在我裡面，掌權，也交帳。"],"self":"被買走的定義：我把神託付的位置與話語，換成別人給的好處、面子或安全；我說「神與我同在」，卻沒有讓祂改變我的心與我的決定。","t321":{"k":"耶穌潔淨聖殿，說我的殿必稱為禱告的殿，祂也成為真聖殿；祂是不收賄賂的審判者，有權柄而不壓人，說真話而帶著眼淚（彌3:8；太21:13；約2:19–21）。","g":"讓耶穌作王，就是把我手上的位置、我口中的話，交回祂的手；我不用位置壓人，也不讓價錢買走我的真話（彌3:1、9–11）。","p":"屬神的體系，不是靠位置站立的人，而是靠神的靈站立的人；領袖、教導者、傳話者，都在耶穌的光下交帳（彌3:8、11）。"},"grp":["【一、破冰】你小時候玩遊戲，有沒有遇到過裁判偏心的時候？當時你的感覺是什麼？","【二、扎心】3:1「你們不當知道公平嗎？」你心裡有一把公平的尺。這個星期，你有沒有一次，明明知道，卻把那把尺放在口袋裡？","【三、經文】3:11首領、祭司、先知各有一個價錢，卻說「耶和華不是在我們中間嗎？」你有沒有把「神與我同在」當作保險？","【四、福音】耶穌潔淨聖殿，又說祂自己就是殿。這怎樣改變你對「聖殿不會倒」的看法？","【五、行動】3:8「我藉耶和華的靈」。這個星期，你要向哪一個人說一句真話？是什麼、什麼時候、告訴誰？"],"prac":{"main":"拿出公平的尺，說出真話，不讓價錢買走你","items":["對神：每天花三分鐘，求神的靈：主，請祢給我力量、公平與才能，使我敢說，也說得柔軟。","對自己：寫下一件你「明明知道，卻沒有做」的公平的事，問：我是怕失去什麼？","對人：找一個你一直迴避的人，用愛心說一句真話，說完之後，先聽他怎麼回應。","對生活：檢查你的帳目、承諾與推薦：有沒有一個地方，是因為好處而說了假話或偏了一點？","對使命：為你身邊一位在位置上的人（主管、牧者、父母）禱告，求神賜他公平的心。"]},"safe":["① 錯誤講法：把3:2–3「吃我民的肉」，渲染成血腥的畫面，或對受害者重複傷害","正確理解：這是先知用比喻描寫有權者一步一步消耗百姓的生命；講台上取其意，不渲染，並要對曾被剝削、被虐待的人保持敏感。","檢驗標準：曾受過傷害的人聽完，是被安慰，還是再次被嚇到？","② 錯誤講法：把3:1「雅各的首領、以色列家的官長」，直接套到今天某個政府、某位領袖或某個政黨","正確理解：這是對主前八世紀猶大與以色列領袖的話；本講義不用它去支持或反對任何現代政治人物，也不替任何人貼標籤。","檢驗標準：會眾是更看見自己手上的位置，還是更熱衷於指責某個人？","③ 錯誤講法：把3:4「神向他們掩面，不應允」，講成「神不會聽你的禱告」，嚇阻正在禱告的人","正確理解：這節是對一直不聽窮人哀求的首領說的；神是順著人自己選的路。對一般的信徒，聖經應許祂必聽（彌7:7）；對悔改的人，門是開的。","檢驗標準：正在禱告的人聽完，是更敢向神說話，還是更怕開口？","④ 錯誤講法：把3:5「為食物說話的先知」，講成所有領薪的牧者都是假先知，或批評教會供應傳道人","正確理解：經文的問題是「為了有沒有吃的」而改變所傳的話，不是領薪本身；教會供應事奉者，是合宜的（太10:10；林前9:14）。","檢驗標準：會眾是更看見傳話者要忠於神的話，還是更懷疑每一位被供應的人？","⑤ 錯誤講法：把3:6「不見異象，不能占卜」，講成神今日已不再向人說話，或否定今日神的帶領","正確理解：這是對假先知的審判：他們賣的異象，最後連異象也沒有了；不是對今日信徒的宣告。","檢驗標準：會眾聽完，是更仰望神的話，還是以為神已經不說話？","⑥ 錯誤講法：把3:8「藉耶和華的靈」，講成「我有靈，所以我說的都是神的話」，作為不被查驗的護身符","正確理解：有些學者認為「藉耶和華的靈」是後來的註解，但全部古抄本都有它；無論怎麼讀，真先知的標誌，是話與神的話一致、公平，並且有力量。","檢驗標準：講員是更願意被神的話查驗，還是更需要被尊敬？","⑦ 錯誤講法：把3:8的「力量、公平、才能」，講成講員的口才、性格或個人魅力","正確理解：三樣都是神的靈所賜；有力量沒有公平是暴力，有公平沒有力量是軟弱；本講義要求講員先倚靠，再說話。","檢驗標準：會眾是更仰望神的靈，還是更欣賞講員的氣勢？","⑧ 錯誤講法：把3:9–11的首領、祭司、先知，講成「牧者與領袖都是壞人」，製造對領袖的不信任","正確理解：先知控告的是為價錢而偏離的人，不是領袖這個身分；神也興起忠心的領袖，並要我們為他們禱告。","檢驗標準：會眾是更為領袖禱告，還是更習慣挑剔領袖？","⑨ 錯誤講法：把3:10「以人血建立錫安」，講成任何建築、事工、教會成長，都是以人血建造的罪","正確理解：這是對用不義手段建造城的人說的話；講員不貶低任何誠實的建造與服事，只問：根基是否建在別人的眼淚上。","檢驗標準：服事中的人聽完，是更檢查自己的動機，還是被定罪而不敢再服事？","⑩ 錯誤講法：把3:11「耶和華不是在我們中間嗎？」講成「相信神與我同在」是錯的","正確理解：錯的不是相信神同在，而是把同在當作保險，用來保護罪；神的同在，是為了改變人的心。","檢驗標準：會眾是更敬畏神的同在，還是更不敢相信祂與我們同在？","⑪ 錯誤講法：把3:12「錫安必被耕種」，講成今日任何教會或聖地必定被毀的預言","正確理解：這是對當時猶大的警告；耶利米書26:17–19記載，長老引用這節，說明希西家聽了，悔改，神就後悔不降所說的災；警告的目的，是讓人回頭。","檢驗標準：會眾是更願意回頭，還是更活在恐懼裡？","⑫ 錯誤講法：把3:12說成「聖殿遲早都會倒」，因此貶低敬拜與聚會的價值","正確理解：經文不是在貶低敬拜，而是在警告：不能把聖殿當作保險；新約也說，我們是神的殿（林前3:16），要被聖潔地對待。","檢驗標準：會眾是更珍惜與神同在，還是更輕看敬拜聚會？","⑬ 錯誤講法：只講3章的控訴，不帶出4:1的轉折，也不提第12節之後，神的靈與審判並行的盼望","正確理解：3:12是全卷的低點，4:1是全卷的轉彎；講員要讓人看見：審判不是故事的結尾，是通往結尾的門。","檢驗標準：會眾離開時，是更想回頭，還是更覺得絕望？"]},{"n":4,"t":"末後的日子","sub":"山、犁、救","lv":"A","arc":"首領的罪、錫安的盼望、伯利恆的牧者","sec":[["4:1--3","耶和華殿的山必堅立：萬民流歸這山"],["4:4--5","人人坐在自己葡萄樹下：我們永遠奉耶和華的名而行"],["4:6--8","聚集瘸腿的：耶和華在錫安山作王"],["4:9--10","現在為何大聲哭號：在那裡蒙解救"],["4:11--13","許多國聚集攻擊：他聚集他們如禾捆"]],"serm":{"pts":[["殿的山","4:1--3","耶和華殿的山必堅立"],["同行","4:4--8","我們卻永永遠遠奉耶和華－我們神的名而行"],["在那裡蒙解救","4:9--13","在那裡耶和華必救贖你脫離仇敵的手"]]},"q":"你有沒有看過一棟老房子被拆掉？推土機來了，牆倒了，最後只剩下一片空地，你站在那裡，心裡空空的。可是有一天你再經過，地基打好了，有人說：我們要在這裡重新蓋。彌迦書第三章的最後，是一座被耕種的錫安；第四章一開始，就是堅立的殿的山，中間沒有任何過渡。這是全卷最大的轉彎。這一章要問：當我的生命像一塊被拆毀的空地，我敢不敢相信，神說的重建，是真的？而且，在我還沒走出巴比倫之前，就已經奉祂的名行走？","truth":"神的審判不是故事的終點：祂要堅立祂的山，聚集瘸腿的與被趕出的，親自作王，並在最遠的巴比倫救贖他們；所以今天，我們就要奉耶和華我們神的名行走。","mv":{"t":"萬民各奉己神的名而行；我們卻永永遠遠奉耶和華－我們神的名而行。","r":"彌4:5"},"card":["末後的日子，耶和華殿的山必堅立，萬民流歸這山，說：我們登耶和華的山，主必將他的道教訓我們，我們也要行他的路。他必施行審判，人就將刀打成犂頭，不再學習戰事。人人坐在自己的葡萄樹下，無人驚嚇；萬民各奉己神的名而行，我們卻永遠奉耶和華的名而行。到那日，神要聚集瘸腿的、被趕出的，耶和華在錫安山作王。錫安現在哭號，要出城、住田野、到巴比倫，在那裡蒙解救。許多國聚集攻擊，卻不知道耶和華的意念，祂聚集他們如禾捆。","「奉耶和華我們神的名而行」：未來的盼望，不是等到那日才開始；今天就決定誰是主，就是開始行走。","福音在這一章是「聚集」：神聚集瘸腿的、被趕出的，不是從強者開始；祂也在巴比倫親自救贖，像親族贖回；耶穌進入被趕出與受傷的人群中（太9:12；路4:18）。","無己是放下「我要先變強、先安排安全」的算盤：我不需要靠自己站在高處，只要先到神面前被教導，再行祂的路。","「來吧，到我這裡來，我先教導你，然後你再走。」","這個星期，在做一個決定以前，先安靜五分鐘，問神：你要教導我什麼？再用一件具體的小事，說：今天我奉你的名行走。","最終整合：\n殿的山，被堅立。\n萬民，像河水流來。\n不是為了看風景，是為了被教導。\n刀，在審判者面前，才打成犁頭。\n人人坐在自己的葡萄樹下，無人驚嚇。\n我們現在，就奉祂的名行走。\n祂聚集瘸腿的，被趕出的。\n祂在巴比倫，也要救贖。\n列國的聚集，也在祂的意念裡。\n讓耶穌作王，在我裡面，先聽，再走。"],"self":"自己建造安全的定義：我以為只要自己夠強、安排夠好，就能站在高處；我先決定要走哪條路，走不通了才來找神，卻忘了神早已邀請我先來被教導。","t321":{"k":"耶穌進入被趕出與受傷的人群中，吃飯、醫治、聚集，祂不是躲在高處的王；祂說：康健的人用不著醫生，有病的人才用得著（彌4:6–7；太9:12；路4:18）。","g":"讓耶穌作王，就是今天就決定誰是主：我奉祂的名行走，包括怎麼說話、怎麼用錢、怎麼處理情緒，不等到「那日」才開始（彌4:5）。","p":"屬神的體系，是一群被聚集的人：先到神面前被教導，再行祂的路；瘸腿的、被趕出的，都在其中，耶和華親自作王（彌4:1–2、6–7）。"},"grp":["【一、破冰】你有沒有看過一個老地方被拆掉，後來又重建？那一刻你心裡的感覺是什麼？","【二、扎心】4:2「主必將他的道教訓我們，我們也要行他的路。」你做決定的次序，是先聽神，還是先走了才問神？","【三、經文】4:5「我們卻永永遠遠奉耶和華－我們神的名而行。」奉祂的名行走，今天在你的家、工作、金錢上，是什麼樣子？","【四、福音】神說要聚集瘸腿的、被趕出的。你身邊有沒有這樣的人？耶穌怎樣對待他們？","【五、行動】4:10「在那裡要蒙解救。」你現在正處在哪一個「巴比倫」？這個星期，你要向神與組員說出哪一句話？"],"prac":{"main":"先聽神，再行路；今天就奉耶和華的名行走","items":["對神：每天做決定以前，先安靜一分鐘，說：主，祢要教導我什麼？","對自己：寫下一件你正在靠自己安排安全的事，問：我願意把它交給神的牧養嗎？","對人：找一位走得比較慢、被忽略的人，今天花十分鐘陪他，先聽，不評論。","對生活：選一件具體的小事（說話、金錢或情緒），今天決定奉耶和華的名處理它。","對使命：想一想你的團契或家庭，有沒有一位像「瘸腿的、被趕出的」，主動邀請他回來。"]},"safe":["① 錯誤講法：把4:1「末後的日子」，講成可以排進日曆的末世時間表，或用來推算主再來的日期","正確理解：在先知書裡，「末後的日子」指神所定結局的那個時候；本講義不排時間表，不算日子，叫人今天就回頭、就行走。","檢驗標準：會眾是更願意今天就奉祂的名行走，還是更熱衷於推算日期？","② 錯誤講法：斷定4:1–3與以賽亞書2:2–4，是彌迦抄以賽亞，或以賽亞抄彌迦，並以此評價誰比較重要","正確理解：學者有不同的看法：有人說彌迦引用以賽亞，有人說反之，也有人說兩人引用同一個古老的應許；聖經沒有說，我們不替它決定。","檢驗標準：會眾是更看見這個應許被兩位先知同時傳講，還是被作者先後的爭論佔去注意力？","③ 錯誤講法：把4:3「將刀打成犂頭」，用作任何政治立場、遊行標語或反戰／主戰的論據","正確理解：經文的次序是：先有真正公平的審判，然後才打刀為犁；這一節不是口號，也不是教導信徒去裁決任何現代的戰爭。","檢驗標準：會眾是更盼望那位公平的審判者，還是更熱衷於用這節替某個立場站台？","④ 錯誤講法：把4:3「不再學習戰事」，講成基督徒絕對不可以服役、報警、或保護弱小的人","正確理解：這是神的審判臨到、萬國歸向之後的光景；本講義不用它去判決任何今日信徒在具體處境下的責任，那需要在禱告、神的話與有智慧的同伴中，一起辨別。","檢驗標準：會眾是更盼望神的和平，還是被一句口號壓得無法思考？","⑤ 錯誤講法：把4:4「人人坐在自己的葡萄樹下」，講成「只要信神就會有房子、有田地、生活無憂」的繁榮神學","正確理解：這是神在審判之後賜下的平安，不是今日信徒生活條件的保證；對正在受苦的人，先陪伴，不暗示他信得不夠。","檢驗標準：受苦的人聽完，是被安慰，還是被暗示自己信心不足？","⑥ 錯誤講法：把4:5「萬民各奉己神的名而行」，講成對其他信仰的人輕蔑，或對他們的信仰嘲笑","正確理解：這是先知以「我們」來作選擇的宣告，不是叫我們輕看鄰舍；愛仇敵、尊重人，仍是耶穌的吩咐（太5:44）。","檢驗標準：會眾是更堅定自己的信仰，還是更輕看別人？","⑦ 錯誤講法：把4:6–7「瘸腿的」，講成人性軟弱的比喻，或用身體殘障的人來作屬靈的教材","正確理解：經文說的是一群被打散、真正走不動、被趕出家園的人；不要拿任何行動不便的弟兄姊妹，去形容「軟弱」，也不當他們是講章的道具。","檢驗標準：行動不便的弟兄姊妹聽完，是被尊重與看重，還是被當作比喻？","⑧ 錯誤講法：把4:6「我所懲治的」，講成神喜歡傷害人，或把今日的苦難直接說是「神的懲治」","正確理解：神在這裡承認，那些受苦的人與祂有關，並要親自聚集他們；經文不是解釋個人苦難的公式。","檢驗標準：受苦的人聽完，是被聚集與看見，還是被暗示「你自己活該」？","⑨ 錯誤講法：把4:8「羊群的高臺」「俄斐勒」「從前的權柄」，講成特定現代地點或政治事件的預言","正確理解：這是以大衛城的老地方，說王權要歸回；本講義不把它對應成今天的任何地理或政治事件。","檢驗標準：會眾是更盼望那位王，還是更熱衷於對號入座？","⑩ 錯誤講法：把4:9–10的「產難的婦人」，講成所有痛苦都有好結果，並對正在受苦的人說「你要再忍耐，這是在生產」","正確理解：這句話只有神可以說；我們可以做的是陪伴，不是替痛苦下結論；經文也不是對所有人的所有苦難的解釋。","檢驗標準：正在受苦的人聽完，是被陪伴，還是被催促要快點有好結果？","⑪ 錯誤講法：把4:10的「到巴比倫去」，講成人的苦難「必須」經歷才得蒙福，或美化被擄與流亡","正確理解：經文是在說，神不繞過流亡，但流亡不是祂所喜悅的；並且在最遠的地方，祂也要救贖。對正在流離的人，先陪伴與協助。","檢驗標準：流離失所的人聽完，是被陪伴，還是被告知「這是你該經歷的」？","⑫ 錯誤講法：把4:11–13的「列國」「禾捆」「鐵角銅蹄」，講成對現代某個國家或民族的宣判，或為某場戰爭背書","正確理解：這一段是古代的歷史語言，不是給我們今日對號入座的名單；最後的主是耶和華，不是敵人，也不是我們自己。","檢驗標準：會眾是更仰望神的主權，還是更熱衷於替某個陣營歡呼？","⑬ 錯誤講法：把4:13「將他們的財獻與耶和華」，講成教導信徒用暴力或掠奪來「歸神」","正確理解：「歸耶和華」是古代的語言，指財富與權力從列國歸給神；本講義不把它當作今日任何行動的指引。","檢驗標準：會眾是更看見神是萬有的主，還是被一句古代的語言引向暴力？"]},{"n":5,"t":"伯利恆的以法他啊","sub":"小、生、安","lv":"A","arc":"首領的罪、錫安的盼望、伯利恆的牧者","sec":[["5:1--1","成群的民哪：審判者的臉被擊打"],["5:2--2","伯利恆的以法他啊：從你那裡出來，根源從亙古"],["5:3--3","直等那生產的婦人生下子來"],["5:4--6","他必牧養：這位必作我們的平安"],["5:7--9","雅各餘剩的人：如露水，如獅子"],["5:10--15","到那日：除去馬匹、偶像，向不聽從的列國施報"]],"serm":{"pts":[["最小的地方","5:1--3","你在猶大諸城中為小"],["牧者與平安","5:4--6","這位必作我們的平安"],["餘民與除去","5:7--15","雅各餘剩的人必在多國的民中"]]},"q":"你有沒有找過一個在地圖上找不到的地方？導航走到一半，只剩下一條細細的線，你問路邊的人，他說：再轉個彎就到了。你心裡想：這麼小的地方，會有什麼人從這裡出來？彌迦書第五章，就在這樣一個地方。猶大諸宗族之中，伯利恆是最小的；可是神說：將來必有一位從你那裡出來，為我作掌權的。這位王不坐在王座上，他站起來，牧養他的羊群；他不只給平安，他自己就是我們的平安。這一章要問：我覺得自己很小的地方，是不是正是神要開始的地方？我的平安，放在一位身上，還是放在一堆可能失去的東西上？","truth":"神不從耶路撒冷的宮殿，而從最小的伯利恆差來一位牧者；他倚靠耶和華的大能牧養，他自己就是我們的平安；神也要一樣一樣除去人所倚靠的馬匹與偶像，好讓人看見真正的平安是一位，不是一座武器庫。","mv":{"t":"這位必作我們的平安。","r":"彌5:5"},"card":["仇敵圍城，審判者的臉被杖擊打。可是神對伯利恆的以法他說：你在猶大諸城中為小，將來必有一位從你那裡出來，為我作掌權的；他的根源從亙古，從太初就有。在那位要來的王出現以前，神把百姓交付敵人，直等生產的婦人生下子來。他必起來，倚靠耶和華的大能，牧養他的羊群，他必日見尊大，直到地極。這位必作我們的平安。雅各餘剩的人在多國的民中，如露水，也如獅子。到那日，神要從百姓中間剪除馬匹、車輛、邪術與偶像，向不聽從的列國施報。","「這位必作我們的平安」：不是「他給我們平安」，是「他就是平安」；給的可以被拿走，他自己不能被拿走。","福音在這一章是「出來」與「牧養」：王從最小的伯利恆出來（太2:5–6），站起來牧養；祂是好牧人，為羊捨命（約10:11），祂留下平安給我們（約14:27）。","無己是放下「我必須自己有一匹馬」：不靠存款、人脈、學歷、掌控當作安全感的源頭，回到本位，讓神作我的平安，我作祂的羊。","「我就是你的平安，你可以放下你的馬。」","這個星期，把你最焦慮的一件事寫下來，對耶穌說：你是我的平安；再為一個人，做一件不為被看見的小事，像一滴露水。","最終整合：\n最小的地方，神從那裡開始。\n伯利恆，被人忽略的村莊。\n王從那裡出來，根源從亙古。\n在王出來以前，有一段被交付的日子。\n他站起來，倚靠耶和華，牧養。\n這位，不是給我們平安，他就是平安。\n神把我們倚靠的馬，一樣一樣拿走。\n是為了，讓我們抓住那一位。\n讓耶穌作王，在我裡面，作我的平安。"],"self":"自己的馬的定義：我把平安放在可以失去的東西上，存款、人脈、學歷、掌控，或一個我以為安全的位置；我不相信小的地方，會是神要開始的地方。","t321":{"k":"耶穌生在伯利恆，是馬槽裡的嬰孩，又成為站起來的牧人；祂不靠馬、不靠車、不靠名聲，倚靠父的大能，用牧養作王（彌5:2、4；太2:5–6；約10:11）。","g":"讓耶穌作王，就是讓祂作我的平安：我把倚靠的馬匹與偶像交回，不再用它們築我的安全（彌5:5、10–14）。","p":"屬神的體系，是一群倚靠牧者的人，像露水一樣安靜地祝福別人，不仗賴人力，也不等候世人之功（彌5:4、7）。"},"grp":["【一、破冰】你有沒有去過一個很小、很偏遠的地方，卻遇見讓你印象深刻的人或事？","【二、扎心】5:2「你在猶大諸城中為小。」你覺得自己（或家人、小組、工作）很小、沒有人看見嗎？你怎麼想這件事？","【三、經文】5:5「這位必作我們的平安。」你現在把平安放在哪裡？如果那一樣失去了，你的平安還在嗎？","【四、福音】耶穌從伯利恆出來，站起來牧養，不靠馬車。這怎樣挑戰你對「有能力」的想法？","【五、行動】5:10–14神要除去人所倚靠的。寫下你的「馬」是什麼，這個星期，你願意怎樣把倚靠換成神？告訴組員。"],"prac":{"main":"把平安放在一位身上，放下你的馬，像露水一樣祝福人","items":["對神：每天花三分鐘，說：主耶穌，祢是我的平安；今天我把最焦慮的一件事交給祢。","對自己：寫下三樣你最倚靠的東西，問：如果它們失去，我的平安還在嗎？","對人：這個星期，為一個人做一件不為被看見的小事（一通電話、一頓飯、一句鼓勵），像露水。","對生活：選一個你習慣用來「掌控」的東西（計畫、帳戶、關係），這個星期，刻意交給神一次。","對使命：找出你身邊「小的地方、小的人」（小組、家庭、初信者），主動投入一份時間陪伴他們。"]},"safe":["① 錯誤講法：斷定5:1「以色列的審判者」是某一位特定的王，或把被擊打的臉，直接說成就是耶穌的預言","正確理解：經文沒有指名；新約記載耶穌被打（太27:30），我們說「這使我們想起」，不替經文加上它沒有說的證明。","檢驗標準：會眾是更看見神的王走進羞辱，還是被一個身分的猜測佔去注意力？","② 錯誤講法：把5:2只當成「預言應驗」的證據，或把它當作辯論的武器，而忘了這是給正在被圍困的人的安慰","正確理解：新約把這節連在耶穌的降生上（太2:5–6；約7:42），這是新約自己作的連結；對聽的人，它首先是盼望：神從最小的地方開始。","檢驗標準：會眾是更盼望，還是只學會一套護教的說法？","③ 錯誤講法：把5:2「從亙古，從太初就有」，一步講成完整的三位一體或基督先存的教義證明，超過經文本身","正確理解：經文用最古老的詞語，說這位王的來歷不是今天才開始；基督徒讀到這裡，想起約翰福音1章，我們說「這使我們想起」，不替它加上超過經文的結論。","檢驗標準：會眾是更看見王的來歷與神的古老計畫相連，還是只聽到一堆神學名詞？","④ 錯誤講法：把5:3「生產的婦人」，斷定只能是馬利亞，或只能是錫安，並否定另一種讀法","正確理解：歷來有兩種讀法：一是接4:9–10的錫安，一是指王的母親（參賽7:14）；兩者並不互相排斥；本講義並陳，不強迫選一個。","檢驗標準：會眾是更看見神的計畫在痛苦中成形，還是被一個身分的爭論佔去注意力？","⑤ 錯誤講法：把5:3「交付敵人」，講成神遺棄祂的百姓，或對受苦的人說「你被交付，是因為你的罪」","正確理解：這是等候王出來之前的一段日子；經文沒有美化它，也不是解釋個人苦難的公式；對受苦的人，先陪伴。","檢驗標準：受苦的人聽完，是被陪伴，還是被暗示自己做錯了什麼？","⑥ 錯誤講法：把5:4「牧養」，講成領袖的特權，或把牧者的權柄用來要求會眾順服","正確理解：這位王的牧養，是站起來、走進羊群、倚靠耶和華的大能；耶穌自己的榜樣是為羊捨命，不是壓住羊。","檢驗標準：會眾是更看見牧者的僕人心，還是更覺得要服從某個人？","⑦ 錯誤講法：把5:5「這位必作我們的平安」，講成「信耶穌就不再有困難、焦慮或病痛」","正確理解：平安是一位，不是環境的零風險；耶穌也說，在世上你們有苦難（約16:33）；平安是在苦難中仍有那一位同在。","檢驗標準：正在受苦的人聽完，是被安慰，還是被暗示「你信得不夠」？","⑧ 錯誤講法：把5:5–6「七個牧者、八個首領」，拿來算人數、算時間，或對應現代的領袖","正確理解：這是舊約常見的「七加一」修辭，意思是「足夠多，甚至更多」；本講義不算數字，不指名任何人。","檢驗標準：會眾是更相信神必興起足夠的人，還是更熱衷於算與猜？","⑨ 錯誤講法：把5:5–6的「亞述」「寧錄」，套到今天某個國家或民族，或為某場戰爭背書","正確理解：這是主前八世紀的歷史；本講義不用彌迦書去支持或反對任何現代國家、政黨或領袖。","檢驗標準：會眾是更貼近經文，還是更熱衷於對號入座？","⑩ 錯誤講法：把5:7「如露水」，講成基督徒要軟弱、不說話、永遠被動","正確理解：露水是從天降下、不靠人力、也不等候人的掌聲；它也配合下一節的「獅子」：餘民是柔，也是力；不是被動，而是不靠人。","檢驗標準：會眾是更成為祝福，還是更不敢表達？","⑪ 錯誤講法：把5:8「如獅子」「踐踏撕裂」，講成為任何暴力、報復或對異己壓迫辯護","正確理解：這是詩歌的語言，描寫神所保守的餘民不被壓倒；本講義不用它為任何暴力辯護，下一章神說祂真正要的，是公義、憐憫、謙卑（6:8）。","檢驗標準：會眾是更仰賴神的保守，還是被一個獅子的畫面誘向暴力？","⑫ 錯誤講法：把5:10–14神要「剪除馬匹、拆毀城邑、除掉邪術與偶像」，講成信徒應該放棄所有財產與保障，或藉此論斷別人的東西是偶像","正確理解：這些是對以色列自己說的：神要除去他們用來取代神的倚靠；每個人的「馬」不同，要由各人在神面前檢查，不由別人代為宣告。","檢驗標準：會眾是更檢查自己的倚靠，還是更習慣指著別人的東西說是偶像？","⑬ 錯誤講法：把5:15「在怒氣和忿怒中施報」，當作信徒可以報復的根據","正確理解：報復是神的事（羅12:19）；這節是對「不聽從」的列國說的，不是教導我們對待誰；我們要做的，是自己先聽。","檢驗標準：會眾是更學會交給神，還是更想自己討回公道？"]},{"n":6,"t":"何為善","sub":"訟、行、秤","lv":"A","arc":"控訴、仰望與赦罪的神","sec":[["6:1--2","向山嶺爭辯：耶和華要與他的百姓爭辯"],["6:3--5","我的百姓啊，我向你做了甚麼呢"],["6:6--8","當獻上甚麼呢？何為善：行公義，好憐憫，存謙卑"],["6:9--12","詭詐的天平與假法碼：城裡的富戶滿行強暴"],["6:13--16","荒涼：你守暗利的惡規"]],"serm":{"pts":[["神的訴訟","6:1--5","我向你做了甚麼呢"],["何為善","6:6--8","只要你行公義，好憐憫，存謙卑的心，與你的神同行"],["詭詐的天平","6:9--16","我若用不公道的天平和囊中詭詐的法碼"]]},"q":"當有人指著你說「你做錯了」，你的第一句話是什麼？有人說「不是我」，有人說「你聽我解釋」，有人低下頭不說話。我們被控告的時候，第一句話常常洩露了我們的心。彌迦書第六章，神把自己的百姓帶上法庭，可是祂的第一句話不是「你錯了」，而是一個問題：我的百姓啊，我向你做了甚麼呢？然後祂開始數算的，不是人的罪，是自己做過的事：領出來、救贖、差遣。這一章要問：當神問我「你需要我做什麼」的時候，我記得祂已經為我做了什麼嗎？而「何為善」這個我們都會背的答案，是從哪裡開始的？","truth":"神先把自己做過的事數算給百姓聽，然後才告訴已經被贖的人何為善：行公義，好憐憫，存謙卑的心，與神同行；而這三件事，要從市場上那一桿秤開始。","mv":{"t":"世人哪，耶和華已指示你何為善。他向你所要的是甚麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。","r":"彌6:8"},"card":["神召集山嶺與地的根基作證人，與自己的百姓爭辯：我向你做了甚麼呢？我在甚麼事上使你厭煩？祂回想自己做過的：領出埃及、救贖、差遣摩西、亞倫和米利暗，並替百姓擋住巴勒與巴蘭的咒詛。百姓問：我該獻上什麼？一歲的牛犢？千千的公羊？萬萬的油河？甚至長子？先知回答：世人哪，耶和華已指示你何為善：行公義，好憐憫，存謙卑的心，與你的神同行。然後神的話回到市場：詭詐的天平與假法碼、強暴與謊言，並因此帶來的荒涼，因為百姓守了暗利與亞哈家的規條。","「何為善」不是一份清單，是一段「同行」：已經被贖的人，與神一起走；而公義是從手上的那一桿秤開始。","福音在這一章是「先做了」：神在要求以前，先數算自己做過的拯救（6:4）；耶穌完全地行公義、好憐憫、與神同行，並在我們裡面活出來（太23:23；約10:30）。","無己是放下「我用我的善來證明自己」：我不再追問獻多少才夠，只回到本位，讓神作神，與祂同行，並讓手上的秤公平。","「我已經為你做了很多，現在，與我同行。」","這個星期，數算三件神替你做過、而你一直不知道的事；再檢查你手上的一桿秤：帳目、承諾、說話，找一個偏了一點點的地方，把它校正。","最終整合：\n神把我們帶上法庭。\n可是，祂的第一句話，是一個問題。\n我向你做了甚麼呢？\n祂數算的，不是我們的罪，是祂自己的作為。\n領出來，救贖，差遣，擋住咒詛。\n我們問：該獻多少才夠？\n祂說：已經指示你何為善。\n行公義，好憐憫，存謙卑，與神同行。\n這不是賺取，是被贖的人的腳步。\n讓耶穌作王，在我裡面，與神同行。"],"self":"用善證明自己的定義：我以為只要獻得夠多、做得夠好，就能站在神面前；我忘了祂先做了拯救，也忘了公義要落在我手上的那一桿秤。","t321":{"k":"耶穌是完全行公義、好憐憫、與父同行的那一位；祂也說，公義、憐憫、信實，是律法上更重的事，並且在我們裡面活出這一切（彌6:8；太23:23；約10:30）。","g":"讓耶穌作王，就是讓祂在我手上那一桿秤、我的帳目、我的說話裡作主；我不再用「我很好」作擋箭牌（彌6:8、11–12）。","p":"屬神的體系，是一群被贖的人，一起行公義、好憐憫、存謙卑的心；市場與家庭，都在神的光下運作（彌6:4、8、11）。"},"grp":["【一、破冰】當有人指著你說「你做錯了」，你的第一句話通常是什麼？你覺得那句話洩露了你的什麼？","【二、扎心】6:3「我的百姓啊，我向你做了甚麼呢？」神沒有責備，而是發問。你有沒有一件事，你一直以為神虧欠了你？","【三、經文】6:8「行公義，好憐憫，存謙卑的心，與你的神同行。」這三樣，哪一樣你最容易缺？為什麼？","【四、福音】6:4神先做了拯救，才說何為善。這怎樣改變你看「做好事」與「得救」的關係？","【五、行動】6:11天平與法碼。這個星期，你要檢查哪一個「秤」（帳目、承諾、說話）？是什麼、怎麼校正、告訴誰？"],"prac":{"main":"記得神先做的，行公義，好憐憫，與神同行，並校正手上的秤","items":["對神：每晚睡前，說出一件今天神為你做的事（即使是小事），先感謝，再求祂帶領明天的路。","對自己：寫下三件你一直不知道神替你擋住的事，問：我今天該怎樣回應這份愛？","對人：找一個你需要「好憐憫」的人，這個星期，多給他一點時間，不為了他值不值得。","對生活：檢查你的帳目、報稅、承諾與說話，找出一個「偏了一點點」的地方，把它校正。","對使命：在你的工作或服事中，找出一個不公平的做法，用誠實、有愛心的方式，說出來。"]},"safe":["① 錯誤講法：把6:1–2神的「爭辯」，講成神需要被辯護，或神與人像在法庭上對立","正確理解：這是約的語言：神把百姓帶到證人面前，願意先聽人說話；祂不是敵人，是一位被冷落的家長。","檢驗標準：會眾是更看見神的耐性，還是更怕被告上法庭？","② 錯誤講法：把6:3「我向你做了甚麼呢」，講成神在自我辯護，或要人替神擔保","正確理解：神問這句話，是要百姓指出祂哪裡做錯（答案：沒有）；重點在引導記起，不在辯護。","檢驗標準：會眾是更記起神的恩典，還是更急著為神辯護？","③ 錯誤講法：把6:4「摩西、亞倫和米利暗」，講成性別立場的辯論，或只是為了強調某一種領袖","正確理解：經文只是列出神所差遣的三位領袖，其中包括一位女性；本講義不把它當作任何角色爭議的論據，只看見神的恩典給一群人。","檢驗標準：會眾是更看見神差派一群人，還是被另一個爭議佔去注意力？","④ 錯誤講法：把6:5「巴勒、巴蘭」，把巴蘭簡化為單純的壞人或單純的先知，或把「從什亭到吉甲」當作地理考試","正確理解：經文只是說神替百姓擋住了咒詛；新約對巴蘭另有論述（彼後2:15），但這裡的重點是「神所做的事」；講員不要在這裡展開巴蘭的人物評價。","檢驗標準：會眾是更記起神的保守，還是被一個人物的爭論帶走？","⑤ 錯誤講法：把6:6–7，講成「神不喜歡獻祭、燔祭，所以今日的奉獻、敬拜、禮儀都不重要」","正確理解：先知反對的是以為能靠數量換取神的心；舊約的獻祭是神所命定的，同一位神也要人誠實。本講義不用這節貶低敬拜或奉獻。","檢驗標準：會眾是更真誠地敬拜與奉獻，還是更輕看這些？","⑥ 錯誤講法：把6:7「獻長子」，講成今日可以用任何傷害孩子的方式表達敬虔，或對失去孩子的人製造罪咎","正確理解：這是先知用最荒謬的極端，說明人對「神到底要什麼」誤會之深；律法嚴禁以人獻祭。任何傷害孩子的行為，都與這節的意思完全相反。","檢驗標準：曾失去孩子或受過傷的人聽完，是被安慰，還是被指責？","⑦ 錯誤講法：把6:8講成「靠行公義、好憐憫、存謙卑得救」，把它當作救恩的條件","正確理解：6:4說神先拯救，才說何為善；6:8是已經被贖的人的路，不是賺取救恩的條件；新約也說，我們得救是本乎恩（弗2:8–10）。","檢驗標準：會眾是更因著被贖而行善，還是更為了得救而拚命行善？","⑧ 錯誤講法：把6:8只講「公義」，成為單一的社會行動議題；或只講「憐憫」，成為縱容；或只講「謙卑」，成為自我貶低","正確理解：三件是一組：只有公義是冷酷，只有憐憫是縱容，沒有與神同行，兩者都成為自己的善；謙卑不是看輕自己，而是回到本位。","檢驗標準：會眾是更完整地看見這三件事，還是只記住自己最喜歡的一件？","⑨ 錯誤講法：把6:8「與你的神同行」，講成一個很虛的屬靈口號，沒有具體的路","正確理解：同行是怎樣過日子：怎麼說話、怎麼用錢、怎麼對待家人；要具體到「今天、這件事」。","檢驗標準：會眾離開時，是否知道今天要怎樣與神同行？","⑩ 錯誤講法：把6:9的難處，當作教義的基礎，或把「智慧人必敬畏他的名」，當作用來比較人高低的標準","正確理解：6:9的原文有困難，古譯本與學者有不同的讀法；講員只取大意：神向這城呼叫，人要聽；不拿其中一個細節作神學。","檢驗標準：會眾是更願意聽神的呼叫，還是被一個難字佔去了注意力？","⑪ 錯誤講法：把6:10–12的「詭詐的天平」，講成所有生意人或有錢人都有罪，或對信徒的職場製造罪咎","正確理解：經文說的是故意用假秤、假斗欺騙人；它不是控告財富本身，也不是控告每一位商人；神喜悅誠實的買賣（箴11:1）。","檢驗標準：職場中的信徒聽完，是被提醒誠實，還是被說「你的工作有罪」？","⑫ 錯誤講法：把6:13–15「吃不飽、撒種不收」，講成貧窮或歉收都是罪的結果，對受苦的人下判斷","正確理解：這是盟約咒詛的語言，對象是故意行詭詐的城；它不是解釋個人貧窮或歉收的公式；對正在匱乏的人，先陪伴與協助。","檢驗標準：正在匱乏的人聽完，是被陪伴，還是被暗示「你一定做錯了什麼」？","⑬ 錯誤講法：把6:16「暗利」「亞哈家」，套到今天某個政權或某位領袖身上，或拿來羞辱人","正確理解：這是以北國的歷史，警告猶大不要走同一條路；本講義不用它指名任何現代人物，也不為任何人貼標籤。","檢驗標準：會眾是更檢查自己的路，還是更熱衷於指著別人？"]},{"n":7,"t":"有何神像你","sub":"哀、望、赦","lv":"A","arc":"控訴、仰望與赦罪的神","sec":[["7:1--6","哀哉：地上虔誠人滅盡，仇敵就是自己家裡的人"],["7:7--10","至於我，我要仰望耶和華：我雖坐在黑暗裡"],["7:11--13","日子必到：牆垣必重修，然而地必荒涼"],["7:14--17","求你牧放你的民：好像出埃及地的時候"],["7:18--20","有何神像你：將我們的一切罪投於深海"]],"serm":{"pts":[["哀哉","7:1--6","世間沒有正直人"],["仰望","7:7--13","我要仰望耶和華，要等候那救我的神"],["有何神像你","7:14--20","將我們的一切罪投於深海"]]},"q":"你有沒有在一個很黑的夜裡醒著？沒有燈，沒有聲音，心裡有一件事轉來轉去，你想：天什麼時候才會亮？有一種夜，不是因為沒有太陽，是因為心裡一點光也沒有。彌迦書第七章，就是從這樣的夜開始：夏天的果子被收盡了，連一串可吃的也沒有，鄰舍與密友都不可信，仇敵竟是自己家裡的人。可是在這一章，先知說了全卷最亮的一句話：至於我，我要仰望耶和華。這一章要問：當環境一點都沒有改變的時候，我敢不敢轉身？而當我看見一位「擔去罪孽、越過過犯、喜愛施恩」的神，我的心會說什麼？","truth":"先知在黑夜與孤單中，不否認黑暗，卻轉身仰望；最後，他以自己名字的意思發問：有何神像你？這位神擔去罪孽、越過過犯，把我們的一切罪投於深海，因為祂喜愛施恩，也守住向亞伯拉罕所起的誓。","mv":{"t":"神啊，有何神像你，赦免罪孽，饒恕你產業之餘民的罪過，不永遠懷怒，喜愛施恩？","r":"彌7:18"},"card":["先知哀歌：我好像夏天的果子已被收盡，連一掛可吃的也沒有。地上虔誠人滅盡，鄰舍、密友與家人都不可信。然後，他說：至於我，我要仰望耶和華，要等候那救我的神；我雖跌倒，卻要起來；我雖坐在黑暗裡，耶和華卻作我的光。他承認自己得罪了神，並相信神要為他辨屈，領他到光明中。牆垣必重修，然而地因居民行事的結果必荒涼。他禱告：求你牧放你的民，像古時一樣；神回答：我要顯奇事，像出埃及的時候。最後，他說：有何神像你？將我們的一切罪投於深海。","「至於我，我要仰望」：環境沒有改變，一個人轉身朝向耶和華；而盼望，就從這個小小的「至於我」開始。","福音在這一章是「擔去」與「投於深海」：神擔去罪孽、越過過犯、將罪踏在腳下，並且守住向亞伯拉罕所發的誓；耶穌在十字架上走進最深的黑暗，為我們把罪帶走（賽53:4–6；羅5:8）。","無己是放下「我要自己找出路、自己證明我不軟弱」：我不是光，我是在黑暗中仰望光的人；回到本位，讓神作神，我作被祂領出來的人。","「我雖在你的黑暗裡，我就是你的光。」","今天找一個安靜的地方，把心裡最沉重的話對神說出來；再用一句話說：至於我，我要仰望耶和華；並把一筆別人欠你的債，交給神，請祂幫助你放下。","最終整合：\n夏天的果子，被收盡了。\n鄰舍不可信，密友不可靠，家裡也不安全。\n可是，有一個人，轉了身。\n至於我，我要仰望耶和華。\n我雖跌倒，卻要起來。\n我雖坐在黑暗裡，耶和華卻作我的光。\n他承認罪，也相信神為他辯護。\n他求：求你牧放。\n神說：我要顯奇事，像出埃及的時候。\n有何神像你？擔去罪孽，越過過犯，投於深海。\n讓耶穌作王，在我裡面，在黑夜裡，仍然仰望。"],"self":"黑夜自救的定義：我以為只要靠自己，就能走出黑暗、證明我不軟弱；我忘了真正的光不在我裡面，而是在黑暗中，仍然對我說話的那一位。","t321":{"k":"耶穌在客西馬尼園與十字架上，真的坐在最深的黑暗裡，卻仍把靈魂交在父手中；祂是最完全的「至於我，我要仰望」，也為我們把罪投到深海（彌7:7–9、19；路22:42；路23:46）。","g":"讓耶穌作王，就是讓祂在我的黑夜裡作我的光，我不再自己證明我很堅強；我也交出一筆別人欠我的債，不再保守怒氣（彌7:8–9）。","p":"屬神的體系，是一群在黑夜裡彼此陪伴、一起仰望的人；是被赦免、也學習赦免的人，不假裝沒有黑夜（彌7:7、18–19）。"},"grp":["【一、破冰】你有沒有在一個很黑的夜裡醒著？那一刻，你心裡最想要的是什麼？","【二、扎心】7:5–6鄰舍、密友、家人都不可信。你生命裡，有沒有一個關係，是你最難相信的？你願意用一句話，把它帶到神面前嗎？","【三、經文】7:7「至於我，我要仰望耶和華。」你現在最需要轉身的事是什麼？你願意怎樣說出你的「至於我」？","【四、福音】7:18–19神擔去罪孽、越過過犯、投於深海。這與耶穌在十字架上所作的，有什麼相連？這怎樣安慰你？","【五、行動】這個星期，你要向哪一個人，交出一筆別人欠你的債（原諒或放下）？是什麼、怎麼開始、告訴誰？"],"prac":{"main":"在黑夜裡仰望，承認罪也領受赦免，學習放下別人欠你的","items":["對神：每天用一分鐘，說：至於我，我要仰望耶和華；請祢作我的光，也領我到光明中。","對自己：寫下一件你「自己扛著、不想讓人知道」的事，帶到神面前，說：主，我不是光，祢才是。","對人：找一位可信的朋友，說出你的黑夜；若在家中不安全，就請牧者或專業人員協助，不獨自承受。","對生活：這個星期，找一個時間安靜五分鐘，不滑手機，只對神說：我坐在黑暗裡，祢是我的光。","對使命：想一位正在黑夜的人，只陪伴，不說教，只說：我在這裡，我願意陪你。"]},"safe":["① 錯誤講法：把7:1–6的哀歌，講成「信徒不應該絕望，絕望就是不信」","正確理解：先知把哀歌放在盼望之前；神沒有叫他跳過這六節。有些痛需要先被說出來；對長期無望、或有輕生念頭的人，先陪伴，並協助他尋求專業的幫助。","檢驗標準：正在黑夜裡的人聽完，是被允許說出來，還是被催促要有信心？","② 錯誤講法：把7:6「仇敵就是自己家裡的人」，講成可以與家人為敵，或對受家庭傷害的人說「你要忍耐與原諒」","正確理解：這是描寫一個壞掉的世界，不是教導；耶穌引用它（太10:35–36），是說跟從祂有時要付上關係的代價。對在家中受傷的人，先確保安全，不要求立刻原諒。","檢驗標準：受過家庭傷害的人聽完，是被保護，還是被催促要原諒？","③ 錯誤講法：把7:7「我要仰望」，講成只要有信心、問題就會消失，或「仰望」只是一種正面思考","正確理解：仰望是守望，是主動的等候；環境不一定改變，改變的是人轉身的方向；先知自己也承認「我雖坐在黑暗裡」。","檢驗標準：會眾是更學會在黑暗裡等候，還是被一個「問題必消失」的承諾所誤導？","④ 錯誤講法：把7:8「不要向我誇耀」「我雖跌倒，卻要起來」，講成堅強的口號，不允許人真正地跌倒","正確理解：「卻要起來」是在跌倒之後說的；經文先承認跌倒與黑暗，再說光；陪伴跌倒的人，比要求他立刻起來重要。","檢驗標準：跌倒的人聽完，是被扶持，還是被要求堅強？","⑤ 錯誤講法：把7:9「我要忍受耶和華的惱怒」，講成「所有的苦難都是神的惱怒」，或對受苦的人說「你應受的」","正確理解：先知承認的是自己的罪（「因我得罪了他」），不是替任何人的苦難下結論；同時他也相信神要為他辯護。","檢驗標準：受苦的人聽完，是更看見神為他辯護，還是被暗示「這是你該受的」？","⑥ 錯誤講法：把7:10的「仇敵」「被踐踏如街上的泥土」，講成信徒可以期待仇敵倒楣，或用來為報復辯護","正確理解：這是描寫仇敵最後的羞愧，不是教導信徒去報復；伸冤在神（羅12:19）；我們被呼召的是愛仇敵（太5:44）。","檢驗標準：會眾是更交給神，還是更想親眼看見別人遭報？","⑦ 錯誤講法：把7:11–13的「牆垣必重修」「從亞述、埃及歸到你這裡」，講成特定現代事件或末世時間表","正確理解：這是古代世界地圖說「從四方」，並與7:13的荒涼並置；本講義不把它對應成任何今日的政治事件，也不算日子。","檢驗標準：會眾是更盼望神的重建，還是更熱衷於推算與對號入座？","⑧ 錯誤講法：把7:14–17「牧放」「出埃及」「舔土如蛇」，講成對任何國家、民族的勝利宣告，或對他們的羞辱","正確理解：這是詩歌的語言，描寫列國在神的作為面前的敬畏；不是我們的勝利歌，也不是對任何現代民族的宣告。","檢驗標準：會眾是更敬畏神的作為，還是更想看見別人被打敗？","⑨ 錯誤講法：斷定7:18「有何神像你」，一定是彌迦自己名字的雙關而不容討論，或把這個雙關說成確定的教義","正確理解：彌迦的名字（Mikhah）一般理解為「誰像耶和華」的縮寫，與這一節的問句相呼應，多數學者接受；但這是文學上的呼應，不是教義的根基。","檢驗標準：會眾是更被這個問句震動，還是被一個語源爭論佔去注意力？","⑩ 錯誤講法：把7:18「赦免罪孽」，講成廉價的恩典：神一定會赦免，所以不必悔改","正確理解：神的赦免是「擔去」：祂親自扛起罪；同一卷書也要求人行公義、好憐憫（6:8）；赦免不取消悔改的呼召，而是使悔改成為可能。","檢驗標準：會眾是更因被赦免而悔改，還是更輕看罪？","⑪ 錯誤講法：把7:19「將我們的罪投於深海」，講成神「忘記」罪，所以人也不必再面對罪的後果，或要受害者假裝沒發生","正確理解：這是神處理罪的畫面：擔起、制伏、丟棄，不是否認後果；受害者的正義與療癒，仍然需要被認真對待。","檢驗標準：受傷的人聽完，是被安慰，還是被要求假裝事情沒有發生？","⑫ 錯誤講法：把7:20「向亞伯拉罕施慈愛」，講成「某一群人」排他地擁有這個應許，或藉此貶低、輕看另一群人","正確理解：這是神守住祂向列祖所起的誓；教會與以色列的關係，在新約有更多的討論，本講義不在這裡作結論，只看見神的信實。","檢驗標準：會眾是更看見神的信實，還是被一個身分的爭論帶走？","⑬ 錯誤講法：把7:19與約拿書2:3、2:5「深海」，講成直接的預言連結，或當作辯論的武器","正確理解：兩處都用「海」「深處」的語言，可以互相呼應；但彌迦書7:19與約拿書的連結，是文學的呼應，不是預言的證明。","檢驗標準：會眾是更被「神把罪投到深處」安慰，還是被經文互相對照的遊戲佔去注意力？"]}],"txt":{"1":["當猶大王約坦、亞哈斯、希西家在位的時候，摩利沙人彌迦得耶和華的默示，論撒馬利亞和耶路撒冷。","萬民哪，你們都要聽！地和其上所有的，也都要側耳而聽！主耶和華從他的聖殿要見證你們的不是。","看哪，耶和華出了他的居所，降臨步行地的高處。","眾山在他以下必消化，諸谷必崩裂，如蠟化在火中，如水沖下山坡。","這都因雅各的罪過，以色列家的罪惡。雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎？猶大的邱壇在哪裡呢？豈不是在耶路撒冷嗎？","所以我必使撒馬利亞變為田野的亂堆，又作為種葡萄之處；也必將她的石頭倒在谷中，露出根基來。","她一切雕刻的偶像必被打碎；她所得的財物必被火燒；所有的偶像我必毀滅；因為是從妓女雇價所聚來的，後必歸為妓女的雇價。","先知說：因此我必大聲哀號，赤腳露體而行；又要呼號如野狗，哀鳴如鴕鳥。","因為撒馬利亞的傷痕無法醫治，延及猶大和耶路撒冷我民的城門。","不要在迦特報告這事，總不要哭泣；我在伯‧亞弗拉滾於灰塵之中。","沙斐的居民哪，你們要赤身蒙羞過去。撒南的居民不敢出來。伯‧以薛人的哀哭使你們無處可站。","瑪律的居民心甚憂急，切望得好處，因為災禍從耶和華那裡臨到耶路撒冷的城門。","拉吉的居民哪，要用快馬套車；錫安民的罪由你而起；以色列人的罪過在你那裡顯出。","猶大啊，你要將禮物送給摩利設‧迦特。亞革悉的眾族必用詭詐待以色列諸王。","瑪利沙的居民哪，我必使那奪取你的來到你這裡；以色列的尊貴人必到亞杜蘭。","猶大啊，要為你所喜愛的兒女剪除你的頭髮，使頭光禿，要大大地光禿，如同禿鷹，因為他們都被擄去離開你。"],"2":["禍哉，那些在床上圖謀罪孽、造作奸惡的！天一發亮，因手有能力就行出來了。","他們貪圖田地就佔據，貪圖房屋便奪取；他們欺壓人，霸佔房屋和產業。","所以耶和華如此說：我籌劃災禍降與這族；這禍在你們的頸項上不能解脫；你們也不能昂首而行，因為這時勢是惡的。","到那日，必有人向你們提起悲慘的哀歌，譏刺說：我們全然敗落了！耶和華將我們的分轉歸別人，何竟使這分離開我們？他將我們的田地分給悖逆的人。","所以在耶和華的會中，你必沒有人拈鬮拉準繩。","他們說：你們不可說預言；不可向這些人說預言，不住地羞辱我們。","雅各家啊，豈可說耶和華的心不忍耐嗎？這些事是他所行的嗎？我－耶和華的言語豈不是與行動正直的人有益嗎？","然而，近來我的民興起如仇敵，從那些安然經過不願打仗之人身上剝去外衣。","你們將我民中的婦人從安樂家中趕出，又將我的榮耀從她們的小孩子盡行奪去。","你們起來去吧！這不是你們安息之所；因為污穢使人毀滅，而且大大毀滅。","若有人心存虛假，用謊言說：我要向你們預言得清酒和濃酒。那人就必作這民的先知。","雅各家啊，我必要聚集你們，必要招聚以色列剩下的人，安置在一處，如波斯拉的羊，又如草場上的羊群；因為人數眾多就必大大喧嘩。","開路的在他們前面上去；他們直闖過城門，從城門出去。他們的王在前面行；耶和華引導他們。"],"3":["我說：雅各的首領，以色列家的官長啊，你們要聽！你們不當知道公平嗎？","你們惡善好惡，從人身上剝皮，從人骨頭上剔肉，","吃我民的肉，剝他們的皮，打折他們的骨頭，分成塊子像要下鍋，又像釜中的肉。","到了遭災的時候，這些人必哀求耶和華，他卻不應允他們。那時他必照他們所行的惡事向他們掩面。","論到使我民走差路的先知－他們牙齒有所嚼的，他們就呼喊說：平安了！凡不供給他們吃的，他們就預備攻擊他－耶和華如此說：","你們必遭遇黑夜，以致不見異象；又必遭遇幽暗，以致不能占卜。日頭必向你們沉落，白晝變為黑暗。","先見必抱愧，占卜的必蒙羞，都必摀著嘴唇，因為神不應允他們。","至於我，我藉耶和華的靈，滿有力量、公平、才能，可以向雅各說明他的過犯，向以色列指出他的罪惡。","雅各家的首領、以色列家的官長啊，當聽我的話！你們厭惡公平，在一切事上屈枉正直；","以人血建立錫安，以罪孽建造耶路撒冷。","首領為賄賂行審判；祭司為雇價施訓誨；先知為銀錢行占卜。他們卻倚賴耶和華，說：耶和華不是在我們中間嗎？災禍必不臨到我們。","所以因你們的緣故，錫安必被耕種像一塊田，耶路撒冷必變為亂堆；這殿的山必像叢林的高處。"],"4":["末後的日子，耶和華殿的山必堅立，超乎諸山，高舉過於萬嶺；萬民都要流歸這山。","必有許多國的民前往，說：來吧，我們登耶和華的山，奔雅各神的殿。主必將他的道教訓我們；我們也要行他的路。因為訓誨必出於錫安；耶和華的言語必出於耶路撒冷。","他必在多國的民中施行審判，為遠方強盛的國斷定是非。他們要將刀打成犂頭，把槍打成鐮刀。這國不舉刀攻擊那國；他們也不再學習戰事。","人人都要坐在自己葡萄樹下和無花果樹下，無人驚嚇。這是萬軍之耶和華親口說的。","萬民各奉己神的名而行；我們卻永永遠遠奉耶和華－我們神的名而行。","耶和華說：到那日，我必聚集瘸腿的，招聚被趕出的和我所懲治的。","我必使瘸腿的為餘剩之民，使趕到遠方的為強盛之民。耶和華要在錫安山作王治理他們，從今直到永遠。","你這羊群的高臺、錫安城的山哪，從前的權柄－就是耶路撒冷民的國權－必歸與你。","現在你為何大聲哭號呢？疼痛抓住你彷彿產難的婦人，是因你中間沒有君王嗎？你的謀士滅亡了嗎？","錫安的民哪，你要疼痛劬勞，彷彿產難的婦人；因為你必從城裡出來，住在田野，到巴比倫去。在那裡要蒙解救；在那裡耶和華必救贖你脫離仇敵的手。","現在有許多國的民聚集攻擊你，說：願錫安被玷污！願我們親眼見她遭報！","他們卻不知道耶和華的意念，也不明白他的籌劃。他聚集他們，好像把禾捆聚到禾場一樣。","錫安的民哪，起來踹穀吧！我必使你的角成為鐵，使你的蹄成為銅。你必打碎多國的民，將他們的財獻與耶和華，將他們的貨獻與普天下的主。"],"5":["成群的民哪，現在你要聚集成隊；因為仇敵圍攻我們，要用杖擊打以色列審判者的臉。","伯利恆的以法他啊，你在猶大諸城中為小，將來必有一位從你那裡出來，在以色列中為我作掌權的；他的根源從亙古，從太初就有。","耶和華必將以色列人交付敵人，直等那生產的婦人生下子來。那時掌權者其餘的弟兄必歸到以色列人那裡。","他必起來，倚靠耶和華的大能，並耶和華－他神之名的威嚴，牧養他的羊群。他們要安然居住；因為他必日見尊大，直到地極。","這位必作我們的平安。當亞述人進入我們的地境，踐踏宮殿的時候，我們就立起七個牧者，八個首領攻擊他。","他們必用刀劍毀壞亞述地和寧錄地的關口。亞述人進入我們的地境踐踏的時候，他必拯救我們。","雅各餘剩的人必在多國的民中，如從耶和華那裡降下的露水，又如甘霖降在草上；不仗賴人力，也不等候世人之功。","雅各餘剩的人必在多國多民中，如林間百獸中的獅子，又如少壯獅子在羊群中。他若經過就必踐踏撕裂，無人搭救。","願你的手舉起，高過敵人！願你的仇敵都被剪除！","耶和華說：到那日，我必從你中間剪除馬匹，毀壞車輛，","也必從你國中除滅城邑，拆毀一切的保障，","又必除掉你手中的邪術；你那裡也不再有占卜的。","我必從你中間除滅雕刻的偶像和柱像，你就不再跪拜自己手所造的。","我必從你中間拔出木偶，又毀滅你的城邑。","我也必在怒氣和忿怒中向那不聽從的列國施報。"],"6":["以色列人哪，當聽耶和華的話！要起來向山嶺爭辯，使岡陵聽你的話。","山嶺和地永久的根基啊，要聽耶和華爭辯的話！因為耶和華要與他的百姓爭辯，與以色列爭論。","我的百姓啊，我向你做了甚麼呢？我在甚麼事上使你厭煩？你可以對我證明。","我曾將你從埃及地領出來，從作奴僕之家救贖你；我也差遣摩西、亞倫，和米利暗在你前面行。","我的百姓啊，你們當追念摩押王巴勒所設的謀和比珥的兒子巴蘭回答他的話，並你們從什亭到吉甲所遇見的事，好使你們知道耶和華公義的作為。","我朝見耶和華，在至高神面前跪拜，當獻上甚麼呢？豈可獻一歲的牛犢為燔祭嗎？","耶和華豈喜悅千千的公羊，或是萬萬的油河嗎？我豈可為自己的罪過獻我的長子嗎？為心中的罪惡獻我身所生的嗎？","世人哪，耶和華已指示你何為善。他向你所要的是甚麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。","耶和華向這城呼叫，智慧人必敬畏他的名。你們當聽是誰派定刑杖的懲罰。","惡人家中不仍有非義之財和可惡的小升斗嗎？","我若用不公道的天平和囊中詭詐的法碼，豈可算為清潔呢？","城裡的富戶滿行強暴；其中的居民也說謊言，口中的舌頭是詭詐的。","因此，我擊打你，使你的傷痕甚重，使你因你的罪惡荒涼。","你要吃，卻吃不飽；你的虛弱必顯在你中間。你必挪去，卻不得救護；所救護的，我必交給刀劍。","你必撒種，卻不得收割；踹橄欖，卻不得油抹身；踹葡萄，卻不得酒喝。","因為你守暗利的惡規，行亞哈家一切所行的，順從他們的計謀；因此，我必使你荒涼，使你的居民令人嗤笑，你們也必擔當我民的羞辱。"],"7":["哀哉！我好像夏天的果子已被收盡，又像摘了葡萄所剩下的，沒有一掛可吃的；我心羨慕初熟的無花果。","地上虔誠人滅盡；世間沒有正直人；各人埋伏，要殺人流血，都用網羅獵取弟兄。","他們雙手作惡；君王徇情面，審判官要賄賂；位分大的吐出惡意，都彼此結聯行惡。","他們最好的，不過是蒺藜；最正直的，不過是荊棘籬笆。你守望者說，降罰的日子已經來到。他們必擾亂不安。","不要倚賴鄰舍；不要信靠密友。要守住你的口；不要向你懷中的妻提說。","因為，兒子藐視父親；女兒抗拒母親；媳婦抗拒婆婆；人的仇敵就是自己家裡的人。","至於我，我要仰望耶和華，要等候那救我的神；我的神必應允我。","我的仇敵啊，不要向我誇耀。我雖跌倒，卻要起來；我雖坐在黑暗裡，耶和華卻作我的光。","我要忍受耶和華的惱怒；因我得罪了他，直等他為我辨屈，為我伸冤。他必領我到光明中；我必得見他的公義。","那時我的仇敵，就是曾對我說「耶和華－你神在哪裡」的，他一看見這事就被羞愧遮蓋。我必親眼見他遭報；他必被踐踏，如同街上的泥土。","以色列啊，日子必到，你的牆垣必重修；到那日，你的境界必開展。","當那日，人必從亞述，從埃及的城邑，從埃及到大河，從這海到那海，從這山到那山，都歸到你這裡。","然而，這地因居民的緣故，又因他們行事的結果，必然荒涼。","求耶和華在迦密山的樹林中，用你的杖牧放你獨居的民，就是你產業的羊群。求你容他們在巴珊和基列得食物，像古時一樣。","耶和華說：我要把奇事顯給他們看，好像出埃及地的時候一樣。","列國看見這事就必為自己的勢力慚愧；他們必用手摀口，掩耳不聽。","他們必舔土如蛇，又如土中腹行的物，戰戰兢兢地出他們的營寨。他們必戰懼投降耶和華，也必因我們的神而懼怕。","神啊，有何神像你，赦免罪孽，饒恕你產業之餘民的罪過，不永遠懷怒，喜愛施恩？","必再憐憫我們，將我們的罪孽踏在腳下，又將我們的一切罪投於深海。","你必按古時起誓應許我們列祖的話，向雅各發誠實，向亞伯拉罕施慈愛。"]},"blk":{"1":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דְּבַר־יְהוָה אֲשֶׁר הָיָה אֶל־מִיכָה הַמֹּרַשְׁתִּי בִּימֵי יוֹתָם אָחָז יְחִזְקִיָּה מַלְכֵי יְהוּדָה אֲשֶׁר־חָזָה עַל־שֹׁמְרוֹן וִירֽוּשָׁלִָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「當猶大王約坦、亞哈斯、希西家在位的時候，摩利沙人彌迦得耶和華的默示，論撒馬利亞和耶路撒冷。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>耶和華的話<\/td><td>דְּבַר<\/td><td>devar<\/td><td>H1697<\/td><td>話語、言語、事<\/td><\/tr><tr><td>彌迦<\/td><td>מִיכָה<\/td><td>mikhah<\/td><td>H4318<\/td><td>彌迦（誰像耶和華？）<\/td><\/tr><tr><td>摩利沙人<\/td><td>הַמֹּרַשְׁתִּי<\/td><td>hamorashti<\/td><td>H4183<\/td><td>摩利沙人（摩利沙，猶大西南的城鎮）<\/td><\/tr><tr><td>得默示<\/td><td>חָזָה<\/td><td>khazah<\/td><td>H2372<\/td><td>看見、得見異象<\/td><\/tr><tr><td>撒馬利亞<\/td><td>שֹׁמְרוֹן<\/td><td>shomron<\/td><td>H8111<\/td><td>撒馬利亞（北國首都）<\/td><\/tr><tr><td>耶路撒冷<\/td><td>וִירֽוּשָׁלִָֽם<\/td><td>virushalaim<\/td><td>H3389<\/td><td>耶路撒冷（南國首都）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>書的第一句<\/strong>：原文開頭是「耶和華的話」（devar-YHWH），不是「彌迦的話」。阿摩司書、耶利米書開頭都是「某某的話」；彌迦書第一個字，就把說話的權柄放回神那裡，人是領受的人。<\/p><p><strong>彌迦<\/strong>：這個名字的意思，是「誰像耶和華？」（mi-kha-yah 的短形）。全卷最後 7:18 以「有何神像你」收尾，用的正是同一個問句。書的開頭藏著名字，書的結尾回答名字。這是寫書的人用心的安排，經文沒有明說，我們只說它是一個可以聽見的呼應。<\/p><p><strong>「得默示」<\/strong>：khazah 字面是「看見」。先知看見的不是風景，是神對撒馬利亞與耶路撒冷的話。<\/p>","exp":"<p><strong>彌迦是摩利沙人。<\/strong>摩利沙在猶大西南的丘陵地帶，靠近非利士的迦特（1:14 稱「摩利設‧迦特」），離耶路撒冷有一段路。他不是京城的人，不是祭司，也沒有王宮的身分。這和阿摩司是提哥亞牧人同一個味道：神的話常常從邊緣的地方進來。一百年後，耶利米書 26 章 18 節還記得這個人：「猶大王希西家的時候，有摩利沙人彌迦對猶大眾人說預言」。一個鄉鎮裡的人，說的話被人記了一百年。<\/p><p><strong>三位王：約坦、亞哈斯、希西家。<\/strong>這三位王，橫跨了猶大從興旺、拜偶像，到改革的幾十年。北國撒馬利亞在希西家年間被亞述攻陷（王下 18:9–10），亞述王西拿基立後來又攻取猶大許多堅固城，直逼耶路撒冷（王下 18:13）。彌迦所說的審判，不是紙上談兵；他一生看見其中一部分發生。<\/p><p><strong>「論撒馬利亞和耶路撒冷」。<\/strong>他的話同時朝向北國與南國的首都。這一個順序很要緊：不是先說別人的罪，是先說首都的罪。首都，是一個國家掌權、拜神、定規矩的地方；神先看那裡。讀到這裡，我們就知道，這卷書不是要我們指著遠方的人說話，是要我們先低頭，看自己所在的「首都」：我的家、我的教會、我所在的位置。<\/p>"},{"a":2,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁמְעוּ עַמִּים כֻּלָּם הַקְשִׁיבִי אֶרֶץ וּמְלֹאָהּ וִיהִי אֲדֹנָי יְהוִה בָּכֶם לְעֵד אֲדֹנָי מֵהֵיכַל קָדְשֽׁוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「萬民哪，你們都要聽！地和其上所有的，也都要側耳而聽！主耶和華從他的聖殿要見證你們的不是。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>萬民<\/td><td>עַמִּים<\/td><td>ammim<\/td><td>H5971<\/td><td>眾民、各民族<\/td><\/tr><tr><td>側耳而聽<\/td><td>הַקְשִׁיבִי<\/td><td>haqshivi<\/td><td>H7181<\/td><td>留心聽、豎起耳朵<\/td><\/tr><tr><td>地<\/td><td>אֶרֶץ<\/td><td>erets<\/td><td>H776<\/td><td>地、大地<\/td><\/tr><tr><td>見證<\/td><td>לְעֵד<\/td><td>le-ed<\/td><td>H5707<\/td><td>作見證的、證人<\/td><\/tr><tr><td>主<\/td><td>אֲדֹנָי<\/td><td>adonay<\/td><td>H136<\/td><td>主（稱呼耶和華的尊稱）<\/td><\/tr><tr><td>聖殿<\/td><td>מֵהֵיכַל<\/td><td>mehekhal<\/td><td>H1964<\/td><td>從殿、從宮殿<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「萬民」<\/strong>：複數的 ammim，不是只有以色列。神把法庭開在全地面前。這一句和列王紀上 22 章 28 節，先知米該雅（Micaiah，名字與彌迦同源）所說的「眾民哪，你們都要聽」，用字相同。有人認為這是彌迦有意的回聲；經文沒有說，我們只指出這個相同。<\/p><p><strong>「你們」<\/strong>：原文 bakhem，可以讀作「against you」（要見證你們的不是），也可以讀作「among you」（在你們中間作見證）。和合本取前者。兩種讀法都說明神是證人，也是審判者。<\/p><p><strong>「聖殿」<\/strong>：hekhal 可指耶路撒冷的殿，也可指天上的宮殿。上下文 1:3 說「出了他的居所」，傾向指天上；兩種讀法並列，不影響全節的意思：證人，就站在最高的地方。<\/p>","exp":"<p><strong>這是一個法庭的開場。<\/strong>「你們都要聽」「側耳而聽」，是傳喚。被傳的是萬民，連地和其上所有的，也被叫來，因為整個受造界都要作這個案件的見證。接著是證人：主耶和華。證人不是旁觀的人，是起訴人，也是受害的一方：這些罪，都是對祂犯的。<\/p><p><strong>沒有人在場外。<\/strong>我們很容易讀成：神在責備某些人。可是原文是對「萬民」說話，所以我們每個人都在被傳喚的名單上。後面你會看到，神要把話說得最重的，是祂自己的百姓，也就是那些以為自己站在法庭對的那一邊的人。<\/p><p><strong>這一節要先問我們一個問題：我的耳朵，是不是已經在聽了？<\/strong>全卷第一個動詞「聽」（shama），之後在 3:1、3:9、6:1、6:2、6:9 一再出現，到 7:7 變成「我的神必應允（聽）我」。從「你們要聽」，走到「神聽我」，是這卷書的路。我們先從第一步開始：安靜，聽。<\/p>"},{"a":3,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּֽי־הִנֵּה יְהוָה יֹצֵא מִמְּקוֹמוֹ וְיָרַד וְדָרַךְ עַל־בָּמֳתֵי אָֽרֶץ׃ וְנָמַסּוּ הֶֽהָרִים תַּחְתָּיו וְהָעֲמָקִים יִתְבַּקָּעוּ כַּדּוֹנַג מִפְּנֵי הָאֵשׁ כְּמַיִם מֻגָּרִים בְּמוֹרָֽד׃<\/p><\/blockquote>","lit":"<blockquote><p>「看哪，耶和華出了他的居所，降臨步行地的高處。眾山在他以下必消化，諸谷必崩裂，如蠟化在火中，如水沖下山坡。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>出了<\/td><td>יֹצֵא<\/td><td>yotse<\/td><td>H3318<\/td><td>出來、出去<\/td><\/tr><tr><td>居所<\/td><td>מִמְּקוֹמוֹ<\/td><td>mimmeqomo<\/td><td>H4725<\/td><td>從他的地方、居所<\/td><\/tr><tr><td>降臨<\/td><td>וְיָרַד<\/td><td>veyarad<\/td><td>H3381<\/td><td>下來、降下<\/td><\/tr><tr><td>步行<\/td><td>וְדָרַךְ<\/td><td>vedarakh<\/td><td>H1869<\/td><td>踏、踐踏、行走<\/td><\/tr><tr><td>高處<\/td><td>בָּמֳתֵי<\/td><td>bamotei<\/td><td>H1116<\/td><td>高處、山崗<\/td><\/tr><tr><td>消化<\/td><td>וְנָמַסּוּ<\/td><td>venamassu<\/td><td>H4549<\/td><td>融化、消融<\/td><\/tr><tr><td>崩裂<\/td><td>יִתְבַּקָּעוּ<\/td><td>yitbaqqe-u<\/td><td>H1234<\/td><td>裂開、崩裂<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「出了」<\/strong>：原文是分詞 yotse，「正在出來」。這個動作還在進行，不是已經走完。這是全卷「出來」（yatsa）八次的第一次；最後一次是 7:15「好像出埃及地的時候」。<\/p><p><strong>「降臨步行地的高處」<\/strong>：兩個動詞並排，「下來」「踏」。「高處」（bamot）在舊約常指人所築的邱壇；5 節對猶大的控告，用的是同一個字根。神踏在地的高處，也要走到人所築的高處。<\/p><p><strong>「如蠟化在火中，如水沖下山坡」<\/strong>：兩個比喻，都是「再也維持不住原來的形狀」。這是神顯現時常見的圖像（士 5:4–5；詩 97:5；鴻 1:5），不是在描寫一場特定的地質災害，我們不用它對照任何一場今日的災難。<\/p>","exp":"<p><strong>「看哪」：全卷第一次翻轉。<\/strong>第 2 節是法庭，傳喚證人；第 3 節，證人自己動身了。神不是坐在遠處發佈判決，祂親自出了居所，親自走下來。我們習慣把審判想成「神在天上決定，人在地上受」；彌迦說的是：神親自走過來。<\/p><p><strong>山與谷，是人以為最穩的地方。<\/strong>山，是人安全、築城、築壇的地方；谷，是人居住、耕種的地方。山在祂腳下消融，谷在祂面前裂開，說的是：沒有一個人所倚靠的地方，是能站在祂面前的。這不是要嚇人，是在說明：真正穩的，只有一個。<\/p><p><strong>讀這兩節，很容易兩種偏差。<\/strong>一種是只看見怕：神出來了，大家快逃。另一種是只看見自然現象：這是一場地震、一場火山。彌迦要我們看見的，是第三個層次：祂為什麼出來？第 5 節馬上回答：「這都因雅各的罪過」。神的降臨，有一個理由，這個理由，是對著祂百姓說的。<\/p>"},{"a":5,"z":5,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בְּפֶשַׁע יַֽעֲקֹב כָּל־זֹאת וּבְחַטֹּאות בֵּית יִשְׂרָאֵל מִֽי־פֶשַׁע יַעֲקֹב הֲלוֹא שֹֽׁמְרוֹן וּמִי בָּמוֹת יְהוּדָה הֲלוֹא יְרוּשָׁלִָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「這都因雅各的罪過，以色列家的罪惡。雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎？猶大的邱壇在哪裡呢？豈不是在耶路撒冷嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>罪過<\/td><td>פֶשַׁע<\/td><td>pesha<\/td><td>H6588<\/td><td>過犯、悖逆、背叛<\/td><\/tr><tr><td>罪惡<\/td><td>וּבְחַטֹּאות<\/td><td>uvkhattot<\/td><td>H2403<\/td><td>罪、錯失、偏離<\/td><\/tr><tr><td>雅各<\/td><td>יַֽעֲקֹב<\/td><td>yaaqov<\/td><td>H3290<\/td><td>雅各（指北國、也指全以色列）<\/td><\/tr><tr><td>撒馬利亞<\/td><td>שֹֽׁמְרוֹן<\/td><td>shomron<\/td><td>H8111<\/td><td>撒馬利亞<\/td><\/tr><tr><td>邱壇<\/td><td>בָּמוֹת<\/td><td>bamot<\/td><td>H1116<\/td><td>高處、邱壇<\/td><\/tr><tr><td>耶路撒冷<\/td><td>יְרוּשָׁלִָֽם<\/td><td>yerushalaim<\/td><td>H3389<\/td><td>耶路撒冷<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「罪過」「罪惡」<\/strong>：pesha 是悖逆、背叛，是對權柄的反抗；khattat 是偏離、射不中靶。兩個字並排，說的是同一件事的兩面：離開了神所定的位置。<\/p><p><strong>「雅各」「以色列家」「猶大」<\/strong>：三個稱呼，在這裡交疊。有人把「雅各」專指北國，「猶大」指南國；但全卷的「雅各」「以色列」常常是指全體神的百姓（例如 3:1、3:9）。這裡我們依上下文：問題在於全民，兩個首都都被點名。<\/p><p><strong>「猶大的邱壇」<\/strong>：這是和合本依希伯來文（bamot）的譯法。七十士譯本等古譯本讀作「猶大的罪」（chattat），與前一句成工整的平行；兩種讀法，意思相差不遠：猶大的罪的源頭，也在耶路撒冷。<\/p>","exp":"<p><strong>神自己提問，自己回答。<\/strong>「雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎？」這是一個修辭問句，答案不留給別人猜。神不是要人去找替罪羊；祂指的是首都：北國的撒馬利亞，南國的耶路撒冷。這是這卷書最先落下來的重錘：問題不在邊疆，不在外國，在中心。<\/p><p><strong>耶路撒冷也在名單上。<\/strong>這句話，對當時的猶大人，一定很刺耳。他們可以接受撒馬利亞被審判；北國的拜偶像是人人都知道的事。可是，說耶路撒冷，說有聖殿的城，也是罪的起頭，就是另一回事了。這一節，在 3:12 還要再回來：「錫安必被耕種像一塊田。」<\/p><p><strong>這一節不是要我們比較誰的罪輕、誰的罪重。<\/strong>它是在說：神看的是中心。一個人、一個家庭、一間教會，若要被更新，不是先改邊緣，是先改中心：我們最靠近權力、最靠近敬拜、最靠近名聲的地方。<\/p>"},{"a":6,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְשַׂמְתִּי שֹׁמְרוֹן לְעִי הַשָּׂדֶה לְמַטָּעֵי כָרֶם וְהִגַּרְתִּי לַגַּי אֲבָנֶיהָ וִיסֹדֶיהָ אֲגַלֶּֽה׃ וְכָל־פְּסִילֶיהָ יֻכַּתּוּ וְכָל־אֶתְנַנֶּיהָ יִשָּׂרְפוּ בָאֵשׁ וְכָל־עֲצַבֶּיהָ אָשִׂים שְׁמָמָה כִּי מֵאֶתְנַן זוֹנָה קִבָּצָה וְעַד־אֶתְנַן זוֹנָה יָשֽׁוּבוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「所以我必使撒馬利亞變為田野的亂堆，又作為種葡萄之處；也必將她的石頭倒在谷中，露出根基來。她一切雕刻的偶像必被打碎；她所得的財物必被火燒；所有的偶像我必毀滅；因為是從妓女雇價所聚來的，後必歸為妓女的雇價。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>亂堆<\/td><td>לְעִי<\/td><td>le-i<\/td><td>H5856<\/td><td>廢墟堆、亂石堆<\/td><\/tr><tr><td>田野<\/td><td>הַשָּׂדֶה<\/td><td>hasadeh<\/td><td>H7704<\/td><td>田野<\/td><\/tr><tr><td>種葡萄之處<\/td><td>לְמַטָּעֵי<\/td><td>lemattae<\/td><td>H4302<\/td><td>栽種之處<\/td><\/tr><tr><td>雕刻的偶像<\/td><td>פְּסִילֶיהָ<\/td><td>pesileha<\/td><td>H6456<\/td><td>雕刻的像<\/td><\/tr><tr><td>雇價<\/td><td>אֶתְנַנֶּיהָ<\/td><td>etnanneha<\/td><td>H868<\/td><td>（妓女的）酬金、報酬<\/td><\/tr><tr><td>偶像<\/td><td>עֲצַבֶּיהָ<\/td><td>atsabbeha<\/td><td>H6091<\/td><td>偶像（原意：使人憂傷的東西）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「亂堆」<\/strong>：原文是 i（前面加了表示「成為」的 le），意思是一堆廢石。撒馬利亞建在山上，被毀的情景，是石頭被倒進山谷，連根基都露出來。<\/p><p><strong>「雕刻的偶像」「偶像」<\/strong>：兩個字都是拜偶像的稱呼。第二個字 atsab 與「憂傷」同字根，偶像最後使人憂傷。<\/p><p><strong>「從妓女雇價所聚來的，後必歸為妓女的雇價」<\/strong>：這句的細節難解。常見的讀法有二：（一）撒馬利亞廟宇所積存的財物，來自敬拜時奉獻的錢，這些財物將被擄去，用在別國的廟裡；（二）以此比喻以色列對耶和華不忠，如同行淫。兩種都與何西阿書的「淫亂」圖像相通（何 9:1）。本講義不下定論，只守住最穩的意思：靠不義與偶像積聚來的，不能長久。<\/p>","exp":"<p><strong>撒馬利亞的審判，用了三個畫面。<\/strong>第一個，是城變成田野裡的亂堆：人以為不會倒的京城，最後只剩石頭。第二個，是「種葡萄之處」：廢墟被人拿來耕種，歷史會繼續往前走，不再記念這座城。第三個，是石頭倒進山谷、露出根基：一切遮蓋都被拿走，從上面看見下面。<\/p><p><strong>被打碎的，是人所倚靠的東西。<\/strong>偶像、財物、雇價，這三樣是撒馬利亞所聚的。神說：「我必毀滅。」這一節，不是在說神喜歡破壞，是在說：人用不義與偶像所建立的，注定留不住。<\/p><p><strong>讀這段，我們可以問自己：我累積的，是什麼？<\/strong>不是只有金錢；包括名聲、資歷、人脈、人的稱讚。這些，在神面前能不能站得住？若是從神的祝福而來，神會保守；若是從不義與偶像而來，我們必須記得：它「後必歸為」它原來的地方。<\/p>"},{"a":8,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַל־זֹאת אֶסְפְּדָה וְאֵילִילָה אֵילְכָה שׁוֹלָל וְעָרוֹם אֶעֱשֶׂה מִסְפֵּד כַּתַּנִּים וְאֵבֶל כִּבְנוֹת יַעֲנָֽה׃ כִּי אֲנוּשָׁה מַכּוֹתֶיהָ כִּי־בָאָה עַד־יְהוּדָה נָגַע עַד־שַׁעַר עַמִּי עַד־יְרוּשָׁלִָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「先知說：因此我必大聲哀號，赤腳露體而行；又要呼號如野狗，哀鳴如鴕鳥。因為撒馬利亞的傷痕無法醫治，延及猶大和耶路撒冷我民的城門。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>哀號<\/td><td>אֶסְפְּדָה<\/td><td>espedah<\/td><td>H5594<\/td><td>哀哭、捶胸哀悼<\/td><\/tr><tr><td>呼號<\/td><td>וְאֵילִילָה<\/td><td>ve-eilelah<\/td><td>H3213<\/td><td>哀號、大聲呼喊<\/td><\/tr><tr><td>赤腳<\/td><td>שׁוֹלָל<\/td><td>sholal<\/td><td>H7758<\/td><td>赤腳、被剝去<\/td><\/tr><tr><td>露體<\/td><td>וְעָרוֹם<\/td><td>ve-arom<\/td><td>H6174<\/td><td>赤身<\/td><\/tr><tr><td>傷痕<\/td><td>מַכּוֹתֶיהָ<\/td><td>makkoteha<\/td><td>H4347<\/td><td>打傷、傷痕<\/td><\/tr><tr><td>無法醫治<\/td><td>אֲנוּשָׁה<\/td><td>anushah<\/td><td>H605<\/td><td>無法醫治的、沉重的<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「我必大聲哀號」<\/strong>：「先知說」是和合本加的，原文沒有，說話的人是誰，有兩種讀法：（一）彌迦自己；（二）神藉著先知說。兩種都說明：審判的宣告者，是流淚的人。<\/p><p><strong>「赤腳露體」<\/strong>：sholal 的意思有「赤腳」「被剝去」兩種讀法，ʿarom 是赤身。以賽亞也曾用相似的標誌行為（賽 20:2–3）。這是先知用身體作的記號，不是要人模仿；我們不需要、也不應該仿效。<\/p><p><strong>「無法醫治」<\/strong>：anushah，是「沉重到無法復原」，與耶利米書 30:12 的「傷痕」同一個字根。傷痕，指的是被亞述踐踏的撒馬利亞，還有「延及猶大」。<\/p>","exp":"<p><strong>宣告審判的人，自己先哭。<\/strong>這是彌迦書的底色：先知不是站在審判的外面，他站在中間。他說「我必哀號」，說「我必呼號如野狗，哀鳴如鴕鳥」；他所選的比喻，是曠野裡最孤獨的叫聲。他愛這些人，所以他為他們哭。<\/p><p><strong>傷痕「延及」。<\/strong>一開始是撒馬利亞的傷痕，接著「延及猶大和耶路撒冷我民的城門」。注意兩個字：「我民」。神在這裡，稱猶大的人為「我的民」；審判臨到的時候，神沒有改稱呼。審判，不是關係的結束。<\/p><p><strong>這一段，是給所有要說重話的人看的。<\/strong>我們若要指出一個人、一個團體的錯，彌迦給我們一面鏡子：我說完的時候，我是不是在哭？若我說話的時候心裡痛快，我說的，就不是彌迦說的那種話。<\/p>"},{"a":10,"z":12,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בְּגַת אַל־תַּגִּידוּ בָּכוֹ אַל־תִּבְכּוּ בְּבֵית לְעַפְרָה עָפָר הִתְפַּלָּֽשִׁי׃ עִבְרִי לָכֶם יוֹשֶׁבֶת שָׁפִיר עֶרְיָה־בֹשֶׁת לֹא יָֽצְאָה יוֹשֶׁבֶת צַֽאֲנָן מִסְפַּד בֵּית הָאֵצֶל יִקַּח מִכֶּם עֶמְדָּתֽוֹ׃ כִּֽי־חָלָֽה לְטוֹב יוֹשֶׁבֶת מָרוֹת כִּֽי־יָרַד רָע מֵאֵת יְהוָה לְשַׁעַר יְרוּשָׁלִָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「不要在迦特報告這事，總不要哭泣；我在伯‧亞弗拉滾於灰塵之中。沙斐的居民哪，你們要赤身蒙羞過去。撒南的居民不敢出來。伯‧以薛人的哀哭使你們無處可站。瑪律的居民心甚憂急，切望得好處，因為災禍從耶和華那裡臨到耶路撒冷的城門。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>迦特<\/td><td>בְּגַת<\/td><td>begat<\/td><td>H1661<\/td><td>迦特（與「報告」同音）<\/td><\/tr><tr><td>報告<\/td><td>תַּגִּידוּ<\/td><td>taggidu<\/td><td>H5046<\/td><td>告訴、報告<\/td><\/tr><tr><td>伯‧亞弗拉<\/td><td>בְּבֵית<\/td><td>beveit<\/td><td>H1036<\/td><td>伯‧亞弗拉（「灰塵之家」）<\/td><\/tr><tr><td>灰塵<\/td><td>עָפָר<\/td><td>afar<\/td><td>H6083<\/td><td>塵土<\/td><\/tr><tr><td>沙斐<\/td><td>שָׁפִיר<\/td><td>shafir<\/td><td>H8208<\/td><td>沙斐（「美麗」）<\/td><\/tr><tr><td>瑪律<\/td><td>מָרוֹת<\/td><td>marot<\/td><td>H4796<\/td><td>瑪律（「苦」）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>地名的雙關<\/strong>：10–16 節是一首「地名哀歌」，每個地名與動詞發音相近。例如「迦特」（Gat）與「報告」（taggidu）、「伯‧亞弗拉」（Aphrah）與「灰塵」（afar）、「沙斐」（美麗）與「赤身蒙羞」。和合本無法把雙關帶出來，我們在講解時把意思補上，不為任何一個地名的音譯作額外的神學推論。<\/p><p><strong>「總不要哭泣」<\/strong>：bakho 在原文與「亞割」（Acco）也近，有些學者讀作「不要在亞割哭泣」。這是希伯來文已知的另一種讀法，意思相同：不要讓外人看見。<\/p><p><strong>「沙斐的居民……赤身蒙羞」<\/strong>：「沙斐」是「美麗」，所以說：美麗的城，要赤身蒙羞，其中的反差，是整首詩的筆法。<\/p>","exp":"<p><strong>這是一份地圖。<\/strong>這幾個城鎮，大多在猶大西南的丘陵地帶，也就是彌迦的家鄉附近。亞述軍隊要從非利士平原進入猶大，這些城，是第一道門戶。彌迦一個一個點名，像是在念自己鄰居的名字。<\/p><p><strong>每一個名字，都在說同一件事：你的名字，就是你的命運。<\/strong>「美麗」要赤身蒙羞；「苦」切望好處；撒南（與「出去」音近）的居民卻不敢出來。這種筆法，不是為了文字遊戲，是為了讓聽的人，一個一個，在自己的名字裡看見自己。<\/p><p><strong>「災禍從耶和華那裡臨到耶路撒冷的城門」。<\/strong>12 節的最後一句，把地圖收攏到京城。外圍城鎮的哀號，是提早到的警報。災禍，是從耶和華那裡臨到；但要留意，是臨到「城門」，也就是審案、決定公平的地方（3:1 的首領，就坐在那裡）。<\/p>"},{"a":13,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ יוֹשֶׁבֶת לָכִישׁ רֵאשִׁית חַטָּאת הִיא לְבַת־צִיּוֹן כִּי־בָךְ נִמְצְאוּ פִּשְׁעֵי יִשְׂרָאֵֽל׃ לָכֵן תִּתְּנִי שִׁלּוּחִים עַל מוֹרֶשֶׁת גַּת בָּתֵּי אַכְזִיב לְאַכְזָב לְמַלְכֵי יִשְׂרָאֵֽל׃ עֹד הַיֹּרֵשׁ אָבִי לָךְ יוֹשֶׁבֶת מָֽרֵשָׁה עַד־עֲדֻּלָּם יָבוֹא כְּבוֹד יִשְׂרָאֵֽל׃ קָרְחִי וָגֹזִּי עַל־בְּנֵי תַּעֲנוּגָיִךְ הַרְחִבִי קָרְחָתֵךְ כַּנֶּשֶׁר כִּי גָלוּ מִמֵּֽךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「拉吉的居民哪，要用快馬套車；錫安民的罪由你而起；以色列人的罪過在你那裡顯出。猶大啊，你要將禮物送給摩利設‧迦特。亞革悉的眾族必用詭詐待以色列諸王。瑪利沙的居民哪，我必使那奪取你的來到你這裡；以色列的尊貴人必到亞杜蘭。猶大啊，要為你所喜愛的兒女剪除你的頭髮，使頭光禿，要大大地光禿，如同禿鷹，因為他們都被擄去離開你。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>拉吉<\/td><td>לָכִישׁ<\/td><td>lakhish<\/td><td>H3923<\/td><td>拉吉（猶大的堅城）<\/td><\/tr><tr><td>快馬<\/td><td>לָרֶכֶשׁ<\/td><td>larekhesh<\/td><td>H7409<\/td><td>駿馬、快馬<\/td><\/tr><tr><td>罪的起頭<\/td><td>רֵאשִׁית<\/td><td>reshit<\/td><td>H7225<\/td><td>起頭、首先<\/td><\/tr><tr><td>錫安民<\/td><td>לְבַת<\/td><td>levat<\/td><td>H1323<\/td><td>錫安的女子、錫安的民<\/td><\/tr><tr><td>摩利設‧迦特<\/td><td>מוֹרֶשֶׁת<\/td><td>moreshet<\/td><td>H4182<\/td><td>摩利設（摩利沙，彌迦的家鄉）<\/td><\/tr><tr><td>被擄<\/td><td>גָלוּ<\/td><td>galu<\/td><td>H1540<\/td><td>被擄、離開、赤露<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「要用快馬套車」<\/strong>：lakhish 與 larekhesh（駿馬）發音相近。拉吉是猶大南部重要的軍事城，有戰車與騎兵。「罪的起頭」可能與倚靠馬匹與戰車有關（參 賽 31:1）；經文沒有說明，我們只說它與軍事倚靠的圖像相通。<\/p><p><strong>「摩利設‧迦特」<\/strong>：Moresheth-gath，就是彌迦的家鄉。他叫猶大把「禮物」（shilluchim，也有「離別的禮物」之意）送給它，像出嫁的女兒離開娘家。這句話，說的是他自己的家鄉要被奪去。<\/p><p><strong>「如同禿鷹」<\/strong>：nesher 一般譯作「鷹」，這裡指頭部光禿的大型鳥類（如禿鷲）。剃頭是哀悼的記號（參 伯 1:20；耶 7:29）。<\/p>","exp":"<p><strong>最後三個城，是最近的。<\/strong>拉吉、摩利沙、瑪利沙、亞杜蘭，都是離彌迦的家最近的地方。亞革悉「必用詭詐待以色列諸王」，指的是它的名字（Achzib，與「欺騙」同字根）：被人倚靠的，最後成了幻象。<\/p><p><strong>「摩利設‧迦特」是最痛的一句。<\/strong>彌迦的家鄉，在名單裡。他不是從京城的高處在論斷外鄉，他是在念自己家門前的名字。你說的話，若傷害到你自己的家，你的話，就有了重量。<\/p><p><strong>末了，是母親的哀歌。<\/strong>「為你所喜愛的兒女剪除你的頭髮」。剃頭，是中東哀悼的記號；「要大大地光禿」，因為孩子被擄去，離開了。一個為孩子哀哭的母親，是全章最後的畫面。神的審判，終點不是毀滅的場面，是一個人為自己的孩子哭。這個畫面，要在 7:8 的「我雖跌倒，卻要起來」再次出現，只是方向換了。<\/p>"}],"2":[{"a":1,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹי חֹֽשְׁבֵי־אָוֶן וּפֹעֲלֵי רָע עַל־מִשְׁכְּבוֹתָם בְּאוֹר הַבֹּקֶר יַעֲשׂוּהָ כִּי יֶשׁ־לְאֵל יָדָֽם׃ וְחָמְדוּ שָׂדוֹת וְגָזָלוּ וּבָתִּים וְנָשָׂאוּ וְעָֽשְׁקוּ גֶּבֶר וּבֵיתוֹ וְאִישׁ וְנַחֲלָתֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「禍哉，那些在床上圖謀罪孽、造作奸惡的！天一發亮，因手有能力就行出來了。他們貪圖田地就佔據，貪圖房屋便奪取；他們欺壓人，霸佔房屋和產業。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禍哉<\/td><td>הוֹי<\/td><td>hoy<\/td><td>H1945<\/td><td>哀哉、禍哉（葬禮上的呼聲）<\/td><\/tr><tr><td>圖謀<\/td><td>חֹֽשְׁבֵי<\/td><td>khoshevei<\/td><td>H2803<\/td><td>籌劃、設計<\/td><\/tr><tr><td>罪孽<\/td><td>אָוֶן<\/td><td>aven<\/td><td>H205<\/td><td>罪孽、禍害<\/td><\/tr><tr><td>在床上<\/td><td>מִשְׁכְּבוֹתָם<\/td><td>mishkevotam<\/td><td>H4904<\/td><td>他們的床、臥榻<\/td><\/tr><tr><td>貪圖<\/td><td>וְחָמְדוּ<\/td><td>vekhamedu<\/td><td>H2530<\/td><td>貪戀、貪圖<\/td><\/tr><tr><td>產業<\/td><td>וְנַחֲלָתֽוֹ<\/td><td>venakhalato<\/td><td>H5159<\/td><td>（祖傳的）產業、地業<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「禍哉」<\/strong>：hoy 是先知書的呼聲，本來是葬禮上的「哀哉」。先知對這些人說「哀哉」，等於在他們還活著的時候，先為他們舉哀。<\/p><p><strong>四個動詞串成一條鏈<\/strong>：「貪圖」（khamad）、「佔據」（gazal）、「奪取」（nasa）、「欺壓」（ashaq）。第一個動詞，與十誡的「不可貪戀」（出 20:17）是同一個字：罪，從心裡的貪戀開始，經過一步一步，落成行動。<\/p><p><strong>「因手有能力」<\/strong>：原文是「因為手裡有力量（el）」，是一句成語，意思是：他們做得到，所以就做。能力，被當成了權利。<\/p>","exp":"<p><strong>罪在夜裡開始。<\/strong>「在床上圖謀」，是說這件事不是衝動，是一夜一夜的計算；「天一發亮就行出來」，是說只要天亮，就動手。這是一種有計畫、有耐性的惡。彌迦沒有說他們脾氣壞，他說他們失眠，是為了籌算別人的田地。<\/p><p><strong>被奪走的，是「產業」。<\/strong>在以色列，田地不是商品，是神分給每一個家族的產業（書 13–19 章；利 25:23：「地是我的」）。列王紀上 21 章，拿伯的葡萄園，是這一節的活例：亞哈說要買，拿伯說這是我祖宗的產業，不能賣；後面的事，是用法律的名義奪取。彌迦的時代，許多這樣的事，正在大規模地發生。<\/p><p><strong>「因手有能力」，是這一章要我們學的第一句話。<\/strong>能力本身不是罪；罪，是把「我做得到」，當成「我可以」。這是 321 所說的驕傲：離開本位，抓住不屬於自己的權力。你在哪個位置，有「手有能力」的時候？在家裡、公司、教會？天一亮，你做的第一件事，是什麼？<\/p>"},{"a":3,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לָכֵן כֹּה אָמַר יְהוָה הִנְנִי חֹשֵׁב עַל־הַמִּשְׁפָּחָה הַזֹּאת רָעָה אֲשֶׁר לֹֽא־תָמִישׁוּ מִשָּׁם צַוְּארֹֽתֵיכֶם וְלֹא תֵֽלְכוּ רוֹמָה כִּי עֵת רָעָה הִֽיא׃ בַּיּוֹם הַהוּא יִשָּׂא עֲלֵיכֶם מָשָׁל וְנָהָה נְהִי נִֽהְיָה אָמַר שָׁדוֹד נְשַׁדֻּנוּ חֵלֶק עַמִּי יָמִיר אֵיךְ יָמִישׁ לִי לְשׁוֹבֵב שָׂדֵינוּ יְחַלֵּֽק׃ לָכֵן לֹֽא־יִֽהְיֶה לְךָ מַשְׁלִיךְ חֶבֶל בְּגוֹרָל בִּקְהַל יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「所以耶和華如此說：我籌劃災禍降與這族；這禍在你們的頸項上不能解脫；你們也不能昂首而行，因為這時勢是惡的。到那日，必有人向你們提起悲慘的哀歌，譏刺說：我們全然敗落了！耶和華將我們的分轉歸別人，何竟使這分離開我們？他將我們的田地分給悖逆的人。所以在耶和華的會中，你必沒有人拈鬮拉準繩。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>籌劃<\/td><td>חֹשֵׁב<\/td><td>khoshev<\/td><td>H2803<\/td><td>籌劃、設計（與 2:1 同字）<\/td><\/tr><tr><td>災禍<\/td><td>רָעָה<\/td><td>raah<\/td><td>H7451<\/td><td>災禍、惡<\/td><\/tr><tr><td>這族<\/td><td>הַמִּשְׁפָּחָה<\/td><td>hamishpakhah<\/td><td>H4940<\/td><td>這個家族、族類<\/td><\/tr><tr><td>頸項<\/td><td>צַוְּארֹֽתֵיכֶם<\/td><td>tsavverotekhem<\/td><td>H6677<\/td><td>你們的頸項<\/td><\/tr><tr><td>哀歌<\/td><td>נְהִי<\/td><td>nehi<\/td><td>H5092<\/td><td>哀歌、哀號<\/td><\/tr><tr><td>拈鬮<\/td><td>בְּגוֹרָל<\/td><td>begoral<\/td><td>H1486<\/td><td>藉著鬮、抽籤<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>同一個動詞<\/strong>：2:1 的「圖謀」（khoshev）和這裡的「籌劃」，是同一個字。他們在床上籌劃惡事，耶和華也在籌劃一件事：用他們所用的字，回答他們。<\/p><p><strong>「這族」<\/strong>：mishpakhah 是家族、宗族。神稱他們為「這族」，不是「我的民」；稱呼拉開了距離，但是 2:12 又回來說「雅各家」。<\/p><p><strong>「分給悖逆的人」<\/strong>：shovev 可以是「悖逆者」「背叛的人」，也可以讀作「（奪走的）征服者」。和合本取前者。兩種都說明：田地，落入了不屬於神百姓的人手中。<\/p>","exp":"<p><strong>神也籌劃。<\/strong>前一段說人籌劃禍害，這一段，神說：「我籌劃災禍降與這族。」神不是旁觀者，祂在回應。這是公義的對稱：他們怎樣量給別人，神怎樣量給他們（參 太 7:2）。<\/p><p><strong>他們也不能昂首而行。<\/strong>「頸項」「昂首」，是驕傲的樣子；而「這禍在你們的頸項上不能解脫」，是軛。他們用手奪來的，最後套在自己頸項上。到了第四節，奪人田地的人，要在別人的嘲笑歌裡，唱：「我們全然敗落了！」<\/p><p><strong>最痛的一句，是第 5 節。<\/strong>「在耶和華的會中，你必沒有人拈鬮拉準繩」。在以色列，田地是用抽籤分配的（書 18:6–10），那是神的會眾分產業的方式。彌迦說：將來重新分配的時候，奪田的人，沒有分。不是神不公平，是他們已經選擇了離開神的會。<\/p>"},{"a":6,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אַל־תַּטִּפוּ יַטִּיפוּן לֹֽא־יַטִּפוּ לָאֵלֶּה לֹא יִסַּג כְּלִמּֽוֹת׃ הֶאָמוּר בֵּֽית־יַעֲקֹב הֲקָצַר רוּחַ יְהוָה אִם־אֵלֶּה מַעֲלָלָיו הֲלוֹא דְבָרַי יֵיטִיבוּ עִם הַיָּשָׁר הוֹלֵֽךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「他們說：你們不可說預言；不可向這些人說預言，不住地羞辱我們。雅各家啊，豈可說耶和華的心不忍耐嗎？這些事是他所行的嗎？我－耶和華的言語豈不是與行動正直的人有益嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>說預言<\/td><td>תַּטִּפוּ<\/td><td>tattifu<\/td><td>H5197<\/td><td>滴下、說預言<\/td><\/tr><tr><td>羞辱<\/td><td>כְּלִמּֽוֹת<\/td><td>kelimmot<\/td><td>H3639<\/td><td>羞辱、侮辱<\/td><\/tr><tr><td>雅各家<\/td><td>בֵּֽית<\/td><td>beit<\/td><td>H1004<\/td><td>家<\/td><\/tr><tr><td>不忍耐<\/td><td>הֲקָצַר<\/td><td>haqatsar<\/td><td>H7114<\/td><td>縮短了嗎、不耐煩嗎<\/td><\/tr><tr><td>言語<\/td><td>דְבָרַי<\/td><td>devarai<\/td><td>H1697<\/td><td>我的話<\/td><\/tr><tr><td>正直人<\/td><td>הַיָּשָׁר<\/td><td>hayashar<\/td><td>H3477<\/td><td>正直的人<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「說預言」<\/strong>：原文是「滴下」（natap），用來形容口裡滴出話語，這個說法在阿摩司書（摩 7:16）、以西結書（結 21:2）也用來指說預言。這一節的說話者是誰，兩種讀法：（一）和合本：這是人對彌迦說：「你們不可說預言」；（二）也有人讀作彌迦在引述他們的話，再回應。<\/p><p><strong>「耶和華的心不忍耐嗎」<\/strong>：qetsar ruakh，字面是「靈（氣）短」，在希伯來文裡指不耐煩（出 6:9；民 21:4）。有人問：神的靈短了嗎？也有人讀為：神的氣息縮短了嗎？意思相近：神是不是不耐煩了？<\/p><p><strong>「行動正直」<\/strong>：「正直」（yashar）在 3:9 也出現，是「彎曲」（3:9 的「屈枉」）的相反。<\/p>","exp":"<p><strong>這是先知與聽眾的對話。<\/strong>有人說：不要說預言，不要說這些，我們被你羞辱了。他們不是不信，他們是不要聽；他們認為，一個真正屬神的人，不應該說這樣的話。<\/p><p><strong>彌迦的回答，有兩個問題。<\/strong>第一，「豈可說耶和華的心不忍耐嗎？」你們以為神是不耐煩，所以才有這些重話？第二，「這些事是他所行的嗎？」這些審判，是神任性行出來的嗎？在 2:7 第二半，他說：「我的言語，豈不是與行動正直的人有益嗎？」神的話，從來不是為了傷人；對行走正直的人，神的話是益處。<\/p><p><strong>我們可以對自己說：我不喜歡聽的話，是不是都是「羞辱」？<\/strong>有一種話，是為了毀壞人；另一種話，是為了挽回人。要分辨，不是看話的輕重，是看說話的人，是不是在流淚（1:8），並且這些話，是不是領人回到行走正直的路上。<\/p>"},{"a":8,"z":9,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאֶתְמוּל עַמִּי לְאוֹיֵב יְקוֹמֵם מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן מֵעֹבְרִים בֶּטַח שׁוּבֵי מִלְחָמָֽה׃ נְשֵׁי עַמִּי תְּגָרְשׁוּן מִבֵּית תַּֽעֲנֻגֶיהָ מֵעַל עֹֽלָלֶיהָ תִּקְחוּ הֲדָרִי לְעוֹלָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「然而，近來我的民興起如仇敵，從那些安然經過不願打仗之人身上剝去外衣。你們將我民中的婦人從安樂家中趕出，又將我的榮耀從她們的小孩子盡行奪去。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>仇敵<\/td><td>לְאוֹיֵב<\/td><td>leoyev<\/td><td>H341<\/td><td>仇敵<\/td><\/tr><tr><td>興起<\/td><td>יְקוֹמֵם<\/td><td>yeqomem<\/td><td>H6965<\/td><td>起來、興起<\/td><\/tr><tr><td>外衣<\/td><td>שַׂלְמָה<\/td><td>salmah<\/td><td>H8008<\/td><td>外袍、衣服<\/td><\/tr><tr><td>安然<\/td><td>בֶּטַח<\/td><td>betakh<\/td><td>H983<\/td><td>安穩、安然無懼<\/td><\/tr><tr><td>小孩子<\/td><td>עֹֽלָלֶיהָ<\/td><td>olaleha<\/td><td>H5768<\/td><td>嬰孩、幼兒<\/td><\/tr><tr><td>榮耀<\/td><td>הֲדָרִי<\/td><td>hadari<\/td><td>H1926<\/td><td>我的榮美、威榮<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「我的民興起如仇敵」<\/strong>：yeqomem 是「起來」，在這裡是敵對的意思。神的百姓，對自己的人，做了仇敵才會做的事。<\/p><p><strong>「剝去外衣」<\/strong>：salmah 是外袍，在窮人手上，往往是唯一的外衣；按律法，拿它作當頭，晚上必須歸還（出 22:26–27）。這一節說的是：連這個最低的保障，也被剝去。<\/p><p><strong>「我的榮耀」<\/strong>：hadari 的所指，有兩種讀法：（一）神所賜給孩子的尊嚴與產業；（二）孩子生在神的百姓中，本該有的「神的榮美」。和合本取「榮耀」，我們兩種並列，意思重疊：孩子的未來，被拿走。<\/p>","exp":"<p><strong>被欺壓的人，是誰？<\/strong>「安然經過、不願打仗的人」，是沒有防備的人；「我民中的婦人」，是失去丈夫、失去房屋的婦人；「小孩子」，是沒有聲音的人。彌迦把鏡頭，從田地，轉到人：奪走田地的後果，是婦人被趕出家，孩子失去未來。<\/p><p><strong>神說：這是「我的民」。<\/strong>被欺壓的人是「我的民」，欺壓的人，也是「我的民」，神在這裡，兩邊都稱「我的民」，因此心更痛。這是一個家庭裡，兄弟互相作了仇敵的圖像。<\/p><p><strong>最後一句：「將我的榮耀從她們的小孩子盡行奪去」。<\/strong>孩子身上，有神的榮耀。奪走孩子的未來，就是奪走神放在他們身上的東西。這樣看，孩子，不是「家庭的附屬品」，是被神看重的。傷害他們，是傷害神所看重的。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>קוּמוּ וּלְכוּ כִּי לֹא־זֹאת הַמְּנוּחָה בַּעֲבוּר טָמְאָה תְּחַבֵּל וְחֶבֶל נִמְרָֽץ׃ לוּ־אִישׁ הֹלֵךְ רוּחַ וָשֶׁקֶר כִּזֵּב אַטִּף לְךָ לַיַּיִן וְלַשֵּׁכָר וְהָיָה מַטִּיף הָעָם הַזֶּֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們起來去吧！這不是你們安息之所；因為污穢使人毀滅，而且大大毀滅。若有人心存虛假，用謊言說：我要向你們預言得清酒和濃酒。那人就必作這民的先知。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>起來<\/td><td>קוּמוּ<\/td><td>qumu<\/td><td>H6965<\/td><td>起來<\/td><\/tr><tr><td>安息之所<\/td><td>הַמְּנוּחָה<\/td><td>hamenuchah<\/td><td>H4496<\/td><td>安息、安歇的地方<\/td><\/tr><tr><td>污穢<\/td><td>טָמְאָה<\/td><td>tum-ah<\/td><td>H2930<\/td><td>污穢、不潔<\/td><\/tr><tr><td>毀滅<\/td><td>תְּחַבֵּל<\/td><td>tekhabbel<\/td><td>H2254<\/td><td>毀壞、傷害<\/td><\/tr><tr><td>虛假<\/td><td>וָשֶׁקֶר<\/td><td>vasheqer<\/td><td>H8267<\/td><td>虛假、謊言<\/td><\/tr><tr><td>清酒<\/td><td>לַיַּיִן<\/td><td>layayin<\/td><td>H3196<\/td><td>酒<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「安息之所」<\/strong>：menukhah 是「安息」，申命記 12:9 說，進入迦南地，是「安息」的開始；詩篇 95:11 也提到進入神的安息。這裡卻說：這地，不再是你們的安息之所。<\/p><p><strong>「污穢使人毀滅」<\/strong>：tum-ah 是儀式與道德上的不潔；在利未記，污穢使土地「吐出」居民（利 18:24–28）。污穢使人和土地都毀壞，因為神與污穢無法同住。<\/p><p><strong>「心存虛假」<\/strong>：原文「行在風與謊言中」（holekh ruakh vasheqer），意思是一個說空話、說謊的人。這是一句帶諷刺的話：如果有一個人，專說你們愛聽的，這人就是你們的先知。<\/p>","exp":"<p><strong>「你們起來去吧」，是被驅逐的聲音。<\/strong>神給了這地，叫作「安息」，是一份禮物；人把這份禮物，用不義弄髒了，神說：這不再是你們的安息。一塊地方變成不是安息的原因，不是神變了，是人用污穢，使地不能安息。<\/p><p><strong>第 11 節，是一句帶刺的話。<\/strong>神說：如果有人專門說你們愛聽的話，「我要向你們預言得清酒和濃酒」，這個人，才是你們心目中的先知。彌迦在這裡，揭開了一個真相：這個社會，不是缺少先知，是想要一種不會刺人的先知。<\/p><p><strong>我們也要問自己：我喜歡什麼樣的先知？<\/strong>說話使我安慰的人，與說話使我悔改的人，並不總是同一個人。分辨的辦法，不是看哪一個我比較喜歡，而是看哪一個，把我帶向耶穌。<\/p>"},{"a":12,"z":13,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָסֹף אֶאֱסֹף יַעֲקֹב כֻּלָּךְ קַבֵּץ אֲקַבֵּץ שְׁאֵרִית יִשְׂרָאֵל יַחַד אֲשִׂימֶנּוּ כְּצֹאן בָּצְרָה כְּעֵדֶר בְּתוֹךְ הַדָּֽבְרוֹ תְּהִימֶנָה מֵאָדָֽם׃ עָלָה הַפֹּרֵץ לִפְנֵיהֶם פָּֽרְצוּ וַֽיַּעֲבֹרוּ שַׁעַר וַיֵּצְאוּ בוֹ וַיַּעֲבֹר מַלְכָּם לִפְנֵיהֶם וַיהוָה בְּרֹאשָֽׁם׃<\/p><\/blockquote>","lit":"<blockquote><p>「雅各家啊，我必要聚集你們，必要招聚以色列剩下的人，安置在一處，如波斯拉的羊，又如草場上的羊群；因為人數眾多就必大大喧嘩。開路的在他們前面上去；他們直闖過城門，從城門出去。他們的王在前面行；耶和華引導他們。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>聚集<\/td><td>אָסֹף<\/td><td>asof<\/td><td>H622<\/td><td>聚集（不定詞加強語氣）<\/td><\/tr><tr><td>招聚<\/td><td>קַבֵּץ<\/td><td>qabbets<\/td><td>H6908<\/td><td>招聚、聚集<\/td><\/tr><tr><td>剩下的人<\/td><td>שְׁאֵרִית<\/td><td>sheerit<\/td><td>H7611<\/td><td>餘民、剩下的<\/td><\/tr><tr><td>羊群<\/td><td>כְּעֵדֶר<\/td><td>keeder<\/td><td>H5739<\/td><td>羊群<\/td><\/tr><tr><td>開路的<\/td><td>הַפֹּרֵץ<\/td><td>happorets<\/td><td>H6555<\/td><td>開路的、衝破的<\/td><\/tr><tr><td>耶和華<\/td><td>וַיהוָה<\/td><td>vayhwh<\/td><td>H3068<\/td><td>耶和華<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>「必要聚集」<\/strong>：原文用不定詞加強語氣（asof e'esof），是「我必定聚集」。連用兩次（asof、qabbets），一節裡共四個「聚」的動詞，是「聚集」（qabats／asaf）全卷的高峰。<\/p><p><strong>「剩下的人」<\/strong>：sheerit，這是全卷五次的「餘民」第一次（2:12；4:7；5:7、8；7:18）。<\/p><p><strong>「開路的」<\/strong>：happorets 的字面是「衝破者」，是衝破圍牆、衝出門的人。這個人是誰？有人讀為王，有人讀為神自己，有人讀為彌賽亞（猶太傳統及教父時代的詮釋有此一說）；經文接著說「他們的王在前面行；耶和華引導他們」。我們不說「這就是耶穌」，只說：新約讀這卷書的人，後來在耶穌身上，看見這位走在前面的牧者。<\/p>","exp":"<p><strong>全章最大的一次轉折。<\/strong>一路讀來，全是控告：貪圖、佔據、欺壓、驅逐；第 12 節忽然說：「我必要聚集你們。」學者對這一轉折有不同看法：有人認為是後來的編者加入；也有人讀為：這仍是審判（聚集如羊被趕入圈）。和合本與傳統，讀作應許。本講義依這個讀法，並看見它與 4:6–7、5:7–8、7:18–20 同聲。<\/p><p><strong>主詞是「我」。<\/strong>不是「你們要聚集」，是「我必要聚集」。羊群散了，牧人親自去招聚。四個動詞，說的是同一個意思：神不放棄。<\/p><p><strong>聚集的方向是「出去」。<\/strong>開路的上去；他們直闖過城門，從城門出去；他們的王在前面行；耶和華引導他們。這是一幅出埃及的畫面（參 7:15）：被圍困的，被帶出來；被趕出的，被帶領。<strong>「耶和華引導他們」，是全章最後一句，也是最大的安慰。<\/strong><\/p>"}],"3":[{"a":1,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וָאֹמַר שִׁמְעוּ־נָא רָאשֵׁי יַעֲקֹב וּקְצִינֵי בֵּית יִשְׂרָאֵל הֲלוֹא לָכֶם לָדַעַת אֶת־הַמִּשְׁפָּֽט׃ שֹׂנְאֵי טוֹב וְאֹהֲבֵי רָע גֹּזְלֵי עוֹרָם מֵֽעֲלֵיהֶם וּשְׁאֵרָם מֵעַל עַצְמוֹתָֽם׃ וַאֲשֶׁר אָכְלוּ שְׁאֵר עַמִּי וְעוֹרָם מֵעֲלֵיהֶם הִפְשִׁיטוּ וְאֶת־עַצְמֹֽתֵיהֶם פִּצֵּחוּ וּפָרְשׂוּ כַּאֲשֶׁר בַּסִּיר וּכְבָשָׂר בְּתוֹךְ קַלָּֽחַת׃ אָז יִזְעֲקוּ אֶל־יְהוָה וְלֹא יַעֲנֶה אוֹתָם וְיַסְתֵּר פָּנָיו מֵהֶם בָּעֵת הַהִיא כַּאֲשֶׁר הֵרֵעוּ מַעַלְלֵיהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「我說：雅各的首領，以色列家的官長啊，你們要聽！你們不當知道公平嗎？你們惡善好惡，從人身上剝皮，從人骨頭上剔肉，吃我民的肉，剝他們的皮，打折他們的骨頭，分成塊子像要下鍋，又像釜中的肉。到了遭災的時候，這些人必哀求耶和華，他卻不應允他們。那時他必照他們所行的惡事向他們掩面。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>首領<\/td><td>רָאשֵׁי<\/td><td>rashei<\/td><td>H7218<\/td><td>頭、首領<\/td><\/tr><tr><td>官長<\/td><td>וּקְצִינֵי<\/td><td>uqtsinei<\/td><td>H7101<\/td><td>官長、審判官<\/td><\/tr><tr><td>公平<\/td><td>הַמִּשְׁפָּֽט<\/td><td>hamishpat<\/td><td>H494
