善的文士和法利賽人有禍了。"],["p","祂是真正，行公義的人。"],["p","祂是真正，好憐憫的人。"],["p","祂是真正，與神同行的人。"],["p","祂說，我與父原為一。"],["p","祂不是，要我們，努力達到，一個標準。"],["p","祂是，在我們裡面活出來。"],["p","祂是我們的榜樣。"],["p","祂的公義，有憐憫。"],["p","祂的憐憫，不縱容罪。"],["p","這裡，也有321的信息。"],["p","有己的生命，要用，自己的善，來站立。"],["p","要證明，我很好。"],["p","這是驕傲，離開本位，抓住權力，想要代替神。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","善，不是我的成就。"],["p","是神已經指示我，而我，願意同行。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我能公義，也有憐憫。"],["p","能謙卑，也不軟弱。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，不是一群，很會說漂亮話的人。"],["p","是一群，手上的秤，是公平的人。"],["p","是一群，與神同行的人。"],["p","我們不用，獻很多。"],["p","我們只要，行公義，好憐憫，存謙卑。"],["p","大家的焦點，都在耶穌，不在自己的善。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，不是用審判，開始跟我們說話。"],["p","謝謝祢，先問我們，祢向我們做了什麼。"],["p","謝謝祢，已經指示我們，何為善。"],["p","求祢，使我們記得，祢領我們出來的恩典。"],["p","求祢，使我們手上的秤，是公平的。"],["p","求祢，使我們，每一天，與祢同行。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"7":{"min":12,"blocks":[["h","《有何神像你》"],["p","弟兄姊妹平安。"],["p","今天我們讀彌迦書第七章。"],["p","先問一個問題。"],["p","你有沒有，在一個很黑的夜裡，醒著？"],["p","沒有燈。"],["p","沒有聲音。"],["p","你躺在床上，一個人。"],["p","心裡有一件事，轉來轉去。"],["p","也許，是一個，你放不下的人。"],["p","也許，是一個，你無法面對的明天。"],["p","你想，天什麼時候，才會亮。"],["p","有一種夜，不是因為，沒有太陽。"],["p","是因為，你的心裡，一點光，也沒有。"],["p","彌迦書第七章，就在這樣的夜裡，開始。"],["p","可是，很奇妙。"],["p","這也是，整卷書，最亮的一章。"],["p","我們分三個部分來讀。"],["p","第一，哀哉。"],["p","第二，仰望。"],["p","第三，有何神像你。"],["h","一、哀哉"],["p","先看第一節。"],["q","哀哉！我好像夏天的果子已被收盡，又像摘了葡萄所剩下的，沒有一掛可吃的；我心羨慕初熟的無花果。（彌7:1）"],["p","哀哉。"],["p","前面六章，彌迦在對別人說話。"],["p","現在，他轉向自己。"],["p","這是一個人的哀歌。"],["p","夏天的果子，已經，被收盡了。"],["p","葡萄園，只剩下，摘剩的。"],["p","連一串可吃的，也沒有。"],["p","他的心，還在羨慕，初熟的無花果。"],["p","你看，這是一個，什麼樣的人？"],["p","一個，還在盼望，卻看見，眼前什麼都沒有的人。"],["q","地上虔誠人滅盡；世間沒有正直人；各人埋伏，要殺人流血，都用網羅獵取弟兄。（彌7:2）"],["p","虔誠人，滅盡了。"],["p","這不是說，所有的人，真的都死了。"],["p","這是一個人，最孤單的感覺。"],["p","看出去，沒有一個，可以信的人。"],["p","然後，最痛的幾句話，來了。"],["q","不要倚賴鄰舍；不要信靠密友。要守住你的口；不要向你懷中的妻提說。（彌7:5）"],["p","連鄰舍，不能倚賴。"],["p","連密友，不能信靠。"],["p","連懷中的妻子，也要小心說話。"],["p","這是一個，信任崩潰的社會。"],["p","這樣的世界，一個人，最孤單的時候，不是在曠野。"],["p","是在家裡。"],["p","是在，餐桌上。"],["q","因為，兒子藐視父親；女兒抗拒母親；媳婦抗拒婆婆；人的仇敵就是自己家裡的人。（彌7:6）"],["p","這一節，我們要，特別小心。"],["p","也許，有的弟兄姊妹，在家裡，真的，受過傷。"],["p","有人，被最親的人，背叛過。"],["p","有人，在家裡，沒有安全感。"],["p","我要先說一句。"],["p","讀到這裡，我們不要，對任何人說，你要原諒。"],["p","你要忍耐。"],["p","經文，沒有要受害的人，留在危險裡。"],["p","經文，只是承認，這樣的痛，是真的。"],["p","有時候，陪伴，比說教，重要。"],["p","還有一件事，我們要說清楚。"],["p","彌迦，沒有說，你要去恨家人。"],["p","他描寫的，是一個壞掉的世界。"],["p","耶穌，後來也引用這一句。"],["p","祂的意思是，跟從我，有時，要付上關係的代價。"],["p","可是，祂沒有，叫任何人，去傷害家人。"],["p","還有一件事，我想你注意。"],["p","在第七節以前，有六節，全是哀歌。"],["p","神，沒有叫先知，跳過這六節。"],["p","有些痛，需要先被說出來。"],["p","才有力量，往下走。"],["p","這是第一個部分。"],["p","哀哉。"],["h","二、仰望"],["p","然後，是整卷書，最重要的一個轉彎。"],["q","至於我，我要仰望耶和華，要等候那救我的神；我的神必應允我。（彌7:7）"],["p","至於我。"],["p","你看，只有一個，小小的連接詞。"],["p","可是，這是整卷書，最大的轉彎。"],["p","前六節，是他們，是人。"],["p","這裡，終於有一個，我。"],["p","環境，有沒有改變？"],["p","沒有。"],["p","果子，還是沒有。"],["p","朋友，還是不能信。"],["p","家人，還是敵人。"],["p","改變的，只有一件事。"],["p","一個人，轉過身，朝向耶和華。"],["p","他說，我要仰望。"],["p","這個字，是守望。"],["p","像守望的人，站在城牆上，等天亮。"],["p","他說，我要等候。"],["p","這是一個，主動的等。"],["p","不是被動地忍。"],["p","是一個人，站起來，面向東方。"],["p","他的最後一句，也很美。"],["p","我的神，必應允我。"],["p","你記得嗎？"],["p","整卷書，神，一直在說，你們要聽。"],["p","第一章，你們要聽。"],["p","第三章，你們要聽。"],["p","第六章，你們要聽。"],["p","現在，最後一個，聽。"],["p","是神，聽人。"],["p","我的神，必應允我。"],["p","他不是，一個很堅強的人。"],["p","他是一個，知道，有一位，會聽他的人。"],["q","我的仇敵啊，不要向我誇耀。我雖跌倒，卻要起來；我雖坐在黑暗裡，耶和華卻作我的光。（彌7:8）"],["p","我雖跌倒，卻要起來。"],["p","我雖坐在黑暗裡，耶和華卻作我的光。"],["p","他沒有說，我已經離開黑暗了。"],["p","他說，我正坐在黑暗裡。"],["p","可是，耶和華，是我的光。"],["p","這不是否認黑暗。"],["p","也不是，等黑暗過去，才相信。"],["p","是黑暗，還在的時候，就已經，有光。"],["p","你今天，也許，就坐在黑暗裡。"],["p","不要急著，從黑暗裡，逃出去。"],["p","先認出，那一道，在你黑暗裡的光。"],["q","我要忍受耶和華的惱怒；因我得罪了他，直等他為我辨屈，為我伸冤。他必領我到光明中；我必得見他的公義。（彌7:9）"],["p","這是很有深度的一節。"],["p","他先承認，因我得罪了他。"],["p","他沒有說，我是無辜的。"],["p","他沒有，自以為義。"],["p","可是，同時，他又說，神要為我辨屈。"],["p","這兩句話，同時存在。"],["p","我有罪。"],["p","我也相信，神會為我，辯護。"],["p","這是福音的樣式。"],["p","不是，我沒有錯。"],["p","而是，神，替我站出來。"],["p","你記得第六章嗎？"],["p","神，與百姓，打官司。"],["p","現在，百姓說，這場官司，神要，為我辯護。"],["p","因為，那位審判者，也是願意，為我們辯護的那一位。"],["p","這一節，最後一句，很美。"],["p","他必領我到光明中。"],["p","領。"],["p","這個字，和出來，是同一個字。"],["p","你記得嗎？"],["p","神，從居所出來。"],["p","君王，從伯利恆出來。"],["p","現在，神，把人，從黑暗裡，領出來。"],["p","這是一個，完整的圓。"],["q","以色列啊，日子必到，你的牆垣必重修；到那日，你的境界必開展。（彌7:11）"],["p","牆垣，必重修。"],["p","這是葡萄園的籬笆。"],["p","是被拆掉的，保護。"],["p","神的應許，從修補籬笆開始。"],["p","不是從蓋高塔開始。"],["p","是把被拆掉的邊界，一磚一瓦，修好。"],["p","讓人，重新有一個，安全的地方。"],["p","還有一句，要誠實地說。"],["p","後面的第十三節，又說，這地，必然荒涼。"],["p","先知沒有假裝，一切都好。"],["p","盼望，不取消，人行事的結果。"],["p","兩件事，同時成立。"],["p","我們才不會，活在虛幻的樂觀裡。"],["p","有一件事，我們要小心。"],["p","下一節，講到仇敵，被踐踏。"],["p","那是描寫仇敵的結局。"],["p","不是教導，信徒去報復。"],["p","伸冤，在神。"],["p","這是第二個部分。"],["p","仰望。"],["h","三、有何神像你"],["p","最後一個部分，彌迦，開始禱告。"],["q","求耶和華在迦密山的樹林中，用你的杖牧放你獨居的民，就是你產業的羊群。求你容他們在巴珊和基列得食物，像古時一樣。（彌7:14）"],["p","求你牧放。"],["p","這是整卷書，第一個，真正的禱告。"],["p","前面六章，是神，對人說話。"],["p","現在，先知，轉過來，對神說話。"],["p","一個人，最後能做的，是求。"],["p","從控告，到哀歌，到禱告。"],["p","這是整卷書的軌跡。"],["p","你看，他稱呼他們，是獨居的民。"],["p","是產業的羊群。"],["p","人看為孤單。"],["p","神看為，祂的產業。"],["q","耶和華說：我要把奇事顯給他們看，好像出埃及地的時候一樣。（彌7:15）"],["p","神的回答，是什麼？"],["p","出埃及。"],["p","過去的拯救，是未來的保證。"],["p","神過去怎樣做，祂就會怎樣做。"],["p","這就是，第六章，那個「記得」，的功用。"],["p","記得，是為了，能盼望。"],["p","然後，是整卷書，最後的三節。"],["q","神啊，有何神像你，赦免罪孽，饒恕你產業之餘民的罪過，不永遠懷怒，喜愛施恩？（彌7:18）"],["p","有何神像你。"],["p","這是一個問句。"],["p","可是，這個問句，也是先知，自己名字的意思。"],["p","彌迦。"],["p","這個名字，意思是，誰像耶和華。"],["p","整卷書，從審判，到控告，到哀歌，走到這裡。"],["p","他沒有，用一個定義，來結束。"],["p","他用一個問句。"],["p","一首讚美詩。"],["p","你看，這裡，有三個動作。"],["p","赦免罪孽。"],["p","原文，是擔去。"],["p","神，把罪，扛起來，帶走。"],["p","饒恕過犯。"],["p","原文，是越過。"],["p","像從旁邊，走過去，不再追究。"],["p","不永遠懷怒。"],["p","因為，祂喜愛施恩。"],["p","這個，喜愛，很重要。"],["p","祂不是勉強，赦免。"],["p","祂不是，被逼的。"],["p","祂喜歡。"],["p","人以為，神的怒氣，是祂的本性，慈愛，只是例外。"],["p","彌迦說，不是。"],["p","神的本性，是喜愛慈愛。"],["p","怒氣，是暫時的。"],["p","這句話，可以改變，一個人，對神的整個認識。"],["p","我是被一位，喜歡憐憫我的神，所面對的。"],["q","必再憐憫我們，將我們的罪孽踏在腳下，又將我們的一切罪投於深海。（彌7:19）"],["p","踏在腳下。"],["p","像踩住一個，要被制伏的東西。"],["p","投於深海。"],["p","丟到，無法撈回的地方。"],["p","罪，不是被忽視。"],["p","罪，是被處理了。"],["p","被擔起來。"],["p","被制伏。"],["p","被丟棄。"],["p","這不是，輕看罪。"],["p","是有一位，親自，為罪付上了代價。"],["p","基督徒，在十字架上，看見這句話，最完整的樣子。"],["q","你必按古時起誓應許我們列祖的話，向雅各發誠實，向亞伯拉罕施慈愛。（彌7:20）"],["p","整卷書，最後一句。"],["p","向亞伯拉罕，施慈愛。"],["p","神的赦免，不是臨時起意。"],["p","是盟約。"],["p","從亞伯拉罕開始，神就許下了。"],["p","我要信實。"],["p","我要慈愛。"],["p","這是整卷書，最堅固的底。"],["p","所有的審判，都在，這個盟約裡。"],["p","人會失敗。"],["p","神的信實，不會。"],["p","你還記得，第六章，第八節嗎？"],["p","神要我們，好憐憫。"],["p","原文是，愛慈愛。"],["p","現在，第七章，第十八節。"],["p","神自己，喜愛施恩。"],["p","祂要我們有的，是祂自己，先有的。"],["p","好，我們把這一章，帶回生活。"],["p","第一，允許自己，哀歌。"],["p","今天，找一個，安靜的地方。"],["p","把你心裡，最沉重的，對神說出來。"],["p","不要，跳過去。"],["p","第二，說出你的，但是我。"],["p","你現在，最需要，轉身的事，是什麼？"],["p","今天，用一句話，說出來。"],["p","至於我，我要仰望耶和華。"],["p","第三，在黑暗裡，認出那一道光。"],["p","不要急著，逃出去。"],["p","先說，主，你是我的光。"],["p","第四，向神，承認你的罪，也相信祂為你辯護。"],["p","兩句話，一起說。"],["p","我得罪了祢。"],["p","祢要為我，站出來。"],["p","第五，向一個人，說出赦免。"],["p","不是，輕易原諒。"],["p","是神，已經，擔去了你的罪。"],["p","你，也學習，一點一點，把別人的債，交出去。"],["p","這裡，我們看見耶穌。"],["p","祂在客西馬尼園，禱告，流汗如血。"],["p","祂在十字架上，說，我的神，我的神，為什麼離棄我。"],["p","祂，真的，坐在，最深的黑暗裡。"],["p","可是，祂也說，父啊，我將我的靈魂交在你手裡。"],["p","祂，是最完全的，至於我。"],["p","祂，為我們，把罪，投到深海裡。"],["p","祂是我們的榜樣。"],["p","在黑暗裡，仍然，仰望。"],["p","在被背叛的時候，仍然，交託。"],["p","這裡，也有321的信息。"],["p","有己的生命，在黑夜裡，要自己，找出路。"],["p","要自己，證明，我不是軟弱。"],["p","這是驕傲，離開本位，抓住權力，想要代替神。"],["p","無己的生命，是回到本位。"],["p","讓神作神，讓人作人。"],["p","我不是光，我是在黑暗中，仰望光的人。"],["p","這是讓耶穌作王。"],["p","當耶穌在我裡面作王，我能在黑暗中，不絕望。"],["p","能承認罪，也能領受赦免。"],["p","弟兄姊妹，我們這個團契，也在學習這件事。"],["p","一個屬神的體系，不是一群，沒有眼淚的人。"],["p","是一群，在黑夜裡，彼此陪伴，一起仰望的人。"],["p","是一群，被赦免，也學習赦免的人。"],["p","我們不假裝，沒有黑夜。"],["p","我們彼此，陪伴。"],["p","大家的焦點，都在耶穌，不在黑夜。"],["p","最後，我們一起來禱告。"],["p","親愛的天父，謝謝祢，允許我們，在祢面前，哀歌。"],["p","謝謝祢，在黑暗裡，作我們的光。"],["p","謝謝祢，是一位，喜愛施恩的神。"],["p","求祢，使我們，每一個人，都能說，至於我，我要仰望耶和華。"],["p","求祢，擔去我們的罪，把我們的罪，投到深海。"],["p","求祢，安慰每一位，在黑夜裡，不知道天什麼時候亮的人。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]}},"issues":[{"id":"ISS00_1","t":"成書與年代：彌迦書全書出於彌迦一人嗎？","r":"1:1--7:20","ch":[1,7],"why":"書首說摩利沙人彌迦，在猶大王約坦、亞哈斯、希西家的時候得到神的話。近代有些學者認為，後半的盼望（如第4–5章、7:8–20）可能經過後人的整理，甚至寫於被擄之後；也有人認為全書的主體出自彌迦，審判與盼望本來就並存。","pos":[["傳統立場","","全書出自彌迦，審判與盼望並存，並不矛盾：先知所傳的神，本來就是審判的神，也是應許的神。"],["編輯成書","","書卷在流傳中經過整理，後人補入盼望與頌讚，讓這卷在被擄之後的人手中仍成為安慰；成書過程不減損其為神的話。"],["折衷理解","","核心的審判話語出自彌迦；成書與編排可能經過後來的整理；無論哪一種，教會所領受的，就是今日的完整書卷。"]],"con":[],"say":"本講義依和合本與書卷現有的次序，把全卷當作一篇完整的話來讀：從「萬民哪，你們都要聽」，一路讀到「有何神像你」。成書的細節，不是讀懂這卷書的門檻。","care":"不要讓成書問題成為「誰比較尊重聖經」的標籤。有人讀過不同的學術意見，有人守著傳統的看法，都可以一起查考同一段經文；先把經文讀完，再談意見。"},{"id":"ISS00_2","t":"審判與赦免：同一位神的兩面嗎？","r":"1:3--7:19","ch":[1,7],"why":"第1章神從居所出來，眾山在祂以下如蠟融化；第7章說祂不永遠懷怒，喜愛施恩，把我們的罪投於深海。有人讀到這裡，就問：舊約的神是發怒的神，新約的神才是愛？或者：這到底是同一位神的兩個面貌，還是兩位神？","pos":[["兩種神的對立","","舊約是審判的神，新約是慈愛的神；這是早期教會也已拒絕的說法（馬吉安主義）。"],["同一位神的整全性格","","審判與赦免來自同一份盟約的慈愛：祂的怒氣是暫時的，祂喜愛慈愛（7:18）；審判的目的，是要人回頭。"],["漸進啟示","","神的性情在聖經中越來越清楚，並在耶穌基督身上完整顯明；舊約已經充滿慈愛，新約也充滿審判。"]],"con":[],"say":"本講義取第二、三種的合併：彌迦書本身就同時包含這兩面，且以赦免為終點。審判的警報，是為了喚醒；赦免的應許，是神的本性。","care":"不要用這個題目，讓聽的人覺得舊約可以略過，或把神嚇成脾氣不好的神。講員要同時讓人看見警報與盼望，並讓聽的人，離開時更想靠近神。"},{"id":"ISS00_3","t":"5:2的彌賽亞盼望：這位從伯利恆出來的，預言了誰？","r":"5:2","ch":[5],"why":"5:2說，將來必有一位從伯利恆以法他出來，為我作掌權的，他的根源從亙古。馬太福音2:5–6引用這節，說明基督要生在伯利恆。有人問：彌迦當時有沒有想到耶穌？這節是直接預言，還是以大衛家王權的盼望為背景，在耶穌身上得到更完整的成就？","pos":[["直接預言說","","彌迦直接預言彌賽亞要生在伯利恆，新約只是引用它的字面應驗。"],["王權盼望與完整成就","","彌迦宣告一位大衛家的理想君王要出現；歷史中的君王不足以成就，新約看見在耶穌身上完整應驗。"],["新約的連結為主","","我們主要根據新約自己所作的連結來讀；對彌迦當時的聽眾，它首先是在圍城的日子裡，神從最小的地方開始的應許。"]],"con":[],"say":"本講義兩種都陳列：新約把這節連在耶穌身上，我們接受；同時，我們尊重彌迦的原有處境，不假設他把一切都看得很清楚。","care":"不要把這節只當護教的證據，也不要用來嘲笑不同意見的人。對聽的人來說，它首先是安慰：神選了最小的地方；你覺得自己很小的時候，這節對你說話。"},{"id":"ISS00_4","t":"公義、憐憫與謙卑：6:8與恩典是甚麼關係？","r":"6:8","ch":[6],"why":"6:8常被說成：神要的不是儀式，是行為。有人因此說，這節是「行為得救」；也有人說，這節說明神喜悅社會公義，勝過敬拜。又有人把它看作一份「清單」，要努力達成。","pos":[["行為得救","","只要行公義、好憐憫、存謙卑，就能得到神的接納。"],["社會行動優先","","神最在乎的是社會公義與愛心行動，宗教儀式次要。"],["已被贖者的路","","6:4神先拯救，6:8是被贖的人如何活；公義、憐憫、與神同行，是恩典的果子，不是條件。"]],"con":[],"say":"本講義取第三種：6:4已經先有恩典，6:8是被贖之人的腳步；敬拜與公義不是二選一，而是兩個岸。","care":"不要把這節變成給會眾的一份「要求清單」，讓人更疲憊。講員要先數算神已做的，再說何為善；也不要用這節去指責別人「不夠公義」。"},{"id":"ISS00_5","t":"餘民：誰是餘民？與以色列、與教會的關係？","r":"2:12","ch":[2,4,5,7],"why":"彌迦書有幾處講到「剩下的人」（2:12；4:7；5:7–8；7:18）。有人問：餘民是誰？是歷史中被擄之後歸回的以色列人？是屬靈的以色列，也就是教會？還是未來還要出現的一群人？","pos":[["歷史以色列的歸回","","主要指被擄後歸回的猶大人，是神守住祂的應許，保留一群人。"],["新約教會","","新約把「餘民」的概念，用在相信基督的人身上，包括猶太人與外邦人（羅9:27；11:5）。"],["多層次的盼望","","餘民在歷史中成為歸回的一群，也在基督裡成為更大的家；細節的分歧，不是我們讀懂「神守住祂的人」的門檻。"]],"con":[],"say":"本講義承認餘民的概念在舊約有歷史的層次，在新約有進一步的使用；我們不在這裡替教會與以色列的所有問題下結論，只看見神必守住祂所聚集的人。","care":"不要用這個題目，讓一群人覺得自己是「真正的餘民」，而輕看另一群人。餘民不是優越的身分，是被神聚集的恩典。"},{"id":"ISS00_6","t":"權力者的責任：首領、祭司、先知今日在哪裡？","r":"3:1--12","ch":[3],"why":"第3章控告首領、祭司、先知，各有一個價錢。有人問：今天的政府官員、牧者、傳道人、媒體、教師，是不是就是今日的首領、祭司、先知？彌迦這一章，可以直接用來評論今日的任何人嗎？","pos":[["直接對應今日","","今日有權者與傳講者，就是彌迦控告的對象，可以直接用來批判。"],["原則的適用","","彌迦書是對當時猶大的領袖說的；今日我們應用「不被價錢買走」的原則，先用在自己身上，再為有權者禱告。"],["以自己為先","","每一個人在自己的位置（家庭、職場、教會）都有「首領」「祭司」「先知」的某種角色；先問我自己。"]],"con":[],"say":"本講義取第二、三種：我們不用彌迦書指名任何現代的領袖，先檢查自己手上的位置與口中的話，並為有權者禱告。","care":"不要把這一章變成攻擊人的武器；講員要先問自己，並為在位置上的人禱告；對曾被權力者傷害過的人，先陪伴，不要求立刻原諒。"},{"id":"ISS01_1","t":"彌迦是誰？摩利沙在哪裡？","r":"1:1","ch":[1],"why":"1:1說彌迦是摩利沙人，在約坦、亞哈斯、希西家的時候得到默示。耶利米書26:18也提到「摩利沙人彌迦」。有人問：這個人到底是誰？摩利沙在哪裡？他是鄉下人，還是有身分的人？","pos":[["鄉村的先知","","摩利沙靠近猶大西南的低地，離非利士邊界不遠；彌迦是一個地方小鎮出來的人，對鄉鎮百姓有特別的關懷。"],["不排除與耶路撒冷有關係","","他對耶路撒冷的事很熟悉；經文沒有說他是什麼身分，我們不替他補上。"]],"con":[],"say":"本講義只取經文所說的：他是摩利沙人，是神所差的先知；我們不補上經文沒有的人物背景。","care":"不要用「鄉下人」作為貶低或抬高的標籤；也不要把先知的出身，當作講員資歷的比較。神把話交給誰，是祂的主權。"},{"id":"ISS01_2","t":"1:5「雅各的罪過在撒馬利亞，猶大的邱壇在耶路撒冷」，是在比較哪一邊更壞嗎？","r":"1:5","ch":[1],"why":"1:5問：雅各的罪過在哪裡？豈不是在撒馬利亞嗎？猶大的邱壇在哪裡？豈不是在耶路撒冷嗎？有人讀成是北國南國的比較；也有人讀成是先知在指出，罪的根在首都。","pos":[["北國與南國的對立","","先知在區分兩國的罪，各自指出罪名。"],["罪的根在中心","","首都是一國信仰與政治的中心，先知說：罪不在外圍，在中心。"]],"con":[],"say":"本講義取第二種：重點不是比較誰更壞，而是罪的根在最該清楚神心意的地方。","care":"不要拿這一節攻擊某一間教會、某一位領袖；講員要先問自己的中心。"},{"id":"ISS01_3","t":"1:8先知的哀號與赤腳露體，今日可以模仿嗎？","r":"1:8","ch":[1],"why":"1:8說先知大聲哀號，赤腳露體而行，呼號如野狗，哀鳴如鴕鳥。有人問：這是真的行動，還是比喻？今日的講員，可以這樣做嗎？","pos":[["真實的象徵行動","","先知有時用身體表達訊息（如賽20:2–4）；這是當時的一種表達哀悼與羞辱的方式。"],["修辭描寫","","這是在描寫哀痛的強烈，不一定每一個細節都是字面行動。"]],"con":[],"say":"本講義不渲染：重點是先知把審判扛在自己身上，帶著眼淚說話；今日不是模仿一個行動，而是學習這個心。","care":"不要用這節為任何嘩眾取寵的行動辯護；對經歷過羞辱、暴露的人，講台要特別溫柔，不渲染。"},{"id":"ISS01_4","t":"1:10–16的地名雙關，有多少是確定的？","r":"1:10--16","ch":[1],"why":"1:10–16列了一串地名，希伯來文常有雙關（例如伯‧亞弗拉像「灰塵之家」）。和合本沒有全部譯出。有人問：每一個地名，是不是都有確定的雙關意義？我們要不要在講台上一一解說？","pos":[["每個地名都有雙關","","先知用地名的聲音，製造一連串的諷刺與哀歌。"],["部分雙關、部分不確定","","有些地名的雙關很清楚，有些較不確定；學者對個別地名也有不同看法。"]],"con":[],"say":"本講義取第二種：只取大意，先知沿著家鄉一帶的小城點名哀歌；我們不為個別地名的音義背書。","care":"不要在講台上用大量地名考據佔去時間，讓會眾失去先知的心；讓人聽見的是哀歌，不是地名課。"},{"id":"ISS01_5","t":"亞述的入侵與年代，我們要不要算日子？","r":"1:1、1:9、1:12","ch":[1],"why":"彌迦的年代與亞述的崛起有關（北國在主前722年亡於亞述，猶大在希西家時也受侵擾）。有人想要把每一節對應到具體的年份與事件。這是必要的嗎？","pos":[["精確對應歷史事件","","把每一個地名與每一個歷史事件，一一對應。"],["取歷史大意","","知道這是亞述崛起的年代就夠了，不必要求每一節對應一個年份。"]],"con":[],"say":"本講義取第二種：我們知道這個時代的大背景，但不為了精確的年份而改變經文的重心，也不算日子。","care":"不要把經文變成一份歷史考試；也不要用歷史細節，使人失去對神的話的敬畏。"},{"id":"ISS01_6","t":"1:1的三位王與寫作年代，有沒有影響我們怎麼讀？","r":"1:1","ch":[1],"why":"1:1說彌迦在約坦、亞哈斯、希西家的時候得默示，大約是主前八世紀後半。有人問：全書是否都在這個時期寫成？三位王的年代，是否限定了全書的內容？","pos":[["全書寫於這三王時期","","全書的內容，都在這個時代的背景裡。"],["書名只標示事奉年代","","書首的時間，標示先知事奉的大致年代；成書與編排的過程不一定在同一個時期。"]],"con":[],"say":"本講義取第二種：知道大致年代，就夠我們理解背景；不推算日期，也不把成書問題變成讀經的門檻。","care":"不要讓時間的考據，取代神的話對人的呼召。"},{"id":"ISS02_1","t":"2:1–2圖謀罪孽、霸佔田產，與利未記25章的地業，有甚麼關係？","r":"2:1--2","ch":[2],"why":"2:2說「貪圖田地就佔據，貪圖房屋便奪取」。在以色列，每一個家庭的地是神所分的（利25章）；土地不可永遠賣斷。有人問：這一段，是對土地買賣的規範，還是對權力濫用的控告？","pos":[["違反地業的律法","","他們違反了神所定的土地分配與贖回之法，把別人的家業奪走。"],["對權力濫用的控告","","重點是有權有力的人，利用手上的權力欺壓平民；土地是一個具體的例子。"]],"con":[],"say":"本講義兩者並陳：經文的重點是權力與貪婪對家庭的傷害；利未記25章提供了背景。我們不把它套成現代任何政策的立場。","care":"不要用這節論斷有房有地的人；對曾經失去家園的人，要特別陪伴。"},{"id":"ISS02_2","t":"2:6–7「不可說預言」：人叫先知住口，今日誰是那個先知？","r":"2:6--7","ch":[2],"why":"2:6他們說：你們不可說預言。2:7彌迦問：豈可說耶和華的心不忍耐嗎？這一段說的，是叫說真話的人住口。有人問：今天誰是被叫住口的先知？是不是每一個被反對的講員，就是先知？","pos":[["被反對就是先知","","凡被人反對的講員，就像彌迦一樣是在說真話。"],["標準是話與神的話一致","","被反對本身不是標準；先知的標誌是話與神的話一致，有公平、有力量，也帶著眼淚。"]],"con":[],"say":"本講義取第二種：被反對，不能證明一位講員是對的；講員自己，也必須願意被糾正。","care":"不要把「被人批評」當作逼迫的證據；講員更要先問：我有沒有真的在聽別人的話？"},{"id":"ISS02_3","t":"2:11說謊言的先知，專門說「清酒和濃酒」，指誰？","r":"2:11","ch":[2],"why":"2:11說，若有人心存虛假，用謊言說「我要向你們預言得清酒和濃酒」，那人就必作這民的先知。有人把它用在講「祝福、豐盛」的講員身上。這樣用對嗎？","pos":[["指講豐盛的講員","","凡講祝福、豐盛的，就是這裡的假先知。"],["指為了好處而說好聽話的人","","重點不是題目，而是動機：為了好處，只說人愛聽的，不說該說的。"]],"con":[],"say":"本講義取第二種：標準是動機與忠於神的話，不是講題；講員要先檢查自己。","care":"不要把這節用來貼別人的標籤；也不要讓會眾對所有講員都不信任。"},{"id":"ISS02_4","t":"2:12–13的「聚集」是歸回，還是末世？","r":"2:12--13","ch":[2],"why":"2:12說神必要聚集雅各家與以色列剩下的人，如波斯拉的羊。有人讀成被擄後的歸回；有人讀成末世的聚集；有人讀成在基督裡的聚集。","pos":[["被擄歸回","","指向猶大人被擄後的歸回。"],["末世與基督","","最終在基督裡，神聚集祂的子民，包括外邦人。"]],"con":[],"say":"本講義兩種都陳：它是神守住祂子民的應許，細節的對應不是重點；我們不推算日期，不指名現代事件。","care":"不要用這一段，替某個政治事件背書；對正在流離的人，它是安慰。"},{"id":"ISS02_5","t":"2:13「開路的」是誰？","r":"2:13","ch":[2],"why":"2:13說「開路的在他們前面上去」，「他們的王在前面行；耶和華引導他們」。有人問：開路的是誰？是一位君王？是耶和華自己？還是彌賽亞？","pos":[["開路的是耶和華","","2:13下半節說「耶和華引導他們」，開路的就是祂自己。"],["開路的是君王或彌賽亞","","「開路的」與「他們的王」是兩個稱呼，指向大衛家的君王，在新約中連到耶穌（來6:20）。"]],"con":[],"say":"本講義兩種都陳：這使我們想起耶穌是先鋒；經文本身沒有指名，我們不替它補上。","care":"不要把這節當成解字謎；讓聽的人看見的，是牧者走在前面。"},{"id":"ISS02_6","t":"2:7「耶和華的心不忍耐嗎？」神真的不忍耐嗎？","r":"2:7","ch":[2],"why":"2:7的反問：「豈可說耶和華的心不忍耐嗎？」有人讀成「耶和華的靈（心）是短促的嗎？」意思是神其實很有耐心；也有人讀成人們在說神沒有耐性。","pos":[["神的忍耐很長","","反問的意思是：神一直忍耐，是人行事的結果，使審判臨到。"],["人對神的誤解","","人們以為神會隨時發怒，其實不然。"]],"con":[],"say":"本講義取第一種：神的忍耐很長，審判是人行為的結果；這句話安慰也提醒。","care":"不要用這節嚇人，也不要用它輕看罪；對正在受苦的人，要看見神的耐心。"},{"id":"ISS03_1","t":"3:1–4「吃我民的肉」是什麼意思？","r":"3:1--4","ch":[3],"why":"3:2–3說首領「從人身上剝皮，從人骨頭上剔肉，吃我民的肉」。有人問：這是字面的暴行，還是比喻？今日的人該怎麼讀這些畫面？","pos":[["比喻","","描寫有權者以審判、罰款與手續，一步一步消耗百姓的生命。"],["兼指實際的暴力","","當時確有以暴力與剝削奪取窮人生計的情況，比喻背後有真實的傷害。"]],"con":[],"say":"本講義取比喻為主：描寫權力的吞噬；講台上不渲染，對受過傷害的人保持敏感。","care":"不要用這個畫面嚇人，或讓曾被剝削的人再次受傷。"},{"id":"ISS03_2","t":"3:5、11假先知「為食物」與「為價」，是不是說牧者不可以領薪？","r":"3:5、3:11","ch":[3],"why":"3:5說先知「牙齒有所嚼的，就呼喊平安」；3:11說先知為銀錢行占卜。有人問：這是不是說，傳道人領薪是錯的？","pos":[["領薪是錯的","","凡靠傳道得到供應的，都有偏離的危險。"],["動機與忠誠才是問題","","問題不是領薪，而是為了供應而改變所傳的話；新約說，工人得飲食是應當的（太10:10；林前9:14）。"]],"con":[],"say":"本講義取第二種：問題是話被買走，不是供應本身；教會供應事奉者是合宜的。","care":"不要用這節攻擊教會養傳道人；也不要讓事奉者因此活在虧欠與懷疑中。"},{"id":"ISS03_3","t":"3:8彌迦「藉耶和華的靈」，這幾個字是原文嗎？","r":"3:8","ch":[3],"why":"3:8「我藉耶和華的靈，滿有力量、公平、才能」。有學者認為「藉耶和華的靈」是後來加入的註解，使句子更順；但所有古抄本都有它。","pos":[["原有的字句","","古抄本一致，且合乎先知書中靈與先知的連結。"],["可能是註解","","文句結構略顯多餘，有些學者視為後來的解釋。"]],"con":[],"say":"本講義依現有經文：不論是不是後來加入，它說明了先知的力量來自神；全卷也在別處說明這個真理。","care":"不要用這個題目，讓人懷疑聖經的可靠；也不要把「有靈」，當作講員不被查驗的護身符。"},{"id":"ISS03_4","t":"3:10「以人血建立錫安」，所有的建造都是這樣嗎？","r":"3:10","ch":[3],"why":"3:10說「以人血建立錫安，以罪孽建造耶路撒冷」。有人問：這是否表示任何建築、事工與教會成長，都帶有罪？","pos":[["所有建造都有罪","","凡人的建造，都有人的軟弱與罪；沒有一個完全乾淨。"],["針對不義手段的控告","","這是對當時用不義手段建造城的人說的，不是否定誠實的建造。"]],"con":[],"say":"本講義取第二種：問題是根基是否建在別人的眼淚上；我們不貶低任何誠實的服事。","care":"不要讓服事者因這節放棄服事；要讓他們檢查動機。"},{"id":"ISS03_5","t":"3:12錫安被耕：耶利米書26章的外證如何幫助我們？","r":"3:12","ch":[3],"why":"3:12預告錫安被耕種像一塊田。耶利米書26:17–19記載，後來的長老引用這句話，說明希西家聽了，沒有殺彌迦，反而敬畏耶和華，神就後悔不降災。這個外證，怎樣影響我們讀3:12？","pos":[["預言必然應驗","","這節是確定的宣判，最後在主前586年應驗。"],["警告的目的是回頭","","耶26說明警告在希西家時，使人悔改，災禍暫時不臨；神的宣告包含呼召。"]],"con":[],"say":"本講義兩者並陳：3:12是真實的警告，也是呼召；警告的目的，是讓人回頭。","care":"不要用這節嚇人；要讓人看見，聽見之後，是有機會的。"},{"id":"ISS03_6","t":"3:4神不應允：禱告何時不蒙垂聽？","r":"3:4","ch":[3],"why":"3:4說首領遭災時哀求，神卻不應允，向他們掩面。有人問：這是不是說，神有時就是不聽禱告？今天的信徒要怎麼理解這節？","pos":[["神拒絕罪人的禱告","","凡不悔改的人，神不聽他的禱告。"],["對一直不聽人哀求者的審判","","他們一直不聽窮人的哀求，現在自己的哀求也沒有被聽見；不是對一般信徒禱告的宣告。"]],"con":[],"say":"本講義取第二種：這是對特定的人與特定的處境，不是一般的規則；對悔改的人，門是開的。","care":"不要用這節，讓正在禱告的人以為「神不聽我」。"},{"id":"ISS04_1","t":"4:1–3與以賽亞書2:2–4：誰引用誰？","r":"4:1--3","ch":[4],"why":"4:1–3與以賽亞書2:2–4幾乎相同。有人說彌迦引用以賽亞，有人說以賽亞引用彌迦，也有人說兩人引用同一個更古老的應許。","pos":[["彌迦引用以賽亞","","以賽亞較早，彌迦後來引用。"],["以賽亞引用彌迦","","彌迦的版本更完整（如4:4–5），是原始的。"],["共同來源","","兩人都引用當時聖殿敬拜中流傳的應許。"]],"con":[],"say":"本講義不替經文決定：聖經沒有說，我們不加；重點是兩位先知同時傳講這個應許。","care":"不要把這個題目變成「誰比較重要」的爭論；讓人聽見的是盼望。"},{"id":"ISS04_2","t":"「打刀為犁」是什麼意思？是我們的責任嗎？","r":"4:3","ch":[4],"why":"4:3說「他們要將刀打成犂頭，把槍打成鐮刀」。有人用它作反戰的標語，有人說這是未來才有的事，今天信徒仍可保護弱小。我們該怎麼讀？","pos":[["今日應推動的目標","","信徒應當努力建立和平，打刀為犁。"],["神審判之後的光景","","次序是：先有公平的審判者，然後才有刀變犁頭；這是神的作為。"]],"con":[],"say":"本講義取第二種，並承認我們今日仍要追求和睦（太5:9）；這節不是口號，也不用來裁決任何具體的戰爭或服役。","care":"不要用這節標籤任何政治立場；對曾經歷戰爭的人，特別溫柔。"},{"id":"ISS04_3","t":"4:6–7「瘸腿的」：這是軟弱的比喻嗎？","r":"4:6--7","ch":[4],"why":"4:6–7說神要聚集瘸腿的、被趕出的。有人把它當作「軟弱的人」的比喻，也有人讀成一群真實被打散的民。","pos":[["軟弱的比喻","","凡軟弱的人，神都要聚集。"],["真實的受害之民","","這是一群真實被打散的民；不拿行動不便的人當比喻。"]],"con":[],"say":"本講義取第二種，並且不拿任何身體殘障的人作屬靈教材；神看重他們，因為他們真的受了苦。","care":"不要用這節形容任何行動不便的弟兄姊妹；他們不是講章的道具。"},{"id":"ISS04_4","t":"4:10「錫安的民」與「到巴比倫」：為什麼是巴比倫？","r":"4:10","ch":[4],"why":"彌迦的年代，強權是亞述，但4:10說錫安的民要到巴比倫，在那裡蒙解救。這與當時的歷史似乎不符，有人認為這是後來的加添，也有人認為是先知的遠見。","pos":[["後人補入","","可能在被擄之後加上。"],["先知的預見","","神使先知預見將來的流亡，巴比倫後來取代亞述成為霸權。"]],"con":[],"say":"本講義依現有經文：重點不是年代，而是在最遠的巴比倫，神也要救贖。","care":"不要用這個題目，讓人懷疑先知的話；講員重點是安慰。"},{"id":"ISS04_5","t":"4:11–13列國如禾捆：這是為戰爭背書嗎？","r":"4:11--13","ch":[4],"why":"4:11–13說列國聚集攻擊，卻不知道耶和華的意念；錫安要起來踹穀，將他們的財獻給主。有人用它支持現代的戰爭。","pos":[["現代戰爭的指引","","把某國等同列國，並為某場戰爭辯護。"],["古代歷史語言","","這是主前八世紀的語言，不是給我們對號入座的名單；最後的主是神。"]],"con":[],"say":"本講義取第二種：不為任何戰爭背書，不指名任何現代國家。","care":"不要用這幾節煽動仇恨；對經歷戰爭的人，先陪伴。"},{"id":"ISS04_6","t":"「末後的日子」要不要排時間表？","r":"4:1","ch":[4],"why":"4:1說「末後的日子」，耶和華殿的山必堅立，萬民流歸。有人藉此把先知書的事件排成末世時間表，推算主再來的日期，也有人因此對末世生出恐懼或熱衷。","pos":[["排出時間表","","把先知書的各個事件，排列成末世的順序。"],["神所定的結局","","「末後的日子」指神所定的結局，不是日曆上的日期。"]],"con":[],"say":"本講義取第二種：不排時間表，不算日子，叫人今天就回頭、就行走。","care":"不要用推算引起恐慌；果效應是忍耐與更愛主。"},{"id":"ISS05_1","t":"5:2伯利恆與以法他：馬太福音2:5–6怎樣引用？","r":"5:2","ch":[5],"why":"馬太福音2:5–6引用這節時，文字與彌迦書略有不同（例如「並不是最小的」）。有人問：這是引用錯誤，還是新約有意的作法？","pos":[["新約意譯的引用","","新約作者按意思引用，並把重點放在「從你那裡出來」的那一位，使這個地方不再是最小的。"],["引用另一個傳統","","新約引用時，可能參考了另一種希伯來文或希臘文的傳統。"]],"con":[],"say":"本講義承認兩種可能，並尊重新約自己作的連結；我們不指責新約的引用，也不替它補上更多的說明。","care":"不要用這個題目，讓人覺得聖經有「錯誤」；重點是神從最小的地方開始。"},{"id":"ISS05_2","t":"「從亙古、從太初就有」：是在說基督的先存嗎？","r":"5:2","ch":[5],"why":"5:2說他的「根源從亙古，從太初就有」。有人說，這是基督先存的證據；有人說，這是說大衛家的王權古老而悠久。","pos":[["基督的先存","","這節指向彌賽亞在永恆中就存在。"],["古老的王權","","這位王的來歷與神古老的計畫相連（如7:14、7:20「古時」）。"]],"con":[],"say":"本講義兩者並陳：經文先說這位王的來歷不是今天才開始；基督徒讀到這裡，想起約翰福音1章，我們說「這使我們想起」，不替經文加上更多。","care":"不要用這個題目，變成神學名詞的堆疊；讓人看見的是神的古老計畫。"},{"id":"ISS05_3","t":"5:3「生產的婦人」是誰？","r":"5:3","ch":[5],"why":"5:3說「直等那生產的婦人生下子來」。有人說是錫安（連到4:9–10的產難婦人）；有人說是王的母親（參賽7:14）。","pos":[["錫安","","接4:9–10：錫安像產婦，生出新的時代。"],["王的母親","","指生出那位王的母親，在新約中連到馬利亞（太1:23）。"]],"con":[],"say":"本講義兩者並陳，不強迫選一個：它們並不互相排斥。","care":"不要把這個題目，變成教派的爭論；對正在受苦的人，不要說「你要再忍耐這是在生產」。"},{"id":"ISS05_4","t":"5:5–6「七牧八君」：是算數字嗎？","r":"5:5--6","ch":[5],"why":"5:5說「他必拯救我們……我們就立起七個牧者，八個首領」。有人用這句話算人數、算日期，甚至把它對應到現代的某些領袖，並由此推算時間表。","pos":[["實際的數字","","指七個牧者，八個首領，是具體的人數。"],["修辭","","「七加一」是舊約常見的遞進說法（如箴6:16；摩1:3），意思是足夠多，甚至更多。"]],"con":[],"say":"本講義取第二種：不算數字，不指名任何人。","care":"不要用這節算日子或算人；神必興起足夠的人。"},{"id":"ISS05_5","t":"5:7–9餘民如露水、如獅子：是為暴力背書嗎？","r":"5:7--9","ch":[5],"why":"5:7說餘民如露水，5:8說如獅子，踐踏撕裂，無人搭救。有人用它支持暴力，或對異己的壓迫。","pos":[["為暴力辯護","","神的子民可以如獅子般對待仇敵。"],["詩歌的語言","","描寫神所保守的餘民不被壓倒；這兩個比喻放在一起，是柔也是力，不為暴力背書。"]],"con":[],"say":"本講義取第二種：露水與獅子並置，不用它為暴力辯護；下一章說神真正要的，是公義、憐憫、謙卑。","care":"不要用這節為任何暴力、報復辯護；對受過暴力的人，要特別小心。"},{"id":"ISS05_6","t":"5:10–15神要除去人所仗賴的：包括什麼？","r":"5:10--15","ch":[5],"why":"5:10–14神要從以色列中間剪除馬匹、車輛、城邑、邪術與偶像。有人說，這是要信徒放棄所有的保障；有人說，這是針對偶像與軍事依賴。","pos":[["放棄所有保障","","信徒應當放棄所有財產與防衛。"],["針對取代神的倚靠","","這些是用來取代神的倚靠；每個人的「馬」不同，需要各人在神面前檢查。"]],"con":[],"say":"本講義取第二種：不為別人宣告他的東西是偶像；每個人先檢查自己。","care":"不要用這節論斷別人；也不要讓人因此放棄正當的責任，如照顧家人與工作。"},{"id":"ISS06_1","t":"6:1–2神的訴訟（ריב）：神為什麼要與百姓「打官司」？","r":"6:1--2","ch":[6],"why":"6:2說「耶和華要與他的百姓爭辯」，原文 riv 是約的訴訟語言。有人問：神是敵人嗎？這是一場要定罪的審判，還是一場邀請悔改的對話？","pos":[["定罪的審判","","神在法庭上控告百姓，要宣判。"],["邀請的對話","","神先問「我向你做了甚麼呢」，願意先聽人說話；這是約的官司，目的是回轉。"]],"con":[],"say":"本講義取第二種：神是被冷落的家長，邀請百姓回來。","care":"不要用這節嚇人；對正在被指責的人，要看見神的耐心。"},{"id":"ISS06_2","t":"6:5巴勒、巴蘭、從什亭到吉甲：為什麼提這些？","r":"6:5","ch":[6],"why":"6:5說「你們當追念摩押王巴勒所設的謀，和巴蘭回答他的話，並你們從什亭到吉甲所遇見的事」。有人問：這是什麼意思？","pos":[["神替百姓擋住咒詛","","巴勒雇巴蘭咒詛以色列，神卻使他說祝福（民22–24）。"],["從什亭到吉甲的過程","","指從約旦河東進入應許地的過程（民25；書3–4），是神的拯救。"]],"con":[],"say":"本講義兩者並陳：重點是記起那些百姓不知道、神替他們做的事。","care":"不要在這裡展開巴蘭的人物評價；讓人回到「神做了什麼」。"},{"id":"ISS06_3","t":"6:6–7獻祭與人祭：先知在反對獻祭嗎？","r":"6:6--7","ch":[6],"why":"6:6–7一連串問句：牛犢、千千公羊、萬萬油河、長子。有人說先知反對獻祭；有人說這是當時有人真的獻人祭。","pos":[["先知反對獻祭","","神不要任何形式的獻祭。"],["修辭的極端","","一步一步加碼，結論是：不論多少，都不是神要的；律法嚴禁以人獻祭。"]],"con":[],"say":"本講義取第二種：先知說的是人以為能靠數量換取神的心；舊約的獻祭是神所命定的，同一位神也要人誠實。","care":"不要用這節貶低奉獻與敬拜；對曾失去孩子的人，特別溫柔，不要用長子的畫面。"},{"id":"ISS06_4","t":"6:8三個動詞與得救：行公義、好憐憫、存謙卑，是條件嗎？","r":"6:8","ch":[6],"why":"6:8「只要你行公義，好憐憫，存謙卑的心，與你的神同行」，是全卷最常被背誦的一節。有人把它當作救恩的條件，也有人把它變成一份要努力達成的清單。","pos":[["救恩的條件","","人要行這三件事才能得到神的接納。"],["被贖者的路","","6:4神先拯救，6:8是被贖之人的路；新約說得救是本乎恩（弗2:8–10）。"]],"con":[],"say":"本講義取第二種：恩典在先，這三件事是恩典的果子。","care":"不要把這節變成給會眾的一份要求清單，讓人更疲憊；講員先數算神已做的（6:4），再說何為善，也不要用它指責別人不夠公義。"},{"id":"ISS06_5","t":"6:10–12詭詐的天平：職場信徒怎麼讀？","r":"6:10--12","ch":[6],"why":"6:10–12控告用假升斗、假天平欺騙人。有人問：這是否表示任何做生意的人都有罪？","pos":[["所有商業都帶罪","","凡買賣都有欺詐的風險。"],["針對故意的欺詐","","問題是故意做假；神喜悅公平的法碼（箴11:1）。"]],"con":[],"say":"本講義取第二種：控告的是故意的欺騙，不是財富與生意本身。","care":"不要對職場的信徒製造罪咎；要提醒誠實是敬拜的一部分。"},{"id":"ISS06_6","t":"6:16暗利與亞哈的條規：是指什麼？","r":"6:16","ch":[6],"why":"6:16說「你守暗利的惡規，行亞哈家一切所行的」。暗利與亞哈是北國的王，有人問：猶大為什麼被控告學他們？","pos":[["拜巴力與社會不義","","暗利、亞哈家與拜巴力、奪取拿伯的葡萄園（王上16；21）相連。"],["借北國的歷史警告猶大","","北國已亡，猶大卻在學他們；別人的失敗是給我們看的鏡子。"]],"con":[],"say":"本講義兩者並陳：北國的歷史是猶大的鏡子；我們不指名任何現代的政權或領袖。","care":"不要拿別人的失敗來羞辱人；用它來檢查自己的路。"},{"id":"ISS07_1","t":"7:1–6先知的哀歌與「家人為仇」：如何讀太10:35–36？","r":"7:1--6","ch":[7],"why":"7:6「人的仇敵就是自己家裡的人」。耶穌在馬太福音10:35–36引用它。有人問：這是否鼓勵與家人為敵？","pos":[["鼓勵與家人決裂","","跟從主，就要離開不信的家人。"],["描寫壞掉的世界","","彌迦描寫信任崩潰的社會；耶穌引用它，是說跟從祂有時要付代價，不是教導傷害家人。"]],"con":[],"say":"本講義取第二種：不鼓勵與家人為敵；對受家庭傷害的人，先確保安全。","care":"不要要求受傷的人立刻原諒；對家暴的受害者，要幫助他們得到保護與協助。"},{"id":"ISS07_2","t":"7:7「我仰望耶和華」：是正面思考嗎？","r":"7:7","ch":[7],"why":"7:7「至於我，我要仰望耶和華，要等候那救我的神」。有人把它說成「保持正面，問題就會消失」。","pos":[["正面思考","","保持樂觀，就會有好結果。"],["守望的等候","","仰望是守望，是在黑暗中仍然朝向神；環境不一定改變。"]],"con":[],"say":"本講義取第二種：仰望是轉身朝向神，不是一種情緒技巧。","care":"不要對憂鬱或長期無望的人說「你要有信心」；先陪伴，並協助尋求專業的幫助。"},{"id":"ISS07_3","t":"7:8–10「我的仇敵」是誰？","r":"7:8--10","ch":[7],"why":"7:8–10說「我的仇敵啊，不要向我誇耀」，仇敵曾說「耶和華你神在哪裡」。有人問：仇敵是誰？是外國人？還是任何與我作對的人？","pos":[["外邦列國","","指當時欺壓以色列的外邦民族。"],["任何嘲笑信仰的人","","可以延伸到任何在苦難中問「你的神在哪裡」的人。"]],"con":[],"say":"本講義兩者並陳：重點是先知如何回應，不是急著為神辯護；伸冤在神。","care":"不要用這節為報復辯護；耶穌教我們愛仇敵（太5:44）。"},{"id":"ISS07_4","t":"7:11–13築牆的日子：是什麼時候？","r":"7:11--13","ch":[7],"why":"7:11說「你的牆垣必重修」，7:12說人從亞述、埃及歸到你這裡，7:13又說這地必荒涼。原文這幾節很難，有人說是被擄歸回，有人說是末世。","pos":[["被擄後歸回與重建","","指尼希米重建城牆等歷史事件。"],["末世的完成","","最終的重建與萬民歸向，在基督裡完成。"]],"con":[],"say":"本講義不為細節作結論：重點是神的重建，與人行為的後果並置；不算日子。","care":"不要用這幾節推算日期；也不要因此對現代某個事件對號入座。"},{"id":"ISS07_5","t":"7:18「有何神像你」與彌迦之名：是雙關嗎？","r":"7:18","ch":[7],"why":"彌迦（Mikhah）的名字，一般理解為「誰像耶和華」的縮寫。7:18問「有何神像你」（mi-el kamokha），與他自己的名字相呼應。有人說，這是先知有意的名字雙關；也有人認為不必過度強調。","pos":[["有意的雙關","","先知以自己的名字結束全書。"],["文學上的呼應","","多數學者接受這個呼應，但不作為教義的根基。"]],"con":[],"say":"本講義取第二種：我們承認這個呼應，但不把它當作教義。","care":"不要讓語源與名字的爭論，帶走了這句讚美；講員要讓會眾先被這個問句震動，再談細節。"},{"id":"ISS07_6","t":"7:19將罪投於深海：與約拿書的海呼應嗎？","r":"7:19","ch":[7],"why":"7:19說「將我們的一切罪投於深海」。約拿書2:3、2:5也有「海」「深處」的語言。有人說，這是兩卷書有意的呼應。","pos":[["有意的呼應","","兩卷書同屬十二小先知書，有相似的意象。"],["各自獨立","","兩處都用海的語言，但沒有明確的連結。"]],"con":[],"say":"本講義兩者並陳：可以互相呼應，但這是文學的呼應，不是預言的證明。","care":"不要把這個對照，變成遊戲；讓人聽見的是神把罪帶走。"}],"terrain":{"points":[[1.125,52,0,"耶和華出了他的居所","mid"],[1.4375,30,0,"我必大聲哀號","bot"],[2.076923076923077,24,0,"貪圖田地就佔據","bot"],[2.8461538461538463,62,0,"我必要聚集你們","mid"],[3.8333333333333335,22,0,"卻倚賴耶和華，說災禍必不臨到","bot"],[3.9166666666666665,6,0,"錫安必被耕種像一塊田","bot"],[4.0,80,0,"末後的日子","top"],[4.6923076923076925,56,0,"在那裡耶和華必救贖你","mid"],[5.066666666666666,92,0,"伯利恆的以法他啊","top"],[6.4375,72,0,"何為善","top"],[7.0,16,0,"哀哉！我好像夏天的果子已被收盡","bot"],[7.85,98,0,"有何神像你","top"]]},"tracks":[{"gk":"שָׁמַע","tr":"shama","gl":"聽","code":"H8085","root":"√שׁמע（聽、使人聽見、聽從）","stops":[["1:2","「萬民哪，你們都要聽！」全卷第一個命令：神從聖殿作見證，地上的人都要側耳。","top"],["3:1","「你們要聽！」對首領說：最該知道公平的人，先要聽。",""],["3:9","「當聽我的話！」再一次對首領說，這回加上罪名：厭惡公平。",""],["5:15","「那不聽從的列國」反面：不肯聽的，神親自施報。",""],["6:1","「當聽耶和華的話！」同一節兩次：神的訴訟，連山岡也要聽。","top"],["6:2","「要聽耶和華爭辯的話」山嶺與地的根基作見證。",""],["6:9","「你們當聽是誰派定刑杖的懲罰」聽，是智慧人敬畏的開始。",""],["7:7","「我的神必應允我」同一個字：從「叫人聽」變成「神聽我」。","top"]],"ins":"「聽」（שָׁמַע）在彌迦書全卷 9 次，分布於 8 節。前半卷是神一次又一次命令人聽（1:2；3:1、9；6:1、2、9），中間 5:15 說不聽的列國要受報；到了最後，7:7 同一個字翻了面：先知說「我的神必應允（聽）我」。全卷由「你們要聽」，走到「神聽我」；聽，是人與神之間的來回。"},{"gk":"יָצָא","tr":"yatsa","gl":"出來、出去","code":"H3318","root":"√יצא（出來、出去、領出）","stops":[["1:3","「耶和華出了他的居所」審判從神自己走出來開始。","top"],["1:11","「撒南的居民不敢出來」百姓卻躲在城裡，不敢出來。",""],["2:13","「從城門出去」開路的在前面，百姓跟著神出去。",""],["4:2","「訓誨必出於錫安」神的教訓從錫安出去，萬民來學。",""],["4:10","「你必從城裡出來」被擄之路：出城，到巴比倫，在那裡蒙解救。",""],["5:2","「必有一位從你那裡出來」從最小的伯利恆出來一位掌權的。","top"],["7:9","「他必領我到光明中」同一個字，神把我領出黑暗。",""],["7:15","「好像出埃及地的時候一樣」全卷最後的「出來」：神要再次帶人出來。","top"]],"ins":"「出來」（יָצָא）在彌迦書全卷 8 次，分布於 8 節，每一節各一次。起頭是耶和華從居所出來（1:3），末了是神要再作出埃及那樣的奇事（7:15）；中間，教訓從錫安出來（4:2）、百姓出城被擄（4:10）、掌權者從伯利恆出來（5:2）、神把我領出黑暗（7:9）。全卷是一條「神出來」的線：祂先出來審判，再出來帶領，最後出來拯救。"},{"gk":"הָלַךְ","tr":"halakh","gl":"行走、同行","code":"H1980／H3212","root":"√הלך（行走、前往、行事為人）","stops":[["1:8","「赤腳露體而行」先知先用自己的腳步為審判哀哭。",""],["2:3","「你們也不能昂首而行」驕傲的腳步被神截住。",""],["2:7","「與行動正直的人有益」神的話，對行走正直的人有益。",""],["2:10","「你們起來去吧」被趕出的路。",""],["4:2","「我們也要行他的路」萬民前往、說：來吧，我們也要行他的路（同一節三次）。","top"],["4:5","「各奉己神的名而行……我們卻永永遠遠奉耶和華……的名而行」同一節兩次：兩條路。","top"],["6:8","「與你的神同行」全卷的高點：行，是與神同行。","top"],["6:16","「順從他們的計謀」另一條路：走暗利與亞哈的路。",""]],"ins":"「行走」（הָלַךְ）在彌迦書全卷 12 次，分布於 9 節。腳步有兩種：一種是驕傲的腳步（2:3）、被趕出的腳步（2:10）、順從暗利與亞哈計謀的腳步（6:16）；另一種是萬民說「我們也要行他的路」（4:2）、「永永遠遠奉耶和華……的名而行」（4:5），以及 6:8 的「與你的神同行」。神向人所要的，歸結在這一個字：不是替神辦事，是與神同行。"},{"gk":"קָבַץ／אָסַף","tr":"qavats／asaf","gl":"聚集、招聚","code":"H6908／H622","root":"√קבץ、√אסף（聚集、招聚）","stops":[["1:7","「從妓女雇價所聚來的」聚來的財物，後必歸為妓女的雇價：人聚的，會散。",""],["2:12","「我必要聚集你們，必要招聚以色列剩下的人」同一節四個動詞：神親自聚集。","top"],["4:6","「我必聚集瘸腿的，招聚被趕出的」神聚集的，是被忽略的人。","top"],["4:11","「許多國的民聚集攻擊你」列國也在聚集。",""],["4:12","「他聚集他們，好像把禾捆聚到禾場」列國的聚集，也在神的籌劃裡。","top"]],"ins":"「聚集」（קָבַץ、אָסַף）在彌迦書全卷 9 次，分布於 5 節。人聚的東西會散（1:7）；列國聚集來攻擊錫安（4:11），卻不知道是神把他們聚到禾場（4:12）；而神自己的聚集，是 2:12（一節四個動詞）與 4:6：聚集的是剩下的人、瘸腿的、被趕出的。附註：「餘民」（שְׁאֵרִית）全卷 5 次（2:12；4:7；5:7、8；7:18），單字未達八次的門檻，附在這一條：餘民，就是被神聚集的人；到了 7:18，他們成了「你產業之餘民」——被赦免的人。"},{"gk":"מִשְׁפָּט／צְדָקָה／חֶסֶד","tr":"mishpat／tsedaqah／khesed","gl":"公平、公義、慈愛","code":"H4941／H6666／H2617","root":"√שׁפט（公平）、√צדק（公義）、חֶסֶד（慈愛、施恩）","stops":[["3:1","「你們不當知道公平嗎」首領本來的責任：知道公平。",""],["3:8","「滿有力量、公平、才能」先知有的，首領丟棄的。","top"],["3:9","「你們厭惡公平」同一個字：首領厭惡的。",""],["6:5","「好使你們知道耶和華公義的作為」神的公義，是救贖的作為，先於要求。",""],["6:8","「行公義，好憐憫」公平與慈愛（חֶסֶד）同在一節：神向人所要的。","top"],["7:9","「為我辨屈……我必得見他的公義」同一節：神行公平，人見公義。",""],["7:18","「喜愛施恩」施恩（חֶסֶד），是神所喜愛的。",""],["7:20","「向亞伯拉罕施慈愛」全卷最後的字：慈愛。","top"]],"ins":"這一組字在彌迦書全卷 10 次，分布於 8 節：公平（מִשְׁפָּט）5 次、公義（צְדָקָה）2 次、慈愛／施恩（חֶסֶד）3 次。前半卷：首領本該知道公平（3:1），卻厭惡公平（3:9），先知是藉著耶和華的靈才有公平（3:8）。中段 6:8：神向人所要的，是行公平、好慈愛、與神同行。末了 7:9 與 7:18、20：行公平的是神自己，慈愛的施予者也是神——人所要行出來的，是神先向人行的。附註：單字「公平」（מִשְׁפָּט）全卷 5 次，未達八次的門檻，與公義、慈愛合為一組。"}],"lesson":{"1":{"no":1,"vol":"《321彌迦書講義》第1課·彌迦書第1章","title":"耶和華出了他的居所——出、審、哀","chars":4764,"min":60,"deep":8,"dchars":1483,"tchars":1278,"blocks":[["h","一、一個不尋常的警報（1:1--2）"],["p","弟兄姊妹平安。不知道你家有沒有過這樣的經驗：半夜裡，客廳的煙霧偵測器，每隔一分鐘就「嗶」一聲。它不是大火警報，只是電池快沒電了，那一聲短短的、有氣無力的聲音。第一個晚上，你翻個身，告訴自己：明天再換。第三個晚上，你開始用枕頭蓋住耳朵。到了第七個晚上，你忽然發現，你已經很習慣了，習慣到你不再覺得那是一個警報，只覺得，那是屋子本來就有的聲音。"],["p","今天這一卷書，就是從這樣一個「我們已經習慣了」的地方開始的。一章一節說，這是摩利沙人彌迦得到耶和華的默示；他的時代，是約坦、亞哈斯、希西家三位王的年間。摩利沙是猶大低地的一個小鎮，不是首都，不是聖殿所在，是你在地圖上要找很久才找得到的地方。神沒有把話先交給宮廷，也沒有先交給祭司，祂把話交給一個鄉下的人。這是彌迦書留給我們的第一個提醒：神最重要的話，常常從最不起眼的地方開始。"],["p","然後，彌迦一開口，就不是小聲的。二節說：「萬民哪，你們都要聽！地和其上所有的，也都要側耳而聽！」（彌1:2）這不是對一間教會講話，也不是對一個家庭講話，是對全地。因為要作見證的，是「主耶和華從他的聖殿」。你看，那個被習慣了的小小一聲嗶，這一次，變成了一個沒有辦法再用枕頭蓋住的聲音。"],["p","彌迦的聽眾，並不是不信神的人。他們每年上聖殿，守節期，獻祭，唱詩，日子大致上算是不錯。所以，當先知說「主耶和華要見證你們的不是」，很多人的第一個反應，大概不是害怕，而是皺眉：又來了。我們今天的處境，其實很像：聚會照樣有，詩歌照樣唱，奉獻照樣收，可是一個人的心，可能已經好久沒有被神碰過。彌迦的第一個工作，就是在一切都很正常的地方，把那個「習慣」，打破。"],["p","可是請注意，這個聲音的起頭，不是吼，是一個動詞：聽。神的第一個期望，不是你馬上懂，也不是你馬上改，而是你願意停下來，聽一聽，那個你已經習慣了的聲音，是不是在說話。今天，我們帶著三個問題走進這一章：神為什麼出來？罪的根在哪裡？先知為什麼哭？"],["d",["彌迦只是一個鄉下人，他說的話有權柄嗎？","話的權柄，在神，不在人的出身。彌迦書的第一節，沒有寫他的學歷，沒有寫他的官職，只寫他是摩利沙人，也就是說，神把話交給一個你在地圖上不容易找到的地方的人。這不是在貶低學習，神也使用受過訓練的人；這是要我們看見，說話的是神，不是講員。所以，沒有受過訓練的人，不需要自卑；有學問的人，也不需要驕傲。你可以先做兩件事：第一，每天讀一小段，不求多，只求聽見一句；第二，把你聽見的那一句，說給一位你信任的人聽，請他為你禱告。"]],["h","二、神從居所出來了（1:3--4）"],["p","三節接著說：「看哪，耶和華出了他的居所，降臨步行地的高處。」（彌1:3）這句話，像是一位在天上的神，忽然站了起來，走下台階。請你不要太快想到可怕的畫面，先停在這個動詞：出了。神是一位本來可以不出來的神。祂在祂的居所，在聖殿，大可以繼續坐著，看著人間的事，不作聲。可是，祂出來了。出來，是因為祂不是一位冷眼旁觀的神。"],["p","四節說：「眾山在他以下必消化，諸谷必崩裂，如蠟化在火中，如水沖下山坡。」（彌1:4）這是詩的語言：最堅固的山，在神面前，像蠟靠近火；最深的谷，像水沖下斜坡，一點也站不住。彌迦要我們看見的，不是一份地質報告，而是神臨到的重量：在祂面前，沒有什麼是真正堅固的，除了祂自己。"],["p","對一個讀過出埃及記的以色列人來說，「神降臨」這件事，一點也不陌生。西乃山上，有雷轟、有火焰、有角聲，百姓怕得發抖，求摩西替他們聽神的話。彌迦用的是同樣的畫面，只是這一次，神的臨到，不是在西乃山，而是在撒馬利亞和耶路撒冷的門口。換句話說：神沒有變，變的是，祂的百姓，已經忘了祂是這樣一位神。"],["p","這裡有一個很重要的提醒。這段經文，不是要我們去算哪一年有災，也不是要我們去猜哪一座山、哪一個國家。經文的重點，是神離開居所，是為了處理人的罪。祂不是出來看熱鬧，祂是出來作見證。所以，我們聽這一段，要問的不是「災難什麼時候來」，而是「祂為什麼出來」。"],["p","把這個畫面拉到你我的生活裡：有一種「神出來了」，不是發生在山上，而是發生在一個晚上、一次檢查、一通電話、一封信、一個你忽然睡不著的凌晨。你若在那個時刻，心裡有一點發抖，請不要馬上把它壓下去。那可能是神，離開了祂安靜的位置，走近了你。祂走近，是要你回頭，不是要你逃走。"],["d",["神離開居所，是不是說祂平常不在我們中間？","不是。聖經說神無所不在，祂不需要從某個地方搬到另一個地方。「出了他的居所」，是一種說法，意思是：神從靜默，走到行動；從忍耐，走到說話。就像一位父親，一直在客廳看著孩子，直到有一天，他站起來，走到孩子面前，說：我們談一談。你可以這樣用：當你感覺到神「很安靜」的時候，不要馬上下結論說祂不在；也許，祂正在忍耐著等你。而當你感覺祂「走近」的時候，也不必恐慌，先安靜一分鐘，問：主，祢要對我說什麼？"]],["h","三、原文亮光：聽、出、哀（1:2--8）"],["p","這一章有三個字，如果你記得，就記得了整章的路：聽、出、哀。我們用三十秒，一個一個，把它轉成生命。"],["p","第一個字，是二節的 שִׁמְעוּ（shim'u），意思是「你們要聽」。這個字在聖經裡，常常不只是耳朵聽見，而是聽了就要順服、聽了就要有行動；摩西對以色列人說「以色列啊，你要聽」，用的也是同一個字根。三十秒轉成生命：今天，在你的行事曆裡，劃出三分鐘，只做一件事：不說話，只聽，問神一句：祢有沒有一個聲音，是我一直沒有回應的？"],["p","第二個字，是三節的 יֹצֵא（yotse），意思是「出來」。這個字根，在聖經裡最有名的一次，是「出埃及」的「出」，神把百姓從埃及領出來，用的是同一個字根。同一位神，從前出來，是為了救；這裡出來，是為了審，卻仍然是為了人。三十秒轉成生命：下次你感覺到神「走近」，請不要先問「我是不是做錯了什麼」，先問「祢出來，是要帶我去哪裡」。"],["p","第三個字，是八節的 אֶסְפְּדָה（espedah），意思是「我要捶胸哀號」。這是葬禮上的字，是一個人為死去的親人，搥著胸口、放聲痛哭的字。先知宣告審判，用的卻是送葬的聲音。三十秒轉成生命：下次你要說一句「重話」之前，先問自己：我說這句話的時候，眼睛是濕的，還是乾的？"],["p","這三個字連起來，就是整章的路：先聽，因為神說話；再看見神出來，因為祂走向人；最後才是哀，因為祂的話，最後落在人的傷痕上。若你這個星期，只能記得一個字，請記得「聽」；因為沒有聽，後面的出和哀，都只是別人的故事。"],["d",["為什麼要學幾個希伯來文的字？我不懂原文，怎麼辦？","你不需要懂希伯來文，才能聽懂神的話。講義把原文放在這裡，只有一個目的：讓你多看見一個畫面。譬如「出來」這個字，若你知道它和出埃及是同一個字根，你就會想到：神一直是一位走向人的神。這一點，用中文也一樣可以說明白，你不必背字母，也不必擔心唸不出來。你只要記得三個中文字：聽、出、哀。若這三個字，能夠在這個星期，各幫你做一件小事，那就夠了。凡是不能在三十秒內，變成生命的原文，我們就把它留在書房裡。"]],["h","四、罪的根在中心（1:5--7）"],["p","五節是整章的轉折：「這都因雅各的罪過，以色列家的罪惡。」（彌1:5）前面那一切，山融化、谷崩裂，都是因為罪。可是請注意，接下來彌迦的問題，問得很貼近：「雅各的罪過在哪裡呢？豈不是在撒馬利亞嗎？猶大的邱壇在哪裡呢？豈不是在耶路撒冷嗎？」（彌1:5）答案是：罪不在遠方，罪在首都；罪不在敵人，罪在自己的中心。"],["p","撒馬利亞是北國以色列的首都，耶路撒冷是南國猶大的首都；一個是政治的中心，一個，還是聖殿的所在。彌迦的話，像是一位醫生，指著X光片說：病灶，不在手腳，在心臟。很多時候，我們很願意討論外面的問題：環境不好，景氣不好，別人不好。可是神問的是：你的中心，在哪裡？這就是先知的眼光：他看見的，不只是山，是心。"],["p","六、七節說到偶像與財物，說這些東西是「從妓女雇價所聚來的」（彌1:7）。這裡的意思是說：他們的宗教，已經跟錢的來路纏在一起；他們所拜、所存的，是從不乾淨的買賣得來的東西。我們不必往細節去猜，只要問一句：我今天所擁有的，有沒有一部分，來路是我不敢攤開來給神看的？"],["p","接著從八節到十六節，彌迦開始唱一首很特別的哀歌。他一個城一個城地點名：迦特、伯‧亞弗拉、沙斐、拉吉……這些，都是他家鄉附近的城鎮；他玩弄這些名字的發音，像一個送葬的人，沿路喊著熟悉的街名。十三節說，拉吉是「錫安民的罪由你而起」；一座邊境的城，它的軟弱，也和首都的罪連在一起。罪，從來不是一個人的事；中心若壞了，邊緣也跟著痛。"],["p","請注意，神的審判，不是從「別人」開始，是從「家裡」開始。這是彌迦書的第一個重點，也是我們讀每一卷先知書，最需要記得的一件事：先知的話，是先對自己的家說的，不是先對鄰居說的。"],["d",["說罪在「中心」，是不是說別人的錯，我都不能指出來？","不是。聖經也有叫人勸戒、指出錯誤的教導，並沒有禁止。這裡的重點是次序：先看自己的中心，再看別人的行為。你可以這樣檢驗自己：在開口指出別人以前，我有沒有先問過神：我自己有沒有類似的地方？我有沒有為他禱告？我是想要他好，還是想要自己痛快？若這三個問題，你都有誠實地問過，再說，就是帶著愛心的說。若你還沒有問，可以先等一等，等你的心，先被神摸一摸。你也可以把這個問題，帶到小組裡，請大家一起為你禱告。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把三、四節講成災難日程表，推算哪一年、哪一個地方會有地震或火。經文講的是神出來的重量，不是日期；本講義不推算時間，也不猜是哪一個地方。檢驗標準是：聽完以後，會眾是更怕新聞，還是更認識神？"],["p","第二個偏差，是把撒馬利亞與耶路撒冷，套成今天某一個城市或某一個國家，說「那就是他們」。經文自己沒有這樣說，新約也沒有這樣連；聖經不是用來支持或反對任何一個現代國家、政黨或領袖的。檢驗標準是：我是不是又把「別人」找到了？"],["p","第三個偏差，是把神講成喜歡毀滅的神。山融化、谷崩裂，是詩的語言；背後，是神離開居所、親自出來，後面還有先知的哀號。神的審判，是帶著眼淚的審判。檢驗標準是：會眾聽完，是更靠近神，還是更躲著神？"],["p","第四個偏差，是把「罪在首都」聽成「罪在領袖身上」，然後自己躲在安全的地方。彌迦說的是：罪的根，在每一個中心，包括家裡的客廳、公司的帳本、教會的服事。檢驗標準是：我有沒有在把手指指向別人以前，先指向自己？"],["p","第五個偏差，是拿先知的哀號當許可證，把講重話、論斷人，說成「我是在行先知的職分」。彌迦是先哭，才說；他的話，帶著傷痕。檢驗標準是：我開口之前，有沒有先為這個人哭過、禱告過？"],["d",["有人用這一章預言某個國家或某個日期，我怎麼回應？","可以先溫和地問他三個問題：第一，經文自己有沒有說這是對今天的預言？沒有，它說的是當時的撒馬利亞與耶路撒冷。第二，新約有沒有把這一段，連到今天任何一個國家？也沒有。第三，這樣的講法，讓人更愛主，還是更熱衷於討論新聞？然後，你可以對他說：我們可以一起讀這一章，看神怎樣看待罪與哀號；至於今天的世界局勢，我們為各國禱告，把結果交給神。對於沒有新約根據的連結，我們只說「這使我們想起」，不說「這就是預言」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們這個文化，很重視「家醜不外揚」。這句話有它的溫柔，保護面子，保護家人。可是，它也常常變成「家醜不內揚」：連自己，也不肯看。很多家庭、教會，把一件事壓了很多年，每個人都聽見那一聲嗶，卻沒有人願意去換電池。你若在這樣的家庭長大，會知道那種沉默的重量：每個人都很小心，不去踩那一塊地板。彌迦書的第一章告訴我們：先知寧可哭，也不肯假裝沒有聽見。"],["p","第二個問題：我們常常把「說重話」當成「負責任」，或者，把「沉默」當成「成熟」。可是這兩個，都可能是逃避。重話，若沒有眼淚，就只是痛快；沉默，若沒有禱告，就只是迴避。有些人，一輩子只會說兩種話：很重的，或者完全沒有的。彌迦走第三條路：他說出口，卻是赤腳、哀號，像送葬的人一樣說出來。"],["d",["「家醜不外揚」是不是錯的？","不全是錯的。保護家人的名聲，不在外面隨便說家裡的軟弱，這是愛的一面。問題在於，它常常停在「不外揚」，卻沒有走到「內處理」。聖經的方式，是先在小範圍、有愛心地處理：先私下去找當事人，再找一兩位可信的同伴，最後才是教會。換句話說，「不外揚」可以保留，但「不處理」不可以。你可以今天先做一件小事：問自己，家裡或團體裡，有哪一件事，是大家都知道、卻都不提的？然後，為它禱告，求神給你一個溫柔而誠實的開口。"]],["h","七、活出321——聽見警報，帶著眼淚"],["p","第一個基礎，耶穌是我的榜樣。耶穌看見耶路撒冷，就為這城哀哭（路19:41）；祂不是站在高處宣判，而是流著眼淚，並且走上十字架，親自擔當審判。我們學彌迦，其實是在學耶穌：先哭，再說；先擔當，再指出；不是先找出誰錯了，而是先問：我為這座城，流過眼淚嗎？"],["p","第二個基礎，聖經是我的準則。我們不是用感覺，來判斷什麼是警報，而是讓經文先說話。一章五節說，罪的根在中心；那就是我們每一次檢查自己的準則：不先看別人，先看自己。"],["p","第三個基礎，聖靈是我的引導。沒有聖靈，我們的耳朵，會一直習慣下去。求聖靈使我們聽見那一聲，不再用枕頭蓋住；也求祂在我們想說重話的時候，先使我們安靜，使我們看見眼淚。聖靈的引導，常常不是很大的聲音，而是一個很小的、願意停下來的念頭。"],["p","第一個核心，讓耶穌作王。讓耶穌作王，就是讓祂的聲音，比我的辯護、我的指責、我的假裝沒聽見，更大。我先把我的中心，交給祂檢查。"],["p","第二個核心，讓耶穌得著一切的榮耀。先知不是自己站出來，是神把話放在他口裡；所以他說完，不是得著掌聲，而是回到眼淚。凡是成就的，都是神；凡是回頭的，都是恩典，榮耀歸給耶穌。"],["p","一個目的，建立屬神的體系。屬神的體系，不是一群很會評論的人，而是一群先聽見神的聲音、帶著眼淚說話、先檢查自己中心的人。他們彼此提醒：那一聲嗶，不要習慣。"],["d",["讓耶穌作王，在這一章具體是什麼意思？","在這一章，具體的意思是：當神說話的時候，我不先替自己辯護。很多時候，我們聽見警報，第一個反應不是安靜，而是找理由：我已經很努力了，別人也有問題，環境本來就這樣。讓耶穌作王，是讓祂的聲音，先於我的理由。你可以練習一個很小的動作：下次有人提醒你，或心裡有一個不舒服的感覺，先說一句：主，祢是王，請祢說。然後，安靜十秒，再決定要怎麼回應。這十秒，就是把王位，還給耶穌。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：問題都在別人，在首都，在領袖，在對手。經文對他說：五節的問題是「雅各的罪過在哪裡呢？」答案，是在自己的中心。他常常最先聽見警報，卻最後才承認，那是在說自己。你可以先問：如果神的手指，先指向我家，我願意不願意聽？"],["p","恐懼型的人說：神出來了，我好怕，我不敢讀這一章。經文對他說：神出來，不是為了抓你，是為了先開口；祂在災難以前，先說話。「看哪」，是叫你轉過頭來看，不是叫你逃。你可以把怕，說給祂聽，從三分鐘安靜開始。"],["p","羞恥型的人說：我的中心，有不乾淨的地方，我不配聽。經文對他說：先知哭了，是因為他沒有放棄這個群體；神也沒有放棄你。羞恥最會說謊，它說你不配，其實是不讓你回家。你可以對一位可信的同伴，說一句：我有一件事，我一直不敢拿出來。"],["p","受傷型的人說：我已經被人傷得很深，這一章又在說審判，我受不了。經文對他說：先知用哭，面對無法醫治的傷痕，他沒有叫傷痕快點好。你不需要一次讀完，神不會因為你讀得慢，就收回祂的同在。今天只讀一句：神出來了，祂看見。若這一章讓你更痛，請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，每天固定三分鐘，安靜地說：主，祢若有一個聲音，是我已經習慣了的，求祢再說一次。連續七天，寫下一句你聽見的。"],["p","第二，找出一件你習慣了的「嗶」：一件小的、拖了很久的、你一直說「明天再處理」的事。今天，寫下它，並決定哪一天處理。不用一次處理完，只要今天，讓它不再是「明天」。"],["p","第三，檢查一個「來路」：收入、服事的動機，或一件你擁有的東西。找一位可信的同伴，說出來。不需要完美，只需要誠實。例如問：這筆錢是怎麼來的？這個服事，我是為了誰？"],["p","第四，想一個你最想批評的人，這個星期，先為他禱告三次，再決定要不要開口；若要開口，先用一句關心的話，開頭。"],["p","第五，下一次你要說一句真話以前，先問：我是帶著眼淚，還是帶著痛快？準備好了，才開口。"],["p","我宣告：耶和華出來了，祂不是來看我笑話的，是來叫我回頭的。"],["p","我宣告：罪的根，在我自己的中心，我不先把手指指向別人。"],["p","我宣告：我要像先知一樣，帶著眼淚說話，帶著禱告開口。"],["p","我宣告：耶穌是我的榜樣，祂為城哀哭，我也要為身邊的人哀哭。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最簡單的，是今晚睡前，拿一張紙，寫下一件你習慣了的「嗶」，也就是一件你一直說「明天再處理」的事。在它下面，寫一句你可以做的第一步，例如：打一通電話、整理一個抽屜、對一個人說對不起。明天，就做這一步，不用做完，只做第一步。一個星期後，回頭看這張紙，你會發現，有些事，因為一個小動作，開始鬆動；也有些，需要更多時間，繼續禱告。若你發現自己很難開始，也不要責備自己，先為它禱告一次，就是一個開始。"]],["h","十、結語"],["p","彌迦書第一章，是一個鄉下先知的名片、一聲從聖殿來的呼喚、一個神離開居所的畫面，和一個先知赤腳哀號的背影。開頭，是摩利沙人彌迦得到神的話；中間，是神出來，山融谷裂，罪的根被指出在撒馬利亞與耶路撒冷；最後，是一串城名，和一句話：兒女被擄去離開你。"],["p","在這一章，神讓我們看見祂的心：祂是一位，在災難以前，先開口的神；祂是一位，離開居所、走近我們的神；祂也是一位，把話交給一個哭的人去說的神；祂不是遠遠地喊，是親自走過來。祂的警報裡，有一個要人回頭的機會。"],["p","彌迦書不是從安慰開始的，卻也不是以絕望結束的。一章最後那一串被擄的城名，像一張很長的訃聞；可是整卷書讀下去，你會看見，同一位走出居所的神，後來要把瘸腿的聚集起來，要在伯利恆興起一位牧者，要把我們一切的罪，投於深海。所以，今天這一聲警報，不是故事的結局，而是一個邀請：願意回頭的人，路是通的。"],["p","所以，請你記得這一課的三個重點：聽，不再假裝沒聽見；出來，神走近，是為了要我們回頭；哀，帶著眼淚說話，先檢查自己的中心。這一課的焦點，不在你有沒有聽懂每一座山、每一個城，不在你找到了誰的罪，也不在災難的日期，而是那位看見耶路撒冷就哀哭、並走上十字架的耶穌。"],["p","親愛的天父，謝謝祢，離開祢的居所，出來對我們說話；求祢使我們聽見祢的聲音，不再用習慣蓋住耳朵；求祢使我們看見自己的中心，先轉回；也求祢賜給我們一顆為人哀哭的心。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 彌迦書一章二節：萬民哪，你們都要聽！你最近有沒有一個「嗶」，是你已經習慣了、一直沒處理的？請說出是哪一類，不必細節。"],["n","2. ★ 一章一節：彌迦是摩利沙人，一個小地方的人。你現在所在的位置是什麼？請說出一個，例如家庭、職場、教會。"],["n","3. ★★ 一章三節：耶和華出了他的居所。你有沒有一個時刻，感覺神走近了你？請用一句話說出那時你的第一個反應。"],["n","4. ★★★ 請在安靜中想一件事：一件你說「明天再處理」、拖了很久的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念一章二節，再開始。不要點名逼人說。這一章會碰到罪、偶像、金錢的來路、被擄與哀號：若有人提到性暴力、家庭暴力、流產、失去孩子、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照一章五節，你覺得自己的「中心」，哪一處最容易被你忽略？請只說出一個，例如帳目、脾氣、服事的動機。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀一章二節與三節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：先知宣告審判，卻像送葬的人一樣哀號（一章八節）。請用自己的話向組員說明：為什麼真正從神來的重話，是帶著眼淚的？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先處理哪一件「嗶」，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一通電話、一次檢查、十分鐘禱告；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一個人，是你最想批評的？請說出名字，並決定這個星期先為他禱告三次。"],["n","11. ★★ 你的小組或教會，有沒有一件大家都聽見、卻沒有人去處理的「嗶」？請說出你可以怎樣，用一句關心的話開口。"],["n","12. ★★ 你有沒有一位，曾經在你最低的時候，陪你哭、沒有急著講道理的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起聽見神聲音的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。若有人分享被傷害、失去孩子、成癮或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件「嗶」，放在神面前。一起念一章二節。"],["p","由帶領者為每一位禱告：求神使我們聽見祂的聲音，看見自己的中心，也帶著眼淚說話。散會前，彼此問一句：你這星期要先處理哪一件事？"]]},"2":{"no":2,"vol":"《321彌迦書講義》第2課·彌迦書第2章","title":"我必要聚集你們——禍、拒、聚","chars":4767,"min":60,"deep":8,"dchars":1417,"tchars":1270,"blocks":[["h","一、「你別講那些」（2:6--7）"],["p","弟兄姊妹平安。年夜飯的桌上，你大概也看過這樣的一幕：大家正吃得開心，二叔忽然放下筷子，開口說：「爸留下的那塊地，我們是不是該找個時間談一談？」話才說到一半，媽媽把碗輕輕一放，說：「過年，別講那些。」整張桌子，立刻安靜下來。有人低頭夾菜，有人趕快換話題，電視的聲音，忽然變得很大。那件事，沒有被談，也沒有消失，它只是被收進了每個人心裡，等著下一個年。"],["p","這一幕，在彌迦書第二章，竟然是一個先知的處境。六節說：「你們不可說預言；不可向這些人說預言，不住地羞辱我們。」（彌2:6）注意，這句話不是敵人說的，是神的百姓說的；他們不是不信神，他們只是不要聽見那些「會讓我們難堪」的話。他們的要求很有禮貌，也很熟悉：請你別講那些。"],["p","可是神的回答，很直接。七節說：「雅各家啊，豈可說耶和華的心不忍耐嗎？」（彌2:7）神在這裡，像一位被誤會的父親。百姓以為，神的話之所以那麼重，是因為神沒有耐心；神卻說：你們看一看，我的話，豈不是「與行動正直的人有益」嗎？也就是說，那些你不想聽的話，不是為了羞辱你，是為了保護你。"],["p","「別講那些」其實有兩種。一種是出於愛，不想在不合適的時候，傷了人；那是智慧，聖經也說，凡事都有定時。另一種，是出於怕：怕麻煩、怕難堪、怕要改變。前一種，是等待合適的時間再說；後一種，是永遠沒有合適的時間。彌迦面對的，是第二種。"],["p","所以，今天這一課，我們要一起學習兩件事：第一，不要用「別講那些」，把神的話擋在門外；第二，也不要用神的話，把別人擋在我們的門外。因為彌迦書第二章，同時有一群「想要說」的人，和一群「不想聽」的人，而神，是站在兩者之間，把心打開的那一位。神說話的方式，常常是先問，再說：祂不是想要贏過你，祂是想要你回家。"],["d",["如果有人不喜歡聽我說真話，是不是就代表我是先知？","不是。這是最容易走偏的一個地方。第二章的百姓，叫先知別說，不代表凡是被人討厭的話，都是神的話。有時候，被討厭，是因為我們說得不夠溫柔，或者說的是自己的意見，不是經文。你可以用三個問題，檢驗自己：第一，我說的話，有沒有經文的根據？第二，我說的時候，有沒有眼淚、有沒有為這個人禱告？第三，我是想他回頭，還是想自己痛快？這三個問題，若有一個答不出來，先不要急著說「我是在說預言」，先回到神面前，再開口。"]],["h","二、床上的算盤，與神的籌劃（2:1--5）"],["p","那麼，百姓為什麼不想聽？第一節給了答案：「禍哉，那些在床上圖謀罪孽、造作奸惡的！」（彌2:1）他們在床上，也就是在夜深人靜、沒有人看見的時候，盤算著要怎樣得到別人的東西；天一亮，「因手有能力就行出來了」。注意這一句：不是因為他們需要，而是因為他們「手有能力」。能力，變成了許可。手有能力，是一個很容易被忽略的試探，因為它看起來，一點也不像罪。"],["p","二節說得很具體：「他們貪圖田地就佔據，貪圖房屋便奪取」（彌2:2）。在彌迦的時代，田地是一個家族的命，是神分給每一個家庭的產業。奪取田地，不只是奪取財產，是奪取一家人的位置。我們今天不一定用同樣的方式，但「手有能力就行出來」的事，仍然天天發生：在合約裡多一行小字，在家族裡多一份委屈，在公司裡一個沒有問清楚的決定。"],["p","三節，神回答了：「所以耶和華如此說：我籌劃災禍降與這族。」（彌2:3）請注意，這裡有一個很美的對照：他們在床上「圖謀」，神說「我籌劃」。在希伯來文裡，這兩個詞是同一個字根。他們在黑夜裡，打算怎麼拿；神在白晝裡，回應怎麼斷。這不是神任意降禍，而是神對一件事，有清楚的回應：你怎樣量給別人，神就怎樣量給你。"],["p","四、五節說，到了那日，他們的田地，要被分給別人，他們自己，要在耶和華的會中，沒有地界、沒有分。這是很重的話，因為「在耶和華的會中」，原是每個家庭，都有一份產業的地方。也就是說，他們奪取了別人的位置，最後，連自己的位置也失去了。"],["p","神的審判，常常是這樣的「照樣」：你怎樣對待別人的位置，最後，你的位置也怎樣。這不是神的報復，而是一個很深的公義：被奪走的，神記得；用手段得來的，站不住。"],["d",["神說「我籌劃災禍」，祂是主動製造災難的嗎？","經文的重點，是神的回應，不是神的興趣。三節的前面，是一長串被人欺壓、被人奪去的事；神的籌劃，是一個有原因的回應，不是隨意的。因此，我們不能反過來說：凡是臨到別人的災難，都是神在審判他。耶穌就曾經清楚地說，不要這樣解釋別人的苦難（路13:1--5）。所以，這一節給我們的提醒，是對自己的：我今天的盤算，若是神能夠看見，我敢不敢攤開？而不是用它，去解釋別人的病痛或意外。"]],["h","三、原文亮光：圖謀、滴、聚（2:1--12）"],["p","這一章，有三個字，可以幫我們走完整條路：圖謀、滴、聚。我們用三十秒，一個一個，轉成生命。"],["p","第一個字，是一節的 חֹֽשְׁבֵי（choshevei），意思是「圖謀的人」。同一個字根，在三節，用在神的身上：הִנְנִי חֹשֵׁב，「看哪，我籌劃」。人在床上籌劃，神也在籌劃，這個字，把兩邊接在一起，也提醒我們：每一個行動，都是從一個看不見的念頭開始的。三十秒轉成生命：今晚睡前，問自己一句：我這幾天，在心裡一直盤算的，是什麼？若這件事，今晚就攤在神面前，我敢不敢？"],["p","第二個字，是六節的 יַטִּיפוּן（yattifun），意思是「他們說預言」；這個字的字根，本來是「滴」，像水一滴一滴地落下來。有趣的是，同一個字根，十一節也用來說那個「要向你們預言得清酒和濃酒」的假先知。這告訴我們：「說預言」這個動作，本身不分真假，要看說的是什麼、從誰來。三十秒轉成生命：下次你聽見一篇信息、一句勸勉，不要只問「好不好聽」，先問「這是不是經文說的」。"],["p","第三個字，是十二節的 אָסֹף אֶאֱסֹף（asof e'esof），意思是「我必要聚集」。在希伯來文裡，同一個動詞連說兩次，有「一定要」的意思，神說：我必要聚集，我一定要聚集。三十秒轉成生命：今天，找一個你覺得「已經散掉了」的關係或群體，為它說一句禱告：主，祢說祢必要聚集，請祢從這一個，開始。"],["p","這三個字連起來，就是整章的路：人在黑夜裡圖謀，神在白天裡聽見；人把神的話，一滴一滴擋在門外；神最後，要把散開的人，一個一個聚回來。"],["d",["「滴」這個字，在別的地方也出現嗎？","有。阿摩司書七章十六節，有人對阿摩司說「不要向以色列說預言」，那裡的「說預言、傳道」，也是同一個字根。這就是說，這個字，不是彌迦一個人的用詞，而是那個時代，很多先知，都面對同樣的處境：有人叫他們別說。你可以把它記成一句話：真先知和假先知，用的是同一個動詞，分別在於，那句話，是不是神的話。這也提醒我們，不要因為一個人「很會說」，就以為他說的對；也不要因為一個人說得不好聽，就以為他說錯。"]],["h","四、近來我的民，和開路的主（2:8--13）"],["p","八節說，神的百姓，「近來我的民興起如仇敵」。這是一句很痛的話：本來是神的子民，如今，對自己的弟兄，像仇敵一樣。他們從那些安然經過、不願打仗的人身上，剝去外衣；他們把婦人，從安樂的家中趕出去，把孩子身上屬神的榮耀，奪走（彌2:8--9）。十節接著說：「你們起來去吧！這不是你們安息之所。」那個被趕出去的人，不是別人，是他們自己，因為污穢，使人毀滅。"],["p","十一節，是這一章最諷刺的一節：「若有人心存虛假，用謊言說：我要向你們預言得清酒和濃酒。那人就必作這民的先知。」（彌2:11）意思是：這個民，只要有人說「你們會有好日子，有酒、有肉」，他們就把這個人，當作先知。他們不是沒有要先知，他們只是，要一種「不會叫我們難堪」的先知。"],["p","可是，第二章的結尾，卻是整卷書第一次的曙光。十二節說：「雅各家啊，我必要聚集你們，必要招聚以色列剩下的人。」（彌2:12）神的話，沒有停在審判，它轉過來，說：我必要聚集。這些人，剛才還被趕出去、被剝去外衣，如今，像羊一樣，被安置在一處，像波斯拉的羊，像草場上的羊群。「剩下的人」，是被審判過、卻沒有被丟棄的人。"],["p","十三節更令人安慰：「開路的在他們前面上去；他們直闖過城門，從城門出去。他們的王在前面行；耶和華引導他們。」（彌2:13）請注意，神不是只在後面推，祂是在前面走：開路的、王，最後說是「耶和華引導他們」。這使我們想起，希伯來書稱耶穌是我們的「先鋒」（來6:20），祂先走過那一條路，我們才敢跟著走。"],["p","請你看見這一章的次序：先是圖謀，再是拒絕，最後是聚集。神沒有等人先改好，才開始聚集；祂說「我必要聚集」，是主動的。這是福音的味道：不是先洗乾淨，才被接納；而是被接納了，才一步一步，被洗乾淨。"],["d",["「開路的」是誰？可以說就是耶穌嗎？","經文本身，沒有直接說「開路的」是誰，新約也沒有直接引用這一節，指著耶穌。所以，我們不說「這就是預言」。我們可以說：「這使我們想起」。希伯來書六章二十節，稱耶穌是為我們進入幔內的「先鋒」，祂先走過去，為我們開了路。這兩段，彼此呼應，但不是同一句話。本講義的立場，是把重點放在這一節自己所說的：神不是在後面催，是在前面走；祂不是把我們聚集起來，就放手，而是一路引導。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把十二、十三節的「聚集」，套成今天某一個民族、某一個國家的政治行動，或者講成末世的時間表。經文講的，是神在審判之中，對祂百姓的憐憫，不是給我們用來推算日期、或支持任何現代政黨與國家的。檢驗標準是：會眾是更認識神的牧養，還是更熱衷於討論新聞？"],["p","第二個偏差，是把六節的「不可說預言」，當成「凡是責備，都是假先知」，或者反過來，「凡是被反對的，我就是真先知」。兩種講法，都是自己抬高自己。真假的分別，在於話是不是從經文來、是不是帶著眼淚。檢驗標準是：我說的話，有沒有經文，有沒有為這個人哭過、禱告過？"],["p","第三個偏差，是把三節的「籌劃災禍」，講成「凡是災難，都是神的懲罰」，並用它去解釋別人的病痛、意外、失去。經文的對象，是那些圖謀奪取、手有能力就行出來的人；耶穌也清楚地說，不要這樣解釋別人的苦難。檢驗標準是：我是在檢查自己，還是在定別人的罪？"],["p","第四個偏差，是把一、二節，講成對有產者的仇恨，或把「奪取田地」，變成煽動階級的口號。經文反對的，是「圖謀奪取」的心與手段，不是擁有；它也沒有叫受害的人，去報復。檢驗標準是：聽完以後，會眾是更有憐憫，還是更有怒氣？"],["p","第五個偏差，是把十一節的「清酒和濃酒」的先知，講成「所有談祝福、談平安的人」，然後用它去給某位講員、某間教會貼標籤。經文分辨的，是話的內容與來源，不是講員的名字。檢驗標準是：我是在分辨經文，還是在貼標籤？"],["d",["有人說「聚集以色列剩下的人」，講的是今天的某個民族，我怎麼辦？","你可以溫和地問他三個問題：第一，經文自己，有沒有說這是在講今天某一個國家？沒有，它說的是彌迦當時的雅各家。第二，新約，有沒有把這一節，連到今天的政治事件？也沒有。第三，這樣的講法，讓人更認識神的牧養，還是更關心局勢？然後，你可以說：我們可以一起讀這一章，看神怎樣聚集祂的百姓；至於今天的世界局勢，我們為各國禱告，把結果交給神。沒有新約根據的連結，我們只說「這使我們想起」，不說「這就是預言」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「報喜不報憂」，也很習慣「過年別講那些」。這在家庭裡，有它的溫柔，保護氣氛，也保護彼此的面子。可是，它很容易變成一種規矩：凡是難聽的、複雜的、需要面對的，都被放進「別講」的箱子。你若問一位牧者，他大概也會告訴你：最難帶的聚會，是那種每個人都說「很好」的聚會。教會裡也一樣：我們喜歡聽祝福、聽恩典，不太想聽「悔改」、「分辨」、「面對」。彌迦書第二章的百姓，不是不拜神，他們只是希望，神的話，不要太刺耳。"],["p","第二個問題：我們很習慣「能做就做」，也很習慣「有人脈、有資源，就是本事」。一、二節說：「因手有能力就行出來了」。在華人社會，土地、房屋、遺產，是一代人最重要的事，也是家人之間最容易翻臉的事。能力，常常被當成許可：我拿得到，就是我的；我說得動，就是對的。可是神問的，不是「你有沒有能力」，而是「這是不是我分給別人的」。我們很少問這一句，我們比較常問：這是不是我能拿到的？我們很少問這一句，我們比較常問：這是不是我能拿到的？"],["d",["家裡的遺產糾紛，這一章有什麼可以幫上忙？","這一章，不能替代法律，也不能替代專業的協助，但它給我們三個原則。第一，先問自己的心：我是為了公平，還是為了「手有能力」？第二，不要用「別講那些」，把問題壓進心裡；找一個時間，在可信、中立的第三者面前，好好談。這位第三者，可以是牧者、年長的親人，必要時，也可以是律師或調解人。第三，不管結果如何，先禱告：求神保守我們與家人的關係，比保守那一塊地更重要。人比事重要，關係比東西重要。"]],["h","七、活出321——不擋住神的話，成為被聚集的羊"],["p","第一個基礎，耶穌是我的榜樣。耶穌被人說「你不要講那些」的時候，祂沒有閉嘴，也沒有發怒。祂手有能力，卻拿來洗門徒的腳；祂用愛，把真話說到底；祂也走上十字架，親自成為那位先走過去的人。我們學彌迦，其實是在學耶穌：不躲開，也不傷人。"],["p","第二個基礎，聖經是我的準則。我們不是用「我喜不喜歡」，來判斷一句話是不是從神來；我們是讓經文先說話。二章七節說：神的話，是與行動正直的人有益的。這是我們每次聽道、每次講道的準則：不是好不好聽，而是有沒有益。"],["p","第三個基礎，聖靈是我的引導。我們很容易在床上盤算，天一亮就行出來；也很容易把神的提醒，當作噪音。求聖靈在我們盤算的那一刻，先使我們停下來，問一句：主，這件事，祢怎麼看？"],["p","第一個核心，讓耶穌作王。讓耶穌作王，就是把「手有能力」，交給祂。我有能力，不等於我可以；祂是王，我是僕人，先問祂，再動手。"],["p","第二個核心，讓耶穌得著一切的榮耀。那位在前面開路的，是神；那位把散開的人聚集起來的，也是神。我們不是自己聚集自己，是祂聚集我們；凡是被聚集的，都是恩典，榮耀歸給耶穌。榮耀若不歸給耶穌，我們就會開始自己聚集，一個又一個小王國。"],["p","一個目的，建立屬神的體系。屬神的體系，不是一群很會說「別講那些」的人，也不是一群很會說「我是先知」的人，而是一群願意被神的話對付、也願意被神聚集的羊。他們彼此說真話，彼此保守。"],["d",["讓耶穌作王，和「別講那些」有什麼關係？","關係很大。「別講那些」背後，常常有一句沒說出來的話：我不想被對付。讓耶穌作王，就是主動把這一句，說出來：主，祢是王，若有一件事，是我一直不讓人說的，請祢說。具體可以這樣做：這個星期，找一位可信的同伴，對他說一句：「若你看見我有什麼地方，需要被提醒，請你直接告訴我。」這是一個很小的動作，卻是把王位，還給耶穌。反過來，若有人對你說了真話，先說謝謝，再回去禱告，不急著辯護。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我手有能力，我做得到，就是我該得的。經文對他說：一節的「手有能力」，正是神所責備的；能力，不是許可。這是人最容易忘記的一件事。你可以先寫下一件你覺得「應得」的東西，再問：這件事，若是神能夠看見，我還敢不敢做？"],["p","恐懼型的人說：我怕神的話太重，所以我寧可不去聽。經文對他說：七節說，神的話，與行動正直的人有益；祂的話，不是來嚇你，是要保護你。你可以從一節經文開始，這是一個很小的開始：今天只讀一句，不求多，也不求懂。"],["p","羞恥型的人說：我曾經是那個奪取別人的人，我不配被聚集。經文對他說：十二節說，神要聚集的，是「雅各家」，是那一群剛被責備的人；祂的聚集，不是賞給完美的人，是給願意回來的人。羞恥說你太晚了，神說：我必要聚集。你可以對一位可信的同伴說：我曾經做過一件事，我一直不敢面對。"],["p","受傷型的人說：我是被趕出家的那一個，這一章的審判，對我來說太遲了。經文對他說：九節看見你，神把那些被趕出安樂家的人，放在祂的眼裡；十二節的聚集，是為你預備的。你不需要馬上原諒，也不需要一次讀完；若這一章讓你更痛，神看見你，也不會要你一個人撐著。請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找出一件「別講那些」的事：一件你一直不讓自己、或家人去談的事。今天，用一句話寫下它，並決定，找誰陪你談。寫下來，是為了讓這件事，從心裡，走到光裡。"],["p","第二，今晚睡前，問自己：我這幾天，在心裡一直盤算的，是什麼？若這件事，今晚就攤在神面前，我敢不敢？把它寫下來，向神說出口。"],["p","第三，檢查一次你的「手有能力」：想一件你可以做、也有能力做，但不確定神喜不喜歡的事。這個星期，先停下來，找一位可信的同伴，問他的意見。"],["p","第四，找出一個你覺得「已經散掉了」的關係或群體，這個星期，為它禱告三次，並用一個小動作，開始修復：一通電話、一則訊息，或一個問候。"],["p","第五，下一次有人對你說一句不太好聽的真話，先說「謝謝你告訴我」，再回去禱告三天，才決定要不要回應。"],["p","我宣告：神的話，不是來羞辱我，是來保護我的。"],["p","我宣告：我不用「別講那些」，把神的話擋在門外。"],["p","我宣告：我不用「手有能力」，替自己找理由。"],["p","我宣告：耶穌是我的牧人，祂在我前面開路，要把我聚集回家。"],["d",["這個星期，我怎樣開始「說一句該說的真話」？","可以從一件很小、很安全的事開始。先選一個你信任的人，這個人，不是你最怕的那一位，而是最可能聽你說完的那一位。再選一句話，只有一句，例如：「我最近心裡一直有一件事，想請你陪我談一談。」不要一次說完，也不要想要結果。說之前，先禱告，求神給你一個溫柔的語氣；說完以後，不管對方怎麼回應，都先說謝謝。若這件事，牽涉到暴力、虐待，或你的人身安全，請不要一個人處理，請先找牧者、輔導，或專業的協助。"]],["h","十、結語"],["p","彌迦書第二章，是一桌被打斷的年夜飯、一張床上的算盤、一個被叫別說的先知，和一個要聚集羊群的牧人。開頭，是「禍哉，那些在床上圖謀罪孽的」；中間，是「你們不可說預言」；最後，是「我必要聚集你們」，和「耶和華引導他們」。"],["p","在這一章，神讓我們看見祂的心：祂是一位，把話說得很重、卻是為了保護我們的神；祂是一位，看見被趕出家門的人、被奪去產業的人的神；祂也是一位，在審判裡，已經預備好聚集的神。祂說的每一句重話，後面，都有一隻伸出來的手。"],["p","第二章也提醒我們，審判與盼望，在同一章裡，連在一起。讀彌迦書，不要只讀前半章，也不要只跳到後半章。有人只愛聽後半章的安慰，卻不想聽前半章的責備；有人只愛聽前半章的責備，卻忘了後半章是神的心。神的話，是整個說完的。"],["p","所以，請你記得這一課的三個重點：不用「別講那些」，擋住神的話；不用「手有能力」，替自己找理由；相信那位在前面開路的主，必要把散開的人，聚集回來。這一課的焦點，不在誰是真先知、誰是假先知，不在誰奪了誰的田，也不在聚集的日期，而是那位為我們先走過去、又把我們帶回來的耶穌。"],["p","親愛的天父，謝謝祢，不因我們說「別講那些」，就收回祢的話；求祢使我們，願意被祢的話對付；也求祢，醫治每一個被趕出家門、被奪去產業的人，把我們都聚集在祢的羊圈裡。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 二章六節：「你別講那些」。你的家或教會，有沒有一件這樣的事？請說出是哪一類，不必細節。"],["n","2. ★ 二章一節：因手有能力就行出來了。你現在手上有什麼能力或位置？請說出一個，例如金錢、職位、人脈、說話的分量。"],["n","3. ★★ 二章十二節：我必要聚集你們。你有沒有一個時刻，感覺神把你從散亂中聚回來？請用一句話說出那一次。"],["n","4. ★★★ 請在安靜中想一件事：一件你一直不讓自己或別人談的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起面對。"],["m","帶領提醒：請先安靜念二章十二節，再開始。不要點名逼人說。這一章會碰到被奪去的產業、被趕出家門、家人之間的糾紛：若有人提到性暴力、家庭暴力、流產、失去孩子、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照二章一節，你睡前最常盤算的是什麼？請只說出一個，例如錢、面子、某一個人。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀二章十二、十三節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：一節的「圖謀」和三節的「籌劃」是同一個字根。請用自己的話向組員說明：神的籌劃，和人的圖謀，有什麼不同？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先對誰說一句「該說的真話」，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一通電話、一次談話、十分鐘禱告；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，像九節那樣被趕出、被排擠、被忽略的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一件「大家都知道、沒有人提」的事？請說出你可以怎樣，用一句溫柔的話開口。"],["n","12. ★★ 你有沒有一位，曾經對你說過逆耳卻有益的真話的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「被神聚集」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或民族。若有人分享被趕出家門、被奪去產業、家庭暴力或長期被忽略的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件「別講那些」的事，放在神面前。一起念二章十二節。"],["p","由帶領者為每一位禱告：求神使我們願意被祂的話對付，也被祂聚集。散會前，彼此問一句：你這星期要先對誰說一句該說的話？"]]},"3":{"no":3,"vol":"《321彌迦書講義》第3課·彌迦書第3章","title":"我藉耶和華的靈——斥、聽、耕","chars":4752,"min":60,"deep":8,"dchars":1527,"tchars":1314,"blocks":[["h","一、「你們不當知道公平嗎？」（3:1--4）"],["p","弟兄姊妹平安。請想像你是一場比賽的評審。你手上有一張分數表，每一位參賽者，你都看過了，你心裡很清楚，誰表現得最好。可是比賽開始前，有一個人悄悄走到你身邊，遞給你一個小紙袋，說：「一點心意，請多關照。」紙袋不大，裡面是你喜歡的茶葉。你當然可以說，這只是人情；你也可以說，我不會因此改分數。可是，你心裡有一個很安靜的聲音說：你本來，是知道公平的。"],["p","這個安靜的聲音，就是彌迦書第三章一開始，神對首領說的那一句話：「雅各的首領，以色列家的官長啊，你們要聽！你們不當知道公平嗎？」（彌3:1）請注意，神沒有說：你們不懂。神說的是：你們「不當知道」嗎？這是一個責備，也是一個肯定：你們本來是知道的。你們在那個位置上，本來就是為了分辨什麼是公平。"],["p","接下來的二、三節，彌迦用一個很可怕的比喻，說這些首領：「惡善好惡，從人身上剝皮，從人骨頭上剔肉」（彌3:2）。他們把人民，當成鍋裡的肉。這是詩的語言，不是真的吃人，而是說：他們用手上的位置，一層一層地，把百姓的血汗，剝下來，吃進自己的肚子裡。善與惡，在他們眼中，顛倒了：該愛的，他們恨；該恨的，他們愛。"],["p","四節說：「到了遭災的時候，這些人必哀求耶和華，他卻不應允他們。那時他必照他們所行的惡事向他們掩面。」（彌3:4）這句話很重，卻很公道。他們平常不聽，等到災難臨到才求；神不是不愛他們，而是，他們把「禱告」，當成了遇難時才使用的救生圈，不是平常與神同行的路。"],["p","請你留意，「位置」這個詞，很值得想一想。位置，不是權力，是託付。一位評審、一位法官、一位主管、一位家長，都是被人放在某一個位置上的；那個位置本身，就帶著一句沒說出口的話：我相信你，會公平。當我們把位置，變成多拿的理由，傷害的不只是眼前的人，還有那份最初的信任。"],["p","這一課，我們要看見三件事：神為什麼斥責首領？神為什麼把話交給彌迦？錫安為什麼會被耕種，像一塊田？三個詞，記在心裡：斥、聽、耕。"],["d",["「公平」和「公義」是一樣的嗎？","在這一章，彌迦用的是同一個希伯來字 mishpat，和合本有時譯為「公平」，有時譯為「公義」或「審判」。它的意思，不是一條冷冰冰的規則，而是「每一個人，得到神所定的、該有的位置與待遇」。你可以把它想成一把秤：不偏左，不偏右。所以，「知道公平」，不是知道法條，而是知道：弱的人，也要被當作人；有位置的人，也不可以用位置，替自己多拿一點。你可以先從一個小問題開始：在我的家、公司、教會裡，有沒有一個地方，因為我是「說了算的人」，就不自覺地多拿了？"]],["h","二、走差路的先知（3:5--7）"],["p","彌迦接著，把目光轉向另一群人：先知。五節說：論到使我民走差路的先知，是「他們牙齒有所嚼的，他們就呼喊說：平安了！凡不供給他們吃的，他們就預備攻擊他」（彌3:5）。這是神自己說的話，而且說得很生動。這幾乎是一幅漫畫：有人供養他，他就說「平安了」；沒有人供養他，他就預備打仗。他的話，不是從神來的，是從他的肚子來的。"],["p","我們要小心，不要把這句話，變成對所有牧者、所有傳道人的懷疑。彌迦批評的，不是「被供養的人」，而是「話隨著供養改變的人」。一個人可以被供養，也可以說真話；但如果他的話，要先看供養的人的臉色，那就是走差路。"],["p","六、七節說，這樣的先知，要遇到黑夜：「你們必遭遇黑夜，以致不見異象；又必遭遇幽暗，以致不能占卜。」（彌3:6）他們本來是要「看見」的人，最後，卻什麼也看不見。他們自己，也要遮著嘴唇，因為神不應允他們。這是一個很深的懲罰：不是被攻擊，而是，神的靜默。"],["p","我們可以從這裡，學兩件事。如果你是一位要說話的人，不論是在家裡對孩子，在教會講台上，還是在公司對同事，請先問：我現在說的這句話，是因為神這樣說，還是因為有人在看我？如果你是一位要聽話的人，也請問：我是在找真話，還是在找一句讓我安心的話？神的靜默，往往從這樣的小地方，開始。"],["d",["神說「他卻不應允他們」，是說悔改也沒有用嗎？","不是。四節說的，是那些平常一直行惡、遇到災難才哀求的人，神沒有立刻回應。這和另一件事，不一樣：真正轉回的人，神總是接納的。耶利米書二十六章十八至十九節就記著，彌迦當年說這番話的時候，希西家王和百姓聽見了，敬畏耶和華，神就後悔，沒有降下所說的災禍。這就是說，神的門，一直是開的；只是，「平常不聽，遇難才求」，和「真心回頭」，是兩回事。所以，若你今天心裡有一個「太遲了」的聲音，請把它帶到神面前，說：主，我回來了。"]],["h","三、原文亮光：公平、靈、耕（3:1--12）"],["p","這一章，有三個字，如果你記得，就記得了整章的路：公平、靈、耕。我們用三十秒，一個一個，把它轉成生命。"],["p","第一個字，是一節的 מִשְׁפָּט（mishpat），意思是「公平、公義、審判」。這個字，在聖經裡，常常和「公義」一起出現，是神國度的根基。有趣的是，在這一章，它出現了三次：一節，神問首領「你們不當知道公平嗎」；八節，彌迦說他「滿有公平」；九節，神責備他們「厭惡公平」。同一個字，從「應當知道」，到「滿有」，到「厭惡」，像是一條下坡的路。三十秒轉成生命：今天，找一個你可以「多拿一點」的小地方，例如多報一點時間、多吃一點好處，然後，不拿。"],["p","第二個字，是八節的 רוּחַ（ruach），意思是「靈、氣、風」。彌迦說：「至於我，我藉耶和華的靈，滿有力量、公平、才能。」（彌3:8）請注意，他不是靠自己的口才，也不是靠自己的勇敢，而是靠神的靈。同一個字，也是創世記一章二節，神的靈運行在水面上的那個字。三十秒轉成生命：下一次，你要說一句不容易說的話以前，先安靜十秒，對神說：主，求祢的靈，先充滿我。"],["p","第三個字，是十二節的 תֵחָרֵשׁ（techareish），意思是「被耕」。這是一個農夫的動詞：犁，翻過整塊田。「錫安必被耕種像一塊田」（彌3:12）。本來是聖殿所在的山，變成了犁過的田；本來有人敬拜的地方，變成了一堆亂石。三十秒轉成生命：今天，問自己一句：我生命裡，有沒有一個地方，是我很自豪、卻已經不再被神使用的「聖殿」？"],["p","這三個字連起來，是一條完整的路：失去公平，需要靈，不然就會被耕。你若願意，今天晚上，用這三個字，做一個五分鐘的禱告：公平，靈，耕。"],["d",["彌迦說錫安必被耕種，後來真的發生了嗎？","有兩個層面。第一，耶利米書二十六章十八至十九節說，在希西家的時代，這個預言說出來以後，百姓和王聽了，敬畏耶和華，神就後悔，沒有降下那個災禍。第二，在後來的另一個世代，因為百姓一再不聽，耶路撒冷與聖殿，真的被毀（列王紀下二十五章）。這兩件事放在一起，給我們一個很深的提醒：神的話，不是空的；但神的話，也不是死的。祂的警告，是為了讓人回頭；人回頭了，祂就憐憫；人不回頭，祂的話，必然成就。"]],["h","四、至於我，與被耕的錫安（3:8--12）"],["p","在一大段責備以後，彌迦突然，說了一句很個人的話：「至於我。」（彌3:8）這是整章的轉折。前面是首領，是先知，現在是「我」。八節的全句是：「至於我，我藉耶和華的靈，滿有力量、公平、才能，可以向雅各說明他的過犯，向以色列指出他的罪惡。」（彌3:8）"],["p","請你看，這句話的重點，不是「我很有力量」，而是力量的用途：「可以向雅各說明他的過犯」。彌迦的力量，不是用來成為英雄，而是用來說真話。他的力量，來自耶和華的靈；他的公平，是神給的；他的才能，是為了指出罪惡，不是為了出名。這是一個很清楚的對比：首領用位置，替自己拿；先知用嘴巴，替自己賺；彌迦用靈與力量，替神說話。"],["p","在一大段責備裡，這個「至於我」，很像是黑夜裡的一盞燈。彌迦並不是一個輕鬆的人：他要面對的，是有位置、有影響力的人；他說的話，不討人喜歡，也沒有人會為他鼓掌。可是，他沒有因為孤單，就停下來；他也沒有因為被拒絕，就變成苦毒。因為他知道，他不是靠自己站在那裡，而是靠神的靈。"],["p","九、十節，神再回到首領，說：「你們厭惡公平，在一切事上屈枉正直；以人血建立錫安，以罪孽建造耶路撒冷。」（彌3:9--10）這是一幅很可怕的景象：一座城，在表面上很宏偉，裡面卻是用不公平，一塊一塊堆起來的。你站在它前面，會覺得：這是一座偉大的城。可是，如果你知道它的磚，是怎麼來的，你就不敢再靠近。"],["p","十一節，是這一章的核心，也是最令人心驚的一節：「首領為賄賂行審判；祭司為雇價施訓誨；先知為銀錢行占卜。他們卻倚賴耶和華，說：耶和華不是在我們中間嗎？災禍必不臨到我們。」（彌3:11）審判、教導、預言，這三樣，本來是神給百姓的保護；現在，每一樣，都有一個價錢。而他們，卻還說：神不是在我們中間嗎？他們把神的名，當成一張保險單。"],["p","所以，十二節，是整章最重的一句：「所以因你們的緣故，錫安必被耕種像一塊田，耶路撒冷必變為亂堆。」（彌3:12）請注意「因你們的緣故」：不是因為亞述的軍隊，不是因為時代不好，而是因為，他們自己。神的同在，從來不是不悔改的保險；神的同在，是要人活出神的公平。"],["d",["「我藉耶和華的靈，滿有力量」是不是說，我也可以像彌迦一樣「滿有力量」？","可以，但要先看目的。彌迦的力量，是為了「說明過犯」，也就是說真話。新約也說，聖靈降臨，是要我們作祂的見證人（使徒行傳一章八節）。所以，求聖靈的充滿，不是為了讓自己變成偉人，而是為了在該說的時候，說得出口；在該站的時候，站得住。你可以這樣禱告：主，若今天有一句話，是祢要我說的，求祢的靈，給我勇氣與愛心；若沒有，求祢使我安靜。這樣的禱告，不是求更多的力量，而是求更清楚的託付。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把這一章，用來攻擊今天某一位領袖、某一個政黨或某一間教會，說「他們就是彌迦所說的那些首領」。經文說的，是彌迦當時的以色列首領；新約並沒有把它連到今天任何一個人。檢驗標準是：我讀完這一章，是更謙卑地看自己，還是更有勁地批評別人？"],["p","第二個偏差，是以為「首領」只是別人，自己不在其中。其實，在家裡的父母、在公司的主管、在小組的帶領者，都有一個「位置」；凡有位置的人，都有機會，把位置變成多拿的理由。檢驗標準是：我有沒有一個位置，是我最需要被提醒的？"],["p","第三個偏差，是把八節的「我藉耶和華的靈，滿有力量」，講成「所以我說的就是神說的」，用來堵住別人的問題。彌迦的力量，是為了說明過犯；他也先為百姓哀號（見第一章）。檢驗標準是：我的話，經得起經文與同伴的檢驗嗎？"],["p","第四個偏差，是把十二節，講成預言今天某一座城市，或某一個聖地的末日。經文說的是，彌迦當時的錫安；耶利米書也告訴我們，那一次，王與百姓悔改，神就後悔。本講義不推算時間，也不套用到今日任何地方。檢驗標準是：聽完以後，會眾是更敬畏神，還是更關心新聞？"],["p","第五個偏差，是把十一節「神不是在我們中間嗎」，當成護身符：因為我們有聖經、有聖殿、有教會，所以神一定與我們同在，不必悔改。神的同在，是恩典，也是責任。檢驗標準是：我是不是把「神與我同在」，當成不改變的理由？"],["d",["有人用「不可論斷神的僕人」，不讓人問帳目和決策，怎麼辦？","尊重和問責，可以同時存在。聖經要我們尊敬那些勞苦的人（帖撒羅尼迦前書五章十二至十三節），也提醒我們，指控長老需要兩三個見證人（提摩太前書五章十九節）；保羅自己收奉獻的時候，也要避免任何嫌疑，把一切放在光中（哥林多後書八章二十至二十一節）。所以，問帳目、問決策，不是論斷，而是一種愛：愛那位僕人，也愛這個群體。你可以先做兩件事：第一，用尊重的語氣，把問題寫下來；第二，按正常的、公開的管道提出，不在背後議論。若遇到被刻意壓住、甚至受到傷害，請找可信的長者或專業的協助。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們這個文化，很重視「尊敬長輩」、「尊師重道」，這是美德。可是，當這份尊敬，變成「不能問」、「不能說」，它就會變成保護傘，保護那個不該被保護的人。在教會裡，「不要論斷神的僕人」，有時被用來擋住所有合理的問題；在家裡，「爸爸說了算」，也可以擋住所有的對話。彌迦書三章告訴我們：位置越高，越需要被檢驗；敬重，不等於不問。"],["p","第二個問題：我們很習慣「人情」和「關係」。逢年過節送禮，辦事前先請託，認識一個人，事情就比較好辦。這裡面，有很多美好的情意，也有很多模糊的灰色地帶。十一節說：「首領為賄賂行審判；祭司為雇價施訓誨；先知為銀錢行占卜。」（彌3:11）當「關係」可以影響判斷，公平就開始，一點一點被侵蝕。我們不需要把每一份禮物，都當成賄賂；但我們需要問：這份心意，有沒有影響，一個本該公平的決定？"],["d",["送禮、請託，是不是都是賄賂？","不是。感謝一個人，表達心意，是美德。分別的標準，在於兩件事：第一，對方，是不是在一個「需要公平判斷」的位置上？第二，我送這份禮的時候，是不是希望他，偏向我？若兩個答案都是「是」，那就接近賄賂了。你可以用三個問題，檢驗：這份禮，公開了，我敢不敢？事後送，還是事前送？有沒有影響，一個本該公平的決定？不需要論斷別人的文化，也不需要把每一件事，都想成罪；只要在自己的小位置上，守住一件事：不用手上的位置，多拿一點。"]],["h","七、活出321——知道公平，藉靈說話"],["p","第一個基礎，耶穌是我的榜樣。耶穌是真正「知道公平」的那一位：祂有權柄，卻不用權柄多拿；祂有位置，卻彎腰洗門徒的腳。祂說真話，也為說真話付上代價。我們學彌迦，其實是學耶穌：位置越高，腰彎得越低。"],["p","第二個基礎，聖經是我的準則。我們不是用「大家都這樣」，來判斷什麼是公平，而是讓經文先說話。三章一節問：你們不當知道公平嗎？這是我們每次做決定的準則：不是對我有利，而是對神的公平。"],["p","第三個基礎，聖靈是我的引導。彌迦說：「我藉耶和華的靈」。沒有聖靈，我們的力量，只是脾氣；沒有聖靈，我們的公平，只是偏見。求聖靈在我們要說話、要判斷、要拒絕的時候，先帶領我們；也求祂在我們沉默得太久的時候，推我們一把。"],["p","第一個核心，讓耶穌作王。讓耶穌作王，就是把我手上的位置，還給祂。我是管家，不是主人；我有位置，是為了服事，不是為了拿取。"],["p","第二個核心，讓耶穌得著一切的榮耀。彌迦說完話，不是得著名聲，而是回到眼淚與孤單。凡是被神使用的，都是祂的靈、祂的恩典；榮耀不歸給彌迦，歸給耶穌。"],["p","一個目的，建立屬神的體系。屬神的體系，不是一座用人血、用罪孽建造的錫安，而是一個首領為神的公平行審判、祭司為神的真理施教導、先知為神的話說預言的群體。每一個有位置的人，先問自己：我在這個位置上，是在建造，還是在拿取？"],["d",["讓耶穌作王，對有位置的人，具體是什麼意思？","意思是：我把這個位置，當成別人託付給我的。一個家長，不把孩子當成自己的財產；一個主管，不把部屬當成自己的工具；一個帶領者，不把小組當成自己的舞台。具體的做法，可以從三件事開始：第一，做決定以前，先問一句：這個決定，對最弱的那一個人，公平嗎？第二，每一個月，讓一位你信任、又敢對你說真話的人，檢查一次你的決定與花費。第三，當別人提出質疑，先說謝謝，再回去禱告，不急著辯護。這三件事，都不大，卻是在說：耶穌是王。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我在這個位置上，是因為我有能力，我拿這些，是應得的。經文對他說：一節的問題是「你們不當知道公平嗎？」神問的，不是你有沒有能力，而是你有沒有知道。你可以先問：我今天多拿的那一點，若被神看見，我還敢不敢？"],["p","恐懼型的人說：我是在一個有權柄的人手下，我不敢說。經文對他說：彌迦也是一個沒有位置的鄉下人，他卻「藉耶和華的靈」，說出口；神沒有要你一個人撐，祂要你先藉著祂的靈。你可以從禱告開始，求神給你智慧，也給你可信的同伴。"],["p","羞恥型的人說：我曾經多拿過，我曾經送過禮，也收過禮，我不配再說話。經文對他說：希西家與百姓聽了彌迦的話，神就後悔；神給的，是回頭的門，不是定罪的牆。你可以對一位可信的同伴說：我曾經做過一件事，我想要把它擺正。"],["p","受傷型的人說：我被一個有位置的人傷害了，我現在聽到「首領」兩個字，就覺得痛。經文對他說：神看見被剝皮、被剔肉的人；祂沒有叫受傷的人，立刻原諒；祂先責備那個傷人的。你不需要一次讀完這一章；若這一章，讓你更痛，請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找出你手上的一個「位置」：家長、主管、帶領者、財務、評審，任何一個。今天，用一句話寫下：這個位置，可能被我用來多拿的地方是什麼？"],["p","第二，找出一個「小小的多拿」：多報的一點時間，多留的一點好處，一份不太透明的帳目。這個星期，把它擺正，或找一位可信的同伴，一起檢查。"],["p","第三，找一位你信任、又敢對你說真話的人，請他在下一個月，用一句話，告訴你：他在你身上，看見的最需要小心的地方。"],["p","第四，下次你要說一句不容易說的話以前，先安靜十秒，對神說：主，求祢的靈，先充滿我；若這句話，不是祢要我說的，求祢使我安靜。"],["p","第五，下一次你收到一份禮物、或要送一份禮物，先問自己：這份心意，會不會影響，一個本該公平的決定？若會，就先暫停，與一位同伴討論。"],["p","我宣告：我知道公平，我不用我的位置，多拿一點。"],["p","我宣告：我不倚賴「神在我們中間」，就不悔改；我要在神面前，誠實。"],["p","我宣告：我要藉耶和華的靈說話，不因怕人，也不為討好人。"],["p","我宣告：耶穌是我的榜樣，祂有位置，卻彎腰服事；我也要這樣活。"],["d",["這個星期，我怎樣開始，讓公平從自己的小位置做起？","可以從一件很小、可以檢查的事開始。先選一個你「說了算」的地方：也許是家裡的零用錢、公司的報帳、小組的奉獻。再選一個動作：把它攤開來，給一位你信任的人看。你可以對他說：「我想請你幫我看一看，這裡有沒有我不小心多拿的地方。」說之前，先禱告，求神給你誠實的心；說完以後，不管對方怎麼說，先說謝謝。若你發現，有一件事，需要補回來，不要自責，先為它禱告，再用一個小動作，去修復。公平，從來不是一次完成的，而是一次一次，擺正的。"]],["h","十、結語"],["p","彌迦書第三章，是一張被收買的評分表、一幅走差路的先知漫畫、一個鄉下先知的「至於我」，和一塊被犁過的田。開頭，是神問：你們不當知道公平嗎；中間，是彌迦說：我藉耶和華的靈，滿有力量；最後，是錫安必被耕種像一塊田。"],["p","在這一章，神讓我們看見祂的心：祂是一位，把位置交給人、也要人交帳的神；祂是一位，不收買、不偏待、也不沉默的神；祂也是一位，在審判之前，還要差遣一個人，用靈與力量，把話說出來的神。祂的斥責裡，有一個要人回頭的邀請。"],["p","這一章也提醒我們，審判與希望，不是兩個世界。三章的最後，是被耕的田；可是四章的開頭，是堅立的山。神把田耕過，不是為了荒廢，而是為了重新栽種。我們若願意被神耕過，我們的位置、我們的公平，就會成為一塊可以長出果子的土地。"],["p","所以，請你記得這一課的三個重點：斥，神問我們，知不知道公平；聽，我們藉著祂的靈，聽見與說出；耕，若不回頭，神的話必然成就；若回頭，祂必後悔。這一課的焦點，不在你找到了誰是壞首領、誰是假先知，不在耶路撒冷何時被耕，而是那位有位置、卻彎腰洗腳，並為公平付上生命的耶穌。"],["p","親愛的天父，謝謝祢，把公平放在我們心裡；求祢使我們，知道公平，也行出公平；求祢的靈，充滿每一位有位置的人，使我們不多拿、不偏待、不沉默；也求祢醫治每一位被權柄傷害的人，使他們知道，祢看見。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 彌迦書三章一節：你們不當知道公平嗎？你現在有沒有一個「位置」，可以說了算？請說出一個，例如家長、主管、帶領者。"],["n","2. ★ 三章十一節：為賄賂、為雇價、為銀錢。你有沒有一件事，曾經因為人情或好處，讓你的判斷變得不那麼公平？請說出是哪一類，不必細節。"],["n","3. ★★ 三章八節：我藉耶和華的靈。你有沒有一個時刻，因為神的靈，讓你說出了一句該說的話？請用一句話說出那一次。"],["n","4. ★★★ 請在安靜中想一件事：一件你在自己位置上「多拿了一點」的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起擺正。"],["m","帶領提醒：請先安靜念三章一節，再開始。不要點名逼人說。這一章會碰到被有位置的人傷害、被剝削、被忽略：若有人提到性暴力、家庭暴力、屬靈權柄的傷害、流產、失去孩子、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照三章九、十節，你覺得自己「位置」中，哪一處最容易變成「多拿」？請只說出一個，例如時間、金錢、尊重、決定權。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀三章八節與十二節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：三章十一節說，他們「倚賴耶和華，說：耶和華不是在我們中間嗎」。請用自己的話向組員說明：為什麼「神與我同在」，不能當成不悔改的理由？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先擺正哪一件「多拿」的事，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一次檢查、一通電話、一次道歉；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，在你手下或你照顧之下，曾經沒有被公平對待的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一件事，因為「不要論斷」，沒有人敢問？請說出你可以怎樣，用尊重的語氣開口。"],["n","12. ★★ 你有沒有一位，曾經在你有位置的時候，敢對你說真話的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「活出公平」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何地方、國家或領袖。若有人分享被權柄傷害、被剝削、家庭暴力或長期被忽略的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件「多拿」的事，放在神面前。一起念三章八節。"],["p","由帶領者為每一位禱告：求神使我們知道公平，也藉祂的靈說話。散會前，彼此問一句：你這星期要先擺正哪一件事？"]]},"4":{"no":4,"vol":"《321彌迦書講義》第4課·彌迦書第4章","title":"末後的日子——山、犁、救","chars":4745,"min":60,"deep":8,"dchars":1466,"tchars":1298,"blocks":[["h","一、殿的山，與犁頭（4:1--3）"],["p","弟兄姊妹平安。前幾年，我回老家，發現阿公的老房子被拆了。那是一棟很普通的磚房，院子裡有一棵芭樂樹，牆上還留著我們小時候量身高的刻痕。站在一堆磚瓦和鋼筋中間，我忽然覺得，心裡空了一塊：好像有一段很長的日子，被人一把推倒，連一句再見都沒有。後來，那塊地蓋起了新的大樓，很漂亮，也很安全，可是，每次經過，我還是會往那個方向看一眼。"],["p","彌迦書三章的最後一句話，就是這樣的一句話：「這殿的山必像叢林的高處。」意思是，聖殿所在的山，要變成荒廢的樹林。讀到這裡，我們心裡也會空了一塊。可是，四章的第一句，神說了一句很不一樣的話：「末後的日子，耶和華殿的山必堅立，超乎諸山，高舉過於萬嶺；萬民都要流歸這山。」（彌4:1）"],["p","請你注意這個順序：先是被拆，然後是被重建。神沒有略過那一段廢墟，祂是先讓我們看見廢墟，再讓我們看見新的山。三章是診斷，四章是應許。三章的聽眾，是需要被斥責的首領；四章的聽眾，是需要被安慰的百姓。同一位神，同一個先知，同一卷書，這是彌迦書的呼吸：吸進去的，是真話；呼出來的，是盼望。這是一個先拆後建、先診斷後應許的順序，我們讀聖經，也要有耐心讀到下一章。"],["p","二節說，將來有許多國的民前往，說：「來吧，我們登耶和華的山，奔雅各神的殿。主必將他的道教訓我們；我們也要行他的路。」（彌4:2）你看，萬民奔走的原因，不是軍隊，也不是金錢，而是「道」，也就是神的教訓。他們不是被趕來的，是被吸引來的；吸引他們的，是一個地方，那裡有人真的在聽神說話。"],["p","三節說，在神施行審判之後，「他們要將刀打成犂頭，把槍打成鐮刀。這國不舉刀攻擊那國；他們也不再學習戰事。」（彌4:3）這是整卷書，最著名的一幅圖畫：本來是殺人的鐵，變成種田的鐵。請注意，這是神施行審判、斷定是非之後的和平；不是人類自己，靠著一個運動，就可以完成的口號。這一段，以賽亞書二章二至四節，也有幾乎一樣的話，可見這是那個時代，神的百姓共同的盼望。"],["d",["「末後的日子」是不是指世界末日？","這個詞，在希伯來文的意思，比較像「後來的日子」，在聖經裡，用的範圍很廣，有時是不久的將來，有時是更遠的時代。所以，我們不能只憑這個詞，就算出一個日期，更不能把它和今天的新聞，一對一地連起來。本講義的立場是：不算日子，也不排時間表。我們要做的，是抓住這一節的重點：神已經應許，祂的山要堅立，萬民要來學習祂的道；這個盼望，足夠讓我們今天，在還沒看見的時候，仍然願意聽祂的話。"]],["h","二、葡萄樹下，與行走（4:4--5）"],["p","四節的圖畫，是整卷書最溫柔的一幅：「人人都要坐在自己葡萄樹下和無花果樹下，無人驚嚇。」（彌4:4）請你想像：一個普通的人，一個普通的下午，坐在自己的樹下，沒有人驚嚇他。沒有警報，沒有債主，沒有突然的壞消息。這是神的國，最小的、最私人的樣子。"],["p","在彌迦的時代，擁有一棵葡萄樹、一棵無花果樹，就是擁有一份安穩，因為每一個家庭，都有自己的一塊地。可是我們已經在二章與三章看見，這份安穩，如何被圖謀、被奪取、被剝皮。所以，四章的這一幅圖，是對所有失去安穩的人，說的一句話：神要把這個安穩，還給你。"],["p","請你想一想，一棵葡萄樹，要幾年才結果？一棵無花果樹，也要好幾年。坐在這樣的樹下，需要的是耐心與時間。所以這一幅圖畫，也在邀請我們：不要只求一個快速的答案，而要願意種下去，等它長大。"],["p","五節接著說，萬民各奉己神的名而行，「我們卻永永遠遠奉耶和華」我們神的名而行。這是整章最重要的一個動詞：行走。信仰，不只是相信，而是一條要走的路。別人走他們的路，我們走我們的路；這不是驕傲，而是一個宣告：我們的腳步，要跟著誰。"],["p","請注意，五節不是說「我們將來要」，而是說「我們永永遠遠」。也就是說，這一個宣告，不是等到末後的日子才開始，而是從今天，就開始。末後的日子，會把這條路的終點，顯明出來；可是這條路的起點，是今天，你要不要，奉神的名而行。"],["d",["「人人坐在自己葡萄樹下」，是不是說信徒都應該買房子、過安穩的日子？","不是。這是神的國的圖畫，不是對每一個信徒，現在就一定會有的物質保證。新約裡，有許多信主的人，是在流離、迫害、貧窮中，仍然相信耶穌；他們沒有得到一棵自己的樹，卻得到了真正的平安。四節給我們的，是一個方向：神要的，是一個沒有人驚嚇的國度。所以，我們今天要做的，不是追求更多的財產，而是在自己所在的地方，成為讓別人「不被驚嚇」的人：不欺壓、不奪取、不製造恐懼。"]],["h","三、原文亮光：訓誨、瘸腿、救贖（4:2--10）"],["p","這一章，有三個字，如果你記得，就記得了整章的路：訓誨、瘸腿、救贖。我們用三十秒，一個一個，把它轉成生命。"],["p","第一個字，是二節的 תּוֹרָה（torah），和合本譯作「訓誨」。這個字，常常被譯成「律法」，可是它最基本的意思，是「指引」、「教導」，像一位父親，指著路，告訴孩子：往這邊走。萬民要流歸的，不是一套規條，而是一位願意指路的神。三十秒轉成生命：今天，在你遇到一個難決定的事情以前，先對神說：主，請祢指引我。"],["p","第二個字，是六節的 הַצֹּלֵעָה（hatsolea），意思是「那瘸腿的」。這是一個很具體的字，指的是真實的、行走不便的人。神說：「我必聚集瘸腿的，招聚被趕出的和我所懲治的。」（彌4:6）請注意，神的聚集，從最走不快的人開始。我們不把這個字，當成軟弱的比喻，更不拿身體的殘缺，來比喻靈命的缺乏。經文說的，是神真的看見，那些被落在後面、被趕出去的人。三十秒轉成生命：這個星期，想一個在群體裡，走得比較慢的人，主動問他一句：我可以怎樣陪你走一段？"],["p","第三個字，是十節的 יִגְאָלֵךְ（yig'alekh），意思是「祂必救贖你」。這個字根，是「贖回」，常常用在家族裡，一位近親，把失去的產業，或被賣掉的人，贖回來。路得記裡的波阿斯，就是這樣的「贖回的人」。神在十節說：「在那裡耶和華必救贖你脫離仇敵的手。」（彌4:10）三十秒轉成生命：今天，找一個你覺得「已經失去、無法贖回」的東西，也許是一段關係，也許是一個機會，對神說：主，祢是贖回的神，請祢在這裡，作我的近親。"],["p","這三個字連起來，是整章的路：神教導我們走路，神聚集那走得慢的人，神贖回那失去的人。"],["d",["「訓誨」這個字，只是「律法」的意思嗎？","不只是。torah 的字根，有「射箭、指向」的意思，像是把箭，指向一個目標。所以，這個字，不只是「規定什麼可以做、什麼不可以做」，而是「指出方向」。這也是為什麼，二節說，萬民要上去，因為「主必將他的道教訓我們；我們也要行他的路」。他們要學的，是一條路。你可以這樣用：當你讀聖經，遇到一段不容易懂的話，不要只問「我該不該遵守」，也可以問：這段話，要指向哪一個方向？這樣，聖經就不再只是一本手冊，而是一位父親的手勢。"]],["h","四、哭號、疼痛，與在那裡蒙解救（4:6--13）"],["p","六、七節，是這一章的中心：「耶和華說：到那日，我必聚集瘸腿的，招聚被趕出的和我所懲治的。我必使瘸腿的為餘剩之民，使趕到遠方的為強盛之民。耶和華要在錫安山作王治理他們，從今直到永遠。」（彌4:6--7）請你看，神聚集的人，有三種：瘸腿的、被趕出的、被神自己懲治的。最後這一種，最令人意外：連被神懲治過的人，也在祂的聚集之內。"],["p","接下來，九節問了一個很真實的問題：「現在你為何大聲哭號呢？」（彌4:9）錫安的百姓，疼痛得像生產的婦人，因為眼前，是一個沒有王的局面。可是十節說，這個疼痛，不是白費的：「因為你必從城裡出來，住在田野，到巴比倫去。在那裡要蒙解救；在那裡耶和華必救贖你脫離仇敵的手。」（彌4:10）"],["p","請你注意兩個「在那裡」。神沒有說：你不用去巴比倫；神說的是，你要去，但是，在那裡，我要救你。這是一個很深的安慰：神的救贖，不是在流亡之前，也不是在流亡之後，而是在流亡之中。許多時候，我們求神，不要讓我們去那個陌生的地方；神卻說：你去，因為我在那裡等你。"],["p","所以，若你今天，正站在一個你不想去的「那裡」，請你記得：神沒有缺席，祂在那裡，與你同在。但若那個「那裡」，是一個傷害你的地方，神也不要你留在那裡，請先尋求保護。"],["p","十一至十三節，說到許多國的民聚集攻擊錫安，他們說：「願錫安被玷污！」神的回答是：「他們卻不知道耶和華的意念，也不明白他的籌劃。」（彌4:12）他們以為自己在攻擊，其實，是被神聚集，像禾捆被聚到禾場。這是詩的語言，要我們看見：神的計畫，比人的算計，大得多。請注意，這幾節的圖畫，不是給我們用來為任何暴力辯護的，也不是用來指某一個今天的國家。我們讀它，是為了看見，在最黑暗的時候，神仍然在掌權。"],["d",["「在巴比倫蒙解救」，是不是說，受苦是神的安排，我應該忍耐？","不是，這一點，請你特別留意。十節說的，是神在流亡中的同在與救贖，不是說，苦難本身是好的，也不是說，人應該留在傷害裡。若有人用這一節，勸一位正在被暴力對待、被虐待的人說：「神要你留在那裡，忍耐。」這是對經文的誤用。神是救贖的神，祂不是要人留在傷害裡；祂要人被救出來。若你或你認識的人，正在被傷害，請先確保安全，找牧者、輔導，或專業的協助。神的同在，與你尋求保護，不但不衝突，而且常常，就是神的方法。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「末後的日子」，講成一個日程表，推算哪一年，這座山要堅立，萬民要來。經文沒有給日期，新約也沒有；本講義不算日子，不排時間表。檢驗標準是：會眾是更盼望神的國，還是更熱衷於預測時間？"],["p","第二個偏差，是把三節「刀打成犂頭」，變成一個政治口號，或某一種立場的標語，無論是支持還是反對任何一個國家的政策。這一節說的，是神施行審判以後的和平，不是人類靠自己，就能完成的運動，也不是給教會用來介入任何政策辯論的。檢驗標準是：聽完以後，會眾是更仰望神的審判與憐憫，還是更熱衷於爭論別人？"],["p","第三個偏差，是把六節的「瘸腿的」，當成軟弱的比喻，說「我們都是瘸腿的」，或把身體的殘缺，拿來形容靈命的不足。這樣的講法，會傷害真實有身心障礙的弟兄姊妹。經文說的，是神真的看見那些被落在後面的人。檢驗標準是：身邊那位行動不便的人，聽完這一課，是被看見，還是被當作比喻？"],["p","第四個偏差，是把十節的「到巴比倫去」，講成「苦難是神刻意的安排，所以不要求助、不要離開」，特別是對正在受傷害的人說「你要忍耐」。經文說的，是神在流亡中救贖；神不是要人留在傷害裡。檢驗標準是：聽完以後，受傷的人，是更有勇氣尋求保護，還是更不敢開口？"],["p","第五個偏差，是把十一至十三節的「許多國聚集」、「踹穀」，套用到今天某一個國家，或用來為暴力辯護。這幾節是詩的語言，要我們看見神的掌權，不是給人拿來定敵人的。檢驗標準是：我讀完這一段，是更愛人，還是更怕人？"],["d",["有人用「刀打成犂頭」當政治口號，我怎麼回應？","可以先欣賞他心裡的渴望：他想要和平，這是好的。然後，你可以溫和地問三個問題：第一，這一節是在說誰「打」？經文說，是神「施行審判，斷定是非」之後，他們才這樣做。第二，這一節的和平，是怎麼來的？是因為萬民，「登耶和華的山」，學習祂的道。第三，我自己，是不是已經把刀，變成犂頭了？也就是說，我心裡的怨恨、我家裡的冷戰，有沒有轉成種田的工具？然後你可以說：我們一起為和平禱告，也從自己的小地方，開始。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很重視「安居樂業」，也很看重「有一個自己的家」。買房子、置產業，是許多華人家庭一輩子的夢想，也是安全感的來源。四節的「人人坐在自己葡萄樹下」，很容易被我們，讀成「有一個自己的房子」。這個渴望，本身並不是錯的；問題是，我們很容易，把「神的國」，換成「我的安穩」。彌迦要我們看見的，是一個沒有人驚嚇的國度，而不只是一個我不被驚嚇的家。"],["p","第二個問題：許多華人弟兄姊妹，因為工作、婚姻、家人或各種原因，在離開故鄉的地方生活。十節的「住在田野，到巴比倫去」，對他們來說，不是一個遙遠的故事。離散，常常帶來孤單、語言的隔閡、身分的不確定。經文沒有說，離散是好的；它說的是，神在那裡。「在那裡」，是你現在住的城市、你現在上班的公司、你現在用外語說話的教會；神，在那裡救贖。"],["d",["在異地生活很孤單，這一章能給我什麼？","它給我們三件事。第一，神的聚集，是從「瘸腿的、被趕出的」開始的，所以，你的孤單，不是被神忘記的證據。第二，十節說「在那裡」，神沒有等你回到故鄉，才開始救贖；祂在你現在站的地方，開始。第三，六節說神「聚集」，所以，你可以向神求一個小小的「聚集」：一位同鄉、一位同伴、一個每週可以去的地方。具體的做法，可以從這個星期，找一個人，邀請他吃一頓飯，或通一次電話。若孤單已經變成長期的沉重、失眠，或不想活下去的念頭，請尋求專業的協助，這不是軟弱，是智慧。"]],["h","七、活出321——神的山，我們的路"],["p","第一個基礎，耶穌是我的榜樣。耶穌走過一條「在那裡蒙解救」的路：祂被趕出城外，被釘在十字架上，在那裡，祂為我們，完成了真正的救贖。祂不是遠遠地站在山上，指揮我們；祂親自走進了我們的巴比倫。"],["p","第二個基礎，聖經是我的準則。我們不是用「我的盼望」，來解釋這一章，而是讓這一章，來形塑我們的盼望。這一章的盼望，是：神的山要堅立，神的道要教訓萬民；這個盼望，成為我們每天做決定的準則。"],["p","第三個基礎，聖靈是我的引導。五節說，我們要「奉耶和華我們神的名而行」。行走，需要引導。沒有聖靈，我們的腳步，會自己走偏；求聖靈使我們每天，知道往哪一條路走。"],["p","第一個核心，讓耶穌作王。七節說：「耶和華要在錫安山作王治理他們。」讓耶穌作王，就是在我們還沒有看見完全應驗的時候，已經讓祂，在我們的家、我們的工作、我們的錢袋裡，作王。"],["p","第二個核心，讓耶穌得著一切的榮耀。萬民來到山上，不是因為人很偉大，而是因為神的道，從那裡出來。我們所有的成就、所有的被聚集，都不是我們的，榮耀都歸給耶穌。"],["p","一個目的，建立屬神的體系。屬神的體系，是一個被聚集的群體：瘸腿的、被趕出的、被神懲治過的，都在裡面。他們在山上學習神的道，在山下，把刀打成犂頭；他們坐在自己的樹下，卻也讓別人，不被驚嚇。"],["d",["讓耶穌作王，和「末後的日子」有什麼關係？","有很大的關係。「末後的日子」，是神的國完全顯明的時候；可是，讓耶穌作王，是從今天，就開始的。我們不需要等到那一天，才讓祂作王。具體的做法，可以從一個地方開始：在你的生活裡，找一個你還不放心交出來的角落，也許是你的錢、你的時間，或你的一段關係，對祂說：主，這裡，祢來作王。你不需要一次交出全部，只要先交一個；交出來以後，再看看神怎樣在那裡作王。每一次這樣說，就是把「末後的日子」，提前一小步，帶進今天。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我已經知道神的道，我不需要再去「學習」。經文對他說：二節說，萬民說的是：「主必將他的道教訓我們」。連萬民，都願意被教導；你呢？你可以先問：我上一次，真正被神的話，改變了一個想法，是什麼時候？"],["p","恐懼型的人說：我怕離開我熟悉的地方，怕要去「巴比倫」。經文對他說：十節說，「在那裡」，神要救贖你；神不是把你推出去，而是，先在那裡等你。你可以把你最怕的那個「那裡」，具體地說給神聽，並請一位同伴，陪你一起去。"],["p","羞恥型的人說：我曾經是那個被神「懲治」的人，我不配被聚集。經文對他說：六節說，神聚集的，包括「我所懲治的」；祂不是聚集完美的人，而是聚集願意回來的人。你可以對一位可信的同伴說：我曾經做過一件事，我想要回來。"],["p","受傷型的人說：我是被趕出來的，被忽略的，我已經不相信，有一個地方，可以讓我坐下。經文對他說：神說，我必招聚被趕出的；祂記得你。你不需要一次相信全部；今天，只要讀一句：「他們要…坐在自己葡萄樹下，無人驚嚇」，然後，對神說：主，我想要這樣的地方。若這一章，讓你更痛，請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找出一個你還不放心交給耶穌作王的角落：錢、時間、一段關係，或一個計畫。今天，用一句話，把它交出來：主，這裡，祢來作王。"],["p","第二，找出一個「走得比較慢」的人：行動不便的、剛搬來的、剛失去的、不太說話的。這個星期，主動問他一句：我可以怎樣，陪你走一段？"],["p","第三，檢查你心裡的「刀」：一段你一直握著的怨恨，或一場你一直不肯停下的冷戰。這個星期，用一個小動作，把它變成「犂頭」：一則問候、一次道歉，或一次禱告。"],["p","第四，每天用三十秒，問自己一個問題：我今天，是奉誰的名而行？連續七天，把你的答案，寫下一句。"],["p","第五，找一個你認識的、正在「巴比倫」的人：離開家鄉的、剛換工作的、正在經歷失落的人。這個星期，為他禱告三次，並傳一則訊息給他。"],["p","我宣告：耶和華的山必堅立，我要讓祂在我的生活裡作王。"],["p","我宣告：我要奉耶和華我們神的名而行，從今天直到永遠。"],["p","我宣告：神聚集瘸腿的、被趕出的，我也要成為一個接納人的人。"],["p","我宣告：耶穌是我的榜樣，祂走進我的巴比倫，我也要走進別人的。"],["d",["這個星期，我怎樣把「我們奉耶和華的名而行」活出來？","可以從一個很小的習慣開始：每天早上，出門以前，用三十秒，對神說：主，今天我奉祢的名而行；晚上回家以後，用三十秒，問自己一句：今天，哪一件事，是我奉祂的名做的？哪一件，我忘記了？不需要責備自己，只要誠實。連續七天，你會發現，有些地方，你很容易記得；有些地方，你一直忘記。那些「一直忘記」的地方，就是神要你，先交出來的地方。把它寫下來，這個星期，一起交給祂。神很會等，也很會用一個小小的習慣，帶人走很遠的路。"]],["h","十、結語"],["p","彌迦書第四章，是一座被拆的老房子後面，重新升起的山；是一幅把刀打成犂頭的圖畫；是一個坐在葡萄樹下、無人驚嚇的下午；也是一句在巴比倫響起的應許。開頭，是「末後的日子，耶和華殿的山必堅立」；中間，是「我們卻永永遠遠奉耶和華我們神的名而行」；最後，是「在那裡耶和華必救贖你脫離仇敵的手」。"],["p","在這一章，神讓我們看見祂的心：祂是一位，把廢墟後面的山，也先預備好的神；祂是一位，從走得最慢的人開始聚集的神；祂也是一位，在流亡之中，也在那裡等我們的神。祂的審判後面，有一個要人安坐的國度。"],["p","這一章也提醒我們，盼望，不是對現實的逃避，而是對現實的另一種眼光。三章的結尾，是被耕的田，我們也許會哭；可是四章說：這不是最後一句。神把話說完，才是最後一句。"],["p","所以，請你記得這一課的三個重點：山，神的山要堅立，萬民要來學祂的道；犁，我們要把刀變成犂頭，從自己的小地方開始；救，神在我們的「那裡」，必要救贖。這一課的焦點，不在於你有沒有算出末後的日子，不在於你站在哪一個政治立場，也不在於誰是仇敵，而是那位被趕出城外、在那裡完成救贖，並要在錫安山作王的耶穌。"],["p","親愛的天父，謝謝祢，在廢墟後面，也為我們預備了山；求祢教導我們祢的道，使我們願意行祢的路；求祢聚集瘸腿的、被趕出的、疲乏的人，使他們知道，祢看見；也求祢在我們每一個「那裡」，作我們的救贖主。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 彌迦書四章四節：人人坐在自己葡萄樹下，無人驚嚇。你最想要的「平安」，是什麼樣子？請用一句話說出來。"],["n","2. ★ 四章五節：我們要奉耶和華我們神的名而行。你現在每天走的路，有哪一個地方，最容易忘記「奉誰的名」？請說出一個。"],["n","3. ★★ 四章六節：我必聚集瘸腿的。你有沒有一個時刻，感覺自己被落在後面、被神看見？請用一句話說出那一次。"],["n","4. ★★★ 請在安靜中想一件事：一件你一直握著的「刀」，也許是一段怨恨，也許是一場冷戰。現在用一句話寫下它，並寫下你願意讓誰陪你，一起把它變成犂頭。"],["m","帶領提醒：請先安靜念四章四節，再開始。不要點名逼人說。這一章會碰到被趕出、離散、孤單與痛苦：若有人提到性暴力、家庭暴力、流產、失去孩子、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照四章十節，你現在有沒有一個「那裡」，是你最不想去、卻正在經歷的？請只說出一個，例如工作、關係、異地。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀四章六、七節與十節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：十節說「在那裡」神要救贖。請用自己的話向組員說明：為什麼這一節，不是叫人留在傷害裡？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先把哪一個角落，交給耶穌作王，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一通電話、一則問候、十分鐘禱告；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，走得比較慢、被落在後面的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一位剛搬來、離開故鄉或孤單的人？請說出你可以怎樣，這個星期邀請他。"],["n","12. ★★ 你有沒有一位，曾經在你的「巴比倫」陪著你的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「奉耶和華的名而行」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。不要用「到巴比倫去」勸任何人留在傷害裡。若有人分享被傷害、被趕出、離散、失去孩子或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一把「刀」，放在神面前。一起念四章四節。"],["p","由帶領者為每一位禱告：求神使我們把刀變成犂頭，也使我們在自己的「那裡」，遇見祂的救贖。散會前，彼此問一句：你這星期要先交出哪一個角落？"]]},"5":{"no":5,"vol":"《321彌迦書講義》第5課·彌迦書第5章","title":"伯利恆的以法他啊——小、生、安","chars":4756,"min":60,"deep":8,"dchars":1466,"tchars":1302,"blocks":[["h","一、地圖上找不到的小地方（5:1--2）"],["p","弟兄姊妹平安。你有沒有試過，在手機的地圖軟體上，找一個很小很小的村子？你把畫面放大，再放大，放到手指都酸了，還是只有一條細細的線，連名字都沒有顯示出來。你需要先找到旁邊一個比較大的鎮，才能知道，它大概在哪裡。其實，我們每一個人，都有一個這樣的「小地方」：童年的小鎮、第一份很小的工作、一段沒有人知道的日子。有些地方，在地圖上，真的小到可以被忽略。彌迦書第五章，就是從這樣一個地方，開始說話的。"],["p","可是，彌迦書第五章，神的眼睛，偏偏看著這樣的一個地方。二節說：「伯利恆的以法他啊，你在猶大諸城中為小，將來必有一位從你那裡出來，在以色列中為我作掌權的；他的根源從亙古，從太初就有。」（彌5:2）請你想想這個場景：前一節，是敵人圍城，以色列的審判者，被人用杖擊打臉頰（彌5:1），整個國家，被打得抬不起頭來。人們會期待，神怎麼回應？也許是一位強大的將軍，也許是一個堅固的首都。可是，神說的，卻是一個「為小」的地方。"],["p","伯利恆，離耶路撒冷不遠，是一個農村小鎮。它是大衛的出生地，可是，在彌迦的時代，它早就不是一個重要的城市了。神沒有選擇宮殿，也沒有選擇聖殿，祂選擇了那個在地圖上，最容易被略過去的地方。這是整卷書，最讓人安靜的一個轉折：神的救贖，不從高處開始，從小處開始。這也是為什麼，每一年的聖誕節，我們不是仰頭看一座宮殿，而是低頭看一個馬槽。"],["p","這一節，在新約裡，有清楚的回聲。馬太福音二章五至六節，記著祭司長和文士，向希律王回答，基督要生在哪裡，他們引用的，正是這一節。約翰福音七章四十二節，也有人提到，基督要從伯利恆出來。所以，這一節，不只是彌迦的盼望，也是整本聖經，一直指向的方向。"],["p","請你想一想，若神選擇的是一個宮殿，我們會怎麼想？我們大概會想：神是為有條件的人預備的。可是，神選擇了伯利恆，這就等於對每一個覺得自己不夠的人，說：我的方式，是從你這裡開始。"],["p","請你留意，彌迦沒有說：這位掌權者，是一個我們早就認識的人；他說的是「將來必有一位」。換句話說，這位牧者，不是我們自己造出來的，不是靠我們的努力，爬上來的；他是神自己，從一個小地方，差遣出來的。這就是這一課的第一個字：小。"],["d",["「小」是不是說，神喜歡小的、不喜歡大的？","不是。神不是因為「小」本身好，才選擇伯利恆；而是祂，常常從別人忽略的地方，開始祂的工作，好叫榮耀歸給祂，不歸給人。大，不是罪；小，也不是功勞。經文要我們看見的，是神的選擇，不是人的條件。所以，若你覺得自己很小，不需要自卑；若你覺得自己很大，也不需要驕傲。這是神的方式，也可以成為我們的方式。你可以先問一個問題：在我所在的地方，有沒有一個「小」的人或「小」的事，是我一直忽略的？今天，找一個，給他一句話：我看見你。"]],["h","二、直等那生產的婦人（5:3--4）"],["p","三節說：「耶和華必將以色列人交付敵人，直等那生產的婦人生下子來。」（彌5:3）這一節，有兩個畫面，擺在一起：一個是「交付敵人」，一個是「生產的婦人」。前者是黑夜，後者是黎明；前者是等待，後者是新生。"],["p","請注意，神並不是說：我要把你們，永遠交給敵人；祂說的是「直等」。也就是說，這個交付，有一個終點。這個終點，不是一個日期，而是一個生命的誕生。經文沒有告訴我們，這位婦人是誰，我們也不需要猜。我們可以看見的是：神說的「直等」，像是一位母親，一邊忍著疼痛，一邊盼望那個生命出來。等待，不是被遺忘；有時候，等待，正是新生命成形的時間。"],["p","四節接著說：他必起來，「倚靠耶和華的大能」，牧養他的羊群；「他們要安然居住；因為他必日見尊大，直到地極」（彌5:4）。請你看，這位掌權者，不是靠自己的大能，而是倚靠耶和華的大能；他做的事，不是統治，而是「牧養」。他讓羊群，安然居住。這是一個非常溫柔的畫面：一位王，用牧人的方式，掌權。"],["p","這個畫面，與前面首領們「剝皮、剔肉」的畫面（彌3:2--3），形成最強烈的對比。首領們，把百姓當作鍋裡的肉；這位掌權者，把百姓當作需要被餵養的羊。一個是吃羊的人，一個是牧羊的人。這是這一課的第二個字：生，也就是，神要從一個小地方，生出一位牧者。"],["d",["「神把以色列人交付敵人」，神為什麼這樣做？","經文本身，沒有一句一句解釋。但從前面四章，我們看見：因為首領的不公平，因為假先知的謊話，因為百姓不聽，神才讓他們，經歷這一切。這不是神在享受他們的痛苦，而是神，用這個方式，讓他們看見，沒有神的日子，是什麼樣子。同時，三節的「直等」，告訴我們，這不是終點。你若現在，正在一個「被交付」的階段：被冷落、被遺忘、被困在一個沒有出口的地方，請不要急著問「為什麼」，也可以問一句：主，祢在「直等」什麼？然後，安靜一分鐘，聽聽祂說什麼。"]],["h","三、原文亮光：小、出來、牧養（5:2--4）"],["p","這一章，有三個字，如果你記得，就記得了整章的路：小、出來、牧養。我們用三十秒，一個一個，把它轉成生命。"],["p","第一個字，是二節的 צָעִיר（tsa'ir），意思是「小」，也可以譯為「年幼的、不重要的」。這個字，在聖經裡，常用在年幼的、排行在後的人身上，例如創世記二十五章二十三節，「大的要服侍小的」，那個「小的」，用的就是這個字。你看，神常常從排在後面的那一個開始。三十秒轉成生命：今天，想一個在群體裡，常常被忽略的人，在他說話的時候，停下來，認真聽完。"],["p","第二個字，是二節的 מוֹצָאֹתָיו（motsa'otav），意思是「他的出處、他的來歷」。它的字根，是「出來」，和第一章三節，「耶和華出了他的居所」的那個「出」，是同一個字根。你看，第一章，是神出來；第五章，是神所差的那一位，從伯利恆出來。神自己，先走向人；然後，祂差遣一位，也走向人。三十秒轉成生命：下次你覺得，神離你很遠，請提醒自己：這位神，是一位會「出來」的神。"],["p","第三個字，是四節的 וְרָעָה（ve-ra'ah），意思是「他要牧養」。這個字，可以是「牧羊」，也可以是「餵養」、「看顧」。有趣的是，它的子音，和「惡」這個字一樣，要看上下文，才知道是哪一個意思；所以，同一組字母，可以是「牧養」，也可以是「惡」。這提醒我們：權柄，可以用來牧養，也可以用來傷害，分別在於，那個人，是不是倚靠耶和華。三十秒轉成生命：今天，在你有權柄的地方，不論大小，問自己一句：我現在，是在牧養，還是在使用？"],["p","這三個字連起來，是整章的路：神選擇小的，神自己出來，神用牧養的方式，掌權。"],["d",["「根源從亙古」是不是說，這位掌權者，在創世以前就有？","二節說：「他的根源從亙古，從太初就有。」（彌5:2）在彌迦的時代，這句話，最直接的意思，是說，這位掌權者的來歷，不是新興的，而是和神，很古老的計畫連在一起。新約的人，在耶穌身上，看見這一句話，有更深的意思；約翰福音一章一節，也說「太初有道」。這兩者，彼此呼應。我們不需要把這一節，變成一場神學論戰；我們可以確定的是：這位從小地方出來的牧者，他的來歷，比我們所知道的，更深、更古老，也更可靠。"]],["h","四、他必作我們的平安（5:4--15）"],["p","五節說：「這位必作我們的平安。」（彌5:5）請你細細看這一句話：不是「他必給我們平安」，而是「他必作我們的平安」。平安，不只是他給的一樣東西，而是他自己。有他在，就有平安；沒有他，我們所有的安排、所有的保險，都只是暫時的。「平安」這個字，在希伯來文，有「完整、圓滿」的意思：不是沒有事，而是什麼都不缺。"],["p","五、六節接著說，當亞述人進入我們的地境時，神的百姓，要立起「七個牧者，八個首領」。這個「七、八」，在希伯來文裡，是一個很多、很夠用的說法，意思是：神必供應足夠的人，來帶領。這是在彌迦時代，一個具體的敵人；我們不把它，套到今天任何一個國家，也不去猜寧錄地，是今天的哪一個地方。我們要看見的，是神的供應：每一個時代，祂都預備好牧者。"],["p","七、八節，有兩幅對比很強的圖畫：「雅各餘剩的人必在多國的民中，如從耶和華那裡降下的露水，又如甘霖降在草上；不仗賴人力，也不等候世人之功。」（彌5:7）還有，「如林間百獸中的獅子」（彌5:8）。一個是露水，一個是獅子；一個是柔和的賜福，一個是不能被擋的力量。請注意，七節的重點，是「不仗賴人力」：露水，不是人造的；它是從神那裡降下來的。"],["p","十至十三節，是一個很特別的清單：神要從他們中間，剪除馬匹，毀壞車輛，除滅城邑，拆毀保障，除掉邪術，除滅雕刻的偶像（彌5:10--13）。這是一張「倚靠清單」：馬匹、車輛，是軍事；城邑、保障，是安全；邪術、偶像，是屬靈的假保險。神說，我要把這些，都從你們中間除去，因為，「你就不再跪拜自己手所造的」（彌5:13）。祂要除去的，不是你的生活，而是你生活裡，那些取代祂的東西。"],["d",["獅子的圖畫，是不是說信徒可以對人強硬、踐踏人？","不是。這是詩的語言，要說的是：神的餘民，在列國中，有一種不能被取代、被消滅的存在感，是因為神與他們同在。請注意，在這一節之前的七節，剛說了「不仗賴人力」；也就是說，這個力量，不是人自己的拳頭。新約也告訴我們，我們的爭戰，不是對著人（以弗所書六章十二節）。所以，這一節，不能用來為任何暴力辯護，也不能用來對家人、同事、教會的人，強硬。若你讀了這一節，想到的是「我要贏過誰」，請先回到七節：露水，是從神那裡降下來的。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把三節的「生產的婦人」，或五、六節的「亞述」，講成一個時間表，推算某一年、某一個事件。經文沒有給日期；新約也沒有。本講義不算日子，也不排時間表。檢驗標準是：會眾是更認識牧養他們的耶穌，還是更熱衷於預測時間？"],["p","第二個偏差，是把「亞述」和「寧錄地」，套成今天某一個國家，並用它去支持對任何國家的仇恨或偏見。經文說的，是彌迦時代的一個具體敵人；聖經不是用來支持或反對任何現代國家的。檢驗標準是：我聽完以後，是更為各國禱告，還是更怕某一個民族？"],["p","第三個偏差，是把二節的「小」，變成一種優越感：「我們是小教會，所以我們更屬靈」，或「大的就一定不對」。神選擇小，是為了榮耀自己，不是為了讓小的人，驕傲。檢驗標準是：我對比我「大」的人，是祝福，還是論斷？"],["p","第四個偏差，是把八節的獅子，拿來為暴力、報復，或對人的強硬辯護，甚至說這是「屬靈爭戰」，可以不留情面。七節先說「不仗賴人力」，露水在先，獅子在後。檢驗標準是：聽完以後，會眾是更溫柔，還是更鋒利？"],["p","第五個偏差，是把十至十五節，講成對會眾的恐嚇：「神要毀掉你所有的東西」，或用十五節「向不聽從的列國施報」，去支持對任何一個國家的敵意。這一段的重點，是神要除去，那些取代祂的東西，目的，是叫人不再跪拜自己手所造的。檢驗標準是：會眾是更自由，還是更恐慌？"],["d",["有人說亞述和寧錄地，就是今天某一個國家，我怎麼回應？","可以溫和地問他三個問題：第一，經文自己，有沒有說這是在講今天的某個國家？沒有，它說的，是彌迦當時的亞述。第二，新約，有沒有把這一段，連到今天的某個國家？也沒有。第三，這樣的講法，讓人更愛耶穌，還是更怕某一群人？然後，你可以說：我們可以一起讀這一章，看神怎樣牧養祂的羊群；至於今天各國的局勢，我們為各國禱告，把結果交給神。沒有新約根據的連結，我們只說「這使我們想起」，不說「這就是預言」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「大就是好」。大學要好的、公司要大的、教會要人多的；孩子，不能「輸在起跑點」。一個孩子聽久了，會以為，自己的價值，是由別人的比較決定的。這樣的文化，讓許多人，把「小」，當成一種缺陷：小地方出來的、小公司的、沒有學歷的、沒有名字的。彌迦書五章二節，卻對我們說：神選擇小。不是因為小比較好，而是因為，神的眼睛，不是用我們的尺，在量人。你若曾經因為出身、學歷、外表，被人看輕，這一節，是神特別對你說的。"],["p","第二個問題：我們很習慣「靠實力」，也很習慣「準備好才安心」。存款、保險、人脈、學歷，這些，都是我們的「馬匹」和「車輛」。它們並不是罪，可是，當我們心裡的平安，完全由它們來決定時，它們，就變成了取代神的東西。十節，神要剪除的，是我們倚靠的「馬匹」，不是我們的生活，而是我們把生活的安全感，放在哪裡。我們也很少問：我所有的準備，是不是已經替代了禱告？"],["d",["怎麼知道自己的「馬匹」是什麼？","可以用三個問題，檢驗自己。第一，如果這一樣東西，明天不見了，我最怕的是什麼？那個最怕的，就可能是你心裡的「馬匹」。第二，我有沒有一件事，是我不敢交給神、一定要自己掌握的？第三，當我感到不安的時候，我第一個想到的，是禱告，還是算帳？這些問題，不是要我們把存款、保險，都丟掉；而是要我們誠實地看見，自己倚靠的是什麼。找一位可信的同伴，一起檢查，會比一個人想，更清楚。"]],["h","七、活出321——小地方的牧者，我們的平安"],["p","第一個基礎，耶穌是我的榜樣。耶穌，就是那位從伯利恆出來的牧者。祂生在一個小城、一個馬槽，不是在宮殿。祂用牧養的方式掌權：不是壓人，而是餵養；不是站在高處，而是走進羊群。我們學彌迦，其實是學耶穌：願意從小的地方，開始。"],["p","第二個基礎，聖經是我的準則。我們不是用「大不大」，來判斷神在哪裡工作，而是讓經文，先說話。五章二節告訴我們：神的選擇，不是人的尺。這是我們每一次評估一件事、一個人、一個聚會的準則：不是它大不大，而是神在不在其中。"],["p","第三個基礎，聖靈是我的引導。四節說，這位牧者，是「倚靠耶和華的大能」；沒有聖靈，我們的牧養，會變成管理，我們的力量，會變成脾氣。求聖靈使我們，在每一個有責任的地方，學會倚靠。"],["p","第一個核心，讓耶穌作王。五節說：「這位必作我們的平安。」讓耶穌作王，就是讓祂，成為我們的平安，而不是我們的存款、我們的人脈、我們的計畫。祂在，就夠了。"],["p","第二個核心，讓耶穌得著一切的榮耀。一個小地方、一位小人物，成為整個歷史的轉折，這不是因為伯利恆很偉大，而是因為神很偉大。所有的成就，所有被牧養的羊，榮耀都歸給耶穌。"],["p","一個目的，建立屬神的體系。屬神的體系，是一個以牧養為中心的群體，每一個人，都不輕看自己所在的小地方：不是一個很大的組織，而是一群被牧養、也願意去牧養別人的人。他們從小處開始，倚靠耶和華，不跪拜自己手所造的。"],["d",["讓耶穌作王，和「作我們的平安」有什麼關係？","關係很直接。當我說「耶穌作我的王」，我就是在說：祂的話，比我的算盤大；當我說「耶穌作我的平安」，我就是在說：祂的同在，比我的保險大。兩句話，其實是同一件事。具體的做法，可以從一個小動作開始：下一次，你感到不安的時候，在你拿起手機、打開帳戶，或開始盤算以前，先停十秒，對祂說：主，祢是我的平安。然後，再決定下一步。這十秒，就是把「馬匹」，還給神。然後，你可以對自己說：我不是沒有準備，我只是，不再把準備，當成神。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我有實力，我有資源，我不需要靠誰。經文對他說：七節說，「不仗賴人力，也不等候世人之功」；神的平安，不是人用實力換來的。實力是恩典，不是靠山。你可以先問：我現在最倚靠的，是什麼？"],["p","恐懼型的人說：我怕自己太小，什麼都做不到。經文對他說：神就是從「小」開始的；伯利恆，在猶大諸城中為小，可是，那位牧者，從那裡出來。小，不是你的問題，而是神的起點。你可以今天，只做一件很小的事，例如，傳一則關心的訊息。"],["p","羞恥型的人說：我來自一個很不起眼的地方，我的過去，也很不光彩。經文對他說：神沒有嫌棄伯利恆，也沒有嫌棄你；祂選擇小，是為了讓人看見，祂的恩典。來歷不能決定，神怎樣用你。你可以對一位可信的同伴，說出你的來歷，並請他為你禱告。"],["p","受傷型的人說：我被人忽略了很久，我已經不相信，有人會「看見」我。經文對他說：神看見伯利恆；祂也看見你。三節的「直等」，是一位正在忍著痛、等待新生的母親；祂沒有忘記你。祂的眼睛，不會跳過小的地方。你不需要一次相信；今天，只讀一句：「你在猶大諸城中為小」，並對神說：主，我也是。若這一章，讓你更痛，請找牧者或輔導陪你。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這個星期，找出一個你一直忽略的「小」：一個人、一件事、一個地方。不必做大事，只要停下來。今天，用一句話，給他一個回應：我看見你。"],["p","第二，找出你的「馬匹」：一樣你最怕失去、最想自己掌握的東西。寫下它，並找一位可信的同伴，一起為它禱告。"],["p","第三，下一次你感到不安的時候，先停十秒，對神說：主，祢是我的平安。連續七天，把你當下的處境，寫下一句。"],["p","第四，在你有「權柄」的地方：家裡、公司、小組，問自己一句：我現在，是在牧養，還是在使用？這個星期，用一個小動作，把「使用」，轉成「牧養」。"],["p","第五，找一位「小地方」來的人：剛搬來的、剛換工作的、不太說話的。這個星期，邀請他喝一杯茶，只是聽，不急著講道理。"],["p","我宣告：神選擇小，我也不輕看任何一個小的人。"],["p","我宣告：耶穌是我的平安，我不倚靠我的馬匹和車輛。"],["p","我宣告：我要用牧養的方式，使用我手上的權柄。"],["p","我宣告：耶穌是我的榜樣，祂從小地方出來，我也要從小處開始。"],["d",["這個星期，我怎樣在「小地方」，與耶穌同在？","可以從一個很普通的地方，開始：你每天走的那條路、你每天坐的那個位子、你每天面對的那一位同事。選一個，對自己說：這個小地方，神也在這裡。然後，做一件很小的事：打一聲招呼、多聽一句話、為對方禱告十秒。不需要有人看見，也不需要有人稱讚。耶穌自己，就是這樣，在一個很少人知道的地方，開始了祂的一生。一個星期以後，回頭看，你會發現，許多「大事」，其實，是從這些很小的地方，一點一點長出來的。神的國，常常是這樣開始的。"]],["h","十、結語"],["p","彌迦書第五章，是一個在地圖上，找不到的小地方；是一位從那裡出來的牧者；是一位生產的婦人、一滴露水、一頭獅子，和一張被神親自剪除的清單。開頭，是「伯利恆的以法他啊，你在猶大諸城中為小」；中間，是「這位必作我們的平安」；最後，是「你就不再跪拜自己手所造的」。"],["p","在這一章，神讓我們看見祂的心：祂是一位，選擇小的神；祂是一位，用牧養的方式掌權的神；祂也是一位，要從我們中間，除去那些取代祂的東西，好讓我們，真正平安的神。祂的選擇裡，有一個要人安息的應許。"],["p","這一章也提醒我們，聖誕節的故事，不是從一個很大的舞台開始的，而是從一個很小的地方開始的。你若覺得，自己的生命，也很小，不要忽略它；神，常常從那裡，開始祂最大的工作。"],["p","請你再看一次這一章的路：從一個被擊打的審判者，到一個小地方；從一位生產的婦人，到一位牧者；從一張被剪除的清單，到一個不再跪拜偶像的人。神的作為，一步一步，從小處，走向平安。"],["p","所以，請你記得這一課的三個重點：小，神選擇小地方、小人物；生，神要從那裡，生出一位牧者；安，這位牧者，必作我們的平安，我們不再跪拜自己手所造的。這一課的焦點，不在你找到了亞述是誰，不在你算出了生產的日期，也不在你有多大或多小，而是那位從伯利恆出來、倚靠耶和華的大能牧養我們的耶穌。"],["p","親愛的天父，謝謝祢，不輕看小的地方、小的人；求祢使我們，看見祢所選擇的；求祢使我們，倚靠祢，勝過倚靠我們的馬匹和車輛；也求祢，讓我們在每一個小地方，成為牧養人的人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 彌迦書五章二節：你在猶大諸城中為小。你有沒有一個「小地方」或「小的時期」，是你不太願意提起的？請說出是哪一類，不必細節。"],["n","2. ★ 五章二節：他的根源從亙古。你現在所在的位置，神有沒有可能，早就在那裡預備了什麼？請說出一個，例如家庭、職場、教會。"],["n","3. ★★ 五章四節：他必牧養他的羊群。你有沒有一個時刻，感覺被一位牧者，安然帶領？請用一句話說出那一次。"],["n","4. ★★★ 請在安靜中想一件事：一件你最想自己掌握、卻一直讓你不安的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起把它交給神。"],["m","帶領提醒：請先安靜念五章二節，再開始。不要點名逼人說。這一章會碰到被忽略、被交付、生產與新生：若有人提到性暴力、家庭暴力、流產、不孕、失去孩子、產後的低落、自傷的念頭或長期的創傷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照五章十節，你現在最倚靠的「馬匹」是什麼？請只說出一個，例如存款、人脈、學歷、健康。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀五章二節與五節。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：五章五節說：「這位必作我們的平安。」請用自己的話向組員說明：為什麼平安，不只是一樣東西，而是一個人？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先把哪一件不安，交給耶穌，並當場說出時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，做哪一件事，例如一通電話、一次探訪、十分鐘禱告；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去，進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，來自小地方、常被忽略的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有一位剛搬來或不太說話的人？請說出你可以怎樣，這個星期邀請他。"],["n","12. ★★ 你有沒有一位，曾經像牧者一樣，陪伴你、沒有急著講道理的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「認識這位牧者」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。不要用獅子的圖畫，為任何暴力辯護。若有人分享被忽略、失去孩子、不孕、成癮或家庭暴力的經歷，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一件不安，放在神面前。一起念五章五節。"],["p","由帶領者為每一位禱告：求神使我們倚靠那位從小地方出來的牧者，作我們的平安。散會前，彼此問一句：你這星期要先把哪一件事，交給祂？"]]},"6":{"no":6,"vol":"《321彌迦書講義》第6課·彌迦書第6章","title":"何為善——訟、行、秤","chars":4735,"min":60,"deep":8,"dchars":1467,"tchars":1286,"blocks":[["h","一、被控告時的第一句話（6:1--5）"],["p","弟兄姊妹平安。星期一的早會，主管指著投影幕，說：「這份報表，有一個數字，好像不太對。」整個會議室，忽然安靜下來。你的心跳，快了一點。這時候，你想一想，你嘴巴裡，會先冒出來的第一句話，是什麼？很多人，是這一句：「那個不是我的問題，是別人給我的資料。」也有人，是這一句：「我可以解釋。」還有人，是這一句：「大家
